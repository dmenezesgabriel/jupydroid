name: arm64 probe

# Temporary scaffolding for the native-runner switch: proves the four arm64 builds run on
# ubuntu-24.04-arm before the next tag does. It has no publish path and uploads nothing, and it is
# deleted once its run is the evidence - a push that removes it finds no workflow left to run.

on:
  push:
    paths:
      - .github/workflows/arm64-probe.yml
      - tools/rootfs/**
      - tools/proot/**

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.8"
          checksum: "56dd1b66701ecb62fe896abb919444e4b83c5e8645cca953e6ddd496ff8a0feb"
          enable-cache: false

      # The same four builds release.yml's rootfs job runs, in the same order, timed for the job
      # summary so the native numbers can retune its timeout.
      - name: Build the arm64 rootfs
        run: |
          started=$SECONDS
          tools/rootfs/build.sh arm64-v8a
          echo "rootfs build: $((SECONDS - started)) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Catalogue the rootfs
        run: |
          started=$SECONDS
          tools/rootfs/sbom.sh arm64-v8a
          echo "sbom: $((SECONDS - started)) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the patched proot
        run: |
          started=$SECONDS
          tools/proot/build.sh
          echo "proot build: $((SECONDS - started)) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the gnu payload
        run: |
          started=$SECONDS
          tools/rootfs/build-gnu.sh
          echo "gnu payload build: $((SECONDS - started)) s" >> "$GITHUB_STEP_SUMMARY"
