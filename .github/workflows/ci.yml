name: CI

# The commit gate (AGENTS.md rule 7), run where the author's machine is not the only witness. The
# job runs `pre-commit run --all-files` verbatim, so CI cannot pass what a commit cannot. This file
# carries the Python and ShellCheck half; the Gradle hooks are skipped by id and get a job of their
# own, because they take far longer and one job would report nothing until they ended.
#
# Job `name:` values are what a required-check ruleset binds to, so renaming one means updating the
# ruleset in the same commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default-deny: a job inherits nothing unless it re-declares a scope. Even `checkout` needs
# `contents: read`, since a zero-scope token cannot clone a private repository.
permissions: {}

# Keyed on the commit for a push, so consecutive pushes to `main` never cancel each other; a pull
# request keys on its number, so a fresh push replaces a stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # Every uv call verifies uv.lock and fails rather than silently relocking (ADR-0130).
  UV_LOCKED: "1"

jobs:
  python-gate:
    name: python-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The binary is pinned twice, by version and by the sha256 astral publishes beside it.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.8"
          checksum: "56dd1b66701ecb62fe896abb919444e4b83c5e8645cca953e6ddd496ff8a0feb"
          enable-cache: true

      - name: Install the locked tooling
        run: uv sync --locked

      # The Gradle hooks run in gradle-gate. A hook renamed in .pre-commit-config.yaml is no
      # longer skipped by this list and starts running here, where there is no Gradle setup.
      # commitlint-config-tests and claude-autopilot-typecheck need Node and `npm ci`, which this job does not set up.
      - name: Python and ShellCheck hooks
        env:
          SKIP: ktlint-check,detekt,cpd,android-lint,unit-tests,commitlint-config-tests,claude-autopilot-typecheck
        run: uv run --locked pre-commit run --all-files

  gradle-gate:
    name: gradle-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.8"
          checksum: "56dd1b66701ecb62fe896abb919444e4b83c5e8645cca953e6ddd496ff8a0feb"
          enable-cache: true

      - name: Install the locked tooling
        run: uv sync --locked

      # Gradle's own JVM. The Kotlin toolchain is 17 and is resolved by Gradle, not by this step.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      # Caches are written from main only, so a pull request can read but never poison them.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # One step per hook, in the order .pre-commit-config.yaml runs them, so the log times each.
      - name: ktlint
        run: uv run --locked pre-commit run ktlint-check --all-files
      - name: detekt
        run: uv run --locked pre-commit run detekt --all-files
      - name: copy-paste detector
        run: uv run --locked pre-commit run cpd --all-files
      - name: Android Lint
        run: uv run --locked pre-commit run android-lint --all-files
      - name: Unit tests
        run: uv run --locked pre-commit run unit-tests --all-files

      - name: Assemble the debug APK
        run: ./gradlew assembleDebug

  # Conventional commits (commitlint.config.mjs): the commits a pull request adds, and its title, which
  # a squash merge turns into the commit on main. Pull requests only: the history before this check
  # holds three subjects that are not conventional and is not rewritten (ADR-0133), so a push to main
  # is not a range anyone can ask to be clean. The commit-msg hook is what stops a bad subject locally;
  # this job is the witness for a contributor who never installed it. Every input from the event goes
  # through `env`, never into the script text.
  commit-messages:
    name: commit-messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The range below walks the history between the base and the head.
          fetch-depth: 0
          persist-credentials: false

      # No dependency cache: nothing here is slow enough to be worth a cache another job could write to.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      # `npm ci` installs exactly package-lock.json and fails on a sha512 mismatch; .npmrc turns the
      # dependencies' install scripts off.
      - name: Install the locked commit tooling
        run: npm ci

      # Registry signatures and provenance, which osv-scanner does not read. Verifying is not choosing a
      # version, so the 7-day `min-release-age` of .npmrc (which Dependabot and `npm install` enforce) is
      # lifted here: with it, a lock entry younger than a week would fail a check that has nothing to say
      # about its age.
      - name: Verify the registry signatures
        run: npm audit signatures --min-release-age=0

      - name: The commit tooling's and the autopilot loop's own tests
        run: npm test

      - name: The autopilot loop typechecks
        run: npm run typecheck

      - name: Commits in the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm exec --no -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      # Runs after a failed range too, so a pull request with a bad commit and a bad title shows both in
      # one run instead of the second after the first is fixed.
      - name: The pull request title
        if: ${{ !cancelled() }}
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PULL_REQUEST_TITLE" | npm exec --no -- commitlint --verbose
