name: Docs

# The user documentation site: docs-site/ built by MkDocs Material. `docs` is the merge-facing check -
# it runs the same `mkdocs build --strict` a commit's docs-site-build hook runs - and `deploy` publishes
# the built site to GitHub Pages on main pushes and release tags while the repository is public, so the
# site a release ships is built from its own commit. The split is permission
# scoping, not ceremony: only `deploy` holds `pages: write` + `id-token: write`; `docs` is
# contents:read end to end. No paths: filter - a required check that path-skips on untouched PRs would
# deadlock them.
#
# Job `name:` values are the required-check API - the default-branch ruleset binds these names. Renaming
# one requires updating the ruleset in the same commit.
on:
  push:
    branches: [main]
    # release-tag.yml pushes vX.Y.Z; a tag push is event_name 'push', so the deploy guard below
    # already covers it - the site deploys from the tagged commit, documenting that release.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Default-deny: a job inherits {} unless it re-declares scopes.
permissions: {}

# Sha-keyed like ci.yml - consecutive main pushes must both deploy; a ref-keyed group would drop a
# deploy between pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # Every uv invocation must verify the lockfile, never silently relock.
  UV_LOCKED: "1"
  # Silences the vendor banner mkdocs-material prints to stderr on every invocation - it is upstream
  # advocacy, not a build diagnostic (the package's own opt-out).
  NO_MKDOCS_2_WARNING: "1"

jobs:
  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.8"
          checksum: "56dd1b66701ecb62fe896abb919444e4b83c5e8645cca953e6ddd496ff8a0feb"
          # Every push this workflow serves publishes the site - main and release tags alike - so
          # it is a release workflow end to end and never reads the shared cache: an entry a
          # lower-trust run wrote must not flow into what Pages serves (zizmor's cache-poisoning
          # audit). uv sync pays the download each run; the docs group is small.
          enable-cache: false

      - name: Install the locked tooling
        run: uv sync --locked

      # The release the build documents: the tag on a tag deploy, else the latest published release.
      # gh's failure (no releases yet, an unreachable API) must not fail the required docs check -
      # the site's hook then falls back to git describe and finally leaves <version> literal.
      # ref_type/ref_name arrive through env: - a tag name is text a person can push, and
      # interpolating it into run: is a script-injection vector.
      - name: Stamp the release the site documents
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "JUPYDROID_DOCS_RELEASE=$REF_NAME" >> "$GITHUB_ENV"
          else
            echo "JUPYDROID_DOCS_RELEASE=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)" >> "$GITHUB_ENV"
          fi

      # The gate's verbatim check: strict mode escalates the validation block (omitted files, broken
      # links) to build errors. The docs group is not a default group, so the run names it.
      - name: Build site (strict)
        run: uv run --locked --group docs mkdocs build --strict -f docs-site/mkdocs.yml

      # configure-pages is a near-noop once Pages source = "GitHub Actions" is set in repo settings.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name == 'push' && github.event.repository.visibility == 'public'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.event.repository.visibility == 'public'
        with:
          path: build/site

  deploy:
    name: deploy
    needs: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Pages needs a public repository; the guard mirrors codeql/scorecard (ADR-0138) so the job
    # activates the moment visibility allows it rather than failing on every push before then.
    if: github.event_name == 'push' && github.event.repository.visibility == 'public'
    permissions:
      pages: write # deploy to Pages
      id-token: write # OIDC proof for deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
