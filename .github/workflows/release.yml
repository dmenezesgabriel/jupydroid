name: Release

# A pushed `vX.Y.Z` tag becomes a GitHub Release: the tag is checked, the arm64 rootfs and its SBOM are built
# on a runner from the digest-pinned image, a signed APK is built around that rootfs, and the Release is
# published with the APK, SHA256SUMS, the SBOM, the tag's changelog notes and SOURCE_OFFER.md. Build provenance
# is attested once the repository is public.
#
# release-tag.yml pushes the tag with the app token, because a tag pushed with GITHUB_TOKEN starts no workflow.
#
# The arm64 rootfs is the only one a Space can run (ADR-0003), and the repository is private on the free plan,
# which has no hosted arm64 runner, so every RUN of the Dockerfile executes under qemu.
#
# `ref` rebuilds an existing tag by hand, which is also how a failed release is retried: publishing is
# idempotent, so a second run updates the Release instead of failing on it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Existing release tag to rebuild (for example v0.1.0)
        required: true
        type: string

# Default-deny: a job inherits nothing unless it re-declares a scope.
permissions: {}

# Runs of one tag queue and are never cancelled: a publish killed halfway could strand a half-uploaded Release.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  # First and cheap, so a ref that is not a release tag fails in a minute rather than after the 32-minute rootfs.
  # The tag must be an ancestor of main: a rebuild may re-publish a release, never an arbitrary commit.
  version:
    name: version
    # A fork's tag push must never reach this repository's release machinery.
    if: github.repository == 'dmenezesgabriel/jupydroid'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
      versionName: ${{ steps.derive.outputs.versionName }}
      versionCode: ${{ steps.derive.outputs.versionCode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          # The full history brings refs/remotes/origin/main, which the ancestry check below reads. It is not
          # fetched later: persist-credentials is off and the repository is private, so a fetch has no login.
          fetch-depth: 0
          persist-credentials: false

      # release_version.py refuses anything but vMAJOR.MINOR.PATCH, naming the value, and prints the two
      # `key=value` lines Gradle's -PversionName and -PversionCode take. It reads the standard library only.
      - name: Check the tag and derive the version
        id: derive
        env:
          RELEASE_TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" > /dev/null \
            || { echo "::error::'${RELEASE_TAG}' is not a tag of this repository; expected an existing vMAJOR.MINOR.PATCH tag"; exit 1; }
          git merge-base --is-ancestor "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" refs/remotes/origin/main \
            || { echo "::error::tag '${RELEASE_TAG}' does not point to a commit on main"; exit 1; }
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          python3 scripts/release_version.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  rootfs:
    name: rootfs
    needs: version
    if: github.repository == 'dmenezesgabriel/jupydroid'
    runs-on: ubuntu-24.04
    # Measured at 32 minutes on a 2 vCPU runner (the build 31 min 06 s, the SBOM 16 s); about three times that.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      # sbom.sh ends in `uv run --locked`. No cache: this is a release workflow, and a cache another
      # workflow could have written to is how a release picks up bytes nobody reviewed.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.8"
          checksum: "56dd1b66701ecb62fe896abb919444e4b83c5e8645cca953e6ddd496ff8a0feb"
          enable-cache: false

      # The arm64 handler does not survive a reboot, so every fresh runner needs it before the first RUN
      # (`exec /bin/sh: exec format error` otherwise). Pinned by digest, as tools/rootfs/build.sh names it:
      # this is qemu-v10.2.3, pushed 2026-06-08.
      - name: Register the arm64 binfmt handler
        run: docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64

      # The elapsed times go to the job summary: how long the build takes under qemu is what decides
      # whether a release can wait for it.
      - name: Build the arm64 rootfs
        run: |
          started=$SECONDS
          tools/rootfs/build.sh arm64-v8a
          echo "rootfs build under qemu: $((SECONDS - started)) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Catalogue the rootfs
        run: |
          started=$SECONDS
          tools/rootfs/sbom.sh arm64-v8a
          echo "sbom: $((SECONDS - started)) s" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rootfs-arm64-v8a
          path: |
            build/rootfs/rootfs-arm64-v8a.tzst
            build/rootfs/rootfs-arm64-v8a.manifest.txt
            build/rootfs/sbom-arm64-v8a.json
          if-no-files-found: error
          retention-days: 7

  # Builds and signs the APK around the rootfs the previous job made. Needs no uv: the staging script and
  # Gradle use the standard library and the Gradle wrapper, and an empty cache directory is the point.
  apk:
    name: apk
    needs: [version, rootfs]
    if: github.repository == 'dmenezesgabriel/jupydroid'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERSION_NAME: ${{ needs.version.outputs.versionName }}
      VERSION_CODE: ${{ needs.version.outputs.versionCode }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      # Gradle's own JVM. The Kotlin toolchain is 17 and is resolved by Gradle, not by this step.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      # No cache, read or written: a release is built from what the lockfiles name, not from bytes another
      # workflow could have left in a cache.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rootfs-arm64-v8a
          path: build/rootfs

      - name: Stage the rootfs and proot into the app module
        run: tools/rootfs/stage-app-artifacts.sh arm64-v8a

      # An empty secret reads as unset to Gradle and yields an UNSIGNED APK, which cannot update an install
      # signed by the release key. A release without the key therefore fails here, unlike release-cut.yml
      # and release-tag.yml, which only warn: those skip a step, this one would publish the wrong artifact.
      - name: Decode the release keystore
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          JUPYDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.JUPYDROID_RELEASE_KEYSTORE_BASE64 }}
          JUPYDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.JUPYDROID_RELEASE_KEYSTORE_PASSWORD }}
          JUPYDROID_RELEASE_KEY_ALIAS: ${{ secrets.JUPYDROID_RELEASE_KEY_ALIAS }}
          JUPYDROID_RELEASE_KEY_PASSWORD: ${{ secrets.JUPYDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in JUPYDROID_RELEASE_KEYSTORE_BASE64 JUPYDROID_RELEASE_KEYSTORE_PASSWORD JUPYDROID_RELEASE_KEY_ALIAS JUPYDROID_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Actions secret ${name} is empty or unset; a release APK must be signed with the release key, expected all four JUPYDROID_RELEASE_* secrets"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$JUPYDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"

      # The four variables are what app/build.gradle.kts reads; no other step sees the passwords.
      - name: Build the signed release APK
        env:
          JUPYDROID_RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          JUPYDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.JUPYDROID_RELEASE_KEYSTORE_PASSWORD }}
          JUPYDROID_RELEASE_KEY_ALIAS: ${{ secrets.JUPYDROID_RELEASE_KEY_ALIAS }}
          JUPYDROID_RELEASE_KEY_PASSWORD: ${{ secrets.JUPYDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Delete the decoded keystore
        if: always()
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
        run: rm -f "$KEYSTORE_FILE"

      # The newest build-tools the runner image carries. The signer's SHA-256 goes to the log, where the
      # maintainer can compare it with the release key's; the badging proves the APK carries the tag's version.
      - name: Verify the signature and the version
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK=app/build/outputs/apk/release/app-release.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          BADGING="$("$BUILD_TOOLS/aapt2" dump badging "$APK")"
          for expected in "versionName='${VERSION_NAME}'" "versionCode='${VERSION_CODE}'"; do
            grep -Fq -- "$expected" <<< "$BADGING" \
              || { echo "::error::the APK's badging lacks ${expected}; the tag ${RELEASE_TAG} and the build disagree"; exit 1; }
          done

      - name: Name the assets and checksum them
        run: |
          set -euo pipefail
          mkdir release-assets
          APK_NAME="jupydroid-${RELEASE_TAG}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-assets/${APK_NAME}"
          cp build/rootfs/sbom-arm64-v8a.json release-assets/
          (cd release-assets && sha256sum "$APK_NAME" sbom-arm64-v8a.json > SHA256SUMS)
          cat release-assets/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 7

  # The only job that writes the repository. It runs after the signature was verified, so a Release never
  # holds an unsigned APK, and it creates the Release or updates the one a failed run left behind.
  publish:
    name: publish
    needs: [version, apk]
    if: github.repository == 'dmenezesgabriel/jupydroid'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      # The tag's own checkout holds the CHANGELOG.md and SOURCE_OFFER.md the release commit carried.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Cut the notes of this tag from the changelog
        run: python3 scripts/release_notes.py CHANGELOG.md "$TAG" > release-notes.md

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSETS=("release-assets/jupydroid-${TAG}-arm64-v8a.apk" release-assets/SHA256SUMS release-assets/sbom-arm64-v8a.json SOURCE_OFFER.md)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file release-notes.md --latest
          fi

  # Attestation needs a public repository (or a paid plan), so the job is written now and skipped until the
  # repository is public, rather than failing on every release (the same guard security.yml gives CodeQL).
  # The checksums file is the subject: it names the APK and the SBOM, so one attestation covers both.
  attest:
    name: attest
    needs: apk
    if: github.repository == 'dmenezesgabriel/jupydroid' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS
