appId: com.jupydroid.app
---
# Audit A1c: markdown is drawn as Compose - no WebView, no HTML. Seeded by the driver.
- launchApp
# Home's list is populated by a disk scan, and a scroll started before it has rendered ends
# rather than retrying - so let the launch settle first.
- waitForAnimationToEnd:
    timeout: 5000
# Scrolled to rather than asserted on: Home is sorted by recency, so a seeded notebook sinks
# below the fold as soon as anything else is saved. This flow began failing at its very first
# assertion for exactly that reason, with the row present the whole time.
- scrollUntilVisible:
    element:
      text: "Markdown Render.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Markdown Render.ipynb"
# Rendered, not source: the heading reads without its hashes and the bullet without its dash.
- extendedWaitUntil:
    visible: "Analysis"
    timeout: 30000
- assertNotVisible: "# Analysis"
- assertVisible: "first point"
- assertVisible: "A quoted remark."
- takeScreenshot: 01-rendered
# Tapping the rendered cell shows the source again, hashes and all.
- tapOn: "Rendered markdown"
- extendedWaitUntil:
    visible: "(?s).*# Analysis.*"
    timeout: 10000
- takeScreenshot: 02-tapped-to-edit
# Screenshotted before this, not after: the keyboard being up *is* the state a tap leaves you in
# now that the editor takes the caret, and the shot should show that. But this cell is 19 lines,
# so focusing it scrolled its header - and the Run button on it - above the viewport. Put the
# keyboard away and come back up to the button, which is what a person does before pressing Run.
- hideKeyboard
# Scrolled to the *kind label*, not to "Run cell", and then anchored to it. `markdown` appears on
# exactly one header, so this addresses that cell's Run whatever else is on screen. `index: 0`
# counted the Run buttons *rendered*, and at 320dp the markdown header is above the fold while
# the code cell below it is not - so index 0 was the code cell's Run and the flow ran the wrong
# cell entirely, then failed looking for a render that was never asked for.
# Anchored on the heading's collapser, not on a kind label. The label was this app's own - the
# reference gives markdown no prompt at all (`packages/cells/src/widget.ts:1693-1700`) - and the
# collapser is the better anchor anyway: it is `# Analysis`'s own control, so it names *this* cell
# rather than every markdown cell on screen.
- scrollUntilVisible:
    element:
      text: "Collapse heading"
    direction: UP
    timeout: 10000
# Run renders it again, which is what running a markdown cell means in Jupyter.
# **`above` the heading, where this said `rightOf` the collapser.** P2n-3 moved the caret out of the
# header strip to beside the heading it folds - which is where the reference draws it
# (`packages/cells/src/widget.ts:2386-2408`) - so no control in the strip is right of it any more.
# The strip is still above the body, so this cell's Run is the one above its own caret; the code
# cell's is below it. `Analysis` would not do as the anchor: the cell is unrendered here, so its
# node carries the whole source and a full-text match on the heading alone finds nothing.
- tapOn:
    text: "Run cell"
    above:
      text: "Collapse heading"
- extendedWaitUntil:
    visible: "Rendered markdown"
    timeout: 10000
# matches-source: rendering a markdown cell hides its source, so the source is the subject
- assertNotVisible: "# Analysis"
- takeScreenshot: 03-run-renders-it-again
