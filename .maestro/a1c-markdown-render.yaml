appId: com.jupydroid.app
---
# Audit A1c: markdown is drawn as Compose - no WebView, no HTML. Seeded by the driver.
- launchApp
- runFlow: open-base-space.yaml
# Home's list is populated by a disk scan, and a scroll started before it has rendered ends
# rather than retrying - so let the launch settle first.
- waitForAnimationToEnd:
    timeout: 5000
# Scrolled to rather than asserted on: Home is sorted by recency, so a seeded notebook sinks
# below the fold as soon as anything else is saved. This flow began failing at its very first
# assertion for exactly that reason, with the row present the whole time.
- scrollUntilVisible:
    element:
      text: "Markdown Render.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Markdown Render.ipynb"
# Rendered, not source: the heading reads without its hashes and the bullet without its dash.
- extendedWaitUntil:
    visible: "Analysis"
    timeout: 30000
- assertNotVisible: "# Analysis"
- assertVisible: "first point"
- assertVisible: "A quoted remark."
- takeScreenshot: 01-rendered
# Tapping the rendered cell shows the source again, hashes and all.
- tapOn: "Rendered markdown"
- extendedWaitUntil:
    visible: "(?s).*# Analysis.*"
    timeout: 10000
- takeScreenshot: 02-tapped-to-edit
# Screenshotted before this, not after: the keyboard being up *is* the state a tap leaves you in
# now that the editor takes the caret, and the shot should show that. But this cell is 19 lines,
# so focusing it scrolled its header - and the Run button on it - above the viewport. Put the
# keyboard away and come back up to the button, which is what a person does before pressing Run.
- hideKeyboard
# **Back to the top of the document by swiping, not by scrolling to an element.**
# `scrollUntilVisible` needs something that is *off* screen to aim at, and since P2v-2 drew the
# heading's caret rendered-only (ADR-0057) the only node left on an open markdown cell is its field
# - which carries the whole source as one node, so it is already partly visible and the scroll is a
# no-op that leaves the cell's first line above the viewport. Before P2v-2 the anchor was that
# caret, and before that a kind label this app invented, the reference giving markdown no prompt at
# all (`packages/cells/src/widget.ts:1693-1700`).
#
# Down the frame's **left edge**, clear of the text: inside a focused field a drag is a selection,
# not a scroll. Three is more than the two this notebook needs, and a swipe at the top of a list
# does nothing - so over-swiping costs a gesture, where under-swiping costs the frame.
- repeat:
    times: 3
    commands:
      - swipe:
          start: 4%, 30%
          end: 4%, 90%
          duration: 300
- waitForAnimationToEnd:
    timeout: 2000
# The whole-node match the wait above already uses: unrendered, the field's node carries the
# entire source, so `# Analysis` alone finds nothing.
- assertVisible: "(?s).*# Analysis.*"
# Run renders it again, which is what running a markdown cell means in Jupyter.
# **`above` the source, and the swipe above is what makes that reachable.** `index: 0` counted the
# Run buttons *rendered*, and at 320dp the markdown header was above the fold while the code cell
# below it was not - so index 0 was the code cell's Run and the flow ran the wrong cell entirely,
# then failed looking for a render that was never asked for. The strip is above the body, so this
# cell's Run is the one above its own text; the code cell's is below it.
- tapOn:
    text: "Run cell"
    above:
      text: "(?s).*# Analysis.*"
- extendedWaitUntil:
    visible: "Rendered markdown"
    timeout: 10000
# matches-source: rendering a markdown cell hides its source, so the source is the subject
- assertNotVisible: "# Analysis"
- takeScreenshot: 03-run-renders-it-again
