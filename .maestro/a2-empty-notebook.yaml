appId: com.jupydroid.app
---
# Audit A2: a notebook with no cells used to show "No cells yet" and offer no way to add one.
# The fixture has no `cells` key at all - which is exactly what createNotebook writes, and what
# an import leaves behind. Seeded by scripts/a2-empty-notebook-driver.sh.
- launchApp
# Home's list is populated by a disk scan, and a scroll started before it has rendered ends
# rather than retrying - so let the launch settle first.
- waitForAnimationToEnd:
    timeout: 5000
# Scrolled to rather than asserted on: Home is sorted by recency, so a seeded notebook
# sinks below the fold as soon as anything else is saved.
- scrollUntilVisible:
    element:
      text: "Empty Notebook"
    direction: DOWN
    timeout: 20000
- tapOn: "Empty Notebook"
- extendedWaitUntil:
    visible: "code"
    timeout: 30000
- assertNotVisible: "No cells yet"
- takeScreenshot: 01-empty-notebook-has-a-cell
# The point of the cell is that it can be typed into.
- tapOn:
    text: "Cell actions"
    index: 0
- tapOn: "Cell menu Insert code below"
- takeScreenshot: 02-and-the-menu-works-from-it
# Now the other route in: a notebook created from the FAB.
- back
- tapOn: "+"
- tapOn: "New notebook"
# No restart. This flow used to stop and relaunch here because audit A3 was open and a new
# notebook did not reach Recents until the list was rebuilt; A3 was fixed in 5403bd9, and
# a3-create-shows-up proves the row arrives on its own. The relaunch also had no settle, so it
# raced the disk scan - a workaround that had outlived its reason and could only misfire.
# "just now" is the new row's timestamp: only createNotebook stamps updatedAt, so it is unique
# to the row just made, and waiting on it means the row is really in view.
- extendedWaitUntil:
    visible: "just now"
    timeout: 15000
- tapOn:
    text: "Untitled"
    index: 0
- extendedWaitUntil:
    visible: "code"
    timeout: 30000
- assertNotVisible: "No cells yet"
- takeScreenshot: 03-created-notebook-has-a-cell
