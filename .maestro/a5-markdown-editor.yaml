appId: com.jupydroid.app
---
# Audit A5: the markdown editor gets a line-number gutter (A5a) and highlighted source (A5b).
# Both are drawn, not laid out as text, so the screenshots are the gate - the assertions here
# only get the app to the state worth photographing.
#
# Seeded by scripts/a5-markdown-editor-driver.sh; until 2026-08-07 it had none and leaned on
# whatever a1c's driver had left on the device.
- launchApp
# Home's list is populated by a disk scan, and a scroll started before it has rendered ends
# rather than retrying - so let the launch settle first.
- waitForAnimationToEnd:
    timeout: 5000
# Scrolled to rather than asserted on: Home is sorted by `updatedAt` descending, so a seeded
# notebook sinks below the fold as the device accumulates notebooks.
- scrollUntilVisible:
    element:
      text: "Markdown Render"
    direction: DOWN
    timeout: 20000
- tapOn: "Markdown Render"
- extendedWaitUntil:
    visible: "Rendered markdown"
    timeout: 20000
- tapOn: "Rendered markdown"
- extendedWaitUntil:
    visible: "(?s).*# Analysis.*"
    timeout: 10000
# Same reason as a4: the editor takes the caret, so the keyboard covers half the screen and the
# cell has scrolled past its first lines. The gutter and the highlighting are what this
# screenshot is for, so put the keyboard away and come back to the top of the cell.
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "markdown"
    direction: UP
    timeout: 10000
- takeScreenshot: markdown-editor
