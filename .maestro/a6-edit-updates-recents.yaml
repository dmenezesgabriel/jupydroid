appId: com.jupydroid.app
---
# Audit A6: editing a notebook must update its "last updated" time, the way Jupyter's does -
# `last_modified` is the file's mtime (jupyter_server filemanager.py:285), so every write counts.
# It used to be stored in the file and bumped by nothing, so an edited notebook kept the time it
# was created and never moved in Recents.
#
# Seeded by scripts/a6-edit-updates-recents-driver.sh, which backdates the file to 2020 - a
# fixture pushed by a driver has this moment's mtime, so without that there is nothing to see.
- launchApp
# Home's list is populated by a disk scan, and a scroll started before it has rendered ends
# rather than retrying - so let the launch settle first.
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "Updated At.ipynb"
    direction: DOWN
    timeout: 20000
# "1 Jan" is how relativeTime renders anything older than a week (`d MMM`). Asserting it first
# is what makes the assertion after the edit mean something.
- assertVisible: "1 Jan"
- takeScreenshot: 01-stale-before-the-edit
- tapOn: "Updated At.ipynb"
- tapOn: "value = 1"
- inputText: " + 1"
# `back` with the keyboard up only dismisses the keyboard, so the first version of this flow
# never left the editor - and then matched "Updated At" against the *app bar title* and failed
# looking for a timestamp that was never on screen. Dismiss, then use the app's own Back button.
- hideKeyboard
- tapOn: "Back to notebooks"   # the TopAppBar arrow. Not "Back": the system nav bar has that too
                               # and a uiautomator dump carries both (evidence/u-flow-sweep/).
# The FAB is Home's and the editor has none: assert it before looking for a row, so a flow that
# is still in the editor fails here rather than against the title in the app bar.
- extendedWaitUntil:
    visible: "\\+"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "Updated At.ipynb"
    direction: DOWN
    timeout: 20000
- extendedWaitUntil:
    visible: "just now"
    timeout: 10000
# The row cannot still be claiming 2020. `Updated At` is the only notebook on this device with
# that date, so an unscoped assertion is unambiguous - the rows are separate sibling nodes with
# no ancestor to scope to (evidence/audit-a6-updated-at/).
- assertNotVisible: "1 Jan"
- takeScreenshot: 02-just-now-after-the-edit
