appId: com.jupydroid.app
---
# U5b: the same cell actions, on the surface the window has room for.
#
# Runs no cell, so any device will do - and that is the point: the driver is run once per device,
# a phone emulator and a tablet, and the screenshots show which surface each width produced. The
# labels are identical on both, so this one flow addresses a dropdown and a bottom sheet without
# knowing which it got.
#
# Seeded by scripts/action-presentation-driver.sh; clearState would delete the fixture.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "Cell Actions.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Cell Actions.ipynb"
- extendedWaitUntil:
    visible: "alpha = 1"
    timeout: 30000
- tapOn:
    text: "Cell actions"
    below:
      text: "alpha = 1"
- waitForAnimationToEnd:
    timeout: 5000
# The first item, which is at the top of both surfaces. Asserting a middle one instead would be
# asserting how many rows happen to fit, which is a property of the device rather than of this.
- assertVisible: "Cell menu Insert code above"
- takeScreenshot: 01-actions-offered
# Choosing an action, so the flow proves the surface *works* rather than only that it appeared.
#
# Reachability of the items below the fold is deliberately **not** driven here: a
# `scrollUntilVisible` swipe on a bottom sheet is a dismiss gesture, and the first attempt closed
# the sheet and then failed looking for a row on the notebook behind it. Scrolling inside either
# surface is asserted by `CellActionsTest`, which can walk the semantics tree without gestures.
- tapOn: "Cell menu Insert code below"
- waitForAnimationToEnd:
    timeout: 5000
# Both original cells still on screen, and the surface has closed. This assertion was briefly
# weakened to one cell, to survive a 450x281dp letterbox produced by forcing a tablet narrow with
# `wm density`; a real phone window is tall, both cells fit, and the assertion is back.
# That a *third* cell was inserted is proved by the saved file the driver prints - a count of
# cells on screen would be a property of the device rather than of the action.
- assertVisible: "alpha = 1"
- assertVisible: "beta = 2"
- takeScreenshot: 02-action-taken
