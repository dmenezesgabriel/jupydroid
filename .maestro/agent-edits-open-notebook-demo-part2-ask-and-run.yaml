appId: com.jupydroid.app
---
# The second of the four flows scripts/agent-edits-open-notebook-demo-driver.sh runs. The app is still
# on part 1's notebook and Chat, and base's MCP server is listening.
#
# opencode's insert_cell is answered over the open notebook
# (extensions/ai/src/main/java/com/jupydroid/extensions/ai/data/http/NotebookLabCommands.kt), so a
# new first cell appears above x = 1. The question shows print(42) too, so the driver checks the saved
# file; running the cell is what the screen can settle, since 42 must come from the kernel's output.
- tapOn: "New chat"
- extendedWaitUntil:
    visible: "Ask the agent"
    timeout: 30000
# The question goes to a model the signed-in account can still use: opencode holds a turn open,
# reporting nothing, when its provider refuses for quota, and OpenCode's free models did that on
# SM-X216B the day this flow was written. The chip lists what opencode offers once the session starts.
- extendedWaitUntil:
    visible: "Default / .*"
    timeout: 300000
- tapOn: "Default / .*"
- tapOn: "Search models"
- inputText: "Nemotron 3 Ultra (free)"
- tapOn: ".*OpenRouter/Nemotron 3 Ultra \\(free\\)"
- tapOn: "Ask the agent"
# "Use no other tool": when its tool failed, opencode once asked to rewrite the notebook through bash,
# and the turn then waited on that permission prompt.
- inputText: "Use the insert_cell tool to insert a code cell containing print(42) at index 0 of untitled.ipynb. Use no other tool. If it fails, reply with its error."
- hideKeyboard
- tapOn: "Send"
# The first message spawns `opencode acp` under proot, which connects to the MCP server before the
# model answers.
- extendedWaitUntil:
    visible: ".*insert_cell.*"
    timeout: 300000
- extendedWaitUntil:
    notVisible: "Stop"
    timeout: 300000
- assertVisible: "✓"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-the-agents-cell-above-x-equals-1
# Index 0 is the agent's cell: the new cell goes above x = 1.
- tapOn:
    text: "Run cell"
    index: 0
- extendedWaitUntil:
    visible:
      text: "42"
      childOf: {text: "Cell output"}
    timeout: 120000
- takeScreenshot: 03-the-agents-cell-ran
