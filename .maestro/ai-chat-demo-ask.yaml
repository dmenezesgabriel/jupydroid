appId: com.jupydroid.app
---
# Landscape, two panes, in base, with opencode installed in base and signed in to a provider by a
# person. The first of the two flows scripts/ai-chat-demo-driver.sh runs.
#
# The demo's question: one that uses no tool, so no permission request stands between it and the
# answer, and whose answer is 40 lines tall, so the panel has something to follow. The driver reads
# what is on screen once the answer is whole, before the second flow kills the app.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "Chat"
- extendedWaitUntil:
    visible: "Ask the agent"
    timeout: 30000
- takeScreenshot: 01-chat-opened
- tapOn: "Ask the agent"
- inputText: "Count from 1 to 40, one number per line, and nothing else."
- hideKeyboard
- tapOn: "Send"
# The first message spawns `opencode acp` under proot and the model answers over the network, so
# the bound is generous. Any start of the count is enough here: this frame is taken while the answer
# may still be growing.
- extendedWaitUntil:
    visible: "1\\s+2\\s+3.*"
    timeout: 300000
- takeScreenshot: 02-the-answer-grows
- extendedWaitUntil:
    visible: "1\\s+2\\s+3.*\\b40\\s*"
    timeout: 120000
- takeScreenshot: 03-the-answer-whole
