appId: com.jupydroid.app
---
# A cell that colours its print and its repr with ANSI escapes, and a cell that raises, draw their
# text with no escape residue - the colours themselves are measured off the screenshot, since
# Maestro reads text and not paint (evidence README). Every value asserted is one the kernel
# computed: `42`, `56`, `81`, `12` and `division by zero` are not in the source, and
# FakeKernelGateway would echo the source instead. Seeded by scripts/ansi-colour-notebook-driver.sh.
#
# TABLET ONLY (SM-X216B): the flow runs cells.
#
# Each assertion full-matches one output node, so an escape left in the text - `[31m` or the ESC
# byte Compose draws as nothing - fails it.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "Ansi Colour.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Ansi Colour.ipynb"
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000
- tapOn: "Run all cells"
# Generous: the first run installs the Space and starts jupyter_server.
- extendedWaitUntil:
    visible:
      text: "red 42 bold green 56 orange 81"
      childOf: {text: "Cell output"}
    timeout: 180000
- assertVisible:
    text: "blue 12"
    childOf: {text: "Cell output"}
- extendedWaitUntil:
    visible:
      text: "[\\s\\S]*ZeroDivisionError: division by zero"
      # The second cell's output: `childOf` resolves to the first match alone.
      childOf: {text: "Cell output", index: 1}
    timeout: 30000
- takeScreenshot: 01-a-print-a-repr-and-a-traceback-draw-in-their-colours
