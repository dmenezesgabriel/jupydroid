appId: com.jupydroid.app
---
# The second of the two flows scripts/answer-names-its-agent-driver.sh runs, after part 1's
# answer in `untitled`.
#
# launchApp stops the process, and with it the Space's server: the name above the answer can now only
# come from the `users` map the `.chat` file kept (jupyterlab_chat `ychat.py`), sent in the new
# socket's `connection` frame.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "More"
- extendedWaitUntil:
    visible: "Chat"
    timeout: 5000
- tapOn: "Chat"
- extendedWaitUntil:
    visible: "Open an existing chat:"
    timeout: 30000
- tapOn: "untitled"
- extendedWaitUntil:
    visible: "[\\s\\S]*\\b605\\b[\\s\\S]*"
    timeout: 60000
- assertVisible: "OpenCode"
- takeScreenshot: 03-relaunched-the-answer-is-still-under-opencodes-name
