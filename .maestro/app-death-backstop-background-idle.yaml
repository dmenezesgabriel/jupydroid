appId: com.jupydroid.app
---
# Part 3: background the app when it is idle.
#
# Part 2 resumed inside the grace, so the server survived the mid-run background. Now nothing
# is running: a Home press starts the countdown with no cell to wait for, and the stopper stops
# the server after its grace. The driver waits past that and checks the process is gone - and
# checks the *app* is still alive, because a dead app would make that check meaningless.
- assertVisible: "42"
- pressKey: Home
- takeScreenshot: 05-backgrounded-idle
