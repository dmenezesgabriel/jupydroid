appId: com.jupydroid.app
---
# Opens ${MAESTRO_NOTEBOOK} and edits its markdown cell, so the autosave writes the whole document
# within seconds. Run by scripts/atomic-save-demo-driver.sh twice: once with a poller,
# started before this flow, that stops the app once a write is under way, and once with nothing to
# stop the save.
#
# A tap on rendered markdown opens its editor. The text is matched as a prefix: a save the stop
# did not catch may already hold an earlier run's edit.
#
# **No screenshot**, for atomic-save-notebook-edit.yaml's reason: the stop can land at any step
# after the open, and a frame taken after it captures whatever app the device brings forward.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "${MAESTRO_NOTEBOOK}.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "${MAESTRO_NOTEBOOK}.ipynb"
- extendedWaitUntil:
    visible: "Notes before the edit.*"
    timeout: 60000
- tapOn: "Notes before the edit.*"
- extendedWaitUntil:
    visible: "(?s)Notes before the edit.*"
    timeout: 10000
- inputText: ", and after"
