appId: com.jupydroid.app
---
# Opens ${MAESTRO_FILE} in the file editor and types into it, so its autosave writes the file with
# nothing to stop it: the clean save scripts/atomic-save-file-driver.sh reads the inode and the
# mode around. That driver seeds the file executable and sets the autosave interval to its minimum.
# scripts/atomic-save-demo-driver.sh runs it too, as part of the demo.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "${MAESTRO_FILE}"
# Its first line, not a toolbar: on the tablet the file opens as a tab beside the explorer, with no
# "Back to files".
- extendedWaitUntil:
    visible: "(?s)notes for the save test.*"
    timeout: 60000
# Where the point lands in the text does not matter: the driver allows the typing anywhere, and
# nothing else.
- tapOn:
    point: "95%,25%"
- inputText: " edited"
- hideKeyboard
- takeScreenshot: 01-typed-in-the-file-editor
