appId: com.jupydroid.app
---
# Replaces the first line of the ~30 MiB ${MAESTRO_FILE} from the search panel, so Replace All writes
# the whole file through WorkspaceRepository.writeText - while the driver's poller, started before
# this flow, watches the file and stops the app once the write is under way. Seeded by
# scripts/atomic-save-file-driver.sh and scripts/atomic-save-demo-driver.sh.
#
# Replace All rather than the file editor: the editor cannot hold a file whose save takes long
# enough to be caught (on SM-X216B, 4 MB is not responding on open and 2 MB draws nothing in a
# minute), and both write through the same call.
#
# **No screenshot**, for the notebook flow's reason (atomic-save-notebook-edit.yaml): the stop can
# land at any step after the tap, and a frame taken after it captures whatever app the device brings
# forward.
#
# **WIDE WINDOW**: the search panel is drawn only where there is room for two panes.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn:
    text: "^Search$"
- tapOn: "Show replace"
- tapOn: "Search the workspace"
- inputText: "notes for the save test"
- extendedWaitUntil:
    visible: "1 result in 1 file"
    timeout: 60000
- hideKeyboard
- tapOn: "Replace across the workspace"
- inputText: "notes for the saved test"
- hideKeyboard
- tapOn: "Replace all in workspace"
- tapOn:
    text: "^Replace$"
