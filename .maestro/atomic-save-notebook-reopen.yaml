appId: com.jupydroid.app
---
# Relaunches after the driver stopped the app mid-save and opens ${MAESTRO_NOTEBOOK} again: it opens
# with its first cell, holding the text before the edit or after it, never as half a file. Seeded and
# killed by scripts/atomic-save-notebook-driver.sh.
#
# The screenshot is taken before the wait, so a notebook that fails to open still leaves a frame
# saying what the app drew instead.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "${MAESTRO_NOTEBOOK}.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "${MAESTRO_NOTEBOOK}.ipynb"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 02-reopened-after-the-kill
- extendedWaitUntil:
    visible: "value = 1.*"
    timeout: 60000
- takeScreenshot: 03-the-first-cell-is-there
