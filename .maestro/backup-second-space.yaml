appId: com.jupydroid.app
---
# After the restore, the second Space has its config and its home but no rootfs: a backup never
# carries one. Run puts the image back around the home (`SpaceImageInstaller.extractIfAbsent`), so
# the Space starts, its home is listed, and its notebook's cell answers from the Space's own kernel.
# `42` is scoped to the output, which the cell's `print(6 * 7)` source cannot satisfy.
#
# TABLET ONLY (SM-X216B): the Space's server is started under proot, and only arm64 ships one.
- launchApp
- extendedWaitUntil:
    visible: "Run Thesis \\(space-1\\)"
    timeout: 10000
- tapOn: "Run Thesis \\(space-1\\)"
# Stop, not an enabled Open: see `open-base-space.yaml` for why Open's own node cannot be read. Long
# enough for the image's extract on top of a server's first start.
- extendedWaitUntil:
    visible: "Stop Thesis \\(space-1\\)"
    timeout: 180000
- tapOn: "Open Thesis \\(space-1\\)"
- extendedWaitUntil:
    visible: "thesis.ipynb"
    timeout: 10000
- assertVisible: "thesis.md"
- takeScreenshot: 07-second-space-documents-after
- tapOn: "thesis.ipynb"
- extendedWaitUntil:
    visible: "Run cell"
    timeout: 60000
- tapOn:
    text: "Run cell"
    index: 0
- extendedWaitUntil:
    visible:
      text: "42"
      childOf: {text: "Cell output"}
    timeout: 120000
- takeScreenshot: 08-second-space-cell-answers
