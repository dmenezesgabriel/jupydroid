appId: com.jupydroid.app
---
# Seeded by scripts/cell-menu-driver.sh; clearState would delete the fixture.
#
# Menu items are matched by contentDescription ("Cell menu Delete"), never by their label: a
# soft keyboard and the app's own text both offer competing matches for words like "Delete",
# and step 5.5b showed what a flow that matches the wrong node looks like — green.
- launchApp
- runFlow: open-base-space.yaml
# Home's list is populated by a disk scan, and a scroll started before it has rendered ends
# rather than retrying - so let the launch settle first.
- waitForAnimationToEnd:
    timeout: 5000
# Scrolled to rather than asserted on: Home is sorted by recency, so a seeded notebook
# sinks below the fold as soon as anything else is saved.
- scrollUntilVisible:
    element:
      text: "Cell Menu.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Cell Menu.ipynb"
- extendedWaitUntil:
    visible: "first = 1"
    timeout: 30000
- takeScreenshot: 01-three-cells
# The button is the only way in, and the only one that needs to be: it is visible on every
# cell, and it is a target of its own rather than a gesture on the whole header.
- tapOn:
    text: "Cell actions"
    index: 0
- assertVisible: "Cell menu Insert code below"
- takeScreenshot: 02-menu-open-by-button
# Insert: a new empty cell lands between the first and second.
- tapOn: "Cell menu Insert code below"
- takeScreenshot: 03-cell-inserted
# Move: the third cell goes above the second, so "third = 3" ends up before "second = 2".
- tapOn:
    text: "Cell actions"
    index: 3
- tapOn: "Cell menu Move up"
- takeScreenshot: 04-cell-moved-up
# Duplicate index 2 - which is `third = 3` by now, after the move - then delete the first
# cell. The driver reads the file back afterwards; that order is the real assertion.
- tapOn:
    text: "Cell actions"
    index: 2
- tapOn: "Cell menu Duplicate"
- takeScreenshot: 05-cell-duplicated
- tapOn:
    text: "Cell actions"
    index: 0
# Delete is the last of fourteen rows since P2b added Split cell, so it starts below the fold on
# both surfaces. Why a plain `scrollUntilVisible` cannot reach it is written down once, in the
# subflow.
- runFlow: scroll-the-cell-menu-to-its-end.yaml
- assertVisible: "Cell menu Delete"
- tapOn: "Cell menu Delete"
- assertNotVisible: "first = 1"
- takeScreenshot: 06-cell-deleted
