appId: com.jupydroid.app
---
# At the one width whose bar cannot carry it, the cell-type control is in the overflow.
#
# **This is the reference's own behaviour, not an adaptation.** JupyterLab's notebook toolbar is a
# `ReactiveToolbar` (`packages/apputils/src/mainareawidget.ts:51`), which *moves* an item too wide
# for the row into a popup opener rather than dropping it
# (`packages/ui-components/src/components/toolbar.tsx:570-700`). This app's popup opener is the
# notebook's `⋮`.
#
# Measured: the action row has 72dp free at 320dp and
# the widest label the control draws wants 73.3dp before its caret, so the phone is the width that
# cannot have it. The wide half is `cell-type-on-the-bar`.
#
# **COMPACT WINDOW (<600dp)**, and it is *not* `NARROW WINDOW`: that rule means <840dp, which
# includes the tablet in portrait at 800dp - a window where this control is on the bar and this
# flow's first assertion would be false. The rule this needs is the mirror of `WIDE WINDOW`.
#
# No cell is run, so this needs the width and not the arm64 kernel.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "Cell Types.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Cell Types.ipynb"
- extendedWaitUntil:
    visible: "(?s).*print\\(6 \\* 42\\).*"
    timeout: 30000
# --- the bar does not carry it here ---------------------------------------------------------
- assertNotVisible: "Cell type Code"
- takeScreenshot: 01-the-bar-has-no-room-for-it
# --- and the overflow does, naming the active cell -------------------------------------------
- tapOn: "Notebook actions"
- assertVisible: "Cell type: Code"
- takeScreenshot: 02-the-overflow-carries-it
- tapOn: "Cell type: Code"
# The same picker the bar's own control opens, so there is one list of types and not two.
- assertVisible: "Cell type picker Code"
- assertVisible: "Cell type picker Markdown"
- assertVisible: "Cell type picker Raw"
- takeScreenshot: 03-every-type-is-offered
- tapOn: "Cell type picker Markdown"
- extendedWaitUntil:
    visible: "(?s).*print\\(6 \\* 42\\).*"
    timeout: 10000
# --- and the row names what the cell became --------------------------------------------------
- tapOn: "Notebook actions"
- assertVisible: "Cell type: Markdown"
- takeScreenshot: 04-the-cell-changed-and-the-row-says-so
