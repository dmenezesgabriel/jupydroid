appId: com.jupydroid.app
---
# A cell that becomes markdown is left showing its source.
#
# `changeCellType` ends with *"Fetch the new widget and unrender it"* -
# `(child as MarkdownCell).rendered = false` (`packages/notebook/src/actions.tsx:3308-3312`) - and
# that `if` sits **outside** the `child.model.type !== value` branch, so it reaches every cell the
# command visited. Ours rendered them at once, so converting hid the very text that had just been
# converted behind rendered prose.
#
# **Two cells, because one would not have found what this is really about.** A run changed to
# markdown opens *several* editors in the same frame, and `MarkdownCellField` requests focus on
# arrival - a line written when a tap was the only way to open one.
#
# No kernel needed, so no device rule.
#
# Seeded by scripts/change-to-markdown-driver.sh; clearState would delete the fixture.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "Change To Markdown.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Change To Markdown.ipynb"
- extendedWaitUntil:
    visible: "(?s).*alpha = 1.*"
    timeout: 30000
- takeScreenshot: 01-two-code-cells

# Mark both, so the command acts on a run and not on one cell.
- tapOn: "Cell actions"
- tapOn: "Cell menu Select cells"
- tapOn: "Select cell 2"
- extendedWaitUntil:
    visible: "2 selected"
    timeout: 10000
- takeScreenshot: 02-a-run-of-two-marked

# The selection bar's overflow carries the cell actions, this one among them.
- tapOn: "Selected cell actions"
- scrollUntilVisible:
    element:
      text: "Cell menu Change cells to markdown"
    direction: DOWN
    timeout: 10000
- tapOn: "Cell menu Change cells to markdown"
- waitForAnimationToEnd:
    timeout: 5000

# Both are markdown and both are showing their source, which is the claim.
- assertVisible: "(?s).*alpha = 1.*"
- assertVisible: "(?s).*beta = 2.*"
- assertNotVisible: "Rendered markdown"
# **And the notebook is still in command mode**, which is the second claim and the one this flow
# was extended to make. `changeCellType` ends on `notebook.deselectAll()` and no mode change
# (`actions.tsx:3314`); here the mode *is* where the focus is, so an editor that took the caret
# would put the symbol row up - `Tab` is its first key - and the soft keyboard with it. That is
# what the first run of this flow captured, before `markdownTakingCaret` existed.
- assertNotVisible: "Tab"
- takeScreenshot: 03-both-are-open-for-editing-and-neither-took-the-caret
