appId: com.jupydroid.app
---
# The second of the three flows scripts/chat-queued-questions-follow-driver.sh runs, after part 1
# queued a question in each of two chats and the driver killed the app.
#
# From the Chat list, "untitled" is renamed "notes" and "untitled1" is deleted, with no chat open, so
# nothing is asked. The driver then reads the app's own storage: the 2+2 question is kept under
# notes.chat, and nothing under either old path.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "Chat"
- extendedWaitUntil:
    visible: "Open an existing chat:"
    timeout: 30000
- takeScreenshot: 03-relaunched-both-chats-listed

- longPressOn: "untitled"
- extendedWaitUntil:
    visible: "Rename"
    timeout: 10000
- tapOn: "Rename"
- extendedWaitUntil:
    visible: "Rename chat"
    timeout: 10000
# The whole name is selected, so what is typed replaces it.
- inputText: "notes"
- tapOn: "Rename"
- extendedWaitUntil:
    notVisible: "Rename chat"
    timeout: 10000
- extendedWaitUntil:
    visible: "notes"
    timeout: 30000
- assertNotVisible: "untitled"
- takeScreenshot: 04-untitled-renamed-notes

- longPressOn: "untitled1"
- extendedWaitUntil:
    visible: "Delete"
    timeout: 10000
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Are you sure you want to permanently delete: untitled1\\?"
    timeout: 10000
# The dialog's title is "Delete" too; its button is the one under the question.
- tapOn:
    text: "Delete"
    below: "Are you sure you want to permanently delete: untitled1\\?"
- extendedWaitUntil:
    notVisible: "Are you sure you want to permanently delete: untitled1\\?"
    timeout: 10000
- extendedWaitUntil:
    notVisible: "untitled1"
    timeout: 30000
- assertVisible: "notes"
- takeScreenshot: 05-untitled1-deleted-notes-left
