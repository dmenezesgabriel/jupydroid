appId: com.jupydroid.app
---
# Landscape, two panes, in base, with opencode installed in base. Driven by
# scripts/chat-queued-questions-driver.sh, which empties the workspace first and afterwards checks in
# untitled.chat that each question was answered before the next was asked.
#
# A question sent while the persona writes would cut its reply short (jupyter_ai_acp_client
# `default_acp_client.py`, `prompt_and_reply`, in the shipped rootfs), so the panel holds it as a
# pending row until the reply ends, and asks the next only once the one before has been answered.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "Chat"
- extendedWaitUntil:
    visible: "No chat opened"
    timeout: 30000
- tapOn: "New chat"
- extendedWaitUntil:
    visible: "Ask the agent"
    timeout: 30000
- tapOn: "Ask the agent"
- inputText: "Run echo queue-$((6*7)) with your bash tool, then answer with only what it printed."
- hideKeyboard
- tapOn: "Send"
# The call waits on the user, and the persona writes until it is answered, however long the flow
# takes: a count to 1000 ended before Maestro had typed the next question.
- extendedWaitUntil:
    visible: ".*Allow\\?"
    timeout: 300000
- tapOn: "Ask the agent"
- inputText: "What is 2+2? Answer with the number only."
- hideKeyboard
- tapOn: "Send"
- extendedWaitUntil:
    visible: "1 queued"
    timeout: 30000
- tapOn: "Ask the agent"
- inputText: "What is 3+3? Answer with the number only."
- hideKeyboard
- tapOn: "Send"
- extendedWaitUntil:
    visible: "2 queued"
    timeout: 30000
# Still writing, and still asking: the queued questions cut nothing short.
- assertVisible: "Stop"
- assertVisible: ".*Allow\\?"
- takeScreenshot: 01-two-questions-wait-while-the-call-asks
# A third, taken off again with its ×. Its text is only in its row, so it is gone when the row is;
# the other two still being there says it was the third row's × that was tapped.
- tapOn: "Ask the agent"
- inputText: "What is 5+5? Answer with the number only."
- hideKeyboard
- tapOn: "Send"
- extendedWaitUntil:
    visible: "3 queued"
    timeout: 30000
- takeScreenshot: 02-a-third-question-queued
- tapOn:
    text: "Remove from queue"
    index: 2
- extendedWaitUntil:
    visible: "2 queued"
    timeout: 30000
- assertNotVisible: "What is 5\\+5\\? Answer with the number only\\."
- assertVisible: "What is 2\\+2\\? Answer with the number only\\."
- assertVisible: "What is 3\\+3\\? Answer with the number only\\."
- takeScreenshot: 03-its-cross-takes-the-third-off-the-queue
- tapOn: "Allow once"
# The reply ends with what the call printed; then the first queued is asked, and the second only
# once the first is answered.
- extendedWaitUntil:
    notVisible: "\\d queued"
    timeout: 600000
# The last answer is the end to wait for, not Stop going: once "6" has streamed the screen is still
# while the persona ends its turn, and Maestro gave up waiting on Stop after 1.3 s of a 60 s timeout.
# The driver reads that the turn ended from the server's log instead.
- extendedWaitUntil:
    visible: "6"
    timeout: 300000
- assertVisible: "(?i)\\W*queue-42\\W*"
- assertVisible: "4"
- takeScreenshot: 04-allowed-the-queue-empties-and-each-is-answered-in-turn
