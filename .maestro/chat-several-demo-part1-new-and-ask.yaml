appId: com.jupydroid.app
---
# The first of the four flows scripts/chat-several-demo-driver.sh runs, landscape, two panes, in base
# with opencode installed and signed in by a person, on an empty workspace.
#
# The Chat panel offers only New chat. New chat makes `untitled`, where a question is answered; a
# second New chat makes `untitled1`, which opens empty.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "Chat"
- extendedWaitUntil:
    visible: "No chat opened"
    timeout: 30000
- assertVisible: "New chat"
- assertNotVisible: "Open an existing chat:"
- takeScreenshot: 01-only-new-chat

- tapOn: "New chat"
- extendedWaitUntil:
    visible: "Ask the agent"
    timeout: 30000
- assertVisible: "untitled"
- tapOn: "Ask the agent"
- inputText: "Count from 1 to 5, one number per line, and nothing else."
- hideKeyboard
- tapOn: "Send"
# The first message spawns `opencode acp` under proot and the model answers over the network, so
# the bound is generous. The question holds no digit on its own line, so only the answer matches.
- extendedWaitUntil:
    visible: "1\\s+2\\s+3\\s+4\\s+5\\s*"
    timeout: 300000
- takeScreenshot: 02-untitled-answered

- tapOn: "All chats"
- extendedWaitUntil:
    visible: "Open an existing chat:"
    timeout: 30000
- tapOn: "New chat"
- extendedWaitUntil:
    visible: "untitled1"
    timeout: 30000
- assertVisible: "Ask the agent"
- assertNotVisible: "1\\s+2\\s+3\\s+4\\s+5\\s*"
- takeScreenshot: 03-untitled1-open-and-empty
