appId: com.jupydroid.app
---
# Beside a browser a document is **closed from its tab**,
# and only from its tab.
#
# There is nothing to go back *to* here - the browser is already on screen - and closing the
# document is the `lm-TabBar-tab`'s ✕, which is where all three references keep it:
# `application:close` is *Close Tab* on the tab (`application-extension/src/index.tsx:309-310`),
# a `Codicon.close` on the tab in VS Code, `CloseTab` inside `EditorTabLabel` in IntelliJ. The
# pane itself offers nothing: JupyterLab's in-document `TitleHandler` exists only in
# `single-document` mode (`packages/application/src/shell.ts:690-705`), which this app has no
# equivalent of, and a second ✕ inside it was the duplicate the strip made redundant.
#
# **All three surfaces**, because the one strip serves all three bars' documents and a flow that
# only opened one would pass with two of them still carrying the dead affordance.
#
# WIDE WINDOW (>= 840dp). Runs no cell: the notebook is opened and read, never executed, so
# `FakeKernelGateway` is never asked anything.
- launchApp
- runFlow: open-base-space.yaml
- extendedWaitUntil:
    visible: "Files"
    timeout: 10000

# --- the notebook ---
- tapOn: "Root.ipynb"
- extendedWaitUntil:
    visible: ".*this one is at the root.*"
    timeout: 20000
- assertVisible: "Close tab: Root.ipynb"
# No arrow either - the browser it would go back to is already beside the document.
# Anchored at "Back to", not "^Back": the system navigation bar's own button is named "Back"
# and this tablet runs three-button navigation, so the bare anchor matches the navbar.
# Every strip arrow's label begins with "Back to" (`upDestinationLabel`).
- assertNotVisible: "^Back to"
- takeScreenshot: 01-the-notebook-closes-from-its-tab
- tapOn: "Close tab: Root.ipynb"
- extendedWaitUntil:
    notVisible: ".*this one is at the root.*"
    timeout: 10000
# **The document area empties and the browser keeps its column** - which is what the frame showed
# and not what this flow first claimed. It is also the reference's own structure: VS Code leaves an
# empty editor group (its watermark lives there) and JupyterLab an empty dock area. What fills it is
# the Launcher, and inventing a surface for it here would be inventing one the reference already
# names.
- assertVisible: "Root.ipynb"
- assertVisible: "file_editor.py"
- takeScreenshot: 02-the-document-area-is-empty-and-the-browser-keeps-its-column

# --- the plain file editor ---
- tapOn: "file_editor.py"
- extendedWaitUntil:
    visible: ".*the file editor.*"
    timeout: 20000
- assertVisible: "Close tab: file_editor.py"
- assertNotVisible: "Back to files"
- takeScreenshot: 03-the-plain-editor-closes-from-its-tab
- tapOn: "Close tab: file_editor.py"
- extendedWaitUntil:
    notVisible: ".*the file editor.*"
    timeout: 10000
- assertVisible: "file_editor.py"
- takeScreenshot: 04-the-file-closed-too

# --- the terminal ---
# A shell is not a file, but it occupies the same area, so what empties that area is still the tab.
- tapOn:
    id: "launcher-card-NEW_TERMINAL"
# The wait is the *tab*, not "Terminal" text - the launcher's own card label is "Terminal" too and
# matched instantly while the shell was still spawning, so the assert below once ran against a
# strip that held only the launcher's tab. The minted name is numbered, "Terminal 1"
# (`terminal-manager` parity), so the match is a prefix.
- extendedWaitUntil:
    visible: "Tab: Terminal .*"
    timeout: 120000
- assertVisible: "Close tab: Terminal .*"
- takeScreenshot: 05-the-terminal-closes-from-its-tab-too
- tapOn: "Close tab: Terminal .*"
# **The tab strip's terminal entry going is the oracle, not the shell's title.** The bar used to be
# that oracle, but the bar survives the close in the launcher's refill - what cannot survive is the
# document's own tab. The emptied area refills with the Launcher, so "Terminal"
# *text* is on screen the whole time as the launcher's own card label.
- extendedWaitUntil:
    notVisible: "Close tab: Terminal .*"
    timeout: 15000
- assertVisible:
    id: "launcher-card-NEW_TERMINAL"
- assertVisible: "Root.ipynb"
- takeScreenshot: 06-the-shell-closed-and-the-browser-remains
