appId: com.jupydroid.app
---
# The two restarts that are a restart *and* something else.
#
# `notebook:restart-and-run-to-selected` and `notebook:restart-clear-output` are each an awaited
# restart followed by one more thing (`packages/notebook-extension/src/index.ts:3245-3345`). Both
# halves have to be shown, and on a real kernel: a restart is silent, so a command that skipped it
# and merely re-ran the cells would look identical on screen.
#
# **The fixture is two dependent pairs, so one `NameError` proves two things at once.** Four cells:
#
#   1  alpha = 6 * 7        -> 42
#   2  print(alpha + 79)    -> 121     (needs cell 1's `alpha`)
#   3  zeta = 13 * 13       -> 169
#   4  print(zeta + 1)      -> 170     (needs cell 3's `zeta`)
#
# **Outputs are cleared before the restart, and that is what makes the middle assertion mean
# anything.** Cells 1 and 2 print the same numbers every time they run, so `121` still being on
# screen afterwards would be satisfied by a command that ran nothing at all. Emptied first, `42`
# and `121` can only be back because those two cells actually executed - and `169` staying away is
# the other half of the same claim.
#
# Then running cell 4 raises `NameError`, and that single assertion carries both remaining claims:
# the kernel really was replaced (`zeta` is gone) and cell 3 really was outside the range.
#
# `.*NameError.*` rather than `NameError`, for the reason `shutdown-kernel-fresh-kernel-forgot` records: Maestro
# regex-matches the whole node string and a traceback is one node.
#
# TABLET ONLY (SM-X216B): every assertion here needs a real kernel.
#
# Seeded by scripts/compound-restarts-driver.sh; clearState would delete the fixture.
- launchApp
- runFlow: open-base-space.yaml
# Home's list is populated by a disk scan, and a scroll started before it has rendered ends
# rather than retrying - so let the launch settle first.
- waitForAnimationToEnd:
    timeout: 5000
# Scrolled to rather than asserted on: Home is sorted by recency, so a seeded notebook
# sinks below the fold as soon as anything else is saved.
- scrollUntilVisible:
    element:
      text: "Compound Restarts.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Compound Restarts.ipynb"
- extendedWaitUntil:
    visible: "print\\(alpha \\+ 79\\)"
    timeout: 30000
- takeScreenshot: 01-four-cells-nothing-run

# Baseline: every cell has run. `[4]` and not `170` is the completion signal, because the fourth
# cell's *output* sits under the kernel bar on this window - measured, not guessed: the first run of
# this flow failed on `170` with `[4] ran in 0.1 s` plainly on screen above it.
- tapOn: "Run all cells"
# Generous: the first run of the session installs the Space if needed and starts jupyter_server.
- extendedWaitUntil:
    visible: "\\[4\\]:"
    timeout: 120000
- assertVisible: "42"
- assertVisible: "121"
- assertVisible: "169"
- takeScreenshot: 02-all-four-ran

# The head goes on cell 2. Focus is what selects a cell in this app, so this takes the keyboard and
# gives it back - `hideKeyboard` is a system BACK that the IME takes, and the second one reaches the
# notebook's own BackHandler and drops the caret.
- tapOn: "print\\(alpha \\+ 79\\)"
- waitForAnimationToEnd:
    timeout: 5000
- hideKeyboard
- back
- extendedWaitUntil:
    visible: "Kernel actions"
    timeout: 10000

# Empty the notebook of results first, so what comes back can only have been recomputed.
- tapOn: "Kernel actions"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Clear Outputs of All Cells"
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible: "42"
- assertNotVisible: "121"
- assertNotVisible: "169"
- takeScreenshot: 03-emptied-so-a-rerun-is-visible

- tapOn: "Kernel actions"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Restart Kernel and Run up to Selected Cell…"
# It asks first, exactly as the reference's `await sessionDialogs.restart(…)` does.
- assertVisible: "Restart and run up to the selected cell?"
- assertVisible: "All variables will be lost."
- takeScreenshot: 04-it-asks-before-a-restart
- tapOn: "Restart"
# Both are newly computed on the fresh kernel - and cell 2's could only appear if cell 1 had run
# first, since the restart took `alpha` with it.
- extendedWaitUntil:
    visible: "121"
    timeout: 120000
- assertVisible: "42"
# The head is where the range stops. Cell 3 stayed empty, so it was not run.
- assertNotVisible: "169"
- takeScreenshot: 05-ran-up-to-the-head-and-stopped

# The one assertion that carries both remaining claims: the kernel was replaced, and cell 3 was
# outside the range. index 3 is the fourth cell's Run - all four are on screen at this point.
- tapOn:
    text: "Run cell"
    index: 3
# Scrolled to rather than asserted on: a traceback is several lines and starts below the fold.
- extendedWaitUntil:
    visible: "Run cell"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: ".*NameError.*"
    direction: DOWN
    timeout: 60000
# One more scroll before the screenshot, and it is not cosmetic: `scrollUntilVisible` stops the
# moment the node qualifies, which for a traceback several lines tall is with its first line at the
# bottom edge - the frame showed a red rule and nothing else. The notebook ends here, so this lands
# at the bottom. Re-asserted afterwards so the screenshot shows something the flow checked rather
# than something it hoped for.
- scroll
- assertVisible: ".*NameError.*"
- takeScreenshot: 06-the-kernel-really-was-replaced

# And the other compound command: restart, then throw every result away.
- tapOn: "Kernel actions"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Restart Kernel and Clear Outputs of All Cells…"
- assertVisible: "Restart and clear all outputs?"
- tapOn: "Restart"
- waitForAnimationToEnd:
    timeout: 10000
# Back to the top before asserting an absence, or the assertion would pass on anything simply
# scrolled off screen.
#
# `(?s).*….*` and not the bare source, for the reason `shutdown-kernel-fresh-kernel-forgot` records: Maestro regex-matches
# the **whole** node string, and this cell's source is two lines - so `alpha = 6 \* 7` matches
# nothing. Measured here too: the first run of this flow failed on exactly that, with the cell on
# screen.
- scrollUntilVisible:
    element:
      text: "(?s).*alpha = 6 \\* 7.*"
    direction: UP
    timeout: 20000
# Nothing rendered anywhere - `Cell output` is the container every output kind lands in, so its
# absence is the whole claim.
- assertNotVisible: "Cell output"
- assertNotVisible: "42"
- assertNotVisible: "121"
- takeScreenshot: 07-restart-and-clear-left-nothing
