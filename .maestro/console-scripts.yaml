appId: com.jupydroid.app
---
# P7e-2: `pip`, `jupyter` and 29 other console scripts run by name in the Space's shell.
#
# Before this step `pip --version` answered *Permission denied*, rc 126
# (`evidence/space-python/04-what-the-console-script-still-does.png`) - a `#!` script cannot
# be `execve`'d out of `filesDir`. Under proot `usr/bin/pip` is the image's own `#!` file and
# execs through its shebang line inside the translated root.
#
# **TABLET ONLY (SM-X216B):** the emulator ships no rootfs, so its terminal has no shell. The
# terminal draws to a `Canvas`, so nothing here is asserted by Maestro text - the flow redirects
# what each script printed to a file and the driver reads it back, the oracle
# `evidence/space-python/the-link.txt` is.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn:
    id: "launcher-card-NEW_TERMINAL"
- extendedWaitUntil:
    visible: "Tab: Terminal .*"
    timeout: 300000
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 01-a-shell

# Focus is taken, not waited for - `TerminalInputField` autofocuses on composition, but a first
# inputText's leading keystrokes can still race the IME's own connection setup on this device
# (measured: `ech` of `echo` eaten, `terminal-tablet.yaml`'s own comment). A tap on the field
# is a user's own focus move, and the one that settles the connection before typing starts.
- tapOn:
    id: "terminal-input"
- inputText: "pip --version > p7e2-pip.txt 2>&1"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 20000
- inputText: "echo rc=$? >> p7e2-pip.txt"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 02-pip-by-name

- inputText: "jupyter --version > p7e2-jupyter.txt 2>&1"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 20000
- inputText: "echo rc=$? >> p7e2-jupyter.txt"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 8000
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-jupyter-by-name
