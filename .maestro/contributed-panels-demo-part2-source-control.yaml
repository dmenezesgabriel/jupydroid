appId: com.jupydroid.app
---
# Goes on from part 1, with the modal rail open over Files: Source Control closes the rail and fills
# the pane with the Git extension's panel, which asks base's `jupyter_server` about the workspace root
# (`notARepositoryMessage`). More again opens the rail over it, and the driver reads from the window
# that Source Control's row is the selected one.
- tapOn: "Source Control"
- extendedWaitUntil:
    notVisible: "New terminal"
    timeout: 5000
- extendedWaitUntil:
    visible: "You are not currently in a Git repository\\."
    timeout: 30000
- takeScreenshot: 03-source-control-fills-the-pane
- tapOn: "More"
- extendedWaitUntil:
    visible: "Chat"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 04-rail-over-source-control-its-row-selected
