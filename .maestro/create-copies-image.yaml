appId: com.jupydroid.app
---
# Creating a Space copies the bundled image into it. The progress bar is now
# assertable mid-act - the copy is ~14 s, where the record-only create of
# manage-spaces-create ended before Maestro could capture it. Runs no cell; the
# tablet is required anyway, because only arm64 ships a rootfs - on x86_64 a create refuses.
- launchApp
- extendedWaitUntil:
    visible: "Open Base \\(base\\)"
    timeout: 10000
- assertVisible: "Spaces"

- tapOn: "New Space"
- extendedWaitUntil:
    visible: "Create"
    timeout: 5000
- inputText: "Thesis"
- tapOn: "Create"

# The point of the task: the ~14 s copy keeps the bar up long after the tap.
- assertVisible: "Working on Spaces"
- takeScreenshot: 01-copy-in-progress

- extendedWaitUntil:
    visible: "Thesis"
    timeout: 60000
- assertVisible: "space-1 · .*"
- assertNotVisible: "Working on Spaces"
- takeScreenshot: 02-thesis-created-as-space-1
