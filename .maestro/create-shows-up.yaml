appId: com.jupydroid.app
---
# The created notebook was added but landed above the fold, so the list looked unchanged
# until the app was restarted. Needs a list long enough to scroll - a short one has nothing to
# anchor to, which is why every create-then-appear test passed while the bug was live. Seeded with
# a crowd by its driver.
#
# **The surface changed and the claim did not**: creating from the browser's "+" must put
# the thing on screen without a restart. Where it lands differs - the browser orders directories
# first then naturally by name (`Private.sort`), where Home prepended by recency - so this asserts
# the row itself rather than a timestamp at the top.
- launchApp
- runFlow: open-base-space.yaml
# No scroll here - this flow watches a new row arrive. It does need the settle: tapping before the
# disk listing has rendered races the cold start.
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Files"
- takeScreenshot: 01-the-crowd-before
- tapOn: "New"
- extendedWaitUntil:
    visible: "New notebook"
    timeout: 5000
- tapOn: "New notebook"
# No restart anywhere in this flow. `Untitled.ipynb` is the server's name for a new notebook, and
# it can only be asserted if the row is actually in view - which is the whole point.
- extendedWaitUntil:
    visible: "Untitled.ipynb"
    timeout: 15000
- takeScreenshot: 02-created-and-visible-without-a-restart
