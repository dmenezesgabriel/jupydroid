appId: com.jupydroid.app
---
# Landscape, two panes, on a fresh install. Driven by
# scripts/delete-stops-session-demo-driver.sh. `a.ipynb` is created, runs `x = 41` and is
# deleted from the explorer with its tab open; `b.ipynb` is created, runs a cell, has its tab closed
# and is deleted. Each time the kernel row leaves the Running panel with the file.
#
# `DocumentManager.deleteFile` stops the session at the path it deletes (jupyterlab@7f0e6906
# `packages/docmanager/src/manager.ts`).
#
# Nothing else holds a kernel in this part, so every absence is read with the panel's "Kernel
# Sessions" header on screen: a panel that never opened would pass "the row is gone" too.
#
# TABLET ONLY (SM-X216B): the flow runs cells.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- runFlow:
    file: recreated-path-demo-create-as.yaml
    env:
      NEW_ITEM: "New notebook"
      UNTITLED: "Untitled.ipynb"
      STEM: "a"
      NAME: "a.ipynb"
- tapOn: "a.ipynb"
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000
- runFlow: focus-first-cell.yaml
- inputText: "x = 41"
- hideKeyboard
- tapOn: "Run cell"
# An assignment prints nothing, so the prompt's count is what says the kernel ran it. Generous: the
# first run on a fresh install installs the Space's kernel and starts it.
- extendedWaitUntil:
    visible: "\\[1\\]:"
    timeout: 180000
# Out of edit mode: a cell left in it brings the keyboard back when a dialog closes, and a tap by
# text then lands on the keyboard's own key.
- back
- tapOn: "Sessions and Tabs"
- extendedWaitUntil:
    visible: "Open kernel session: a.ipynb"
    timeout: 15000
- takeScreenshot: 01-a-ipynb-ran-its-kernel-row-listed

# ---- deleted with its tab open: the tab closes and the row leaves ----
- tapOn: "Files"
# An opened file is listed twice when Recents is open, and only the listing's row carries the menu.
# The section arrives shut (ADR-0121), so the listing's row is the one match.
- longPressOn: "a.ipynb"
- extendedWaitUntil:
    visible: "Delete"
    timeout: 5000
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Are you sure you want to permanently delete: a.ipynb?"
    timeout: 5000
- tapOn:
    text: "Delete"
    index: 1
- extendedWaitUntil:
    notVisible: "Tab: a.ipynb"
    timeout: 15000
- tapOn: "Sessions and Tabs"
- extendedWaitUntil:
    visible: "Kernel Sessions"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Open kernel session: a.ipynb"
    timeout: 15000
- takeScreenshot: 02-a-deleted-tab-and-kernel-row-gone

# ---- deleted with its tab closed: the session outlives the tab, and still ends with the file ----
- runFlow:
    file: recreated-path-demo-create-as.yaml
    env:
      NEW_ITEM: "New notebook"
      UNTITLED: "Untitled.ipynb"
      STEM: "b"
      NAME: "b.ipynb"
- tapOn: "b.ipynb"
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000
- runFlow: focus-first-cell.yaml
- inputText: "x = 41"
- hideKeyboard
- tapOn: "Run cell"
# A second kernel starting.
- extendedWaitUntil:
    visible: "\\[1\\]:"
    timeout: 120000
- back
- tapOn: "Close tab: b.ipynb"
- extendedWaitUntil:
    notVisible: "Tab: b.ipynb"
    timeout: 10000
- tapOn: "Sessions and Tabs"
- extendedWaitUntil:
    visible: "Open kernel session: b.ipynb"
    timeout: 15000
- takeScreenshot: 03-b-tab-closed-its-kernel-still-listed
- tapOn: "Files"
- longPressOn: "b.ipynb"
- extendedWaitUntil:
    visible: "Delete"
    timeout: 5000
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Are you sure you want to permanently delete: b.ipynb?"
    timeout: 5000
- tapOn:
    text: "Delete"
    index: 1
- extendedWaitUntil:
    notVisible: "b.ipynb"
    timeout: 15000
- tapOn: "Sessions and Tabs"
- extendedWaitUntil:
    visible: "Kernel Sessions"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Open kernel session: b.ipynb"
    timeout: 15000
- takeScreenshot: 04-b-deleted-its-kernel-row-gone
