appId: com.jupydroid.app
---
# The same process, after part 1. `c.ipynb` runs a cell and is replaced by `d.ipynb` renamed over
# it; no kernel row reads `c.ipynb` afterwards. Then `keep.ipynb` runs `x = 41` and `e.ipynb` a cell
# of its own, and `e.ipynb` is deleted: the row `keep.ipynb` stays, and a second cell there holding
# only `x + 1` prints `42`.
#
# `overwrite` deletes its target through `deleteFile`, which stops the session at that path
# (jupyterlab@7f0e6906 `packages/docmanager/src/manager.ts`). `42` is in no source, and a kernel the
# delete beside it had stopped would answer `NameError`: the stop took only the path it was aimed at.
#
# TABLET ONLY (SM-X216B): the flow runs cells.
- launchApp:
    stopApp: false

# ---- replaced by a rename over it ----
- runFlow:
    file: recreated-path-demo-create-as.yaml
    env:
      NEW_ITEM: "New notebook"
      UNTITLED: "Untitled.ipynb"
      STEM: "c"
      NAME: "c.ipynb"
- tapOn: "c.ipynb"
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000
- runFlow: focus-first-cell.yaml
- inputText: "x = 41"
- hideKeyboard
- tapOn: "Run cell"
- extendedWaitUntil:
    visible: "\\[1\\]:"
    timeout: 120000
# Out of edit mode, so the keyboard stays down when the dialogs below close.
- back
- tapOn: "Close tab: c.ipynb"
- extendedWaitUntil:
    notVisible: "Tab: c.ipynb"
    timeout: 10000
- tapOn: "Sessions and Tabs"
- extendedWaitUntil:
    visible: "Open kernel session: c.ipynb"
    timeout: 15000
- takeScreenshot: 05-c-ran-its-kernel-row-listed
- runFlow:
    file: recreated-path-demo-create-as.yaml
    env:
      NEW_ITEM: "New notebook"
      UNTITLED: "Untitled.ipynb"
      STEM: "d"
      NAME: "d.ipynb"
- longPressOn: "d.ipynb"
- extendedWaitUntil:
    visible: "Rename"
    timeout: 5000
- tapOn: "Rename"
- extendedWaitUntil:
    visible: "Rename file"
    timeout: 5000
- inputText: "c"
- tapOn: "Rename"
- extendedWaitUntil:
    visible: "Overwrite file?"
    timeout: 10000
- takeScreenshot: 06-d-renamed-over-c-asks
- tapOn: "Overwrite"
- extendedWaitUntil:
    notVisible: "d.ipynb"
    timeout: 15000
- tapOn: "Sessions and Tabs"
- extendedWaitUntil:
    visible: "Kernel Sessions"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Open kernel session: c.ipynb"
    timeout: 15000
- takeScreenshot: 07-c-overwritten-its-kernel-row-gone

# ---- a delete beside a running notebook takes only its own kernel ----
- runFlow:
    file: recreated-path-demo-create-as.yaml
    env:
      NEW_ITEM: "New notebook"
      UNTITLED: "Untitled.ipynb"
      STEM: "keep"
      NAME: "keep.ipynb"
- tapOn: "keep.ipynb"
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000
- runFlow: focus-first-cell.yaml
- inputText: "x = 41"
- hideKeyboard
- tapOn: "Run cell"
- extendedWaitUntil:
    visible: "\\[1\\]:"
    timeout: 120000
- back
- runFlow:
    file: recreated-path-demo-create-as.yaml
    env:
      NEW_ITEM: "New notebook"
      UNTITLED: "Untitled.ipynb"
      STEM: "e"
      NAME: "e.ipynb"
- tapOn: "e.ipynb"
- extendedWaitUntil:
    visible: "Tab: e.ipynb"
    timeout: 30000
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000
- runFlow: focus-first-cell.yaml
- inputText: "x = 41"
- hideKeyboard
- tapOn: "Run cell"
- extendedWaitUntil:
    visible: "\\[1\\]:"
    timeout: 120000
- back
- tapOn: "Sessions and Tabs"
- extendedWaitUntil:
    visible: "Open kernel session: e.ipynb"
    timeout: 15000
- assertVisible: "Open kernel session: keep.ipynb"
- takeScreenshot: 08-e-and-keep-each-hold-a-kernel
- tapOn: "Files"
# Recents is cleared for the reason part 1 gives: only the listing's row carries the menu.
- tapOn: "Recent actions"
- tapOn: "Clear Recent Documents"
- extendedWaitUntil:
    notVisible: "Recent"
    timeout: 5000
- longPressOn: "e.ipynb"
- extendedWaitUntil:
    visible: "Delete"
    timeout: 5000
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Are you sure you want to permanently delete: e.ipynb?"
    timeout: 5000
- tapOn:
    text: "Delete"
    index: 1
- extendedWaitUntil:
    notVisible: "Tab: e.ipynb"
    timeout: 15000
- tapOn: "Sessions and Tabs"
- extendedWaitUntil:
    visible: "Open kernel session: keep.ipynb"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Open kernel session: e.ipynb"
    timeout: 15000
- takeScreenshot: 09-e-deleted-keep-still-listed

# ---- the same kernel: a second cell in keep.ipynb holding only `x + 1` ----
- tapOn: "Open kernel session: keep.ipynb"
- extendedWaitUntil:
    visible: "Tab: keep.ipynb"
    timeout: 10000
- tapOn: "Cell actions"
- extendedWaitUntil:
    visible: "Insert code below"
    timeout: 5000
- tapOn: "Insert code below"
- waitForAnimationToEnd:
    timeout: 3000
# Beneath a one-line cell with no output the new field is at [805,488][1884,522]
# (`uiautomator dump`, as the rename demo measured it).
- tapOn:
    point: "1300,505"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "x + 1"
- hideKeyboard
- tapOn:
    text: "Run cell"
    index: 1
- extendedWaitUntil:
    visible:
      text: "42"
      childOf: {text: "Cell output"}
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 10-x-plus-1-prints-42-on-keeps-own-kernel
