appId: com.jupydroid.app
---
# A line's breakpoint and its finding each answer their own tap. The gutter is the breakpoint's alone,
# as VS Code's glyph margin is; a finding is read from its squiggle in the text, as VS Code's marker
# hover is, and a phone performs the hover as a tap.
#
# What a flow can observe here is the card: `Diagnostic detail` and the finding's own text are
# accessibility text, so a tap that must open it asserts it and a tap that must not asserts its
# absence. The breakpoint is canvas, so it is read off the screenshot, which is looked at: one
# circle in the gutter's cell, with nothing drawn over it.
#
# The squiggle is canvas too, and nothing says the server has published: the field's own name
# ("Code cell") sits where a summary of its findings once did. So the first tap on the squiggle is
# also the wait for it, repeated until the card opens.
#
# TABLET ONLY, for the reason `diagnostics.yaml` states: on the emulator's `FakeKernelGateway` no
# kernel session opens, the sync gate never opens, and no `pylsp` runs. Run at both of the tablet's
# widths by `scripts/diagnostic-detail-driver.sh`, which names where each target is
# in the `MAESTRO_*` points below, since the two widths put them at different places.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "Diagnostics.ipynb"
- extendedWaitUntil:
    # matches-source: the warm-up cell's source anchors the notebook being open; what is asserted
    # after is `ran in`, the kernel's own output.
    visible: '.*x = 1 \+ 1.*'
    timeout: 15000
- tapOn: "Run cell"
# `ran in` - the run's job is the open session, which opens the sync gate the findings ride on.
- extendedWaitUntil:
    visible: ".*ran in.*"
    timeout: 180000
- takeScreenshot: 01-kernel-session-open

# A finding alone: the line has no breakpoint, so the card is all a tap on its squiggle can do.
- repeat:
    times: 30
    while:
      notVisible: "Diagnostic detail"
    commands:
      - tapOn:
          point: ${MAESTRO_ERROR_SQUIGGLE}
      - waitForAnimationToEnd:
          timeout: 2000
- assertVisible: "Diagnostic detail"
- assertVisible: ".*error: undefined name 'never_defined_lsp_name'.*"
- assertVisible: ".*pyflakes.*"
- takeScreenshot: 02-squiggle-tap-shows-the-finding
- tapOn:
    point: ${MAESTRO_OUTSIDE}
- assertNotVisible: "Diagnostic detail"

# A breakpoint alone, on a line with no finding: the gutter arms it and no card opens.
- tapOn:
    point: ${MAESTRO_GUTTER_BREAKPOINT_ONLY}
- assertNotVisible: "Diagnostic detail"
- takeScreenshot: 03-breakpoint-alone-armed

# The line holding both. One tap in the gutter arms it, and the finding's icon is not drawn over it.
- tapOn:
    point: ${MAESTRO_GUTTER_BOTH}
- assertNotVisible: "Diagnostic detail"
- takeScreenshot: 04-line-holding-both-armed

# The squiggle reads the finding and leaves the breakpoint where it is.
- tapOn:
    point: ${MAESTRO_ERROR_SQUIGGLE}
- extendedWaitUntil:
    visible: "Diagnostic detail"
    timeout: 10000
- takeScreenshot: 05-squiggle-tap-on-the-armed-line-shows-the-finding
- tapOn:
    point: ${MAESTRO_OUTSIDE}
- assertNotVisible: "Diagnostic detail"

# The gutter removes it and no card opens.
- tapOn:
    point: ${MAESTRO_GUTTER_BOTH}
- assertNotVisible: "Diagnostic detail"
- takeScreenshot: 06-gutter-tap-removed-the-breakpoint

# A second severity on a line of its own, a warning under `=`: a squiggle two characters wide is
# still a target a finger hits. Last, because focusing this cell raises the soft keyboard at 1280dp and
# the list scrolls to keep it in view, which would move every point above. The keyboard is already up
# from the gutter taps and covers this cell; `hideKeyboard` is sent only when it is (its space bar reads
# "English"), since where none shows, at 800dp, a BACK would go to the notebook.
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "English"
    commands:
      - hideKeyboard
- tapOn:
    point: ${MAESTRO_WARNING_SQUIGGLE}
- extendedWaitUntil:
    visible: "Diagnostic detail"
    timeout: 10000
- assertVisible: ".*E225 missing whitespace around operator.*"
- takeScreenshot: 07-warning-squiggle-tap-shows-the-finding
