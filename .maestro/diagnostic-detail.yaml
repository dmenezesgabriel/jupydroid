appId: com.jupydroid.app
---
# P5e-1: the gutter mark's tap answers what VS Code's `markerHoverParticipant` answers on hover -
# the line's findings in a floating card.
#
# The mark itself is canvas, so the flow taps its *pixel* (the square `02` shows at the glyph
# column's left edge, ≈39% across the width) and asserts the popup's own accessibility text -
# `Diagnostic detail`, the severity line, and `pyflakes · code` where the server sent them.
# Dismissal is then a real outside tap on empty notebook space, the finger version of clicking
# off the hover.
#
# TABLET ONLY, for the reason `diagnostics.yaml` states: on the emulator's
# `FakeKernelGateway` no kernel session opens, the sync gate never opens, and no `pylsp` runs.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "Diagnostics.ipynb"
- extendedWaitUntil:
    visible: '.*x = 1 \+ 1.*'
    timeout: 15000
- tapOn: "Run cell"
# `ran in` - the run's job is the open session, which opens the sync gate the diagnostics ride on.
- extendedWaitUntil:
    visible: ".*ran in.*"
    timeout: 180000
- takeScreenshot: 01-kernel-session-open

# Both marks published - the gate the rest of the flow rides on (same as P5d-2b).
- extendedWaitUntil:
    visible: ".*diagnostic on line 1: error, undefined name 'never_defined_lsp_name'.*"
    timeout: 60000
- assertVisible: ".*diagnostic on line 1: warning, E225 missing whitespace around operator.*"
- takeScreenshot: 02-marks-up

# The mark's own tap - the square sits in the glyph column at the field's left edge, the
# position `02` measured. A finger where the mark is drawn, nothing else.
- tapOn:
    point: "39%,42%"
- extendedWaitUntil:
    visible: "Diagnostic detail"
    timeout: 10000
- assertVisible: "Diagnostic detail"
- assertVisible: ".*error: undefined name 'never_defined_lsp_name'.*"
- assertVisible: ".*pyflakes.*"
- takeScreenshot: 03-mark-tap-shows-the-findings

# Off the card dismisses it - the popup's own semantics is what vanishes; the mark's a11y
# summary on the field stays behind and must not be what this asserts on.
- tapOn:
    point: "50%,75%"
- extendedWaitUntil:
    notVisible:
      text: "Diagnostic detail"
    timeout: 10000
- assertNotVisible: "Diagnostic detail"
- takeScreenshot: 04-outside-tap-dismissed
