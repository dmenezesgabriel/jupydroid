appId: com.jupydroid.app
---
# `publishDiagnostics` as gutter marks. The server pushes the publications unprompted once
# the document is synced; `NotebookDiagnostics` maps their ranges back through the virtual document
# and the cell gutters draw a severity-coloured square - CodeMirror's lint-gutter job in the
# reference.
#
# What is asserted is the *semantics text* the mark carries - the painted square states its own
# diagnostics for TalkBack (`diagnostic on line 1: error, ...`), which is also what a flow can
# see - and then the same mark's *pixel* is checked in the screenshots by eye.
#
# The discriminating shape is the same one virtual-document.yaml's comments record: the marked name is
# never run, so the kernel's namespace cannot be where the diagnostic came from - only the
# shared virtual document pyflakes linted knows it. And the last step re-types the cell to a
# *different* undefined name: a mark naming it appears only if edits resync the document -
# the live-as-you-type half of the feature.
#
# TABLET ONLY, for the same reason `language-completion.yaml` states: on the x86_64
# emulator `MainActivity` falls back to `FakeKernelGateway` - no kernel session opens, the
# sync gate never opens, and no `pylsp` ever runs to push a diagnostic.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "Diagnostics.ipynb"
- extendedWaitUntil:
    # The warm-up cell's own source is the anchor, not an observation - what is asserted
    # after is `ran in`, the kernel's own output.
    # matches-source: as above
    visible: '.*x = 1 \+ 1.*'
    timeout: 15000
- tapOn: "Run cell"
# `ran in` rather than an output value - the run's job is the open session, which is what
# opens the sync gate the diagnostics ride on.
- extendedWaitUntil:
    visible: ".*ran in.*"
    timeout: 180000
- takeScreenshot: 01-kernel-session-open

# The first publish: pyflakes' own `undefined name` on the never-run cell's first line, and
# pycodestyle's `missing whitespace` on the warning cell - both pushed by the server, neither
# asked for.
- extendedWaitUntil:
    visible: ".*diagnostic on line 1: error, undefined name 'never_defined_lsp_name'.*"
    timeout: 60000
- assertVisible: ".*diagnostic on line 1: error, undefined name 'never_defined_lsp_name'.*"
- assertVisible: ".*diagnostic on line 1: warning, E225 missing whitespace around operator.*"
- takeScreenshot: 02-error-and-warning-marks

# Live-as-you-type: the error cell becomes a *different* undefined call, and a mark naming
# it must appear - possible only if the edit resynced the virtual document and the server
# pushed again.
# matches-source: the tap anchors on the cell's current text to focus the field; what is
# asserted after is the new mark's description, not this text.
- tapOn: '.*print\(never_defined_lsp_name\).*'
- eraseText
- inputText: "second_also_undefined()"
- hideKeyboard
- extendedWaitUntil:
    visible: ".*diagnostic on line 1: error, undefined name 'second_also_undefined'.*"
    timeout: 60000
- assertVisible: ".*diagnostic on line 1: error, undefined name 'second_also_undefined'.*"
- takeScreenshot: 03-live-edit-republished
