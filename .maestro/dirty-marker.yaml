appId: com.jupydroid.app
---
# P6c-9c: the `•` a dirty document's title carries, on both title bars - the file editor's own bar
# and the notebook's title strip. `jp-mod-dirty` marks the widget in the reference and the tab
# draws the dot (`ui-components/style/icons.css:268-278`); neither of this app's bars is a tab
# strip, so the marker is the `•` beside the title, announced as "Unsaved changes".
#
# `autosaveEnabled: false` is seeded by the driver, the way the autosave flows seed it: with the
# debounce live the document is clean 500 ms after the last keystroke and the marker a race.
#
# Each arm closes through Discard so the flow leaves nothing behind; nothing runs a cell, so the
# emulator is enough and the driver shards across both devices.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- assertVisible: "Files"
# ---- Arm 1: the file editor's own bar ----
- tapOn: "marker_file.py"
- assertVisible: "Back to files|Close tab: marker_file.py"
- extendedWaitUntil:
    visible: ".*the file editor.*"
    timeout: 10000
- assertNotVisible: "Unsaved changes"
- takeScreenshot: 01-file-editor-clean
- tapOn: ".*the file editor.*"
- tapOn:
    point: "95%,25%"
- pressKey: Enter
- inputText: "dirty_probe"
- assertVisible: "(?s).*dirty_probe.*"
- extendedWaitUntil:
    visible: "Unsaved changes"
    timeout: 10000
- takeScreenshot: 02-file-editor-dirty
# Discard is how the arm leaves: the dialog the dismiss raises is itself the proof the marker was
# telling the truth, and answering it keeps the flow self-contained.
- tapOn: "Back to files|Close tab: marker_file.py"
- extendedWaitUntil:
    visible: "Save your work"
    timeout: 5000
- takeScreenshot: 03-the-gate-agrees
- tapOn: "Discard"
- extendedWaitUntil:
    visible: "Files"
    timeout: 10000
# ---- Arm 2: the notebook's title strip ----
- tapOn: "Dirty Marker.ipynb"
- assertVisible: "Back to files|Close tab: Dirty Marker.ipynb"
- extendedWaitUntil:
    visible: "marker_probe = 1"
    timeout: 10000
- assertNotVisible: "Unsaved changes"
- takeScreenshot: 04-notebook-clean
- tapOn: "marker_probe = 1"
- inputText: " + 1"
# The edit lands in the field first and the marker follows it once the debounced report has
# turned into `dirty` - the wait is what keeps the screenshot honest.
- extendedWaitUntil:
    visible: "Unsaved changes"
    timeout: 10000
- takeScreenshot: 05-notebook-dirty
- tapOn: "Back to files|Close tab: Dirty Marker.ipynb"
- extendedWaitUntil:
    visible: "Save your work"
    timeout: 5000
- tapOn: "Discard"
- extendedWaitUntil:
    visible: "Files"
    timeout: 10000
- takeScreenshot: 06-both-left-clean
