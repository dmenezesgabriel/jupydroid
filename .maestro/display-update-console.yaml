appId: com.jupydroid.app
---
# The Console redraws a display by id across its entries, as a notebook does across its cells:
# entry 1 shows a handle, entry 2 updates it three times, and entry 1 must end on `'frame 3'` alone
# while entry 2 shows nothing. `'frame 3'` is built by the kernel from an f-string, so no source
# typed here holds it, and FakeKernelGateway would echo the sources instead. Opened by
# output-caps-baseline-open.yaml on the control notebook, whose run starts the kernel the
# Console shares; seeded by scripts/display-update-console-driver.sh.
#
# TABLET ONLY (SM-X216B): the flow runs cells.
- tapOn: "Run cell"
# Generous: the first run starts the kernel.
- extendedWaitUntil:
    visible: "\\[1\\]:"
    timeout: 300000
- tapOn: "Kernel actions"
- tapOn: "New Console for Notebook"
- extendedWaitUntil:
    visible:
      id: "console-input-field"
    timeout: 10000
- tapOn:
    id: "console-input-field"
- inputText: "h = display('frame 0', display_id=True)"
- tapOn: "Run"
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: "'frame 0'"
      childOf: {text: "Cell output"}
    timeout: 60000
- takeScreenshot: 01-entry-one-shows-frame-0
- tapOn:
    id: "console-input-field"
- inputText: "for i in range(1, 4): h.update(f'frame {i}')"
- tapOn: "Run"
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: "'frame 3'"
      childOf: {text: "Cell output"}
    timeout: 60000
- assertNotVisible:
    text: "'frame 0'"
    childOf: {text: "Cell output"}
- assertNotVisible:
    text: "'frame 2'"
    childOf: {text: "Cell output"}
- takeScreenshot: 02-entry-one-on-frame-3-alone
