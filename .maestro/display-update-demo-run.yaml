appId: com.jupydroid.app
---
# The demo, typed into a new notebook rather than seeded: cell 1 shows a display handle, cell 2
# updates it three times and cell 1 ends on `'frame 3'` alone while cell 2 shows nothing; cell 3
# draws an image displayed with `width=100`; and a Console on the notebook's kernel redraws its own
# entry 1 the same way from entry 2. Run by scripts/display-update-demo-driver.sh, which
# kills the app after this part and reads the saved file.
#
# The Console runs here, before the relaunch, because a relaunched notebook has no kernel to share.
#
# TABLET ONLY (SM-X216B): the flow runs cells. `'frame 3'` is built by the kernel from an f-string,
# so no source typed here holds it, and FakeKernelGateway would echo the sources and draw no image.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "New"
- extendedWaitUntil:
    visible: "New notebook"
    timeout: 5000
- tapOn: "New notebook"
- extendedWaitUntil:
    visible: "Untitled.ipynb"
    timeout: 10000
- tapOn: "Untitled.ipynb"
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000

# All three cells are typed before any runs, each focused by its field's name: a pixel tapped
# below an unrun cell missed the field on SM-X216B's 1920x1200 and every source landed in cell 1.
- runFlow:
    file: focus-cell.yaml
    env:
      CELL_INDEX: 0
- inputText: "h = display(\"frame 0\", display_id=True)"
- hideKeyboard
- tapOn:
    text: "Cell actions"
    index: 0
- tapOn: "Cell menu Insert code below"
- runFlow:
    file: focus-cell.yaml
    env:
      CELL_INDEX: 1
- runFlow: display-update-demo-type-update.yaml
- hideKeyboard
- tapOn:
    text: "Cell actions"
    index: 1
- tapOn: "Cell menu Insert code below"
- runFlow:
    file: focus-cell.yaml
    env:
      CELL_INDEX: 2
# The 1x1 PNG of the display-update-metadata.ipynb fixture.
- inputText: "import base64; from IPython.display import Image, display; display(Image(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=='), width=100))"
- hideKeyboard

# Cell 1 alone first, so the frame it starts on is seen before anything updates it.
- tapOn:
    text: "Run cell"
    index: 0
# Generous: a kernel that is not up yet starts first.
- extendedWaitUntil:
    visible:
      text: "'frame 0'"
      childOf: {text: "Cell output"}
    timeout: 300000
- takeScreenshot: 01-one-output-frame-0

- tapOn:
    text: "Run cell"
    index: 1
- extendedWaitUntil:
    visible: "\\[2\\]:"
    timeout: 60000
- assertVisible:
    text: "'frame 3'"
    childOf: {text: "Cell output"}
- assertNotVisible:
    text: "'frame 0'"
    childOf: {text: "Cell output"}
- assertNotVisible:
    text: "'frame 2'"
    childOf: {text: "Cell output"}
- takeScreenshot: 02-cell-one-on-frame-3-alone

- tapOn:
    text: "Run cell"
    index: 2
- extendedWaitUntil:
    visible: "\\[3\\]:"
    timeout: 60000
- assertVisible: "Cell image output"
- takeScreenshot: 03-the-image

# The Console, on the notebook's own kernel. The cell still has focus after Run, and a notebook in
# edit mode draws the symbol row where the kernel bar would be; `back` is edit mode's exit to
# command mode, as in progress-bar-demo-runs.yaml.
- back
- tapOn: "Kernel actions"
- tapOn: "New Console for Notebook"
- extendedWaitUntil:
    visible:
      id: "console-input-field"
    timeout: 10000
- tapOn:
    id: "console-input-field"
- inputText: "h = display(\"frame 0\", display_id=True)"
- tapOn: "Run"
# The soft keyboard covers the transcript's newest entry, so it goes before the wait looks for it.
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: "'frame 0'"
      childOf: {text: "Cell output"}
    timeout: 60000
- takeScreenshot: 04-console-entry-one-frame-0
- tapOn:
    id: "console-input-field"
- runFlow: display-update-demo-type-update.yaml
- tapOn: "Run"
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: "'frame 3'"
      childOf: {text: "Cell output"}
    timeout: 60000
- assertNotVisible:
    text: "'frame 0'"
    childOf: {text: "Cell output"}
- assertNotVisible:
    text: "'frame 2'"
    childOf: {text: "Cell output"}
- takeScreenshot: 05-console-entry-one-on-frame-3-alone
