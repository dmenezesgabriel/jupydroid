appId: com.jupydroid.app
---
# The Settings screen's Code font size stepper resizes a real notebook cell, and the
# choice survives a relaunch. Nothing below runs a cell, so the emulator - and its
# FakeKernelGateway - is enough; this flow is sharded across both devices the same way
# settings-screen.yaml and theme-override.yaml are, since a notebook cell is drawn
# full-width on the emulator's one pane and beside Files on the tablet's two.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "Code Font Size.ipynb"
- extendedWaitUntil:
    visible: "import numpy as np"
    timeout: 15000
- takeScreenshot: 01-cell-at-default-size

- back
- runFlow: open-settings.yaml
- extendedWaitUntil:
    visible: "Code font size"
    timeout: 5000
- assertVisible: "14sp"
- takeScreenshot: 02-settings-default-size

- tapOn: "Increase code font size"
- tapOn: "Increase code font size"
- tapOn: "Increase code font size"
- tapOn: "Increase code font size"
- tapOn: "Increase code font size"
- tapOn: "Increase code font size"
- assertVisible: "20sp"
- tapOn: "Decrease code font size"
- tapOn: "Decrease code font size"
- assertVisible: "18sp"
- takeScreenshot: 03-settings-increased

- tapOn: "Back to files|Close tab: Settings"
- extendedWaitUntil:
    visible: "Code Font Size.ipynb"
    timeout: 5000
- tapOn: "Code Font Size.ipynb"
- extendedWaitUntil:
    visible: "import numpy as np"
    timeout: 15000
- takeScreenshot: 04-cell-at-increased-size

# The choice survives a relaunch - `EditorSettingsRepositoryContract`'s own
# `remembersACodeFontSizeChange`, now asked of the real app rather than a `TemporaryFolder`.
- stopApp
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- runFlow: open-settings.yaml
- extendedWaitUntil:
    visible: "Code font size"
    timeout: 5000
- assertVisible: "18sp"
- takeScreenshot: 05-settings-after-relaunch
