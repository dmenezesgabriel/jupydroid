appId: com.jupydroid.app
---
# A notebook with no cells used to show "No cells yet" and offer no way to add one.
# The fixture has no `cells` key at all - which is exactly what createNotebook writes, and what
# an import leaves behind. Seeded by scripts/empty-notebook-driver.sh.
- launchApp
- runFlow: open-base-space.yaml
# Home's list is populated by a disk scan, and a scroll started before it has rendered ends
# rather than retrying - so let the launch settle first.
- waitForAnimationToEnd:
    timeout: 5000
# Scrolled to rather than asserted on: Home is sorted by recency, so a seeded notebook
# sinks below the fold as soon as anything else is saved.
- scrollUntilVisible:
    element:
      text: "Empty Notebook.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Empty Notebook.ipynb"
# `[ ]` rather than the word "code": a code cell's kind label is Jupyter's own
# bracket, where `[ ]` is "never run".
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000
- assertNotVisible: "No cells yet"
- takeScreenshot: 01-empty-notebook-has-a-cell
# The point of the cell is that it can be typed into.
- tapOn:
    text: "Cell actions"
    index: 0
- tapOn: "Cell menu Insert code below"
- takeScreenshot: 02-and-the-menu-works-from-it
# Now the other route in: a notebook created from the browser's New menu, which is where Home's
# FAB items went when the browser replaced Home.
- back
- tapOn: "New"
- extendedWaitUntil:
    visible: "New notebook"
    timeout: 5000
- tapOn: "New notebook"
# No restart. This flow used to stop and relaunch here because a new
# notebook did not reach Recents until the list was rebuilt; that was fixed in e517e4a, and
# create-shows-up proves the row arrives on its own. The relaunch also had no settle, so it
# raced the disk scan - a workaround that had outlived its reason and could only misfire.
# `Untitled.ipynb` is the server's name for a new notebook, and waiting on it means the row is
# really in view - the browser orders by name, so the creation scrolls itself into view rather
# than being prepended the way Home's list was.
- extendedWaitUntil:
    visible: "Untitled.ipynb"
    timeout: 15000
# The row arriving is not the list holding still: that fix scrolls Recents to a newly-topmost
# notebook, and a tap dispatched mid-animation lands where the row was rather than where it is.
# Seen failing exactly here once in thirty flows, and green on the retry - the settle after a
# launch has an in-app twin, needed after anything that re-orders the list.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Untitled.ipynb"
    index: 0
# `[ ]` rather than the word "code": a code cell's kind label is Jupyter's own
# bracket, where `[ ]` is "never run".
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000
- assertNotVisible: "No cells yet"
- takeScreenshot: 03-created-notebook-has-a-cell
