appId: com.jupydroid.app
---
# X2a: the workspace as files. Recents lists notebooks wherever they are and cannot show a folder
# at all, so everything below - the folder, the notebook inside it, the data file beside it - is
# invisible to every other flow in the suite.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
# The workspace opens on its browser - there is no second door to walk through, because
# Recents stopped being a screen and became a section of this one.
- assertVisible: "Files"
# "Workspace" is the root crumb; the reference labels its own root the same way rather than
# showing an empty path.
- assertVisible: "Workspace"
- assertVisible: "reports"
- assertVisible: "At Root.ipynb"
- takeScreenshot: 02-workspace-root

- tapOn: "reports"
# The crumb trail grew a segment, which is what makes it navigation rather than a label.
- assertVisible: "reports"
- assertVisible: "Nested.ipynb"
- assertVisible: "data.csv"
- takeScreenshot: 03-inside-the-folder

# A file that is not a notebook opens in the plain editor, which is the reference's own split:
# the notebook factory claims `.ipynb` and the file editor is the default for everything else.
# It must NOT open in the notebook editor - a `.csv` shown as cells is the same confusion that
# "New Python file" caused.
- tapOn: "data.csv"
# The whole file is one text node, so the regex must span it: maestro matches a selector against
# the *entire* text of a node, and the field holds `region,amount\nnorth,120\nsouth,80`.
- assertVisible: ".*region,amount.*"
- takeScreenshot: 04-a-csv-in-the-file-editor
- tapOn: "Back to files"
- assertVisible: "Nested.ipynb"

# The notebook in the folder opens, asserted by its cell: a title alone would be matched by the
# row that was tapped, and the path is what the editor has to resolve - `reports/Nested`, not
# `Nested`, and not `reports/Nested.ipynb` with the suffix left on.
- tapOn: "Nested.ipynb"
# The whole cell source. Maestro matches a selector against the *entire* text of a node, so a
# substring finds nothing even when it is plainly on screen.
- extendedWaitUntil:
    visible: "print('this notebook lives in a folder')"
    timeout: 10000
- takeScreenshot: 05-notebook-from-a-folder

# Back returns to the folder it was opened from, not to Recents: the explorer is still an entry
# underneath.
- tapOn: "Back to files"   # the TopAppBar arrow. Not "Back": the system nav bar has that too
- assertVisible: "Nested.ipynb"
- takeScreenshot: 06-back-to-the-folder

# `filebrowser:go-up`. Back climbs the workspace one directory before it leaves the screen, which
# is the reference's Backspace binding.
- back
- assertVisible: "At Root.ipynb"
- assertNotVisible: "Nested.ipynb"
- takeScreenshot: 07-back-climbed-to-the-root

# At the root there is no parent left, so `BackHandler` is disabled and the gesture leaves the app
# rather than being swallowed. Asserting the *leaving* is not something maestro can do without
# reading another app's screen, so what is pinned here is the state it leaves from: the root, with
# no crumb below "Workspace" to climb to.
- assertVisible: "Workspace"
- assertNotVisible: "Nested.ipynb"
- takeScreenshot: 08-back-at-the-root-with-nothing-left-to-climb
