appId: com.jupydroid.app
---
# X2g, the case only two panes can reach: deleting the document that is open *beside* the browser.
#
# Two things have to happen, and neither is visible from the other. The pane must close - the
# reference's `deleteFile` closes every widget open on the path (`manager.ts:351-363`) - and the
# editor must stop writing, because ours flushes its last edit on the way out where the
# reference's `SaveHandler.dispose()` writes nothing. A flush after the delete puts the notebook
# back, and the screen would look perfectly correct while it happened. The driver reads the disk.
#
# Runs no cell: a delete is a filesystem question, and the panes are a layout one.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
# The workspace opens on its browser, so there is no "Browse files" to tap: Recents
# stopped being a screen and became a section of this one.
- extendedWaitUntil:
    visible: "Files"
    timeout: 10000
- tapOn: "Switch Alpha.ipynb"
- extendedWaitUntil:
    visible: "first_only = 111"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Workspace"
- takeScreenshot: 01-the-notebook-beside-the-browser

# An edit that has not been written yet: the debounce is 500ms, and the delete lands on top of it.
- tapOn: "first_only = 111"
- inputText: "edited_before_the_delete = 1"
- takeScreenshot: 02-an-edit-in-flight

# **Clear Recents first, to remove an ambiguity rather than to test one.** Since X2h an open
# document is on screen twice in the browser pane - the section carries what was opened, the
# listing carries what is on disk - and only the listing row has a menu, because renaming and
# deleting belong to the file rather than to the memory of having opened it. Selecting by index
# was tried and is not stable: maestro's ordering is its own, and the editor's app-bar title is a
# third node with the same text. Emptying the section leaves one row in the browser, which is the
# state these flows were written against.
# Clearing is behind the section's own overflow since P7c - the reference's view-pane header keeps
# its secondary actions in a `…` menu (`viewPane.ts:693`) and gives the heading itself to the
# collapse, so the two taps here are one act.
- tapOn: "Recent actions"
- tapOn: "Clear Recent Documents"
- extendedWaitUntil:
    notVisible: "Recent"
    timeout: 5000

# Delete it from the browser, with the notebook still open beside it.
- longPressOn: "Switch Alpha.ipynb"
- extendedWaitUntil:
    visible: "Delete"
    timeout: 5000
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Are you sure you want to permanently delete: Switch Alpha.ipynb?"
    timeout: 5000
- takeScreenshot: 03-it-asks-first
- tapOn:
    text: "Delete"
    index: 1

# The row goes, and so does the pane: nothing is left claiming to show a notebook that is gone.
- extendedWaitUntil:
    notVisible: "Switch Alpha.ipynb"
    timeout: 15000
- extendedWaitUntil:
    notVisible: ".*first_only = 111.*"
    timeout: 10000
- assertVisible: "Workspace"
- takeScreenshot: 04-the-pane-closed-with-it
