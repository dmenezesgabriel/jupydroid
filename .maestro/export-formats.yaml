appId: com.jupydroid.app
---
# P2j-2: bring `jupyter_server` up so the driver can ask nbconvert what it can actually convert.
#
# The flow's whole job is the *side effect*. Nothing here is about export - there is no export in
# the app yet - it opens the fixture and runs one cell, because a run is what starts the Space and
# the server, and the server is what the driver then talks to over `adb forward`.
#
# The fixture's other three cells are carried rather than computed: a markdown cell (which
# `asciidoc`, `latex` and `rst` all route through `convert_pandoc`), a stored `image/png` output
# (which makes `resources['outputs']` non-empty, so `respond_zip` answers with a zip instead of the
# plain artifact) and a stored `text/html` one. nbformat keeps outputs in the file, so none of them
# needs a kernel - the same reading that let P2h-6 be a width rule rather than an ABI one.
#
# TABLET ONLY: on the x86_64 emulator `MainActivity` falls back to `FakeKernelGateway` and no
# server is started at all, so there would be nothing for the driver to ask.
#
# Driven by scripts/export-formats-driver.sh, which reads `GET /api/nbconvert` and then
# converts this notebook to every format that list names.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "export-formats.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "export-formats.ipynb"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-notebook-open
# `print(3 ** 5)`, and it is the notebook's **first** cell for a layout reason rather than a
# narrative one: with it last, its output landed under the kernel bar and the assertion failed
# against a screen whose own `ran in 6.2 s` said the cell had run
# (`evidence/export-formats/README.md`). First, the output is at the top of the viewport
# and no scroll is needed to see it.
#
# 243 is computed and appears in no cell's source, so `FakeKernelGateway`'s echo cannot produce
# it - this flow only passes where a real server came up.
- tapOn:
    text: "Run cell"
    index: 0
# Deliberately *not* scoped with `childOf: {text: "Cell output"}`, for the reason
# `execution-status` already records: this notebook puts **three** output containers on screen -
# this one, the carried PNG and the carried table - and Maestro resolves the scope against the
# first of them. It needs no scope to be honest anyway: 243 is in no cell's source, which is what
# the output gate checks.
#
# Generous timeout: the first run installs the Space and starts jupyter_server.
- extendedWaitUntil:
    visible: "243"
    timeout: 120000
- takeScreenshot: 02-the-server-is-up
