appId: com.jupydroid.app
---
# Puts the focus in the first code cell's field, by the name the field carries.
#
# **Not a flow.** No driver runs this; every flow that types into a fresh notebook's first cell calls
# it with `runFlow`, so the name and the wait for it are written once instead of at every caller. A
# pixel moved with every layout change above the cell, and a tap that missed read as "Run cell not
# found" once the soft keyboard's BACK closed the tab, which looks like an app regression and is not.
#
# `Code cell` is the accessibility text of a child of the field's `EditText`
# (`EditorCell.kt`, `CODE_CELL_NAME`; ADR-0143), and a tap on it lands inside the field. A notebook
# with several cells holds several nodes of that name, so the first is taken with `index: 0`;
# Maestro's text selectors are full-string regexes, so the name cannot match a longer one.
- extendedWaitUntil:
    visible: "Code cell"
    timeout: 5000
- tapOn:
    text: "Code cell"
    index: 0
- waitForAnimationToEnd:
    timeout: 3000
