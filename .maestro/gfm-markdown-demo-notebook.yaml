appId: com.jupydroid.app
---
# The PRD's demo, typed into a new notebook rather than seeded. The first cell becomes markdown and
# holds a pipe table with a left, a centred and a right column, then a paragraph with struck text and
# a bare URL; rendered, it draws a grid, struck text and a link and none of its own syntax. A code
# cell below displays a second table through IPython's Markdown and prints `6 * 7`. Run by
# scripts/gfm-markdown-demo-driver.sh, which dumps the hierarchy after this part.
#
# `42` is computed by the kernel; FakeKernelGateway would echo the source as one node and draw no
# table. Every table cell is its own text node, which a paragraph of pipes never is, so a cell's
# word asserted whole is a grid cell.
#
# TABLET ONLY (SM-X216B): the flow runs a cell.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "New"
- extendedWaitUntil:
    visible: "New notebook"
    timeout: 5000
- tapOn: "New notebook"
- extendedWaitUntil:
    visible: "Untitled.ipynb"
    timeout: 10000
- tapOn: "Untitled.ipynb"
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000

# The new notebook's one cell, turned markdown from the bar's own type control.
- tapOn: "Cell type Code"
- tapOn: "Cell type picker Markdown"
- extendedWaitUntil:
    visible: "Cell type Markdown"
    timeout: 10000
- tapOn: "Write markdown…"
- waitForAnimationToEnd:
    timeout: 3000
# One line per inputText: Enter is the editor's line break, as a keyboard's own key sends it.
- inputText: "| Name | Mid | Count |"
- pressKey: Enter
- inputText: "|:-----|:---:|------:|"
- pressKey: Enter
- inputText: "| left | centre | 7 |"
- pressKey: Enter
- pressKey: Enter
- inputText: "~~gone~~ and https://jupyter.org"
- hideKeyboard
# The source as the field holds it, before it renders: the keyboard once rewrote the URL here, and
# this frame is what says it was left as typed.
- assertVisible: "(?s).*~~gone~~ and https://jupyter\\.org"
- takeScreenshot: 01-the-typed-markdown
- tapOn: "Run cell"
- extendedWaitUntil:
    visible: "centre"
    timeout: 10000
- assertVisible: "Name"
- assertVisible: "Mid"
- assertVisible: "Count"
- assertVisible: "left"
- assertVisible: "7"
# The paragraph keeps its words, struck and linked: its strike and its link are read from the frame.
- assertVisible: "gone and https://jupyter\\.org"
- assertNotVisible: "(?s).*\\| Name \\|.*"
- assertNotVisible: "(?s).*:---:.*"
- assertNotVisible: "(?s).*~~.*"
- takeScreenshot: 02-the-markdown-cell-draws-the-grid

# A code cell below it.
- tapOn: "Cell actions"
- tapOn: "Cell menu Insert code below"
# The new cell's field, where uiautomator put it on SM-X216B's 1920x1200: [805,581][1884,653].
- tapOn:
    point: "1300,617"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "from IPython.display import Markdown, display; display(Markdown(\"| a | b |\\n|:--|--:|\\n| x | 1 |\")); print(6*7)"
- hideKeyboard
- tapOn:
    text: "Run cell"
    index: 1
# Generous: the first run starts the kernel.
- extendedWaitUntil:
    visible:
      text: "42"
      childOf: {text: "Cell output"}
    timeout: 300000
- assertVisible:
    text: "a"
    childOf: {text: "Cell output"}
- assertVisible:
    text: "b"
    childOf: {text: "Cell output"}
- assertVisible:
    text: "x"
    childOf: {text: "Cell output"}
- assertVisible:
    text: "1"
    childOf: {text: "Cell output"}
- assertNotVisible:
    text: "(?s).*\\| a \\|.*"
    childOf: {text: "Cell output"}
# The markdown cell above is still a grid after the run.
- assertVisible: "centre"
- takeScreenshot: 03-the-output-grid-and-the-print
# The code cell still has focus after Run; `back` is edit mode's exit to command mode, where the
# kernel bar part 2 starts from is.
- back
- extendedWaitUntil:
    visible: "Kernel actions"
    timeout: 5000
