appId: com.jupydroid.app
---
# The driver force-stopped the app after part 2. Relaunched and reopened, the markdown cell and the
# output still draw their grids, read back off the disk: no cell runs in this part, and the bar says
# No Kernel, so the output's table and `42` are what the kernel produced in part 1 and the file
# kept. The driver reads the saved file after it.
#
# TABLET ONLY (SM-X216B): part 1 runs a cell.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "Untitled.ipynb"
- extendedWaitUntil:
    visible:
      text: "42"
      childOf: {text: "Cell output"}
    timeout: 60000
- assertVisible: "No Kernel"
- assertVisible: "centre"
- assertVisible: "gone and https://jupyter\\.org"
- assertNotVisible: "(?s).*\\| Name \\|.*"
- assertVisible:
    text: "x"
    childOf: {text: "Cell output"}
- assertNotVisible:
    text: "(?s).*\\| a \\|.*"
    childOf: {text: "Cell output"}
- takeScreenshot: 05-both-grids-after-a-relaunch
