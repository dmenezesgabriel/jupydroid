appId: com.jupydroid.app
---
# Landscape, two panes, on a fresh install with an emptied workspace. Driven by
# scripts/git-panel-demo-driver.sh.
#
# The PRD's demo, in its order. The Source Control panel is the Git extension's (ADR-0104): it asks
# jupyterlab-git's handler in base's `jupyter_server` for the status of the directory the explorer
# shows. The repository is made in the Space's own terminal: `a.txt` is committed and then edited,
# and `c.txt` is new and left alone.
#
# **Each row is asserted by its description, `"<path> • <status>"`**, which only the panel's rows
# carry. A file's bare name proves nothing: the explorer lists it, and the terminal echoes the line
# that made it. A pty echoes the typed line whether or not a shell ran it, so the branch the panel
# names is what says the commands ran; the driver also reads `demo/.git/HEAD` back afterwards.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml

# ---- a repository with one commit, one modified file and one untracked one ----
- tapOn: "New Launcher"
- extendedWaitUntil:
    visible:
      id: "launcher-card-NEW_TERMINAL"
    timeout: 10000
- tapOn:
    id: "launcher-card-NEW_TERMINAL"
- extendedWaitUntil:
    visible: "Tab: Terminal .*"
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    id: "terminal-input"
- inputText: "git init demo && cd demo && echo a > a.txt && git add a.txt && git -c user.name=d -c user.email=d@d commit -m a && echo b >> a.txt && echo c > c.txt"
- pressKey: Enter
- hideKeyboard

# ---- the panel reads master, a.txt modified and c.txt untracked ----
- extendedWaitUntil:
    visible: "demo"
    timeout: 30000
- tapOn: "demo"
- extendedWaitUntil:
    visible: "c.txt"
    timeout: 15000
- tapOn: "Source Control"
- extendedWaitUntil:
    visible: "master"
    timeout: 30000
- assertVisible: "Changed (1)"
- assertVisible: "a.txt • Modified"
- assertVisible: "Untracked (1)"
- assertVisible: "c.txt • Untracked"
- assertNotVisible: "Staged.*"
- takeScreenshot: 01-demo-reads-master-and-its-changes

# ---- a new branch, and the panel reopened reads it ----
- tapOn:
    id: "terminal-input"
- inputText: "git checkout -b feature"
- pressKey: Enter
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Files"
- extendedWaitUntil:
    visible: "c.txt"
    timeout: 10000
- tapOn: "Source Control"
- extendedWaitUntil:
    visible: "feature"
    timeout: 30000
- assertNotVisible: "master"
- takeScreenshot: 02-reopened-reads-feature

# ---- the workspace root is not a repository, and the panel says so ----
- tapOn: "Files"
- tapOn: "Workspace"
- extendedWaitUntil:
    visible: "demo"
    timeout: 10000
- assertNotVisible: "c.txt"
- tapOn: "Source Control"
- extendedWaitUntil:
    visible: "You are not currently in a Git repository."
    timeout: 30000
- assertNotVisible: "a.txt • Modified"
- takeScreenshot: 03-the-root-is-not-a-repository

# ---- after a kill: the same repository reads the same ----
# launchApp stops the process, so the Space's server is started again and the panel asks the new one.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- extendedWaitUntil:
    visible: "demo"
    timeout: 30000
- tapOn: "demo"
- extendedWaitUntil:
    visible: "c.txt"
    timeout: 15000
- tapOn: "Source Control"
- extendedWaitUntil:
    visible: "feature"
    timeout: 60000
- assertVisible: "a.txt • Modified"
- assertVisible: "c.txt • Untracked"
- takeScreenshot: 04-after-a-kill-reads-the-same
