appId: com.jupydroid.app
---
# Seeded by scripts/gutter-wrapped-line-driver.sh; clearState would delete the fixture.
#
# The numbers are drawn on a canvas, not laid out as text, so they carry no accessibility node
# and Maestro cannot assert them - deliberately, since a line number must never be selectable
# or copyable with the code. The screenshots are the evidence; the fixture is built so they
# cannot be read two ways.
- launchApp
- runFlow: open-base-space.yaml
# Home's list is populated by a disk scan, and a scroll started before it has rendered ends
# rather than retrying - so let the launch settle first.
- waitForAnimationToEnd:
    timeout: 5000
# Scrolled to rather than asserted on: Home is sorted by recency, so a seeded notebook
# sinks below the fold as soon as anything else is saved.
- scrollUntilVisible:
    element:
      text: "Line Numbers.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Line Numbers.ipynb"
- extendedWaitUntil:
    visible: "(?s).*import numpy as np.*"
    timeout: 30000
# 11 logical lines, one of which wraps: the gutter must show 1..11 with a single number beside
# the wrapped line, and two-digit numbers must not shift the code sideways.
- takeScreenshot: 01-numbers-with-a-wrapped-line
- tapOn: "(?s).*import numpy as np.*"
- pressKey: Enter
- inputText: "extra = 1"
# The count grew, so the gutter has to have grown with it.
- assertVisible: "(?s).*extra = 1.*"
- takeScreenshot: 02-gutter-follows-an-edit
