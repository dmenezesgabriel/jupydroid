appId: com.jupydroid.app
---
# X2e: Home's "New Python file" creates a *plain file* - not a notebook wearing a `.py` name -
# and opens it in the file editor, which is where a new Untitled Python File lands in the
# reference (`new_untitled({type: "file", ext})` -> the file editor factory). Nothing here runs a
# cell, so the emulator and its FakeKernelGateway are enough; the disk side is the driver's job.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Recents"
- takeScreenshot: 01-recents-with-empty-workspace

# The FAB's menu is the same New menu the explorer carries, minus the folder - a phone offers
# the creation it will use from where it is.
- tapOn: "+"
- assertVisible: "New notebook"
- assertVisible: "New Python file"
- tapOn: "New Python file"
# The editor's own arrow is "Back to files", not the notebook editor's "Back to notebooks": the
# created item is a file, and proving that is on screen what the step is about.
- extendedWaitUntil:
    visible: "Back to files"
    timeout: 10000
- assertVisible: "untitled.py"
- takeScreenshot: 02-a-real-file-not-a-notebook

# The empty field is focusable but has no text to anchor a tap on, so put the cursor on the top
# line directly; the debounced save (500ms) has long flushed by the time the exit screenshot is
# taken, and the driver then proves it on disk.
- tapOn:
    point: "50%,40%"
- inputText: "print('from home')"
- assertVisible: "(?s).*print\\('from home'\\)"
- takeScreenshot: 03-typed-in-the-created-file

- tapOn: "Back to files"
- assertVisible: "Recents"
- takeScreenshot: 04-back-to-recents