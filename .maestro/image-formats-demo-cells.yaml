appId: com.jupydroid.app
---
# The demo, typed into a new notebook rather than seeded. Cell 1 displays a 96x8 strip in each
# of image/jpeg, image/gif, image/webp and image/bmp, each alone with raw=True, then prints `6 * 7`.
# Cell 2 displays a 96 px PNG with width=100, and cell 3 a 96 px PNG with no width, kept as `img3`
# for the Console in part 2. Run by scripts/image-formats-demo-driver.sh.
#
# A flow cannot read a width: the driver's `uiautomator dump` after this part measures each image's
# bounds, and the screenshot shows them. `42` is computed by the kernel, and FakeKernelGateway would
# echo the sources and draw no image.
#
# TABLET ONLY (SM-X216B): the flow runs cells.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "New"
- extendedWaitUntil:
    visible: "New notebook"
    timeout: 5000
- tapOn: "New notebook"
- extendedWaitUntil:
    visible: "Untitled.ipynb"
    timeout: 10000
- tapOn: "Untitled.ipynb"
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000

# Three empty cells first, then typed bottom-up, so a cell that wraps as it fills never moves a field
# still to be typed. Where `uiautomator dump` put the three empty fields on SM-X216B's 1920x1200:
# [805,319][1884,391], [805,488][1884,560] and [805,657][1884,729].
- tapOn:
    text: "Cell actions"
    index: 0
- tapOn: "Cell menu Insert code below"
- tapOn:
    text: "Cell actions"
    index: 1
- tapOn: "Cell menu Insert code below"

- tapOn:
    point: "1300,693"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "img3 = Image(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAGAAAAAQCAIAAABm2O2uAAAAQUlEQVR4nO3QMQ0AIQDAQEAN/vUgBgWfjvxwp6DpPHsPvq3XAX9nUDAoGBQMCgYFg4JBwaBgUDAoGBQMCgYFg8IFXXYBTK6sqH8AAAAASUVORK5CYII=')); display(img3)"
- hideKeyboard
- tapOn:
    point: "1300,524"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "import base64; from IPython.display import Image; display(Image(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAGAAAAAQCAIAAABm2O2uAAAAQElEQVR4nO3QMQ0AIQDAQEANspGKgk9HfrhT0HTuswff1uuAvzMoGBQMCgYFg4JBwaBgUDAoGBQMCgYFg4JB4QIhPgEQpW0vQgAAAABJRU5ErkJggg=='), width=100))"
- hideKeyboard
# Typed in pieces of 200 characters: Maestro types about five a second on SM-X216B, and gives one
# `inputText` 120 s before it calls the device server dead.
- tapOn:
    point: "1300,355"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "display({'image/jpeg': '/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDACgcHiMeGSgjISMtKygwPGRBPDc3PHtYXUlkkYCZlo+AjIqgtObDoKrarYqMyP/L2u71////m8H////6/+b9//j/2wBDASstLTw1PHZBQXb4pYyl+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4"
- inputText: "+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj/wAARCAAIAGADASIAAhEBAxEB/8QAFQABAQAAAAAAAAAAAAAAAAAAAAT/xAAUEAEAAAAAAAAAAAAAAAAAAAAA/8QAFgEBAQEAAAAAAAAAAAAAAAAAAAMF/8QAFBEBAAAAAAAAAAAAAAAAAAAAAP/aAAwDAQACEQMRAD8A"
- inputText: "mASaAAAAAAAAAAD/2Q=='}, raw=True); display({'image/gif': 'R0lGODdhYAAIAIEAACigKAAAAAAAAAAAACwAAAAAYAAIAAAILwABCBxIsKDBgwgTKlzIsKHDhxAjSpxIsaLFixgzatzIsaPHjyBDihxJsqTJjQEBADs='}, raw=True); display({'i"
- inputText: "mage/webp': 'UklGRkgAAABXRUJQVlA4IDwAAAAwAwCdASpgAAgAPtFmrFCoJaQipWgBABoJZwDOOA8KmggAAP7scN//jeP8l39u+3n8GyRTmhpnRcbQAAA='}, raw=True); display({'image/bmp': 'Qk2eAAAAAAAAAD4AAAAoAAAAYAAAAAgAAAABAAEAA"
- inputText: "AAAAGAAAAATCwAAEwsAAAIAAAAAAAAAFIzwABSM8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='}, raw=True); print(6 * 7)"
- hideKeyboard

# Cell 1 is too tall for its own Run cell to stay on screen once typed, so all three run from the
# bar, in order. The bar is command mode's, and `back` is edit mode's exit to it.
- back
- tapOn: "Run all cells"
# Generous: the first run starts the kernel. `[3]:` is cell 3's count, so cells 1 and 2 are done.
- scrollUntilVisible:
    element: "\\[3\\]:"
    direction: DOWN
    timeout: 300000
- assertVisible:
    text: "42"
    childOf: {text: "Cell output"}
- assertVisible:
    text: "Cell image output"
    index: 3
# Each format falling through would draw its mime key in cell 1's output, the first `Cell output`.
- assertNotVisible:
    text: "image/jpeg"
    childOf: {text: "Cell output"}
- assertNotVisible:
    text: "image/gif"
    childOf: {text: "Cell output"}
- assertNotVisible:
    text: "image/webp"
    childOf: {text: "Cell output"}
- assertNotVisible:
    text: "image/bmp"
    childOf: {text: "Cell output"}
- takeScreenshot: 01-four-formats-and-the-print

# Cell 3's image is below the fold until the notebook scrolls; the driver's dump measures cells 2
# and 3 from here.
- scroll
- assertVisible:
    text: "Cell image output"
    index: 1
- assertNotVisible: "<IPython.core.display.Image object>"
- takeScreenshot: 02-width-100-and-its-own-width
