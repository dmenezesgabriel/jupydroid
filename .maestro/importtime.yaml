appId: com.jupydroid.app
---
# Runs the seeded import profile in base's own terminal, so jupyter_ai_acp_client is imported by the
# Space's python3 under proot, as the server imports it. Driven by scripts/importtime-driver.sh,
# which reads the profiles back from the workspace: the terminal canvas is not readable by an
# assertion (cross-cutting.md §8.6).
#
# TABLET ONLY: on the x86_64 emulator no Space runs.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "New Launcher"
- extendedWaitUntil:
    visible:
      id: "launcher-card-NEW_TERMINAL"
    timeout: 10000
- tapOn:
    id: "launcher-card-NEW_TERMINAL"
- extendedWaitUntil:
    visible: "Tab: Terminal .*"
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    id: "terminal-input"
- inputText: "sh jd046-importtime-probe.sh; cat jd046-importtime.txt"
- pressKey: Enter
- hideKeyboard
- takeScreenshot: 01-probe-started
