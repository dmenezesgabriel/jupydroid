appId: com.jupydroid.app
---
# `allow_stdin` is true now, and the notebook and the Console both answer `input_request`
# (ADR-0082). Each prompt here is ipykernel's own: FakeKernelGateway sends no `input_request`, so
# no field would appear, and it would echo each cell's source - which holds neither `hi Ada`, nor
# `42`, nor `abab`. Seeded by scripts/input-prompt-answers-driver.sh.
#
# TABLET ONLY (SM-X216B): the flow runs cells.
#
# The three cells fit the tablet's landscape pane, so each Run is addressed by index: `above:` picks
# the first match above, not the nearest, and ran the first cell twice.
#
# No `hideKeyboard` after a submit: the field goes with the answer and takes the keyboard with it,
# and `hideKeyboard` with no keyboard up presses Back - which closed the notebook's tab here once.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "Input Prompt.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Input Prompt.ipynb"
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000

# input(): the field appears under the cell, labelled with the prompt, while the cell runs.
- tapOn:
    text: "Run cell"
    index: 0
# Generous: the first run installs the Space and starts jupyter_server.
- extendedWaitUntil:
    visible: "Input prompt"
    timeout: 180000
- assertVisible: "Name\\?"
- takeScreenshot: 01-input-prompts-under-the-cell
- tapOn: "Input prompt"
- inputText: "Ada"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      text: "hi Ada"
      childOf: {text: "Cell output"}
    timeout: 60000
- assertVisible:
    text: "Name\\? Ada"
    childOf: {text: "Cell output"}
- assertNotVisible: "Input prompt"
- takeScreenshot: 02-the-answer-echoes-and-the-cell-carries-on

# getpass(): the same field, masked; the echo carries JupyterLab's mask, never the value.
- tapOn:
    text: "Run cell"
    index: 1
- extendedWaitUntil:
    visible: "Input prompt"
    timeout: 60000
- tapOn: "Input prompt"
- inputText: "abc"
- takeScreenshot: 03-a-password-prompt-masks-what-is-typed
- pressKey: Enter
# Two cells have outputs now, and `childOf` takes the first container it matches, so the second
# cell's container is named by index.
- extendedWaitUntil:
    visible:
      text: "42"
      childOf: {text: "Cell output", index: 1}
    timeout: 60000
- assertVisible:
    text: "Secret\\? ········"
    childOf: {text: "Cell output", index: 1}
- takeScreenshot: 04-the-password-echo-is-masked

# Stop with a prompt open: ipykernel's zmq.select loop raises KeyboardInterrupt, the run ends
# Cancelled, and the field goes with it.
- tapOn:
    text: "Run cell"
    index: 2
- extendedWaitUntil:
    visible: "Input prompt"
    timeout: 60000
- hideKeyboard
- tapOn: "Stop cell"
- extendedWaitUntil:
    visible:
      text: ".*KeyboardInterrupt.*"
      childOf: {text: "Cell output", index: 2}
    timeout: 60000
- assertNotVisible: "Input prompt"
- takeScreenshot: 05-stop-closes-an-unanswered-prompt

# The Console prompts the same way, on the notebook's own kernel.
- tapOn: "Kernel actions"
- tapOn: "New Console for Notebook"
- extendedWaitUntil:
    visible:
      id: "console-input-field"
    timeout: 10000
- tapOn:
    id: "console-input-field"
- inputText: "x = input('Again?'); print(x * 2)"
- tapOn: "Run"
- extendedWaitUntil:
    visible: "Input prompt"
    timeout: 60000
- tapOn: "Input prompt"
- inputText: "ab"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      text: "abab"
      childOf: {text: "Cell output"}
    timeout: 60000
- assertVisible:
    text: "Again\\? ab"
    childOf: {text: "Cell output"}
- takeScreenshot: 06-the-console-prompts-the-same-way
