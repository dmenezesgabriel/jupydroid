appId: com.jupydroid.app
---
# The PRD's demo, typed into a new notebook rather than seeded: input() prompts under the cell and
# carries on with the answer, getpass() masks it, Stop closes an unanswered prompt, and a Console
# entry prompts the same way (ADR-0082). Each prompt is ipykernel's own: FakeKernelGateway sends no
# `input_request`, so no field would appear, and it would echo each source - which holds neither
# `hi Ada`, nor a bare `3`, nor `'ab'`. Run by scripts/input-prompt-demo-driver.sh, which
# kills the app after this part.
#
# TABLET ONLY (SM-X216B): the flow runs cells.
#
# No `hideKeyboard` after a prompt's submit: the field goes with the answer and takes the keyboard
# with it, and `hideKeyboard` with no keyboard up presses Back - which closes the notebook's tab.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "New"
- extendedWaitUntil:
    visible: "New notebook"
    timeout: 5000
- tapOn: "New notebook"
- extendedWaitUntil:
    visible: "Untitled.ipynb"
    timeout: 10000
- tapOn: "Untitled.ipynb"
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000

# input(): the field appears under the cell, labelled with the prompt, while the cell runs.
# The empty cell's field has no text to tap by and the editor gives it no tag, so it is tapped at a
# point inside it: SM-X216B's 1920x1200 puts the field at [805,319][1884,391] (`maestro hierarchy`).
- tapOn:
    point: "1300,354"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "name = input(\"Name?\"); print(\"hi\", name)"
- hideKeyboard
- tapOn:
    text: "Run cell"
    index: 0
# Generous: the first run installs the Space's kernel and starts it.
- extendedWaitUntil:
    visible: "Input prompt"
    timeout: 180000
- assertVisible: "Name\\?"
- takeScreenshot: 01-input-prompts-under-the-cell
- tapOn: "Input prompt"
- inputText: "Ada"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      text: "hi Ada"
      childOf: {text: "Cell output"}
    timeout: 60000
- assertVisible:
    text: "Name\\? Ada"
    childOf: {text: "Cell output"}
- assertNotVisible: "Input prompt"
- takeScreenshot: 02-the-answer-echoes-and-the-cell-carries-on

# getpass(): a second cell, inserted below the first.
- tapOn:
    text: "Cell actions"
    index: 0
- tapOn: "Cell menu Insert code below"
# The new cell's field sits at [805,556][1884,628] under the first cell's two output lines, and
# the language server's diagnostic mark covers [805,576][1884,607] of it - tapped below the mark,
# which opens its own detail popup rather than the field.
- tapOn:
    point: "1300,620"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "import getpass; s = getpass.getpass(\"Secret?\"); print(len(s))"
- hideKeyboard
- tapOn:
    text: "Run cell"
    index: 1
- extendedWaitUntil:
    visible: "Input prompt"
    timeout: 60000
- tapOn: "Input prompt"
- inputText: "abc"
- takeScreenshot: 03-a-password-prompt-masks-what-is-typed
- pressKey: Enter
# `childOf` takes the first container it matches, so the second cell's container is named by index.
- extendedWaitUntil:
    visible:
      text: "3"
      childOf: {text: "Cell output", index: 1}
    timeout: 60000
- assertVisible:
    text: "Secret\\? ········"
    childOf: {text: "Cell output", index: 1}
- takeScreenshot: 04-the-password-echo-is-masked

# Stop with a prompt open, in a third cell: ipykernel's zmq.select loop raises KeyboardInterrupt,
# the run ends Cancelled, and the field goes with it.
- tapOn:
    text: "Cell actions"
    index: 1
- tapOn: "Cell menu Insert code below"
# Two output lines lower again: [805,793][1884,865], the diagnostic mark over [805,813][1884,844].
- tapOn:
    point: "1300,857"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "input(\"Wait?\")"
- hideKeyboard
- tapOn:
    text: "Run cell"
    index: 2
- extendedWaitUntil:
    visible: "Input prompt"
    timeout: 60000
- hideKeyboard
- tapOn: "Stop cell"
- extendedWaitUntil:
    visible:
      text: ".*KeyboardInterrupt.*"
      childOf: {text: "Cell output", index: 2}
    timeout: 60000
- assertNotVisible: "Input prompt"
- takeScreenshot: 05-stop-closes-an-unanswered-prompt

# The Console prompts the same way, on the notebook's own kernel. A bare input() is the entry's
# value, so the kernel answers `'ab'` as its result after the echo.
- tapOn: "Kernel actions"
- tapOn: "New Console for Notebook"
- extendedWaitUntil:
    visible:
      id: "console-input-field"
    timeout: 10000
- tapOn:
    id: "console-input-field"
- inputText: "input(\"Again?\")"
- tapOn: "Run"
- extendedWaitUntil:
    visible: "Input prompt"
    timeout: 60000
- tapOn: "Input prompt"
- inputText: "ab"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      text: "'ab'"
      childOf: {text: "Cell output"}
    timeout: 60000
- assertVisible:
    text: "Again\\? ab"
    childOf: {text: "Cell output"}
- takeScreenshot: 06-the-console-prompts-the-same-way
