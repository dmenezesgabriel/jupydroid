appId: com.jupydroid.app
---
# JD-002 T3: a Space is created and renamed by name from the Spaces panel, base offers no rename,
# and a blank name cannot be confirmed. Runs no cell - the acts write config.json, not a kernel -
# and needs two panes, since the panel is on the rail only.
- launchApp
- extendedWaitUntil:
    visible: "Files"
    timeout: 10000
- tapOn: "Spaces"
- extendedWaitUntil:
    visible: "Base"
    timeout: 10000
- assertNotVisible: "Rename Base.*"
- takeScreenshot: 01-base-alone-with-no-rename-control
- tapOn: "New Space"
- extendedWaitUntil:
    visible: "Create"
    timeout: 5000
- inputText: "   "
# Refused by behaviour, not by reading the button's state: Android's accessibility tree keeps a
# Compose button's disabled flag on the clickable node above its label, so `enabled: false` on
# "Create" matches an always-enabled TextView (the same trap `p2d-ranged-runs.yaml` records). A
# live button closes the dialog and adds a row; a dead one does neither.
- tapOn: "Create"
- assertVisible: "Create"
- assertNotVisible: "space-1 · .*"
- takeScreenshot: 02-a-blank-name-cannot-be-created
- eraseText: 5
- inputText: "Thesis"
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Thesis"
    timeout: 10000
- assertVisible: "space-1 · .*"
- assertVisible: "Rename Thesis \\(space-1\\)"
- takeScreenshot: 03-thesis-listed-as-space-1
- tapOn: "Rename Thesis \\(space-1\\)"
- extendedWaitUntil:
    visible: "Rename Space"
    timeout: 5000
- takeScreenshot: 04-the-rename-dialog-with-the-name-selected
- inputText: "Dissertation"
- tapOn: "Rename"
- extendedWaitUntil:
    visible: "Dissertation"
    timeout: 10000
- assertNotVisible: "Thesis"
- assertVisible: "space-1 · .*"
- takeScreenshot: 05-renamed-dissertation-still-space-1
