appId: com.jupydroid.app
---
# JD-002 T5, one pane: the home fills a portrait window too, and the browser is the workspace's
# root, so Back from it is Back to the home. Runs no cell. Portrait on the tablet;
# `scripts/jd-002-t5-spaces-home-driver.sh` rotates.
- launchApp
- extendedWaitUntil:
    visible: "Open Base \\(base\\)"
    timeout: 10000
- takeScreenshot: 05-home-at-one-pane
- runFlow: open-base-space.yaml
- takeScreenshot: 06-base-workspace-one-pane
- back
- extendedWaitUntil:
    visible: "Open Base \\(base\\)"
    timeout: 10000
- takeScreenshot: 07-back-from-one-pane-returns-home
