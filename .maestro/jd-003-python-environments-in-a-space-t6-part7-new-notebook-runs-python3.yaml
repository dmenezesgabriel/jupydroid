appId: com.jupydroid.app
---
# Thesis runs with its stored default `stats` gone, so its server was started with python3: a new
# notebook records and starts `Python 3`, and its cell prints `sys.prefix` as `/usr`, the image's
# own interpreter - FakeKernelGateway would echo the source, which never holds the path. The driver
# reads the file's `metadata.kernelspec` after this part.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Run Thesis \\(space-1\\)"
    timeout: 30000
- tapOn: "Run Thesis \\(space-1\\)"
- extendedWaitUntil:
    visible: "Stop Thesis \\(space-1\\)"
    timeout: 120000
- tapOn: "Open Thesis \\(space-1\\)"
- extendedWaitUntil:
    visible: "Files"
    timeout: 10000
- tapOn: "New"
- extendedWaitUntil:
    visible: "New notebook"
    timeout: 5000
- tapOn: "New notebook"
- extendedWaitUntil:
    visible: "Untitled.ipynb"
    timeout: 10000
- tapOn: "Untitled.ipynb"
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000
# The empty cell's field has no text to tap by; SM-X216B puts it at [805,319][1884,391], as in
# `jd-003-python-environments-in-a-space-t5-part6-new-notebook-runs-in-stats.yaml`.
- tapOn:
    point: "1300,354"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "import sys; sys.prefix"
- hideKeyboard
- tapOn:
    text: "Run cell"
    index: 0
- extendedWaitUntil:
    visible:
      text: ".*'/usr'.*"
      childOf: {text: "Cell output"}
    timeout: 120000
- assertVisible: "Python 3"
- takeScreenshot: 12-new-notebook-ran-in-python3
