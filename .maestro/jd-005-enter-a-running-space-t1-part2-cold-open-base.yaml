appId: com.jupydroid.app
---
# The shared `open-base-space.yaml` from a cold start, where base reads Stopped: it runs base, waits
# for Open to enable, and enters - and base's cell then runs on that server. The path every other
# flow takes into the workspace, checked once against a real server start.
- launchApp
- extendedWaitUntil:
    visible: "Run Base \\(base\\)"
    timeout: 10000
- takeScreenshot: 05-cold-base-stopped
- runFlow: open-base-space.yaml
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "Real Kernel.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Real Kernel.ipynb"
- assertVisible: "print(6 * 7)"
- tapOn:
    text: "Run cell"
    index: 0
# 42 is the kernel's answer: the source reads `6 * 7`, and the fake echo would print that.
- extendedWaitUntil:
    visible:
      text: "42"
      childOf:
        text: "Cell output"
    timeout: 120000
- takeScreenshot: 06-base-printed-42
