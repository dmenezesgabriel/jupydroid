appId: com.jupydroid.app
---
# JD-008: a Space is its own system - the item demo, one run on the tablet.
#
#   1. cold start: install and launch, the home lists Base, open it;
#   2. a terminal: `apk add jq` succeeds and `jq` answers;
#   3. a notebook cell: numpy reports 2.5.1 and sys.prefix is `/usr`;
#   4. back home: creating "Thesis" copies the image with progress showing;
#   5. space-1's rootfs holds no `usr/bin/jq` - base's install did not reach it
#      (driver-side, through run-as: the claim is on disk, not on screen);
#   6. kill and relaunch, open Base: jq is still installed.
#
# TABLET ONLY (SM-X216B): a cell runs, and only arm64 ships a rootfs - on x86_64 the kernel is
# FakeKernelGateway echoing the source. Needs the tablet online, as any `apk add` does.
#
# Driven by scripts/jd-008-space-is-its-own-system-driver.sh, which pm-clear's first for the
# cold start and reads the answer files the typed commands leave in the workspace: the terminal
# draws to a canvas, so nothing in it is assertable by text (`architecture/cross-cutting.md`
# §8.6) - the `jd8-*.rc`/`*.out` files are the oracle and the frames are the record. Typed lines
# stay short for the measured dropped-character defect in terminal inputText
# (p7e-1's header names it).
#
# --- 1. cold start: the home lists Base, open it ------------------------------------------------
- launchApp
- extendedWaitUntil:
    visible: "Open Base \\(base\\)"
    timeout: 30000
- assertVisible: "Spaces"
- takeScreenshot: 01-cold-start-the-home-lists-base

# --- 2. a terminal: `apk add jq` succeeds, and `jq` answers ---------------------------------------
- runFlow: open-base-space.yaml
# The launcher card beside two panes, the modal rail behind the bar's More at one (ADR-0109) -
# p8b's two branches. On this cold start base's rootfs is still extracting while the workspace
# first draws, so every wait carries the slack for it.
- runFlow:
    when:
      notVisible: "More"
    commands:
      - tapOn: "New Launcher"
      - extendedWaitUntil:
          visible:
            id: "launcher-card-NEW_TERMINAL"
          timeout: 60000
      - tapOn:
          id: "launcher-card-NEW_TERMINAL"
- runFlow:
    when:
      visible: "More"
    commands:
      - tapOn: "More"
      - tapOn: "New terminal"
- extendedWaitUntil:
    visible: "Tab: Terminal .*"
    timeout: 180000
- extendedWaitUntil:
    visible:
      id: "terminal-input"
    timeout: 180000
# A tap is a user's own focus move, and the one that settles the IME connection before typing
# starts - autofocus alone raced the first inputText once (p7e-1).
- tapOn:
    id: "terminal-input"
- inputText: "apk add jq > jd8-apk.log 2>&1; echo rc=$? > jd8-apk.rc"
- pressKey: Enter
- takeScreenshot: 02-apk-add-running
# The Files rail re-lists on its 10 s poll, so this row appearing IS "apk exited".
- extendedWaitUntil:
    visible: "jd8-apk.rc"
    timeout: 180000
- inputText: "echo '{\"a\":1}' > j.json"
- pressKey: Enter
- inputText: "jq .a j.json > jd8-jq.out; echo rc=$? > jd8-jq.rc"
- pressKey: Enter
# The keyboard covers the rail's lower rows: jd8-apk.rc was the third row and still showed, but
# the j* rows after it do not. Hidden once, every later row-wait reads the whole rail.
- hideKeyboard
- extendedWaitUntil:
    visible: "jd8-jq.rc"
    timeout: 60000
- takeScreenshot: 03-jq-installed-and-answers

# --- 3. a notebook cell: numpy 2.5.1, sys.prefix /usr ---------------------------------------------
- tapOn: "Apk Space.ipynb"
- extendedWaitUntil:
    visible: "Run cell"
    timeout: 60000
- tapOn:
    text: "Run cell"
    index: 0
# 2.5.1 is the lock's numpy and `/usr` the in-root prefix - both kernel-computed, both scoped to
# the output subtree because the cell's source is on screen too (`check_maestro_output_assertions`).
- extendedWaitUntil:
    visible:
      text: "2\\.5\\.1 /usr[\\s\\S]*"
      childOf: {text: "Cell output"}
    timeout: 120000
- takeScreenshot: 04-numpy-reports-itself-and-the-inroot-prefix

# --- 4. back home: creating "Thesis" copies the image, progress showing -----------------------------
# The user's own way out of a document is its tab's close - one per open tab - and then the
# workspace is the lone launcher, where one Back leaves for the home (p7d, jd-002).
- tapOn: "Close tab: Apk Space\\.ipynb"
- tapOn: "Close tab: Terminal .*"
- extendedWaitUntil:
    visible:
      id: "launcher-card-NEW_TERMINAL"
    timeout: 15000
- back
- extendedWaitUntil:
    visible: "Open Base \\(base\\)"
    timeout: 10000
- takeScreenshot: 05-back-at-the-home

- tapOn: "New Space"
- extendedWaitUntil:
    visible: "Create"
    timeout: 5000
- inputText: "Thesis"
- tapOn: "Create"
# The ~14 s copy keeps the bar up long after the tap - T4's own assertion shape.
- assertVisible: "Working on Spaces"
- takeScreenshot: 06-thesis-copy-in-progress
- extendedWaitUntil:
    visible: "Thesis"
    timeout: 60000
- assertVisible: "space-1 · .*"
- assertNotVisible: "Working on Spaces"
- takeScreenshot: 07-thesis-created-as-space-1

# --- 6. kill and relaunch, open Base: jq is still installed -----------------------------------------
# stopApp is a real kill (force-stop): the server, terminal and kernel all die, and a
# force-stopped app keeps no saved stack, so the relaunch lands on the home, not mid-workspace.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Open Base \\(base\\)"
    timeout: 30000
- runFlow: open-base-space.yaml
- runFlow:
    when:
      notVisible: "More"
    commands:
      - tapOn: "New Launcher"
      - extendedWaitUntil:
          visible:
            id: "launcher-card-NEW_TERMINAL"
          timeout: 60000
      - tapOn:
          id: "launcher-card-NEW_TERMINAL"
- runFlow:
    when:
      visible: "More"
    commands:
      - tapOn: "More"
      - tapOn: "New terminal"
- extendedWaitUntil:
    visible: "Tab: Terminal .*"
    timeout: 180000
- extendedWaitUntil:
    visible:
      id: "terminal-input"
    timeout: 180000
- tapOn:
    id: "terminal-input"
# j.json was written before the kill: jq answering against it now is the install *and* the
# workspace surviving the relaunch in one line.
- inputText: "jq .a j.json > jd8-jq2.out; echo rc=$? > jd8-jq2.rc"
- pressKey: Enter
- hideKeyboard
- extendedWaitUntil:
    visible: "jd8-jq2.rc"
    timeout: 60000
- takeScreenshot: 08-jq-still-installed-after-relaunch
