appId: com.jupydroid.app
---
# Thesis is created as T1's part 1 creates it. In its Settings the thread cap is set to 1, and a
# variable row naming one of the cap's own names is refused **as the cap's**, with Save held; the
# row is removed and the cap saved. A held control is proven by pressing it - the dialog stays
# open - because the node Maestro finds reports enabled whatever the button's state (t1 part 1).
- launchApp
- extendedWaitUntil:
    visible: "Open Base \\(base\\)"
    timeout: 10000
- tapOn: "New Space"
- extendedWaitUntil:
    visible: "Create"
    timeout: 5000
- inputText: "Thesis"
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Run Thesis \\(space-1\\)"
    timeout: 60000
- tapOn: "Settings Thesis \\(space-1\\)"
- extendedWaitUntil:
    visible: "Thread cap"
    timeout: 5000
- tapOn:
    id: "space-thread-cap-field"
- inputText: "1"
- tapOn: "Add variable"
- tapOn:
    id: "space-variable-name-0"
- inputText: "OMP_NUM_THREADS"
- tapOn:
    id: "space-variable-value-0"
- inputText: "8"
- extendedWaitUntil:
    visible: "'OMP_NUM_THREADS' is set by the Space's thread cap and cannot be set"
    timeout: 5000
# The keyboard covers the dialog's button row while a field is focused.
- hideKeyboard
- takeScreenshot: 01-cap-typed-and-omp-refused
- tapOn: "Save"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Thread cap"
- takeScreenshot: 02-save-held-while-omp-refused
- tapOn: "Remove variable OMP_NUM_THREADS"
- tapOn: "Save"
- extendedWaitUntil:
    notVisible: "Thread cap"
    timeout: 5000
- takeScreenshot: 03-saved
# Reopened, the stored cap reads back as it was saved.
- tapOn: "Settings Thesis \\(space-1\\)"
- extendedWaitUntil:
    visible:
      id: "space-thread-cap-field"
      text: "1"
    timeout: 5000
- takeScreenshot: 04-reopened-with-the-stored-cap
- tapOn: "Cancel"
