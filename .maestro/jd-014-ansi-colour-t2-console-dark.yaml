appId: com.jupydroid.app
---
# In the app's Dark theme, then Light, a notebook's ANSI-coloured print, repr and traceback, and the same three
# run from a Console, draw with no escape residue. The colours are measured off the screenshots
# (evidence README). The notebook's cell defines `colours(n)` and `Blue(n)` and calls them with
# n = 1; the Console calls them with n = 2 and raises a ValueError, so every Console value - `84`,
# `112`, `162`, `24`, `invalid literal` - is one only the Console's own execute produced, and none
# is in any source. FakeKernelGateway would echo the source instead. Seeded by
# scripts/jd-014-ansi-colour-t2-driver.sh.
#
# TABLET ONLY (SM-X216B): the flow runs cells.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Back to files|Close tab: Settings"
    timeout: 5000
- tapOn: "Dark"
- tapOn: "Back to files|Close tab: Settings"
- scrollUntilVisible:
    element:
      text: "Ansi Console.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Ansi Console.ipynb"
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000
- tapOn: "Run all cells"
# Generous: the first run installs the Space and starts jupyter_server.
- extendedWaitUntil:
    visible:
      text: "red 42 bold green 56 orange 81"
      childOf: {text: "Cell output"}
    timeout: 180000
- extendedWaitUntil:
    visible: "\\[2\\]:"
    timeout: 30000
- takeScreenshot: 01-the-notebook-draws-its-colours-in-dark
- tapOn: "Kernel actions"
- tapOn: "New Console for Notebook"
- extendedWaitUntil:
    visible:
      id: "console-input-field"
    timeout: 10000
- tapOn:
    id: "console-input-field"
- inputText: "colours(2)"
- tapOn: "Run"
- extendedWaitUntil:
    visible:
      text: "red 84 bold green 112 orange 162"
      childOf: {text: "Cell output"}
    timeout: 30000
- tapOn:
    id: "console-input-field"
- inputText: "Blue(2)"
- tapOn: "Run"
- extendedWaitUntil:
    visible: "blue 24"
    timeout: 30000
- tapOn:
    id: "console-input-field"
- inputText: "int('x')"
- tapOn: "Run"
# The soft keyboard covers the transcript's newest entry, so it goes before the wait looks for it.
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "[\\s\\S]*ValueError: invalid literal for int\\(\\) with base 10: 'x'"
    direction: DOWN
    timeout: 30000
- takeScreenshot: 02-the-console-draws-the-same-colours-in-dark
# The same transcript in the app's Light theme, which swaps the ANSI ramp with the rest of the palette.
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Back to files|Close tab: Settings"
    timeout: 5000
- tapOn: "Light"
- tapOn: "Back to files|Close tab: Settings"
- scrollUntilVisible:
    element:
      text: "[\\s\\S]*ValueError: invalid literal for int\\(\\) with base 10: 'x'"
    direction: DOWN
    timeout: 30000
- takeScreenshot: 03-the-console-draws-the-same-colours-in-light
