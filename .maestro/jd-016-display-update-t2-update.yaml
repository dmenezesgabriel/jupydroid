appId: com.jupydroid.app
---
# Cell 1 shows a display handle; cell 2 updates it three times. Cell 1 must end on `'frame 3'` alone
# and cell 2 must show nothing. `'frame 3'` is built by the kernel from an f-string, so neither cell's
# source holds it, and FakeKernelGateway would echo the sources instead.
# Opened by jd-015-output-caps-baseline-open.yaml, seeded and read by
# scripts/jd-016-display-update-t2-driver.sh.
#
# TABLET ONLY (SM-X216B): the flow runs cells.
- tapOn: "Run all cells"
# Generous: the first run starts the kernel.
- extendedWaitUntil:
    visible: "\\[2\\]:"
    timeout: 300000
- assertVisible:
    text: "'frame 3'"
    childOf: {text: "Cell output"}
- assertNotVisible:
    text: "'frame 0'"
    childOf: {text: "Cell output"}
- assertNotVisible:
    text: "'frame 2'"
    childOf: {text: "Cell output"}
- takeScreenshot: 01-one-frame-in-cell-one
