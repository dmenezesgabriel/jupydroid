appId: com.jupydroid.app
---
# The Console carries out clear_output by entry, as a notebook does by cell. Entry 1 prints, clears
# and prints again, and must show only its second print. Entry 2 prints, then asks to clear when its
# next output arrives and sleeps: its first print must still show while it sleeps, then be replaced
# by its second, and entry 1 must be untouched. Every printed value is built by the kernel from an
# f-string, so no typed source holds it, and FakeKernelGateway would echo the sources instead.
# Entry 2's checks are not scoped by `childOf: {text: "Cell output"}`: Maestro resolves that selector
# to the first such node, entry 1's, so entry 2's output never matched and an assertNotVisible on it
# could never fail. Its values appear in no typed source, so they need no scope.
# Opened by jd-015-output-caps-baseline-open.yaml on the control notebook, whose run starts the
# kernel the Console shares; seeded by scripts/jd-017-console-clear-t1-driver.sh.
#
# TABLET ONLY (SM-X216B): the flow runs cells.
- tapOn: "Run cell"
# Generous: the first run starts the kernel.
- extendedWaitUntil:
    visible: "\\[1\\]:"
    timeout: 300000
- tapOn: "Kernel actions"
- tapOn: "New Console for Notebook"
- extendedWaitUntil:
    visible:
      id: "console-input-field"
    timeout: 10000
- tapOn:
    id: "console-input-field"
- inputText: "from IPython.display import clear_output; print(f'before {6*7}'); clear_output(); print(f'after {6*7}')"
- tapOn: "Run"
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: "after 42"
      childOf: {text: "Cell output"}
    timeout: 60000
- assertNotVisible:
    text: "before 42"
    childOf: {text: "Cell output"}
- takeScreenshot: 01-entry-one-shows-only-after
- tapOn:
    id: "console-input-field"
- inputText: "import time; print(f'first {6*7}'); clear_output(wait=True); time.sleep(15); print(f'second {6*7}')"
- tapOn: "Run"
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: "first 42"
    timeout: 60000
- takeScreenshot: 02-entry-two-keeps-first-while-it-sleeps
- extendedWaitUntil:
    visible:
      text: "second 42"
    timeout: 60000
- assertNotVisible:
    text: "first 42"
- assertVisible:
    text: "after 42"
    childOf: {text: "Cell output"}
- takeScreenshot: 03-entry-two-shows-only-second-and-entry-one-is-untouched
