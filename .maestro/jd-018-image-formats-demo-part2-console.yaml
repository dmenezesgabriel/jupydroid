appId: com.jupydroid.app
---
# A Console on the notebook's kernel displays `img3`, the 96 px PNG cell 3 kept, and draws it the
# width cell 3 did. `img3` exists only in that kernel's namespace, so the image proves the Console
# shares it; FakeKernelGateway draws no image. Run by scripts/jd-018-image-formats-demo-driver.sh
# after part 1, on the screen part 1 left.
#
# A flow cannot read a width: the driver's `uiautomator dump` after this part measures it, and the
# screenshot shows it.
#
# TABLET ONLY (SM-X216B): part 1 runs cells.
# Part 1 ran its cells from command mode and left the notebook there, where the kernel bar is: a
# `back` here would close the notebook rather than leave edit mode.
- tapOn: "Kernel actions"
- tapOn: "New Console for Notebook"
- extendedWaitUntil:
    visible:
      id: "console-input-field"
    timeout: 10000
- tapOn:
    id: "console-input-field"
- inputText: "display(img3)"
- tapOn: "Run"
# The soft keyboard covers the transcript's newest entry, so it goes before the wait looks for it.
- hideKeyboard
- extendedWaitUntil:
    visible: "Cell image output"
    timeout: 60000
- takeScreenshot: 03-console-draws-img3-at-its-own-width
