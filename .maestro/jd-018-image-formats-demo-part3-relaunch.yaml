appId: com.jupydroid.app
---
# The driver force-stopped the app after part 2. Relaunched and reopened, the notebook draws its six
# images again, read back off the disk: no cell runs in this part, so every image and the `42` are
# what the kernel produced in part 1 and the file kept. The driver measures the widths after it and
# reads the saved file.
#
# TABLET ONLY (SM-X216B): part 1 runs cells.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "Untitled.ipynb"
- extendedWaitUntil:
    visible:
      text: "42"
      childOf: {text: "Cell output"}
    timeout: 60000
- assertVisible:
    text: "Cell image output"
    index: 3
- takeScreenshot: 04-four-formats-after-a-relaunch
- scrollUntilVisible:
    element: "\\[3\\]:"
    direction: DOWN
    timeout: 20000
- scroll
- assertVisible:
    text: "Cell image output"
    index: 1
- takeScreenshot: 05-both-widths-after-a-relaunch
