appId: com.jupydroid.app
---
# A JPEG, a GIF, a WebP and a BMP each draw as an image, where each used to fall through to its
# mime-keys line. `42` is computed by the kernel from `6 * 7`; FakeKernelGateway would echo the
# source instead and draw no image. Opened by jd-015-output-caps-baseline-open.yaml, seeded by
# scripts/jd-018-image-formats-t1-driver.sh.
#
# TABLET ONLY (SM-X216B): the flow runs a cell.
- tapOn: "Run cell"
# Generous: the first run starts the kernel.
- extendedWaitUntil:
    visible: "\\[1\\]:"
    timeout: 300000
# The four payloads make the source taller than the screen, so the output is below it. `42` is
# printed after the four displays, so with it in view every image is drawn above it.
- scrollUntilVisible:
    element:
      text: "42"
      childOf: {text: "Cell output"}
    direction: DOWN
    timeout: 20000
- assertVisible:
    text: "Cell image output"
    index: 3
- assertNotVisible:
    text: "image/jpeg"
    childOf: {text: "Cell output"}
- assertNotVisible:
    text: "image/gif"
    childOf: {text: "Cell output"}
- assertNotVisible:
    text: "image/webp"
    childOf: {text: "Cell output"}
- assertNotVisible:
    text: "image/bmp"
    childOf: {text: "Cell output"}
- takeScreenshot: 01-four-images-and-the-print
