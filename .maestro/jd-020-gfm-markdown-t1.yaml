appId: com.jupydroid.app
---
# A GitHub-flavoured pipe table draws as a grid, in a markdown cell and in a `display(Markdown(...))`
# output. Each cell is its own text node, which a paragraph of pipes never is. Where each cell sits
# inside its column is the alignment, which no Maestro assertion reads: the driver dumps the
# hierarchy, and RichTableTest measures it. `42` is computed by the kernel from `6 * 7`;
# FakeKernelGateway would echo the source instead and draw no table. Opened by
# output-caps-baseline-open.yaml, seeded by scripts/jd-020-gfm-markdown-t1-driver.sh.
#
# TABLET ONLY (SM-X216B): the flow runs a cell.
#
# The markdown cell is rendered on open, so it is read before anything runs.
- assertVisible: "Name"
- assertVisible: "centre"
- assertVisible: "1024"
- assertNotVisible: ".*\\| Name \\|.*"
- assertNotVisible: ".*:---:.*"
- takeScreenshot: 01-markdown-cell-table
# Run all rather than the code cell's own Run: it is the one button on screen with that name, and
# running a notebook leaves a rendered markdown cell rendered.
- tapOn: "Run all cells"
# Generous: the first run starts the kernel.
- extendedWaitUntil:
    visible:
      text: "42"
      childOf: {text: "Cell output"}
    timeout: 300000
- assertVisible:
    text: "Key"
    childOf: {text: "Cell output"}
- assertVisible:
    text: "3\\.14"
    childOf: {text: "Cell output"}
- assertNotVisible:
    text: ".*\\| Key \\|.*"
    childOf: {text: "Cell output"}
# The markdown cell's table is still drawn after the run. `Name` is the markdown cell's own text,
# not an output, so the source could match it only if the cell had opened for editing - which the
# pipe line asserted absent next rules out.
# matches-source: the rendered markdown cell, read on purpose
- assertVisible: "Name"
- assertNotVisible: ".*\\| Name \\|.*"
- takeScreenshot: 02-output-table-and-the-print
