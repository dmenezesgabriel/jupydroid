appId: com.jupydroid.app
---
# A bare URL draws as a link, in a markdown cell and in a `display(Markdown(...))` output. A link keeps
# its own characters, so the text reads the same linked or not: what the flow can assert is that each
# paragraph draws whole, and the link's accent and underline are read from the screenshots. `42` is
# computed by the kernel from `6 * 7`; FakeKernelGateway would echo the source instead. Opened by
# output-caps-baseline-open.yaml, seeded by scripts/jd-020-gfm-markdown-t3-driver.sh.
#
# TABLET ONLY (SM-X216B): the flow runs a cell.
#
# The markdown cell is rendered on open, so it is read before anything runs.
- assertVisible: "see https://jupyter.org or www.python.org"
- takeScreenshot: 01-markdown-cell-links
# Run all rather than the code cell's own Run: it is the one button on screen with that name, and
# running a notebook leaves a rendered markdown cell rendered.
- tapOn: "Run all cells"
# Generous: the first run starts the kernel.
- extendedWaitUntil:
    visible:
      text: "42"
      childOf: {text: "Cell output"}
    timeout: 300000
# The code cell's source line holds this text inside `display(Markdown('…'))`, and a selector matches
# a node's whole text, so only the output's own paragraph can match it.
- assertVisible:
    text: "docs at https://ipython.org"
    childOf: {text: "Cell output"}
# matches-source: the rendered markdown cell, read on purpose
- assertVisible: "see https://jupyter.org or www.python.org"
- takeScreenshot: 02-output-link-and-the-print
