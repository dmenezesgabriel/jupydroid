appId: com.jupydroid.app
---
# A Console on the notebook's kernel runs the same `display(Markdown(...))`, and a tap on its link
# opens the browser, which the driver reads from the resumed activity. `Markdown` and `display` are
# names only the cell imported, so a Console that draws the link is on the cell's kernel. Run by
# scripts/jd-021-rendered-link-demo-driver.sh after part 3, which left the notebook in front.
#
# The Console has one entry, so `childOf: {text: "Cell output"}` reaches it: Maestro resolves that
# selector to the first such node (docs/architecture/cross-cutting.md, 8.6).
#
# TABLET ONLY (SM-X216B): part 3 runs a cell.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Kernel actions"
- tapOn: "New Console for Notebook"
- extendedWaitUntil:
    visible:
      id: "console-input-field"
    timeout: 10000
- tapOn:
    id: "console-input-field"
- inputText: "display(Markdown(\"see https://jupyter.org\"))"
- tapOn: "Run"
# The soft keyboard covers the transcript's newest entry, so it goes before the wait looks for it.
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: "see https://jupyter\\.org"
      childOf: {text: "Cell output"}
    timeout: 60000
- takeScreenshot: 01-the-console-link
- tapOn:
    text: "see https://jupyter\\.org"
    childOf: {text: "Cell output"}
    point: "60%,50%"
# No screenshot after the tap: what is on screen then is the browser.
- waitForAnimationToEnd:
    timeout: 5000
