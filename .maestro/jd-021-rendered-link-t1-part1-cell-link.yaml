appId: com.jupydroid.app
---
# A tap on a link in a rendered markdown cell follows the link. The cell's first paragraph is the
# link and nothing else, so its text node is the link. What the tap opened is not on this app's
# screen: scripts/jd-021-rendered-link-t1-driver.sh reads the device's resumed activity after this
# flow and requires another app's. Opened by jd-015-output-caps-baseline-open.yaml.
#
# TABLET ONLY (SM-X216B): the flows that follow run a cell.
- assertVisible: "Jupyter"
- assertVisible: "words beside the link"
- takeScreenshot: 01-markdown-cell-link
- tapOn: "Jupyter"
# No screenshot after the tap: what is on screen then is the browser, with the owner's tabs and
# account in it. The driver's record of the resumed activity is the evidence.
- waitForAnimationToEnd:
    timeout: 5000
