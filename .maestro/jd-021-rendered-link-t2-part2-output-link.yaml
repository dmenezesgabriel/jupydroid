appId: com.jupydroid.app
---
# A workspace link in a `display(Markdown(...))` output opens the document too. `42` is computed by
# the kernel from `6 * 7`; FakeKernelGateway would echo the source instead.
#
# TABLET ONLY (SM-X216B): the flow runs a cell.
#
# Not `stopApp`: the notebook the first part left open is the state under test.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Run all cells"
# Generous: the first run starts the kernel.
- extendedWaitUntil:
    visible:
      text: "42"
      childOf: {text: "Cell output"}
    timeout: 300000
- takeScreenshot: 01-output-link
- tapOn:
    text: "the notes, from an output"
    childOf: {text: "Cell output"}
# The file editor's text node holds the file whole, its final newline included.
- extendedWaitUntil:
    visible: "Notes beside the notebook\\.\\s*"
    timeout: 10000
- assertVisible: "Tab: notes.md"
- takeScreenshot: 02-notes-opened-from-output
