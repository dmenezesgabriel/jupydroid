appId: com.jupydroid.app
---
# A Console on the notebook's kernel calls `mod.f` before it prints, so a Console that prints is
# on the kernel that imported `mod`; then a tap on its printed URL opens the browser, which the
# driver reads from the resumed activity. Run by scripts/jd-022-text-output-link-demo-driver.sh
# after part 4, which left the notebook in front.
#
# The Console has one entry, so `childOf: {text: "Cell output"}` reaches it: Maestro resolves that
# selector to the first such node (docs/architecture/cross-cutting.md, 8.6).
#
# TABLET ONLY (SM-X216B): part 1 runs a cell.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Kernel actions"
- tapOn: "New Console for Notebook"
- extendedWaitUntil:
    visible:
      id: "console-input-field"
    timeout: 10000
- tapOn:
    id: "console-input-field"
- inputText: "mod.f and print(\"see https://jupyter.org\")"
- tapOn: "Run"
# The soft keyboard covers the transcript's newest entry, so it goes before the wait looks for it.
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: "see https://jupyter\\.org"
      childOf: {text: "Cell output"}
    timeout: 60000
- takeScreenshot: 01-the-console-url
# The URL is characters 5-23 of 23, so 60% is inside it, as in part 2.
- tapOn:
    text: "see https://jupyter\\.org"
    childOf: {text: "Cell output"}
    point: "60%,50%"
# No screenshot after the tap: what is on screen then is the browser.
- waitForAnimationToEnd:
    timeout: 5000
