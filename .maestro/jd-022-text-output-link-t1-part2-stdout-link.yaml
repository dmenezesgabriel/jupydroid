appId: com.jupydroid.app
---
# A tap on the URL in the printed sentence; the driver reads the resumed activity, which must be
# another app's. Run by scripts/jd-022-text-output-link-t1-driver.sh after part 1, whose outputs
# are still drawn.
#
# TABLET ONLY (SM-X216B): part 1 runs a cell.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    text: "see https://jupyter\\.org/42"
    childOf: {text: "Cell output"}
# The URL is characters 5-26 of 26, so 60% is inside it.
- tapOn:
    text: "see https://jupyter\\.org/42"
    childOf: {text: "Cell output"}
    point: "60%,50%"
# No screenshot after the tap: what is on screen then is the browser.
- waitForAnimationToEnd:
    timeout: 5000
