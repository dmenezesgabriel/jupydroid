appId: com.jupydroid.app
---
# A Console on the notebook's kernel prints the same sentence, and a tap on its URL opens the
# browser, which the driver reads from the resumed activity. `sys` is imported only by the
# notebook's second cell, so a Console that prints through it is on the notebook's kernel.
# Run by scripts/jd-022-text-output-link-t1-driver.sh after part 3.
#
# The Console has one entry, so `childOf: {text: "Cell output"}` reaches it: Maestro resolves that
# selector to the first such node (docs/architecture/cross-cutting.md, 8.6).
#
# TABLET ONLY (SM-X216B): part 1 runs a cell.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Kernel actions"
- tapOn: "New Console for Notebook"
- extendedWaitUntil:
    visible:
      id: "console-input-field"
    timeout: 10000
- tapOn:
    id: "console-input-field"
- inputText: "print(\"see https://jupyter.org/\" + str(6 * 7), file=sys.stdout)"
- tapOn: "Run"
# The soft keyboard covers the transcript's newest entry, so it goes before the wait looks for it.
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: "see https://jupyter\\.org/42"
      childOf: {text: "Cell output"}
    timeout: 60000
- takeScreenshot: 01-the-console-link
- tapOn:
    text: "see https://jupyter\\.org/42"
    childOf: {text: "Cell output"}
    point: "60%,50%"
# No screenshot after the tap: what is on screen then is the browser.
- waitForAnimationToEnd:
    timeout: 5000
