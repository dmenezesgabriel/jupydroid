appId: com.jupydroid.app
---
# `traceback.print_exc()` on stderr: a tap on the frame in the kernel's own temp dir opens nothing,
# and a tap on `/home/jupydroid/mod.py` opens `mod.py` as a tab. After part 2, run by
# scripts/jd-022-text-output-link-t2-driver.sh.
#
# The traceback is one text node of seven 31 px lines, measured on SM-X216B from `maestro
# hierarchy`: the `/tmp/ipykernel_...` frame is line 2, at 21% of the node's height, and the
# workspace frame line 4, at 50%; 28% across is inside both paths.
#
# TABLET ONLY (SM-X216B): part 1 runs a cell.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Traceback \\(most recent call last\\):.*"
    point: "28%,21%"
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: "Tab: mod.py"
- takeScreenshot: 01-after-the-temp-dir-tap
- tapOn:
    text: "Traceback \\(most recent call last\\):.*"
    point: "28%,50%"
# The file editor's text node holds the file whole, its final newline included.
- extendedWaitUntil:
    visible: "def f\\(\\): 1/0\\s*"
    timeout: 10000
- assertVisible: "Tab: mod.py"
- takeScreenshot: 02-mod-opened-from-stderr
# Back closes the file's tab, and the notebook under it is still there.
- back
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible: "Tab: mod.py"
