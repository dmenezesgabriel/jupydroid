appId: com.jupydroid.app
---
# The driver has `Shared analysis.ipynb` opened from a cold start, by a VIEW intent or through My
# Files (jd-023-shared-notebook-open-from-my-files.yaml); no launchApp here, since the import must
# land in the process the intent started. What the notebook holds is drawn
# before anything runs, so every line on screen came from the shared file's own bytes: its rendered
# heading, and the output the other app saved. The empty notebook this replaces had neither.
# Run by scripts/jd-023-shared-notebook-t1-driver.sh.
#
# TABLET ONLY (SM-X216B): the flow after this one runs a cell.
- extendedWaitUntil:
    visible: "Shared analysis\\.ipynb"
    timeout: 180000
- extendedWaitUntil:
    visible: "A shared analysis"
    timeout: 30000
- assertVisible:
    text: "kept from the other app"
    childOf: {text: "Cell output"}
- assertVisible: "print\\(sum\\(range\\(10\\)\\)\\)"
- takeScreenshot: 01-opened-with-its-cells
