appId: com.jupydroid.app
---
# After a force-stop, both copies are still in base's workspace, and the first opens with the
# output its run saved. Nothing runs here, so the `45` on screen was read back from the file.
# Run by scripts/jd-023-shared-notebook-t1-driver.sh.
#
# TABLET ONLY (SM-X216B): the notebook ran a cell before the relaunch.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- extendedWaitUntil:
    visible: "Shared analysis1\\.ipynb"
    timeout: 20000
- tapOn: "Shared analysis\\.ipynb"
- extendedWaitUntil:
    visible: "A shared analysis"
    timeout: 30000
- assertVisible:
    text: "45"
    childOf: {text: "Cell output"}
- takeScreenshot: 01-relaunched
