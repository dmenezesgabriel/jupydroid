appId: com.jupydroid.app
---
# Below the web image: an HTML <img> at its width attribute, and an image naming no file, which
# draws its alt text. Run by scripts/jd-024-markdown-images-demo-driver.sh twice: after part 3, and
# again after the relaunch.
#
# Runs no cell, so any device draws it; the demo's later parts run cells on the tablet.
- scrollUntilVisible:
    element:
      text: "Missing: no such picture"
    direction: DOWN
    timeout: 20000
- assertVisible: "sized plot"
# No file at that path: the alt is drawn as text in its line, and no image carries it.
- assertNotVisible: "no such picture"
- takeScreenshot: 03-html-img-and-missing
