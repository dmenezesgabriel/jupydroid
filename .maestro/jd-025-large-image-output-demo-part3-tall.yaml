appId: com.jupydroid.app
---
# Cell 2 displays a 300 x 60000 PNG, past the canvas floor and decoded at half size, 150 px wide: it
# draws 300 dp wide, its own width (ADR-0087). `48` is computed from `6 * 8` and printed above the
# image, so it marks the image's top and is no output of cell 1's. Run by
# scripts/jd-025-large-image-output-demo-driver.sh after part 2, whose dump after this part requires
# one image node on screen, so cell 1's cannot be the one it measures.
#
# TABLET ONLY (SM-X216B): the flow runs a cell.
- scrollUntilVisible:
    element:
      text: "Run cell"
      below: "42"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Run cell"
    below: "42"
- extendedWaitUntil:
    visible: "\\[2\\]:"
    timeout: 120000
# Unscoped: `childOf` reaches only the first `Cell output`, cell 1's (docs/architecture/cross-cutting.md,
# 8.6), and the source reads `6 * 8`, which puts no 48 on screen.
- scrollUntilVisible:
    element:
      text: "48"
    direction: DOWN
    timeout: 20000
# Up the screen, past cell 1's image, onto the tall one's bands.
- scroll
- assertNotVisible:
    text: "<IPython.core.display.Image object>"
- takeScreenshot: 03-the-tall-image-at-its-own-width
