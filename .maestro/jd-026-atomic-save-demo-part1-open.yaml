appId: com.jupydroid.app
---
# The demo's cold start: the workspace holds the several-MiB ${MAESTRO_NOTEBOOK}.ipynb and the
# ~30 MiB ${MAESTRO_FILE} beside it, and the notebook opens with its markdown cell. Seeded by
# scripts/jd-026-atomic-save-demo-driver.sh, which waits for the save that binding a kernel makes
# before the next part watches for one.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "${MAESTRO_NOTEBOOK}.ipynb"
    direction: DOWN
    timeout: 20000
- assertVisible: "${MAESTRO_FILE}"
- takeScreenshot: 01-both-documents-in-the-workspace
- tapOn: "${MAESTRO_NOTEBOOK}.ipynb"
- extendedWaitUntil:
    visible: "Notes before the edit"
    timeout: 60000
- takeScreenshot: 02-the-notebook-opened
