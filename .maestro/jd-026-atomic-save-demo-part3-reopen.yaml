appId: com.jupydroid.app
---
# Relaunches and opens ${MAESTRO_NOTEBOOK} again: it opens with its markdown cell, holding the text
# before the edit or after it, never as half a file. Run by scripts/jd-026-atomic-save-demo-driver.sh
# after the stop and after the clean save, which checks the bytes on disk.
#
# The screenshot is taken before the wait, so a notebook that fails to open still leaves a frame
# saying what the app drew instead.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "${MAESTRO_NOTEBOOK}.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "${MAESTRO_NOTEBOOK}.ipynb"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 01-reopened
- extendedWaitUntil:
    visible: "Notes before the edit.*"
    timeout: 60000
- takeScreenshot: 02-the-markdown-cell-is-there
