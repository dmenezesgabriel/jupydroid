appId: com.jupydroid.app
---
# Opens the several-MiB notebook ${MAESTRO_NOTEBOOK} and edits its first cell, so the autosave
# writes the whole document within seconds - while the driver's poller, started before this flow,
# watches the file and stops the app once a write is under way. Seeded by
# scripts/jd-026-atomic-save-t1-driver.sh, which also sets the autosave interval to its minimum.
#
# The first save can come before the edit: opening binds a kernel, which writes
# `metadata.kernelspec` like any other edit (`onKernelBound` in EditorViewModel). Either is a write
# of the whole notebook. The edit makes sure there is one.
#
# **No screenshot.** The stop can land at any step after the open, and a frame taken after it
# captures whatever app the device brings forward - another app's photos, the home screen's
# location. The reopen flow's frames are the evidence.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "${MAESTRO_NOTEBOOK}.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "${MAESTRO_NOTEBOOK}.ipynb"
- extendedWaitUntil:
    visible: "value = 1"
    timeout: 60000
- tapOn: "value = 1"
- inputText: " + 1"
