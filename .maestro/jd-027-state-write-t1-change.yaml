appId: com.jupydroid.app
---
# Opens ${MAESTRO_FILE}, which writes the recents, then picks Dark in Settings, which writes the
# theme store. Seeded by scripts/jd-027-state-write-t1-driver.sh, which reads both files' inodes
# before and after.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "${MAESTRO_FILE}"
- extendedWaitUntil:
    visible: ".*this one is at the root.*"
    timeout: 30000
- takeScreenshot: 01-the-notebook-open
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Back to files|Close tab: Settings"
    timeout: 5000
- assertVisible: "Theme"
- tapOn: "Dark"
- takeScreenshot: 02-dark-chosen
