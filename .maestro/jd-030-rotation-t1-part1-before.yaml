appId: com.jupydroid.app
---
# Landscape, two panes. Seeded by scripts/jd-030-rotation-t1-driver.sh with autosave off, so a
# typed line stays owed rather than racing a debounce. `second.py` is typed into and then left
# beneath `first.py`: a dirty tab that is not on top, the case whose screen does not compose.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "${MAESTRO_FIRST}"
- extendedWaitUntil:
    visible: "Tab: ${MAESTRO_FIRST}"
    timeout: 10000
- tapOn: "${MAESTRO_SECOND}"
- extendedWaitUntil:
    visible: "second = \"typed into\"\\s*"
    timeout: 10000
- tapOn:
    point: "95%,25%"
- inputText: " # unsaved"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Tab: ${MAESTRO_FIRST}"
- extendedWaitUntil:
    visible: "first = \"kept open\"\\s*"
    timeout: 10000
- takeScreenshot: 01-second-is-dirty-beneath-first
