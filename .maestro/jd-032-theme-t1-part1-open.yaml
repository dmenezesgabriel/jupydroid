appId: com.jupydroid.app
---
# Run by scripts/jd-032-theme-t1-driver.sh, once per device mode, which the driver has already set.
# Opens what the theme has to reach: a file, a notebook, a terminal with a line in it, and Settings,
# whose tab every later part comes back to. The app's theme is reset by the driver, so this opens
# on System.
#
# TABLET ONLY (SM-X216B): the terminal is the Space's real shell, which only arm64 ships.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "${MAESTRO_FILE}"
- extendedWaitUntil:
    visible: "notes = \"seeded\"\\s*"
    timeout: 10000
- tapOn: "${MAESTRO_NOTEBOOK}"
- extendedWaitUntil:
    visible: "p8e_marker_first = 1"
    timeout: 30000
- tapOn: "New Launcher"
- extendedWaitUntil:
    visible:
      id: "launcher-card-NEW_TERMINAL"
    timeout: 10000
- tapOn:
    id: "launcher-card-NEW_TERMINAL"
- extendedWaitUntil:
    visible: "Tab: Terminal .*"
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    id: "terminal-input"
- inputText: "echo the shell draws here"
- pressKey: Enter
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Tab: Settings"
    timeout: 5000
- assertVisible: "Theme"
- takeScreenshot: 01-opened-on-system
