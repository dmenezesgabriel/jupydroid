appId: com.jupydroid.app
---
# The second half of scripts/jd-034-recreated-path-t1-driver.sh, against the app the rename half
# left running - no launchApp, which would stop it and take the open tabs with it. A new
# `second.py` is on disk now; its row appears when the listing's poll re-reads the folder, and its
# tap must open a tab of its own beside the renamed one.
- extendedWaitUntil:
    visible: "${MAESTRO_SECOND}"
    timeout: 30000
- tapOn: "${MAESTRO_SECOND}"
- extendedWaitUntil:
    visible: "Tab: ${MAESTRO_SECOND}"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Tab: ${MAESTRO_RENAMED_STEM}.py"
- assertVisible: ".*written after the rename.*"
- takeScreenshot: 03-recreated-second-opens-beside-the-renamed-tab
- tapOn: "Tab: ${MAESTRO_RENAMED_STEM}.py"
- extendedWaitUntil:
    visible: ".*typed into.*"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 04-the-renamed-tab-keeps-its-own-file
