appId: com.jupydroid.app
---
# Landscape, two panes. Seeded by scripts/jd-038-tab-reload-t1-driver.sh with autosave off, so an
# edit stays owed until something writes it or a reload drops it.
#
# `docmanager:reload` re-reads an open document from its file, and asks first when the document has
# unsaved work (jupyterlab@7f0e690 `packages/docmanager-extension/src/index.tsx`). A cell in
# writer.ipynb rewrites notes.py and target.ipynb while both are open; each tab still shows what it
# opened until the strip's reload icon is tapped. The values the cell writes are computed, so only a
# kernel can put `after_42` and `reloaded_42` on screen.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "notes.py"
- extendedWaitUntil:
    visible: "notes = \"seeded\"\\s*"
    timeout: 10000
- tapOn: "target.ipynb"
- extendedWaitUntil:
    visible: "target_as_seeded = 1"
    timeout: 30000
- tapOn: "writer.ipynb"
- extendedWaitUntil:
    visible: "Tab: writer.ipynb"
    timeout: 30000
- tapOn: "Run cell"
- extendedWaitUntil:
    visible:
      text: "wrote_42[\\s\\S]*"
      childOf:
        text: "Cell output"
    timeout: 120000
- takeScreenshot: 01-a-cell-rewrote-notes-and-target

# ---- a clean file: stale until the tap, then the disk's text, with no question ----
- tapOn: "Tab: notes.py"
- extendedWaitUntil:
    visible: "notes = \"seeded\"\\s*"
    timeout: 10000
- takeScreenshot: 02-notes-still-shows-what-it-opened
- tapOn: "Reload tab: notes.py"
- extendedWaitUntil:
    visible: "notes = \"after_42\"\\s*"
    timeout: 10000
- assertNotVisible: "Reload File from Disk"
- assertVisible:
    text: "Save tab: notes.py"
    enabled: false
- takeScreenshot: 03-reloaded-notes-shows-the-cells-text

# ---- a dirty file: asked first; Cancel keeps the edit, Reload drops it ----
- tapOn:
    point: "95%,25%"
- inputText: " # typed_here"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    text: "Save tab: notes.py"
    enabled: true
- tapOn: "Reload tab: notes.py"
- extendedWaitUntil:
    visible: "Reload File from Disk"
    timeout: 5000
- assertVisible: "Are you sure you want to reload the File from the disk?"
- takeScreenshot: 04-unsaved-work-is-asked-about
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Reload File from Disk"
    timeout: 5000
- assertVisible: ".*typed_here.*"
- assertVisible:
    text: "Save tab: notes.py"
    enabled: true
- takeScreenshot: 05-cancel-keeps-the-edit
- tapOn: "Reload tab: notes.py"
- extendedWaitUntil:
    visible: "Reload File from Disk"
    timeout: 5000
- tapOn: "Reload"
- extendedWaitUntil:
    visible: "notes = \"after_42\"\\s*"
    timeout: 10000
- assertVisible:
    text: "Save tab: notes.py"
    enabled: false
- assertNotVisible: ".*typed_here.*"
- takeScreenshot: 06-reload-drops-the-edit-for-the-disks-text

# ---- a notebook: its cells read back ----
- tapOn: "Tab: target.ipynb"
# matches-source: the stale cell is the subject - the tab must still show what it opened
- extendedWaitUntil:
    visible: "target_as_seeded = 1"
    timeout: 10000
- takeScreenshot: 07-target-still-shows-what-it-opened
- tapOn: "Reload tab: target.ipynb"
- extendedWaitUntil:
    visible: "reloaded_42"
    timeout: 10000
# matches-source: the stale cell is the subject - the reload must have replaced it
- assertNotVisible: "target_as_seeded = 1"
- assertVisible:
    text: "Save tab: target.ipynb"
    enabled: false
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 08-reloaded-target-shows-the-cells-cell
