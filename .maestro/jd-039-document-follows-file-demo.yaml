appId: com.jupydroid.app
---
# Landscape, two panes, on a fresh install. Driven by
# scripts/jd-039-document-follows-file-demo-driver.sh, which seeds notes.py, target.ipynb and
# writer.ipynb with autosave off.
#
# An open document with no unsaved work re-reads its file when something else writes it, and one
# with unsaved work does not (vscode@3f3380c `textFileEditorModelManager.ts` `onDidFilesChange`).
# The first part is the T1 flow as it stands: a cell rewrites both open documents, the clean ones
# follow with no tap, and a typed edit survives the second write. Then the app's own save: with
# autosave on, the debounce writes notes.py, inotify reports that save like anyone's, and the tab
# must not re-read it - a re-read would move the caret, so the next letter typed lands elsewhere.
#
# TABLET ONLY (SM-X216B): the cell needs a real Space.
- runFlow: jd-039-document-follows-file-t1.yaml

# ---- drop the typed edit, so the autosave about to be turned on has nothing stale to write ----
- tapOn: "Reload tab: notes.py"
- extendedWaitUntil:
    visible: "Reload File from Disk"
    timeout: 5000
- tapOn: "Reload"
- extendedWaitUntil:
    visible: "notes = \"after_42_2\"\\s*"
    timeout: 10000
- assertVisible:
    text: "Save tab: notes.py"
    enabled: false
- takeScreenshot: 08-reload-drops-the-edit-for-the-last-write

# ---- autosave on ----
- runFlow:
    when:
      notVisible: "Settings"
    commands:
      - tapOn: "Files"
- runFlow: open-settings.yaml
- scrollUntilVisible:
    element:
      text: "Autosave interval"
    direction: DOWN
    timeout: 10000
- tapOn: "Autosave documents"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 09-autosave-turned-on

# ---- the app's own save is not a change to follow: text and caret stay ----
# The seed ends in a newline, so the tap below line 1 puts the caret on the empty line 2.
- tapOn: "Tab: notes.py"
- tapOn:
    point: "95%,25%"
- inputText: " # a"
# DocumentAutosave's 500 ms debounce writes the edit, and the Save icon greys once it has.
- extendedWaitUntil:
    visible:
      text: "Save tab: notes.py"
      enabled: false
    timeout: 10000
# Well past the follow's 75 ms settle, so a re-read of the save, had there been one, has happened.
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 10-autosave-wrote-the-edit
- inputText: "b"
- extendedWaitUntil:
    visible: "notes = \"after_42_2\"\\n # ab\\s*"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: "Save tab: notes.py"
      enabled: false
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 11-the-caret-stayed-after-the-save
