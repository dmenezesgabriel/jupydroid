appId: com.jupydroid.app
---
# Landscape, two panes. Seeded by scripts/jd-039-document-follows-file-t1-driver.sh with autosave
# off, so a typed edit stays unsaved until something writes it or a reload drops it.
#
# An open document with no unsaved work re-reads its file when something else writes it, and one
# with unsaved work does not - vscode@3f3380c `textFileEditorModelManager.ts` `onDidFilesChange`,
# "never reload dirty models". A cell in writer.ipynb rewrites notes.py and target.ipynb while both
# are open; every value it writes carries the kernel's own count of runs, so only a kernel can put
# `after_42_1` or `after_42_2` on screen. **No Reload is tapped until the last part**, where it shows
# the dirty tab is still dirty.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "notes.py"
- extendedWaitUntil:
    visible: "notes = \"seeded\"\\s*"
    timeout: 10000
- tapOn: "target.ipynb"
- extendedWaitUntil:
    visible: "target_as_seeded = 1"
    timeout: 30000
- tapOn: "writer.ipynb"
- extendedWaitUntil:
    visible: "Tab: writer.ipynb"
    timeout: 30000
- tapOn: "Run cell"
- extendedWaitUntil:
    visible:
      text: "wrote_42_1[\\s\\S]*"
      childOf:
        text: "Cell output"
    timeout: 120000
- takeScreenshot: 01-a-cell-rewrote-notes-and-target

# ---- a clean file and a clean notebook show what the cell wrote, with no tap ----
- tapOn: "Tab: notes.py"
- extendedWaitUntil:
    visible: "notes = \"after_42_1\"\\s*"
    timeout: 10000
- assertVisible:
    text: "Save tab: notes.py"
    enabled: false
- takeScreenshot: 02-clean-notes-shows-the-cells-text-untapped
- tapOn: "Tab: target.ipynb"
- extendedWaitUntil:
    visible: "reloaded_42_1"
    timeout: 10000
# matches-source: the seeded cell is the subject - the follow must have replaced it
- assertNotVisible: "target_as_seeded = 1"
- assertVisible:
    text: "Save tab: target.ipynb"
    enabled: false
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-clean-target-shows-the-cells-cell-untapped

# ---- a dirty file keeps its edit through the next write; a clean notebook follows it ----
- tapOn: "Tab: notes.py"
- tapOn:
    point: "95%,25%"
- inputText: " # typed_here"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    text: "Save tab: notes.py"
    enabled: true
- tapOn: "Tab: writer.ipynb"
- tapOn: "Run cell"
- extendedWaitUntil:
    visible:
      text: "wrote_42_2[\\s\\S]*"
      childOf:
        text: "Cell output"
    timeout: 120000
- takeScreenshot: 04-the-cell-wrote-again
- tapOn: "Tab: notes.py"
- extendedWaitUntil:
    visible: ".*after_42_1.*typed_here.*"
    timeout: 10000
- assertNotVisible: ".*after_42_2.*"
- assertVisible:
    text: "Save tab: notes.py"
    enabled: true
- takeScreenshot: 05-dirty-notes-keeps-its-edit
- tapOn: "Tab: target.ipynb"
- extendedWaitUntil:
    visible: "reloaded_42_2"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 06-clean-target-follows-the-second-write

# ---- the dirty file is still dirty: Reload asks, as it did before the watcher ----
- tapOn: "Tab: notes.py"
- tapOn: "Reload tab: notes.py"
- extendedWaitUntil:
    visible: "Reload File from Disk"
    timeout: 5000
- takeScreenshot: 07-reload-still-asks-about-the-edit
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Reload File from Disk"
    timeout: 5000
- assertVisible: ".*typed_here.*"
