appId: com.jupydroid.app
---
# Runs after part 5, once the driver has removed `plain.py`'s checkpoint by hand.
#
# `stopApp: false` keeps the process and its open tab, so nothing opens the file again and makes a
# new checkpoint. Revert to Checkpoint lists the disk when pressed, finds none, and says so in the
# command's own words (jupyterlab@7f0e690 `packages/docmanager-extension/src/index.tsx`).
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "Tab: plain.py"
    timeout: 10000
- longPressOn: "Tab: plain.py"
- extendedWaitUntil:
    visible: "Revert to Checkpoint…"
    timeout: 5000
- tapOn: "Revert to Checkpoint…"
- extendedWaitUntil:
    visible: "No checkpoints"
    timeout: 5000
- assertVisible: "No checkpoints are available for this File."
- takeScreenshot: 01-a-checkpoint-removed-by-hand-says-none
- tapOn: "OK"
- extendedWaitUntil:
    notVisible: "No checkpoints"
    timeout: 5000
- assertVisible: "Tab: plain.py"
