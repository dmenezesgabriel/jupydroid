appId: com.jupydroid.app
---
# Landscape, two panes. Seeded by scripts/jd-042-checkpoint-t2-driver.sh with `other.py` and
# `taken.py`, each holding its own name.
#
# Both are opened, so both have a checkpoint. `other.py` is renamed onto `taken.py` and the
# overwrite accepted: as `DocumentManager.overwrite` deletes the target and renames ours into place
# (jupyterlab@7f0e690 `packages/docmanager/src/manager.ts`), the target's checkpoint goes with it
# and ours moves onto its name. The driver reads which one is left.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "taken.py"
- extendedWaitUntil:
    visible: "Tab: taken.py"
    timeout: 10000
- tapOn: "other.py"
- extendedWaitUntil:
    visible: "Tab: other.py"
    timeout: 10000
- longPressOn: "Tab: other.py"
- extendedWaitUntil:
    visible: "Rename…"
    timeout: 5000
- tapOn: "Rename…"
- extendedWaitUntil:
    visible: "Rename file"
    timeout: 5000
- inputText: "taken"
- tapOn: "Rename"
- extendedWaitUntil:
    visible: "Overwrite file\\?"
    timeout: 10000
- takeScreenshot: 01-a-taken-name-asks-first
- tapOn: "Overwrite"
- extendedWaitUntil:
    notVisible: "Tab: other.py"
    timeout: 10000
- assertVisible: "Tab: taken.py"
- assertVisible: ".*other_seeded.*"
- takeScreenshot: 02-ours-in-place-of-taken
