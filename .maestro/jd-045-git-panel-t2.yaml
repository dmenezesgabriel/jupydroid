appId: com.jupydroid.app
---
# Landscape, two panes, on an emptied workspace. Driven by scripts/jd-045-git-panel-t2-driver.sh.
#
# The Source Control panel is the Git extension's (ADR-0104): it asks jupyterlab-git's handler in
# base's `jupyter_server` for the status of the directory the explorer shows. The repository is
# made in the Space's own terminal, so the git that made it is the one the handler runs.
#
# **This flow cannot say the shell ran anything.** A pty echoes a typed line whether or not a shell
# ran it. The panel naming `master`, then `feature`, is what says the commands ran; the driver reads
# `demo/.git/HEAD` back through run-as afterwards.
#
# The terminal also runs the import-cost measurement, `python3 -X importtime`, whose file the
# driver reads back. The server's own `jupyter_server.serverapp` is imported first, so what follows
# is what the two extensions a Space now loads add: jupyterlab-git's handlers, then nbdime's server
# extension, which nbdime enables for itself (`jupyter_server_config.d/nbdime.json` in the rootfs).
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml

# ---- a repository with one commit, one modified file and one untracked one ----
- tapOn: "New Launcher"
- extendedWaitUntil:
    visible:
      id: "launcher-card-NEW_TERMINAL"
    timeout: 10000
- tapOn:
    id: "launcher-card-NEW_TERMINAL"
- extendedWaitUntil:
    visible: "Tab: Terminal .*"
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    id: "terminal-input"
- inputText: "git init -q demo && cd demo && echo a > a.txt && git add a.txt && git -c user.name=d -c user.email=d@d commit -qm a && echo b >> a.txt && echo c > c.txt"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 10000
- inputText: "python3 -X importtime -c 'import jupyter_server.serverapp; import jupyterlab_git.handlers; import nbdime.webapp.nb_server_extension' 2> ../importtime.txt"
- pressKey: Enter
- hideKeyboard

# ---- the panel reads demo's branch ----
- extendedWaitUntil:
    visible: "demo"
    timeout: 30000
- tapOn: "demo"
- extendedWaitUntil:
    visible: "c.txt"
    timeout: 15000
- tapOn: "Source Control"
- extendedWaitUntil:
    visible: "master"
    timeout: 30000
- assertVisible: "Current branch"
- takeScreenshot: 01-demo-reads-master

# ---- a new branch, and the panel reopened reads it ----
- tapOn:
    id: "terminal-input"
- inputText: "git checkout -q -b feature"
- pressKey: Enter
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Files"
- extendedWaitUntil:
    visible: "c.txt"
    timeout: 10000
- tapOn: "Source Control"
- extendedWaitUntil:
    visible: "feature"
    timeout: 30000
- assertNotVisible: "master"
- takeScreenshot: 02-reopened-reads-feature

# ---- the workspace root is not a repository, and the panel says so ----
- tapOn: "Files"
- tapOn: "Workspace"
- extendedWaitUntil:
    visible: "importtime.txt"
    timeout: 10000
- tapOn: "Source Control"
- extendedWaitUntil:
    visible: "You are not currently in a Git repository."
    timeout: 30000
- takeScreenshot: 03-the-root-is-not-a-repository

# ---- after a kill: the same repository reads the same ----
# launchApp stops the process, so the Space's server is started again and the panel asks the new one.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- extendedWaitUntil:
    visible: "demo"
    timeout: 30000
- tapOn: "demo"
- extendedWaitUntil:
    visible: "c.txt"
    timeout: 15000
- tapOn: "Source Control"
- extendedWaitUntil:
    visible: "feature"
    timeout: 60000
- takeScreenshot: 04-after-a-kill-demo-reads-feature
