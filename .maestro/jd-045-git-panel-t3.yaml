appId: com.jupydroid.app
---
# Landscape, two panes, on an emptied workspace. Driven by scripts/jd-045-git-panel-t3-driver.sh.
#
# The Source Control panel lists every file `git status` reports under jupyterlab-git's headings:
# Staged, Changed, Untracked. The repository is made in the Space's own terminal: `a.txt` is
# committed and then edited, `s.txt` is new and added, `c.txt` is new and left alone.
#
# **Each row is asserted by its description, `"<path> • <status>"`**, which only the panel's rows
# carry. A file's bare name proves nothing: the explorer lists it, and the terminal echoes the line
# that made it.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml

- tapOn: "New Launcher"
- extendedWaitUntil:
    visible:
      id: "launcher-card-NEW_TERMINAL"
    timeout: 10000
- tapOn:
    id: "launcher-card-NEW_TERMINAL"
- extendedWaitUntil:
    visible: "Tab: Terminal .*"
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    id: "terminal-input"
- inputText: "git init -q demo && cd demo && echo a > a.txt && git add a.txt && git -c user.name=d -c user.email=d@d commit -qm a && echo b >> a.txt && echo c > c.txt && echo s > s.txt && git add s.txt"
- pressKey: Enter
- hideKeyboard

- extendedWaitUntil:
    visible: "demo"
    timeout: 30000
- tapOn: "demo"
- extendedWaitUntil:
    visible: "s.txt"
    timeout: 15000
- tapOn: "Source Control"
- extendedWaitUntil:
    visible: "master"
    timeout: 30000
- assertVisible: "Staged (1)"
- assertVisible: "s.txt • Added"
- assertVisible: "Changed (1)"
- assertVisible: "a.txt • Modified"
- assertVisible: "Untracked (1)"
- assertVisible: "c.txt • Untracked"
- takeScreenshot: 01-demo-lists-its-changed-files
