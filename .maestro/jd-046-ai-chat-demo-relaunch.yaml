appId: com.jupydroid.app
---
# The second of the two flows scripts/jd-046-ai-chat-demo-driver.sh runs, after
# jd-046-ai-chat-demo-ask.yaml has asked the count to 40.
#
# launchApp stops the process, so the Space's server is started again and reads both messages back
# from `untitled.chat`. The panel opens on them, and is then scrolled up to the question, so one
# frame holds both rows and the driver can read whose each is from its colour.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "Chat"
- extendedWaitUntil:
    visible: "1\\s+2\\s+3.*\\b40\\s*"
    timeout: 30000
- takeScreenshot: 01-read-back-after-the-kill
# Swiped inside the panel, at a fifth of the width: `scrollUntilVisible` swipes the middle of the
# screen, which in landscape is the editor pane beside it. The answer is one message taller than the
# panel, so it takes more than one swipe to reach the question above it.
- repeat:
    times: 5
    while:
      notVisible: "Count from 1 to 40.*"
    commands:
      - swipe:
          start: 20%, 30%
          end: 20%, 75%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible: "Count from 1 to 40.*"
    timeout: 5000
- takeScreenshot: 02-the-question-above-its-answer
