appId: com.jupydroid.app
---
# The second of the two flows scripts/jd-046-ai-chat-explore-driver.sh runs, after it has turned
# the tablet to portrait. The window is one pane there, and it reopens on the main area, with the
# rail behind "Back to files". This flow records what that pane offers; whether Chat is among it is
# read off the frame, as no extension panel was on the one-pane bar when this was written.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-portrait
- tapOn: "Back to files"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-the-one-pane-bar
