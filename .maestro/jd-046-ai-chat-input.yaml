appId: com.jupydroid.app
---
# Landscape, two panes, in base. Driven by scripts/jd-046-ai-chat-input-driver.sh, which reads the
# input's geometry from the hierarchy once the flow ends, with the field empty again after Send.
#
# The input as jupyter-chat draws it: one bordered box, the field above, Send in a row beneath it
# (jupyter-chat@2c224bc `packages/jupyter-chat/src/components/input/chat-input.tsx`). The question
# reaches the chat through base's server; no agent need answer it, so opencode is not required.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "Chat"
- extendedWaitUntil:
    visible: "Ask the agent"
    timeout: 30000
- takeScreenshot: 01-empty
- tapOn: "Ask the agent"
- inputText: "Where does Send sit?"
- hideKeyboard
- takeScreenshot: 02-typed
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Where does Send sit\\?"
    timeout: 30000
- takeScreenshot: 03-sent
