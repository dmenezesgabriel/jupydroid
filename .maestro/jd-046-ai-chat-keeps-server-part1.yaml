appId: com.jupydroid.app
---
# Landscape, two panes. base idles out after 1 minute, the shortest the setting takes, and Chat is
# opened on it. scripts/jd-046-ai-chat-keeps-server-driver.sh then leaves it open past the
# pre-started kernel's cull and the server's own idle shutdown, which once dropped the chat.
# Settings is offered only on a stopped Space, which a fresh launch leaves base.
- launchApp
- extendedWaitUntil:
    visible: "Settings Base \\(base\\)"
    timeout: 10000
- tapOn: "Settings Base \\(base\\)"
- extendedWaitUntil:
    visible: "Idle shutdown \\(minutes\\)"
    timeout: 5000
- tapOn:
    id: "space-idle-shutdown-field"
- eraseText: 10
- inputText: "1"
- hideKeyboard
- takeScreenshot: 01-base-idles-after-one-minute
- tapOn: "Save"
- extendedWaitUntil:
    notVisible: "Idle shutdown \\(minutes\\)"
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "Chat"
- extendedWaitUntil:
    visible: "Ask the agent"
    timeout: 30000
- takeScreenshot: 02-chat-opened
