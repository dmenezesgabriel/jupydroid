appId: com.jupydroid.app
---
# Landscape, two panes, in base, with opencode installed in base and signed in to a provider.
# Driven by scripts/jd-046-ai-chat-relaunch-driver.sh.
#
# A question asked, the app killed and launched again, and the Chat opened on the same
# `untitled.chat`: the server reads both messages back from the file, and the panel's new socket is
# a new anonymous user (jupyter_server 2.20.0 `auth/identity.py`, `generate_anonymous_user`). The
# question is still the user's only if the panel tells people from bots by the chat's `users`. The
# colour each row is drawn in is read by the driver off frame 02, since no flow can read a colour.
#
# The answer is waited for as the whole text "42", which the question's own text cannot match.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "Chat"
- extendedWaitUntil:
    visible: "Ask the agent"
    timeout: 30000
- tapOn: "Ask the agent"
- inputText: "What is 6 times 7? Reply with the number only."
- hideKeyboard
- tapOn: "Send"
# The first message spawns `opencode acp` under proot and the model answers over the network.
- extendedWaitUntil:
    visible: "42"
    timeout: 300000
- takeScreenshot: 01-answered-before-the-kill

# ---- after a kill: the same chat, read back by a new server through a new socket ----
# launchApp stops the process, so the Space's server is started again and the panel asks the new one.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "Chat"
- extendedWaitUntil:
    visible: "What is 6 times 7.*"
    timeout: 30000
- extendedWaitUntil:
    visible: "42"
    timeout: 10000
- takeScreenshot: 02-read-back-after-the-kill
