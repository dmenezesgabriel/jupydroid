appId: com.jupydroid.app
---
# What the user made, on screen before the backup: base's three seeded documents, one of them opened
# so the recents hold it, and a theme that is not the system's. Driven by
# scripts/jd-058-reinstall-demo-driver.sh, after opencode is installed into base and signed in to its console.
#
# TABLET ONLY (SM-X216B): base is entered, and only arm64 ships its rootfs.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- extendedWaitUntil:
    visible: "survives.ipynb"
    timeout: 10000
- assertVisible: "notes.md"
- assertVisible: "talk.chat"
- tapOn: "survives.ipynb"
- extendedWaitUntil:
    visible: "print\\('kept through an uninstall'\\)"
    timeout: 10000
- assertVisible: "Recent"
- takeScreenshot: 02-documents-and-recent-before
- runFlow: open-settings.yaml
- extendedWaitUntil:
    visible: "Back to files|Close tab: Settings"
    timeout: 5000
- tapOn: "Light"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-light-theme-picked
