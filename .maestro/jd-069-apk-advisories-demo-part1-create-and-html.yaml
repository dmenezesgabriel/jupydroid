appId: com.jupydroid.app
---
# JD-069 demo, parts 1-3: the bumped APK installed over the app already on the tablet
# (`adb install -r`), a Space is created - the ~14 s image copy is SpaceImageInstaller ->
# TarZstdExtractor, commons-compress's TarArchiveInputStream and ZstdCompressorInputStream,
# which is the jar that carries commons-lang3 - and a cell in base emits
# `display(HTML("..."))`, whose `text/html` renders through HtmlDocument (jsoup).
# Driven by scripts/jd-069-apk-advisories-demo-driver.sh.
#
# TABLET ONLY (SM-X216B): the cell runs on a real kernel.
- launchApp
- extendedWaitUntil:
    visible: "Open Base \\(base\\)"
    timeout: 30000
- tapOn: "New Space"
- extendedWaitUntil:
    visible: "Create"
    timeout: 5000
- inputText: "Advisories"
- tapOn: "Create"
# Waited on the row and not on the typed name: the dialog's input field keeps reading
# "Advisories" while the image copy runs, so only "space-1 · ..." proves the create
# returned - the extract staged, renamed and listed.
- extendedWaitUntil:
    visible: "space-1 · .*"
    timeout: 180000
- assertVisible: "Advisories"
- takeScreenshot: 01-space-created-through-compress
- runFlow: open-base-space.yaml
- extendedWaitUntil:
    visible: "Apk Advisories.ipynb"
    timeout: 10000
- tapOn: "Apk Advisories.ipynb"
- extendedWaitUntil:
    visible: "Run cell"
    timeout: 60000
- tapOn:
    text: "Run cell"
    index: 0
# Every assertion below is scoped to the output subtree, because the cell's *source* holds
# this same markup and is on screen too - unscoped, they would pass on a run that never
# happened. `Cell output` is the contentDescription CellOutputs sets. Generous: base's
# kernel may be starting.
- extendedWaitUntil:
    visible:
      text: "Above the fixed version"
      childOf:
        text: "Cell output"
    timeout: 180000
# The two ways this can go green while being wrong, both asserted against: the markup
# drawn literally, and the text/plain fallback winning the mime race. The second also
# refuses FakeKernelGateway - its echo draws the tags.
- assertNotVisible:
    text: "<h3>Above the fixed version</h3>"
    childOf:
      text: "Cell output"
- assertNotVisible: "<IPython.core.display.HTML object>"
- assertVisible:
    text: "jsoup drew this line"
    childOf:
      text: "Cell output"
- assertVisible:
    text: "compress unpacked the Space"
    childOf:
      text: "Cell output"
- assertVisible:
    text: "No library below its fix."
    childOf:
      text: "Cell output"
- takeScreenshot: 02-html-rendered-through-jsoup
