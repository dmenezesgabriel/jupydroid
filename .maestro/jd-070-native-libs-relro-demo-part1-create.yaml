appId: com.jupydroid.app
---
# JD-070 demo, part 1: the bumped APK installed over the app already on the tablet
# (`adb install -r`), a Space is created - the ~14 s image copy is SpaceImageInstaller ->
# TarZstdExtractor -> commons-compress's ZstdCompressorInputStream -> com.github.luben.zstd,
# which is the arm64-v8a libzstd-jni-1.5.7-24.so this item repairs. Runs no cell.
# Driven by scripts/jd-070-native-libs-relro-demo-driver.sh.
#
# TABLET ONLY (SM-X216B): only arm64 ships a rootfs, and the arm64 .so is the one that had
# no RELRO at all.
- launchApp
- extendedWaitUntil:
    visible: "Open Base \\(base\\)"
    timeout: 30000
- tapOn: "New Space"
- extendedWaitUntil:
    visible: "Create"
    timeout: 5000
- inputText: "Relro"
- tapOn: "Create"
# Waited on the row and not on the typed name: the dialog's input field keeps reading
# "Relro" while the image copy runs, so only "space-1 · ..." proves the create returned -
# the extract staged, renamed and listed.
- extendedWaitUntil:
    visible: "space-1 · .*"
    timeout: 180000
- assertVisible: "Relro"
- takeScreenshot: 01-space-created-through-zstd
