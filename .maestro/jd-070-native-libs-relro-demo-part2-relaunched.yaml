appId: com.jupydroid.app
---
# JD-070 demo, part 2: after a force-stop, the relaunch keeps the Space the first part
# created. Runs no cell.
# Driven by scripts/jd-070-native-libs-relro-demo-driver.sh.
#
# TABLET ONLY (SM-X216B): only arm64 ships a rootfs.
- launchApp
- extendedWaitUntil:
    visible: "Relro"
    timeout: 30000
- assertVisible: "space-1 · .*"
- takeScreenshot: 01-space-persists-after-relaunch
