appId: com.jupydroid.app
---
# A cold launch after the refusal draws the Spaces home and no leftover import: the screen shows the
# app is up and nothing opened, and the driver reads the workspace on disk, which no screen lists
# from here. Run by scripts/jd-073-import-too-large-driver.sh.
#
# TABLET ONLY (SM-X216B): the driver that runs it shares from My Files.
- launchApp
- extendedWaitUntil:
    visible: "Spaces"
    timeout: 60000
- assertNotVisible: "Too large.*"
- takeScreenshot: 01-relaunched-nothing-opened
