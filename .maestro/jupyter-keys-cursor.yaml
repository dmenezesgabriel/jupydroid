appId: com.jupydroid.app
---
# Command-mode cursor keys, driven the way a hardware keyboard drives them. The flow only opens
# the seeded notebook and taps into the first cell; every key after that is `input keyevent`/
# `input keycombination` in scripts/jupyter-keys-cursor-driver.sh - `J`/`K`, the heading pair on
# `←`/`→`, `Shift`+`J` marking and `Shift`+`End` to the bottom.
#
# Seeded by scripts/jupyter-keys-cursor-driver.sh; clearState would delete the fixture.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "Cursor Keys.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Cursor Keys.ipynb"
- extendedWaitUntil:
    visible: "first = 1"
    timeout: 30000
- takeScreenshot: 01-notebook-open
# A tap on the first cell's source puts the caret in it: edit mode, keyboard up.
- tapOn: "first = 1"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-edit-mode
