appId: com.jupydroid.app
---
# The command-mode focus owner: open the seeded notebook and tap into a cell, after which the
# driver takes over with `input keyevent` - Escape onto the head cell's frame, Enter back into
# the editor, Ctrl+M as Escape's sibling, and a chrome tap as the touch form of the same select.
#
# Seeded by scripts/jupyter-keys-focus-driver.sh; clearState would delete the fixture.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "Keys.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Keys.ipynb"
- extendedWaitUntil:
    visible: "beta = 2"
    timeout: 30000
- takeScreenshot: 01-notebook-open
# A tap on the middle cell's source puts the caret in it: edit mode, keyboard up.
- tapOn: "beta = 2"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-edit-mode
