appId: com.jupydroid.app
---
# The command-mode letter set, driven the way a hardware keyboard drives it. The flow only opens
# the seeded notebook and taps into the first cell; every key after that is `input keyevent`/
# `input keycombination` in scripts/jupyter-keys-letters-driver.sh - `D`,`D`, `B`/`A`, `M` and
# the markdown-gated `1`, `X`/`V`, `Z`/`Shift+Z`, `Shift+M`, `Ctrl+A`, `Shift+L`, the
# command-mode `Ctrl`+`Enter`, `Ctrl`+`Shift`+`-`, and `Ctrl`+`S`/`Ctrl`+`Shift`+`S`.
#
# Seeded by scripts/jupyter-keys-letters-driver.sh; clearState would delete the fixture.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "Letter Keys.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Letter Keys.ipynb"
- extendedWaitUntil:
    visible: "first = 1"
    timeout: 30000
- takeScreenshot: 01-notebook-open
# A tap on the first cell's source puts the caret in it: edit mode, keyboard up.
- tapOn: "first = 1"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-edit-mode
