appId: com.jupydroid.app
---
# P8g, the picker's shape where no Space can run: the dialog opens from the indicator's tap and
# lists what the catalogue has. **No cell is run**, deliberately - on x86_64 the fake gateway
# echoes source, so a Run's assertions would be green against a kernel that does not exist. The
# real proof is kernel-picker-tablet.yaml on the tablet.
#
# NARROW WINDOW (<840dp): the emulator at 320dp. The flow also doubles as the picker's
# narrow-window evidence - the dialog's rows and its `No Kernel`-labelled cancel are all that a
# 320dp window has to show for it.
#
# Driven by scripts/kernel-picker-emulator-driver.sh.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "P8g Emulator.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "P8g Emulator.ipynb"
- extendedWaitUntil:
    visible: ".*print.*"
    timeout: 30000
- assertVisible: "No Kernel"

# `kernelName`'s click is `selectKernel` (`toolbar/widget.tsx:155`) - the narrow bar's one node
# carries the name, the state and the tap.
- tapOn: "No Kernel"
- extendedWaitUntil:
    visible: "Select Kernel"
    timeout: 10000
- assertVisible: "Select kernel for: \"P8g Emulator.ipynb\""
# The persisted `python3` resolves to language `python`, so the catalogue splits the language
# groups out - the reference's own ordering, not a flat list.
- assertVisible: "Start python Kernel"
- assertVisible: "Python 3"
- assertVisible: "Use No Kernel"
- assertVisible: "No Kernel"
- assertVisible: "Start Kernel"
- takeScreenshot: 01-picker-at-320dp

# The cancel button is `kernelDisplayName` while nothing is bound - it literally says
# "No Kernel" (`sessioncontext.tsx:1407-1410`). Two texts read alike; the button is pressed by
# its position at the dialog's edge, so dismiss with a back-press instead and then show the row
# is still the picker's own.
- back
- assertNotVisible: "Select Kernel"
