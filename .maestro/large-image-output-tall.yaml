appId: com.jupydroid.app
---
# An image output 300 px wide and 60000 px tall is past the canvas floor and decodes at half size,
# 150 px wide; it still draws 300 dp wide, its own width (ADR-0087). The cell builds it from `zlib`
# and `struct`, so the kernel made the image, and `42` is computed from `6 * 7`; FakeKernelGateway
# would echo the source instead and draw no image. Run by
# scripts/large-image-output-tall-driver.sh after large-image-output-tall-markdown.yaml.
#
# A flow cannot read a width: the driver's `uiautomator dump` measures the image's bounds, and the
# screenshot shows its bands.
#
# TABLET ONLY (SM-X216B): the flow runs a cell.
- tapOn: "Run cell"
# Generous: the first run starts the kernel.
- extendedWaitUntil:
    visible: "\\[1\\]:"
    timeout: 300000
# `42` is printed before the display, so the image's top is on screen under it.
- scrollUntilVisible:
    element:
      text: "42"
      childOf: {text: "Cell output"}
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element: "Cell image output"
    direction: DOWN
    timeout: 20000
- assertNotVisible:
    text: "<IPython.core.display.Image object>"
- takeScreenshot: 02-the-image-output-at-its-own-width
