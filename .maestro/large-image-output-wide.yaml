appId: com.jupydroid.app
---
# A 12800 x 3200 PNG, 163 840 000 bytes decoded and past the 150 MiB a canvas draws, draws shrunk to
# the column where it used to take the app down (ADR-0087). The cell builds it from `zlib` and
# `struct`, so the kernel made the image, and `42` is computed from `6 * 7`; FakeKernelGateway would
# echo the source instead and draw no image. Opened by output-caps-baseline-open.yaml, seeded
# by scripts/large-image-output-wide-driver.sh.
#
# A flow cannot read a width: the driver's `uiautomator dump` measures the image's bounds against
# the column's, and the screenshot shows its bars.
#
# TABLET ONLY (SM-X216B): the flow runs a cell.
- tapOn: "Run cell"
# Generous: the first run starts the kernel.
- extendedWaitUntil:
    visible: "\\[1\\]:"
    timeout: 300000
# `42` is printed after the display, so with it in view the image is drawn above it.
- scrollUntilVisible:
    element:
      text: "42"
      childOf: {text: "Cell output"}
    direction: DOWN
    timeout: 20000
- assertVisible: "Cell image output"
- assertNotVisible:
    text: "<IPython.core.display.Image object>"
- takeScreenshot: 01-the-image-across-the-column-and-the-print
