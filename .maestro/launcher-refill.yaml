appId: com.jupydroid.app
---
# `maybeCreate`: an empty main area fills itself with a launcher on every layout change, and a lone
# launcher is not closable - `main.title.closable = widgets('main').length > 1`. The close is the
# tab's ✕, which is why "Close tab:" is the string asserted rather than the pane's own.
- launchApp
- runFlow: open-base-space.yaml
# "Launcher" is the tab's label - no in-pane title row survives, so the strip node is
# the oracle, not a text "Launcher" that used to sit in the pane's bar.
- assertVisible: "Tab: Launcher"
- assertVisible: "Python 3"
- assertNotVisible: "Close tab: Launcher"
- takeScreenshot: 01-auto-filled-launcher
- tapOn: "Text File"
- assertVisible: "Tab: untitled.txt"
- takeScreenshot: 02-text-file-open
- tapOn: "Close tab: untitled.txt"
- assertVisible: "Tab: Launcher"
- assertNotVisible: "^Close tab:"
- takeScreenshot: 03-refilled-after-close
