appId: com.jupydroid.app
---
# JD-002 demo, step 7: with space-1 deleted, the next create mints `space-1` again, because
# deleting the highest id hands it back (ADR-0010). Runs no cell.
# `scripts/manage-spaces-driver.sh` checks that the new config.json names Scratch.
- launchApp
- extendedWaitUntil:
    visible: "Open Base \\(base\\)"
    timeout: 10000
- tapOn: "New Space"
- extendedWaitUntil:
    visible: "Create"
    timeout: 5000
- inputText: "Scratch"
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Scratch"
    timeout: 10000
- assertVisible: "space-1 · .*"
- takeScreenshot: 08-scratch-mints-space-1-again
