appId: com.jupydroid.app
---
# JD-002 demo, steps 2-4: a cold start lands on the Spaces home with base alone and protected, a
# Space is created by name, and a blank name cannot be created. Runs no cell - the acts write
# config.json, not a kernel. Landscape on the tablet; `scripts/manage-spaces-driver.sh`
# rotates and checks the disk.
#
# Cannot assert the progress bar: a create on disk ends before Maestro can capture it. What sees
# it is `SpacesHomeScreenTest.theBarShowsWhileAnActRunsAndGoesWhenItEnds`.
- launchApp
- extendedWaitUntil:
    visible: "Open Base \\(base\\)"
    timeout: 10000
- assertVisible: "Spaces"
- assertNotVisible: "Files"
- assertNotVisible: "Rename Base.*"
- assertNotVisible: "Delete Base.*"
- takeScreenshot: 01-cold-start-base-alone-with-open-only

- tapOn: "New Space"
- extendedWaitUntil:
    visible: "Create"
    timeout: 5000
- inputText: "Thesis"
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Thesis"
    timeout: 10000
- assertVisible: "space-1 · .*"
- takeScreenshot: 02-thesis-created-as-space-1

# Refused by behaviour, not by reading the button's state: the accessibility tree keeps a Compose
# button's disabled flag on the node above its label (`manage-spaces-relaunch-open`
# says the same of Open). A live Create closes the dialog and adds a row; a dead one does neither.
- tapOn: "New Space"
- extendedWaitUntil:
    visible: "Create"
    timeout: 5000
- inputText: "   "
- tapOn: "Create"
- assertVisible: "Create"
- assertNotVisible: "space-2 · .*"
- takeScreenshot: 03-a-blank-name-cannot-be-created
- tapOn: "Cancel"
- assertNotVisible: "Create"
