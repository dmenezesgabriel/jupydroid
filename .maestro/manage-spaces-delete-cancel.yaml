appId: com.jupydroid.app
---
# JD-002 demo, step 6 first half: delete asks first, naming the Space as "<name> (<id>)", and
# Cancel keeps it. Runs no cell. `scripts/manage-spaces-driver.sh` checks that the
# directory is still there afterwards.
- launchApp
- extendedWaitUntil:
    visible: "Delete Dissertation \\(space-1\\)"
    timeout: 10000
- tapOn: "Delete Dissertation \\(space-1\\)"
- extendedWaitUntil:
    visible: "Are you sure you want to permanently delete: Dissertation \\(space-1\\)\\?"
    timeout: 5000
- takeScreenshot: 05-the-question-names-dissertation-space-1
- tapOn: "Cancel"
- assertNotVisible: "Are you sure.*"
- assertVisible: "Dissertation"
- assertVisible: "space-1 · .*"
- takeScreenshot: 06-cancel-keeps-dissertation
