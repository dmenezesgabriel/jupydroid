appId: com.jupydroid.app
---
# The markdown editor drew its source black in both themes, which is invisible on
# dark. Run once per theme - the driver flips the device between them, because a single-theme
# check is exactly what let this through.
- launchApp
- runFlow: open-base-space.yaml
# Home's list is populated by a disk scan, and a scroll started before it has rendered ends
# rather than retrying - so let the launch settle first.
- waitForAnimationToEnd:
    timeout: 5000
# Scrolled to rather than asserted on: Home is sorted by recency, so a seeded notebook
# sinks below the fold as soon as anything else is saved.
- scrollUntilVisible:
    element:
      text: "Markdown Render.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Markdown Render.ipynb"
- extendedWaitUntil:
    visible: "Rendered markdown"
    timeout: 20000
- tapOn: "Rendered markdown"
- extendedWaitUntil:
    visible: "(?s).*# Analysis.*"
    timeout: 10000
# The editor takes the caret when it opens, so the keyboard covers half the screen and the cell
# has scrolled past its first lines. This flow's evidence is a screenshot of the source text's
# colour, and half a keyboard is not that - so put it away and come back to the top of the cell.
- hideKeyboard
# **Back to the top of the document by swiping, not by scrolling to an element.**
# `scrollUntilVisible` needs something that is *off* screen to aim at, and now that the
# heading's caret is drawn rendered-only (ADR-0057) the only node left on an open markdown cell is its field
# - which carries the whole source as one node, so it is already partly visible and the scroll is a
# no-op that leaves the cell's first line above the viewport. Before that the anchor was that
# caret, and before that a kind label this app invented, the reference giving markdown no prompt at
# all (`packages/cells/src/widget.ts:1693-1700`).
#
# Down the frame's **left edge**, clear of the text: inside a focused field a drag is a selection,
# not a scroll. Three is more than the two this notebook needs, and a swipe at the top of a list
# does nothing - so over-swiping costs a gesture, where under-swiping costs the frame.
- repeat:
    times: 3
    commands:
      - swipe:
          start: 4%, 30%
          end: 4%, 90%
          duration: 300
- waitForAnimationToEnd:
    timeout: 2000
# The whole-node match the wait above already uses: unrendered, the field's node carries the
# entire source, so `# Analysis` alone finds nothing.
- assertVisible: "(?s).*# Analysis.*"
- takeScreenshot: markdown-edit-mode
