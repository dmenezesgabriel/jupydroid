appId: com.jupydroid.app
---
# The demo, typed into a new notebook rather than seeded. One cell displays IPython's Markdown
# (a heading, a paragraph with bold and code, a list item) and prints `6 * 7`; the output draws as
# markdown, and the table of contents lists its heading. Run by
# scripts/markdown-output-demo-driver.sh.
#
# `42` is computed by the kernel; FakeKernelGateway would echo the source as one node and draw no
# heading. The notebook has no markdown cell, so the table of contents' entry can only be the
# output's. The typed string has no blank line before its list item, which commonmark lets
# interrupt a paragraph; the driver's hierarchy dump after this part says what nodes it drew as.
#
# TABLET ONLY (SM-X216B): the flow runs a cell.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "New"
- extendedWaitUntil:
    visible: "New notebook"
    timeout: 5000
- tapOn: "New notebook"
- extendedWaitUntil:
    visible: "Untitled.ipynb"
    timeout: 10000
- tapOn: "Untitled.ipynb"
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000

# The empty first field, where `maestro hierarchy` put it on SM-X216B's 1920x1200:
# [805,319][1884,391], as display-update-demo-run.yaml measured it.
- tapOn:
    point: "1300,354"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "from IPython.display import Markdown, display; display(Markdown(\"# Heading\\n**bold** and `code`\\n- item\")); print(6*7)"
- hideKeyboard
# The source as the field holds it, before anything runs: the string carries quotes, backticks and
# a backslash, and the frame is what says the typing rules left them as typed.
- takeScreenshot: 01-the-typed-cell
- tapOn: "Run cell"
# Generous: the first run starts the kernel.
- extendedWaitUntil:
    visible:
      text: "42"
      childOf: {text: "Cell output"}
    timeout: 300000
- assertVisible:
    text: "Heading"
    childOf: {text: "Cell output"}
- assertVisible:
    text: "bold and code"
    childOf: {text: "Cell output"}
- assertVisible:
    text: "item"
    childOf: {text: "Cell output"}
- assertNotVisible:
    text: "# Heading.*"
    childOf: {text: "Cell output"}
- assertNotVisible:
    text: ".*\\*\\*bold\\*\\*.*"
    childOf: {text: "Cell output"}
- assertNotVisible:
    text: "<IPython\\.core\\.display\\.Markdown object>"
    childOf: {text: "Cell output"}
- takeScreenshot: 02-the-markdown-and-the-print

# The cell still has focus after Run; `back` is edit mode's exit to command mode.
- back
- tapOn: "Notebook actions"
- tapOn: "Show table of contents"
- assertVisible: "Table of contents Heading"
- takeScreenshot: 03-the-heading-is-in-the-table-of-contents
