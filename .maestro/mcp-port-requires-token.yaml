appId: com.jupydroid.app
---
# Brings base's `jupyter_server` up so the driver can call its MCP port, with and without the token.
#
# The flow's whole job is the side effect: entering a Space runs its server, and the server starts
# jupyter-server-mcp beside it. Nothing on screen changes in this step, since nothing in the app calls
# the port yet.
#
# TABLET ONLY: on the x86_64 emulator no Space runs and no server is started.
#
# Driven by scripts/mcp-port-requires-token-driver.sh.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- takeScreenshot: 01-base-entered
