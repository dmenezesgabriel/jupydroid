appId: com.sec.android.app.myfiles
---
# Opening a notebook from My Files, shaped for a device that has chosen before: Samsung's select-then-confirm
# resolver writes a preferred-activity record for the VIEW's MIME, and on this device the
# octet-stream record already names Jupydroid - no shell command clears it (measured:
# `pm clear-package-preferred-activities`, `pm clear`, suspend, uninstall all leave it), so
# My Files' tap resolves straight to the app instead of drawing "Open with". The wait names
# both honest outcomes - the chooser's title, or the notebook's own rendered heading, which
# the search row can never show - and the pick runs only if the chooser is what drew.
# Run by scripts/import-filter-not-browsable-driver.sh.
#
# TABLET ONLY (SM-X216B): My Files is Samsung's own manager; the emulator carries none.
- launchApp
- tapOn:
    id: "com.sec.android.app.myfiles:id/menu_search"
- inputText: "Shared analysis"
- tapOn:
    text: "Shared analysis\\.ipynb"
    id: "com.sec.android.app.myfiles:id/main_text"
- extendedWaitUntil:
    visible: "Open with|A shared analysis"
    timeout: 120000
- takeScreenshot: 00-opened-from-my-files
- runFlow:
    when:
      visible: "Open with"
    commands:
      - tapOn:
          text: "Jupydroid"
          id: "android:id/text1"
- runFlow:
    when:
      visible: "Just once"
    commands:
      - tapOn: "Just once"
