appId: com.jupydroid.app
---
# Leaving a notebook closes its socket; reopening it **reattaches to the same kernel**, so a
# variable defined before leaving is still defined afterwards.
#
# This is the device-observable half of Step 17. Closing the socket is what
# `EditorViewModel.onCleared` does, and it is the client-side close JupyterLab's
# `SessionContext.dispose()` performs - not a kernel shutdown, which it only does when
# `shutdownOnDispose` is set (packages/apputils/src/sessioncontext.tsx:679-709). The kernel
# therefore outlives the visit, and `POST /api/sessions` finds it again by path: the server does
# `exists = session_exists(path)` and returns `get_session(path)` rather than creating a second one
# (services/sessions/handlers.py). Until Step 17 this flow asserted the opposite - a NameError from
# a fresh kernel - because `connect()` POSTed `/api/kernels` and got a new one every time.
#
# The other half of the teardown - flushing a save still inside its 500 ms debounce - has no
# honest flow: any gesture Maestro can make takes longer than the debounce, so the save would
# have happened anyway and the flow would be green with or without the fix. It is gated on the
# JVM instead, by EditorTeardownTest, whose assertions were checked by emptying onCleared.
#
# **Tablet only.** It runs cells, and on the x86_64 emulator MainActivity falls back to
# FakeKernelGateway, which echoes the source back and never holds a session at all.
#
# Seeded by scripts/notebook-session-reattaches-driver.sh.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "Session Reattaches.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Session Reattaches.ipynb"
# No assertion on the cell's source here: Maestro regex-matches the *whole* node string, and
# this cell is two lines, so "carried = 6 * 7" can never match it. The claims this flow makes
# are the computed outputs below.
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 00-opened
# The first cell defines the variable AND prints it - an assignment on its own produces no output at
# all, which is the trap `answer = 42` fell into. 42, 43 and 44 are all computed; none appears in
# any cell's source.
- tapOn:
    text: "Run cell"
    index: 0
# Generous: the first run installs the Space if needed and starts jupyter_server.
- extendedWaitUntil:
    visible: "42"
    timeout: 120000
# The second cell *increments* the variable the first one defined, so it reads the session's state
# and then changes it. Both halves matter: reading it proves one session across cells, and changing
# it is what makes the run after the reopen say something no earlier run could have saved.
- tapOn:
    text: "Run cell"
    index: 1
- extendedWaitUntil:
    visible: "43"
    timeout: 60000
- takeScreenshot: 01-carried-across-cells-in-one-session
- tapOn: "Back to files"   # the TopAppBar arrow. Not "Back": the system nav bar has that too
                               # and a uiautomator dump carries both (evidence/u-flow-sweep/).
# The browser's crumb, which the editor has none of: assert it before looking for a row, so a flow
# still stuck in the editor fails here rather than against the title in the app bar. (This was
# Home's FAB until X2h; the browser has no FAB, and "Workspace" is the thing only it draws.)
- extendedWaitUntil:
    visible: "Workspace"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "Session Reattaches.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Session Reattaches.ipynb"
# Run only the second cell, and **44** is the whole assertion. Three outcomes are distinguishable
# here, which is why the cell increments rather than merely reads:
#
#   NameError -> a fresh kernel, which is what this flow asserted before Step 17
#   43        -> the output saved on the previous visit, still on screen
#   44        -> `carried` was 43 in a live kernel and this run moved it on
#
# Only the third can happen if the reopen reattached, and only the third is asserted. A cell that
# just read the variable would print 43 either way and could not tell the second case from the
# third - the saved output is cleared by startingRun, but a flow should not have to rest on that.
- tapOn:
    text: "Run cell"
    index: 1
- extendedWaitUntil:
    visible: "44"
    timeout: 120000
- takeScreenshot: 02-same-kernel-still-remembers
