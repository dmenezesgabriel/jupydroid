appId: com.jupydroid.app
---
# What was created is still there after the process dies - the notebook is a file, and the
# listing is read from disk on every launch.
- launchApp:
    clearState: true
- runFlow: open-base-space.yaml
- assertVisible: "Files"
- tapOn: "New"
- extendedWaitUntil:
    visible: "New notebook"
    timeout: 5000
- tapOn: "New notebook"
- assertVisible: "Untitled.ipynb"
- stopApp
- launchApp:
    clearState: false
- runFlow: open-base-space.yaml
- assertVisible: "Untitled.ipynb"
- takeScreenshot: 01-persisted-after-restart
