appId: com.jupydroid.app
---
# Enters base from the Spaces home, where a launched app starts (`Navigation.kt`, `SpacesHome`).
#
# **Not a flow.** No driver runs this; every flow that launches the app calls it with `runFlow`
# right after the launch settles, so the step from the home into the workspace is written once.
#
# Waited for rather than tapped at once: the home lists the Spaces from disk, so the row is not
# there on the first frame. "Files" afterwards is the workspace's own first panel, which is what
# every caller went on to assume when the app still opened on the browser.
- extendedWaitUntil:
    visible: "Open Base \\(base\\)"
    timeout: 10000
# Open is enabled only on a running Space (`SpacesHomeScreen`), so a stopped base is run first. A
# caller that already ran it - or kept the app alive with `stopApp: false` - skips the tap.
- runFlow:
    when:
      visible: "Run Base \\(base\\)"
    commands:
      - tapOn: "Run Base \\(base\\)"
# Stop, not an enabled Open: the node Maestro finds by Open's name is a child that reads enabled
# whatever the button's state, while Stop is drawn only once Run has returned. Long enough for a
# real server's first start on the tablet, not only the emulator's fake.
- extendedWaitUntil:
    visible: "Stop Base \\(base\\)"
    timeout: 120000
- tapOn: "Open Base \\(base\\)"
- extendedWaitUntil:
    visible: "Files"
    timeout: 10000
