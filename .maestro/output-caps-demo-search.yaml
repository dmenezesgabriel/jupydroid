appId: com.jupydroid.app
---
# On the notebook part 2 reopened, with the print cut again: a search finds `123456` in the lines
# the cut hides and counts it without drawing it, and stepping onto it with the arrows draws the
# whole output (CellOutputsView.kt, OutputLineWindow.hides). It runs after the relaunch because
# part 1's tap already drew every line, and an expansion lasts while its output does. Chunk 0 is
# matched whole, `0` through `999`, which only exists once every line is drawn.
#
# TABLET ONLY (SM-X216B): part 1 runs cells.
- tapOn: "Find in notebook"
- inputText: "123456"
# Off by default, so the source alone is searched and holds no `123456`.
- assertVisible: "Matches -/-"
- tapOn: "Search options"
- tapOn: "Search cell outputs"
# Found and current, as a query lands - and still hidden, because a query reveals nothing.
- assertVisible: "Matches 1/1"
# Re-finding moves the notebook to the hit's cell top, and the keyboard covers the half below it -
# so the row is scrolled back to, not assumed on screen.
- hideKeyboard
- scrollUntilVisible:
    element: "199970 lines hidden"
    direction: DOWN
    timeout: 20000
- takeScreenshot: 08-found-and-still-hidden
- tapOn: "Next match"
- extendedWaitUntil:
    visible:
      text: "0\n1\n2\n[\\s\\S]*\n998\n999"
      childOf: {text: "Cell output"}
    timeout: 120000
- assertNotVisible: "199970 lines hidden"
- assertVisible: "Matches 1/1"
- takeScreenshot: 09-stepped-onto-and-drawn
