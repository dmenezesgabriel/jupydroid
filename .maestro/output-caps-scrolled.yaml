appId: com.jupydroid.app
---
# A 200k-line print in a scrolled cell draws, inside its 24-line box, a row counting the 195000 lines
# it hides and then the last 5000 (OutputLineWindow.kt, outputTailWindowOf). The tail's first chunk
# is matched whole, `195000` through `195999`: every value is one the kernel computed, and
# FakeKernelGateway would echo the source instead. Opened by output-caps-baseline-open.yaml,
# seeded and measured by scripts/output-caps-scrolled-driver.sh.
#
# TABLET ONLY (SM-X216B): the flow runs a cell.
- tapOn: "Run cell"
# Generous: the first run starts the kernel, and the print itself takes ~50 s under proot.
- extendedWaitUntil:
    visible: "\\[1\\]:"
    timeout: 300000
- takeScreenshot: 01-ran
- assertVisible: "195000 lines hidden"
- assertVisible:
    text: "195000\n195001\n195002\n[\\s\\S]*\n195998\n195999"
    childOf: {text: "Cell output"}
- takeScreenshot: 02-the-row-and-the-tail-in-the-box
- tapOn: "195000 lines hidden"
# The wait is the expand being timed: maestro.log stamps the tap and the match.
- extendedWaitUntil:
    visible:
      text: "0\n1\n2\n[\\s\\S]*\n998\n999"
      childOf: {text: "Cell output"}
    timeout: 120000
- assertNotVisible: "195000 lines hidden"
- takeScreenshot: 03-every-line-is-drawn
