appId: com.jupydroid.app
---
# P2b: `notebook:split-cell-at-cursor` - cutting one cell in two where the caret is.
#
# Runs no cell, so the emulator is enough and this is evidence on both devices.
#
# **Three things are being proved, and the first two are the ones a first guess gets wrong.**
#
#   1. **The original cell becomes the LAST fragment.** The text above the caret is what moves
#      into a *new* cell - *"The last piece will remain in the original cell to preserve kernel
#      connection"* (`actions.tsx:287`). So `above = 1` ends up in a cell that did not exist and
#      `below = 2` stays in the one that did.
#   2. **The outputs and the `[7]` go with that last fragment**, because every new cell is created
#      with `outputs: undefined`. The new cell above shows `[ ]` and has nothing under it.
#   3. **The field on screen adopts a source it did not type.** Nothing before this step could
#      push text into a live `BasicTextField` - it seeded itself once. If that mechanism were
#      missing the lower cell would still be showing both lines after the split, so the
#      `below = 2`-alone assertion is what covers it, and the undo covers it a second time in the
#      other direction.
#
# **The caret is placed deterministically, which a tap cannot do.** A tap lands where it lands, so
# the flow drives the caret from a known origin instead: the symbol row's `←` clamps at offset 0
# (`FocusedCellInput.moveCaret` coerces), so twenty presses put it at the start whatever the tap
# did, and ten `→` then put it exactly at the `b` of `below` - `len("above = 1\n")`.
#
# Seeded by scripts/p2b-split-driver.sh; clearState would delete the fixture.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "Cut It In Two.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Cut It In Two.ipynb"
- extendedWaitUntil:
    visible: "(?s).*above = 1\nbelow = 2.*"
    timeout: 30000
- assertVisible: "split output"
- assertVisible: "\\[7\\]:"
- takeScreenshot: 01-one-cell-with-its-output
# Into the cell, which brings up the keyboard and the symbol row with it.
- tapOn: "(?s).*above = 1.*"
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: reveal-the-symbol-row-arrows.yaml
# Twenty is "more than the nineteen characters there are", so the caret is at 0 wherever the tap
# left it; ten then puts it on the `b` of `below`, which is `len("above = 1\n")`.
- repeat:
    times: 20
    commands:
      - tapOn: "←"
- repeat:
    times: 10
    commands:
      - tapOn: "→"
- takeScreenshot: 02-caret-at-the-start-of-the-second-line
# The text is unchanged, and this assertion is here because it once was not: an IME that put seven
# characters into the cell during the caret drive left the split cutting in a place nobody could
# explain, three steps later. A precondition asserted where it is established fails where the
# problem is.
- assertVisible: "(?s).*above = 1\nbelow = 2.*"
# The cell menu. Opening it takes focus off the field - the caret stays where it was put, which is
# the whole reason the text state belongs to the cell rather than to the field.
- tapOn: "Cell actions"
- scrollUntilVisible:
    element:
      text: "Cell menu Split cell"
    direction: DOWN
    timeout: 10000
- tapOn: "Cell menu Split cell"
- waitForAnimationToEnd:
    timeout: 5000
# Two cells now, each holding one line - and neither holding both, which is the field having
# adopted its new source.
- assertVisible: "above = 1"
- assertVisible: "below = 2"
- assertNotVisible: "(?s).*above = 1\nbelow = 2.*"
# The result stayed with the lower cell, which is the one that kept the cell id. `below:` is what
# makes this an assertion about *which* cell rather than about the screen having a `[7]` on it
# somewhere.
# Scrolled into view first: since P2q the document's name has a row of its own, which costs 48dp
# until a scroll hands it back (`titleCollapseFraction`), and the split cell's output sits just
# past the fold at 320dp. `below:` still carries the claim - it is *which* cell holds the output.
- scrollUntilVisible:
    element:
      text: "split output"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "split output"
    below:
      text: "above = 1"
- assertVisible:
    text: "\\[7\\]:"
    below:
      text: "above = 1"
# And the new cell above has never run.
- assertVisible:
    text: "\\[ \\]:"
    above:
      text: "above = 1"
- takeScreenshot: 03-split-with-the-output-below
# Undo puts the text back into the cell that is still there - the case the design exists for. A
# structural undo alone would drop the new fragment and leave `above = 1` destroyed.
- tapOn: "Undo cell operation"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "(?s).*above = 1\nbelow = 2.*"
- assertVisible: "split output"
- assertVisible: "\\[7\\]:"
- takeScreenshot: 04-undone-whole
- tapOn: "Redo cell operation"
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible: "(?s).*above = 1\nbelow = 2.*"
- assertVisible: "below = 2"
- takeScreenshot: 05-redone
# A split is an edit to the document and goes to disk on the same debounce every other edit uses.
# stopApp is a real kill, so anything held only in the ViewModel is gone by the relaunch - and the
# driver prints the saved file afterwards, where the two cells are counted rather than looked at.
- stopApp
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "Cut It In Two.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Cut It In Two.ipynb"
- extendedWaitUntil:
    visible: "above = 1"
    timeout: 30000
- assertVisible: "below = 2"
- assertNotVisible: "(?s).*above = 1\nbelow = 2.*"
- takeScreenshot: 06-saved-as-the-redo-left-it
