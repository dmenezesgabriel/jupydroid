appId: com.jupydroid.app
---
# P2h-3: an editor with room draws the table of contents as a **pane** beside the notebook, and
# the difference from P2h-2's overlay is the whole point - a pick does not close it, so jumping
# twice costs two taps rather than four. That is the reference's own shape: its ToC is a sidebar
# panel (`packages/toc-extension/src/index.ts:309`), not a menu.
#
# **WIDE WINDOW**, and the rule is the feature's rather than the harness's: `tocPresentationFor`
# reads the *editor's* width, and only above 840dp of it is there room for a column. On the tablet
# a 1280dp window less the 360dp explorer leaves the editor 896dp, so it qualifies; the emulator's
# 320dp does not and gets `p2h-2-table-of-contents` instead.
#
# Reuses p2f-2's fixture: three headings at three depths, in a notebook already known not to fit
# one screen - which is what makes "the notebook actually moved" a claim rather than a scroll
# position that would have looked the same either way.
#
# No cell is run, so this needs the width and not the arm64 kernel.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "Heading Sections.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Heading Sections.ipynb"
- extendedWaitUntil:
    visible: "Notes before any heading."
    timeout: 30000
# Hidden by default, as the reference's own ToC tab is - the file browser is the sidebar panel
# that opens with the shell, not this one.
- assertNotVisible: "Table of contents Chapter one"
- takeScreenshot: 01-no-pane-until-it-is-asked-for
- tapOn: "View actions"
- assertVisible: "Show table of contents"
- tapOn: "Show table of contents"
- assertVisible: "Table of contents Chapter one"
- assertVisible: "Table of contents Part A"
- assertVisible: "Table of contents Chapter two"
- takeScreenshot: 02-the-pane
# To the bottom, so the jump back is a movement no screenshot could confuse with doing nothing -
# and done *with the pane up*, which is what a pane is for.
#
# **Named by a cell, never by a heading's own words.** The pane lists "Chapter one" and so does the
# markdown cell it names, so `assertNotVisible: "Chapter one"` is a question that cannot come back
# true while the pane is up - it went red here first. The second attempt, `one = 1`, was ambiguous
# for a different reason: this window is tall enough to show that cell and "Chapter two" at once,
# so it never left the screen either. The notebook's *last* cell settles both halves - visible only
# at the bottom, gone once the head is back at Chapter one - and code is the notebook's alone.
- scrollUntilVisible:
    element:
      text: "two = 3"
    direction: DOWN
    timeout: 10000
- assertVisible: "two = 3"
- takeScreenshot: 03-scrolled-with-the-pane-still-up
- tapOn: "Table of contents Chapter one"
- assertVisible: "one = 1"
- assertNotVisible: "two = 3"
# **The pane is still there**, which is the one claim that separates this adaptation from P2h-2's.
- assertVisible: "Table of contents Chapter one"
- takeScreenshot: 04-jumped-and-the-pane-stayed
# The way out is on the pane itself, and the menu row names the state it is now in.
- tapOn: "Hide table of contents"
- assertNotVisible: "Table of contents Chapter one"
- takeScreenshot: 05-closed-from-the-pane
- tapOn: "View actions"
- assertVisible: "Show table of contents"
- takeScreenshot: 06-the-row-reads-show-again
