appId: com.jupydroid.app
---
# P2h-4: `toc:toggle-collapse` - an entry folds what it owns away, and one control does the whole
# tree. The claim that matters is the one the reference's own default makes: this is the **ToC's**
# fold and not the notebook's, so folding "Chapter one" here hides its entries and leaves every
# cell of that section exactly where it was (`syncCollapseState` defaults false,
# `packages/toc-extension/schema/registry.json:32-69`).
#
# **WIDE WINDOW**, for `p2h-3-table-of-contents-pane`'s reason: the disclosure belongs to the pane,
# because a fold on a surface that is dismissed by the pick would never survive to be seen twice.
#
# Reuses p2f-2's fixture: `# Chapter one` owns `## Part A`, which is the one nesting this needs.
#
# No cell is run, so this needs the width and not the arm64 kernel.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "Heading Sections.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Heading Sections.ipynb"
- extendedWaitUntil:
    visible: "Notes before any heading."
    timeout: 30000
- tapOn: "Notebook actions"
- tapOn: "Show table of contents"
- assertVisible: "Table of contents Chapter one"
- assertVisible: "Table of contents Part A"
# Drawn only where there is something under it: Chapter one owns Part A, and Part A owns nothing.
- assertVisible: "Collapse Chapter one"
- assertNotVisible: "Collapse Part A"
- takeScreenshot: 01-the-tree
- tapOn: "Collapse Chapter one"
# The entry it owns is gone from the list, the entry itself stays - and offers the way back.
- assertNotVisible: "Table of contents Part A"
- assertVisible: "Table of contents Chapter one"
- assertVisible: "Expand Chapter one"
- assertVisible: "Table of contents Chapter two"
# **And the notebook is untouched**, which is the whole point of the fold being the ToC's own.
# `part = 2` is the cell inside Part A's section, and it is code, so it is the notebook's alone.
- assertVisible: "part = 2"
- takeScreenshot: 02-folded-in-the-list-only
- tapOn: "Expand Chapter one"
- assertVisible: "Table of contents Part A"
- takeScreenshot: 03-unfolded-again
# One control for the whole tree, named for the half the next tap performs.
- tapOn: "Collapse all entries"
- assertNotVisible: "Table of contents Part A"
- assertVisible: "Expand all entries"
- takeScreenshot: 04-every-entry-folded
- tapOn: "Expand all entries"
- assertVisible: "Table of contents Part A"
- assertVisible: "Collapse all entries"
- takeScreenshot: 05-every-entry-back
