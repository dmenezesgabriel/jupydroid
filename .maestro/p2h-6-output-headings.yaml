appId: com.jupydroid.app
---
# P2h-6: `toc:display-outputs-numbering` - a heading a code cell **printed** is an entry beside the
# ones its neighbours wrote. `CodeCell.getHeadings` reads the cell's outputs for `<h1>`-`<h6>`
# (`packages/cells/src/widget.ts:1312-1370`), and the schema has it **on** by default
# (`packages/toc-extension/schema/registry.json:32-69`), so the flow starts with it listed.
#
# **WIDE WINDOW** rather than TABLET ONLY, and the fixture is why: nbformat stores a cell's outputs,
# so the HTML this reads was saved into the file rather than produced by a kernel. That makes the
# flow repeatable and lets it run wherever there is room for the pane - `docs/PLAN.md` assumed it
# would need the arm64 kernel, and it does not.
#
# Seeded by scripts/p2h-6-output-headings-driver.sh; the setting is app-wide and persisted, so this
# flow puts it back at the end.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "Printed Headings.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Printed Headings.ipynb"
- extendedWaitUntil:
    visible: "Written heading"
    timeout: 30000
- tapOn: "Notebook actions"
- tapOn: "Show table of contents"
# On by default, so the printed heading is listed between the two written ones.
- assertVisible: "Table of contents Written heading"
- assertVisible: "Table of contents Printed heading"
- assertVisible: "Table of contents Second written heading"
# **The premise the jump rests on**, and the reason this fixture is thirteen cells rather than
# three: the printed heading's own output has to be off screen *before* the tap, or "it is visible
# now" is true of a screen nothing moved. Three cells fit any window this flow runs in, so the
# assertion below could not fail and the frame showed a document that had not moved (P2z-x). Ten
# `filler_N` cells between the written heading and the cell that prints one is about twice the
# 1280x800 viewport - the same fix, and the same idiom, P2z-c gave `p2h-2`.
- assertNotVisible: "from the kernel"
- takeScreenshot: 01-a-printed-heading-is-an-entry
# It jumps like any other entry: the cell it points at is the one that printed it, and it was not
# on screen a moment ago.
- tapOn: "Table of contents Printed heading"
- assertVisible: "from the kernel"
- takeScreenshot: 02-jumped-to-the-cell-that-printed-it
- tapOn: "Notebook actions"
- assertVisible: "Hide output headings"
- tapOn: "Hide output headings"
# Gone from the list, and **still in the notebook** - this hides an entry, never an output.
- assertNotVisible: "Table of contents Printed heading"
- assertVisible: "Table of contents Written heading"
- assertVisible: "from the kernel"
- takeScreenshot: 03-listed-no-longer-but-still-printed
# Put it back, so a later flow on this device is not reading a setting nobody chose.
- tapOn: "Notebook actions"
- tapOn: "Show output headings"
- assertVisible: "Table of contents Printed heading"
- takeScreenshot: 04-listed-again
