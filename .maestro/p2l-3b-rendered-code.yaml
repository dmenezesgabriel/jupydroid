appId: com.jupydroid.app
---
# P2l-3b: code inside *rendered* markdown against code that is not, in one frame.
#
# Seeded by scripts/p2l-3b-rendered-code-driver.sh; clearState would delete the fixture.
#
# **The reference has two rules and this frame is where they meet.** `.jp-RenderedText pre` -
# stream output - takes `--jp-code-font-size` (`rendermime/base.css:24-29`), while
# `.jp-RenderedHTMLCommon pre, code` takes the code family and the code line height but
# **`font-size: inherit`**, the prose size (`:407-417`, later at equal specificity, so it wins for
# the selector both rules name). Ours drew the fenced block at `bodySmall`, smaller than both.
#
# So the cell carries prose, inline code and a fenced block, and the cell under it carries a saved
# stream output: after this step the fenced block reads at the size of the prose around it, and the
# output at the code size, which happen to coincide today and are a different *rule* either way.
#
# No cell is run - a markdown cell renders on open and a saved output is drawn from the file - so
# this needs no Space runtime and no kernel.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "Rendered Code.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Rendered Code.ipynb"
# Rendered, not source: the fence markers are gone and the prose has no backticks in it.
- extendedWaitUntil:
    visible: "fenced = 'a block, at the size of the prose above it'"
    timeout: 30000
- assertNotVisible: "```python"
- assertVisible: "stream output, at the code size"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-rendered-code-beside-output-code
