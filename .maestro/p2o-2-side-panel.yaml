appId: com.jupydroid.app
---
# P2o-2: the table of contents is a **sidebar panel of the shell**, reached from the activity bar
# beside the file browser - `shell.add(toc, 'left', { rank: 400 })`
# (`packages/toc-extension/src/index.ts:309`). It used to be a column on the right of the notebook,
# which is a second side area the reference does not have.
#
# Three claims, and each is a thing the old pane could not do:
#   1. The rail swaps the side area between Files and Table of contents - one panel at a time,
#      which is `SideBarHandler._onCurrentChanged` (`packages/application/src/shell.ts:2630-2643`).
#   2. A pick jumps the notebook and the panel stays, which is what a panel buys over the overlay.
#   3. Picking the showing panel again *collapses* the area and the notebook takes the width -
#      `collapse()` sets `currentTitle = null` (`shell.ts:2383-2394`).
#
# **WIDE WINDOW**: the rail is only drawn where there is room for two panes, since a rail on a
# 320dp phone would spend a quarter of the screen on chrome. The emulator gets
# `p2h-2-table-of-contents`, which is the overlay the same menu row opens where there is no side
# area to activate.
#
# Reuses p2f-2's fixture: three headings at three depths, in a notebook already known not to fit
# one screen - which is what makes "the notebook actually moved" a claim rather than a scroll
# position that would have looked the same either way.
#
# No cell is run, so this needs the width and not the arm64 kernel.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
# Files is the panel that opens with the shell, which is the reference's own default.
- assertVisible: "Workspace"
- takeScreenshot: 01-files-is-the-panel-the-shell-opens-with
# **Nothing open draws the placeholder**, and it is the *same* one an open document with no
# headings gets: `if (!this.model || this.model.headings.length === 0)`
# (`packages/toc/src/treeview.tsx:31-40`), with the reference's own two strings
# (`packages/toc/src/panel.ts:32-36`).
- tapOn: "Table of contents"
- assertVisible: "No headings"
- assertVisible: "The table of contents shows headings in notebooks and supported files."
- takeScreenshot: 02-nothing-open-draws-the-placeholder
- tapOn: "Files"
- assertVisible: "Workspace"
- scrollUntilVisible:
    element:
      text: "Heading Sections.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Heading Sections.ipynb"
- extendedWaitUntil:
    visible: "Notes before any heading."
    timeout: 30000
- assertNotVisible: "Table of contents Chapter one"
# --- 1. the rail swaps the side area -------------------------------------------------------
- tapOn: "Table of contents"
- assertVisible: "Table of contents Chapter one"
- assertVisible: "Table of contents Part A"
- assertVisible: "Table of contents Chapter two"
# The panel is named for the document it lists - `this._model?.title` (`packages/toc/src/panel.ts:77-80`).
- assertVisible: "Heading Sections.ipynb"
# **One panel at a time**: the file browser is not beside it. `Workspace` is the breadcrumb only
# the explorer draws, which is the same handle three other flows use to tell the two apart.
- assertNotVisible: "Workspace"
- takeScreenshot: 03-the-panel-replaced-the-file-browser
# --- 2. a pick jumps, and the panel stays --------------------------------------------------
#
# To the bottom first, so the jump back is a movement no screenshot could confuse with doing
# nothing. **Named by a cell, never by a heading's own words**: the panel lists "Chapter one" and
# so does the markdown cell it names, so `assertNotVisible: "Chapter one"` is a question that
# cannot come back true while the panel is up - it went red that way once. The notebook's *last*
# cell settles it, being visible only at the bottom and code rather than prose.
- scrollUntilVisible:
    element:
      text: "two = 3"
    direction: DOWN
    timeout: 10000
- assertVisible: "two = 3"
- takeScreenshot: 04-scrolled-with-the-panel-still-up
- tapOn: "Table of contents Chapter one"
- assertVisible: "one = 1"
- assertNotVisible: "two = 3"
- assertVisible: "Table of contents Chapter one"
- takeScreenshot: 05-jumped-and-the-panel-stayed
# --- 3. the showing panel collapses the area ------------------------------------------------
- tapOn: "Table of contents"
- assertNotVisible: "Table of contents Chapter one"
# The bar stays where the panel went, which is what `collapse()` promises in `'side'` mode - so
# the way back is one tap and not a gesture.
- assertVisible: "Files"
- takeScreenshot: 06-collapsed-to-the-rail-alone
# And the same control brings it back, which is the other half of `application:toggle-left-area`.
- tapOn: "Files"
- assertVisible: "Workspace"
- takeScreenshot: 07-the-file-browser-came-back
