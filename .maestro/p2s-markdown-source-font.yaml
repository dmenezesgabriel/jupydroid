appId: com.jupydroid.app
---
# P2s: a markdown cell's *source* against a raw cell's, in one frame.
#
# Seeded by scripts/p2s-markdown-source-font-driver.sh; clearState would delete the fixture.
#
# **Both references draw every cell type's editor in one font.** VS Code builds a markup cell's
# editor as a plain `CodeEditorWidget` over `getBaseCellEditorOptions(language)` - a code cell's own
# options - with no font override in the file (`view/cellParts/markupCell.ts:66,331`); its one
# markdown-specific font setting, `markupFontFamily`, is returned from `computeWebviewOptions()`
# (`notebookOptions.ts:748-772`) and styles the **rendered** preview instead. JupyterLab's
# `.cm-editor` takes `--jp-code-font-family` (`packages/codemirror/style/base.css:5-9`) with no
# per-cell-type override. This app drew markdown's source in `bodyMedium` - prose.
#
# **The fixture is the assertion.** Both cells open with `iiii mmmm WWWW`: in a monospace font
# those three groups are the same width and the two lines align down the frame, and in a
# proportional one they are not and do not. So the pair is legible in the picture and not only in
# a measurement - which is the point, since three defects in this repo's history were green
# against every assertion and wrong in the frame.
#
# The markdown cell renders on open, so it is tapped once to put its source on screen. Raw has no
# rendered state to leave (`packages/cells/src/widget.ts:2671-2694`), so it is already showing one.
#
# No cell is run - a markdown cell renders from the file - so this needs no Space runtime and
# either device will do.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "Markdown Source Font.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Markdown Source Font.ipynb"
# Rendered: the emphasis markers are gone, which is what says this cell is *not* showing source.
# Without a difference between the two states the flow below would pass on a tap that did nothing.
- extendedWaitUntil:
    visible: "iiii mmmm WWWW markdown"
    timeout: 30000
- assertNotVisible: "iiii mmmm WWWW _markdown_"
- takeScreenshot: 01-markdown-rendered
# A tap on the rendered cell opens its editor with the caret placed (audit A1c), which is what puts
# the *source* on screen rather than the prose rendered from it.
- tapOn: "iiii mmmm WWWW markdown"
- waitForAnimationToEnd:
    timeout: 3000
# a5's reason, and the tablet is what proved it applies here: opening the editor takes the caret,
# so the soft keyboard covers the cell under the one being edited and the raw cell is off screen.
# The emulator hid this - `dev36` has a hardware keyboard, so nothing ever came up there.
# Unrendering is a mode rather than a focus state, so putting the keyboard away leaves the source
# showing, which the assertion below is what proves.
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
# The markers are back, so this is the source and not the prose - and it is the source this step
# is about. The raw cell beside it never left source, and the two `iiii mmmm WWWW` runs are what
# the frame is compared on.
- assertVisible: "iiii mmmm WWWW _markdown_"
- assertVisible: "iiii mmmm WWWW raw"
- takeScreenshot: 02-markdown-source-beside-raw-source
