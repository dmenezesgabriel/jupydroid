appId: com.jupydroid.app
---
# P2u-1: the app's chrome, drawn from the resolved VS Code 2026 ramp.
#
# **Colour is judged from the screenshots by a human** - a flow cannot read a hex value. What this
# drives is the set of surfaces the Material roles actually reach, so that one pair of runs shows
# the whole swap rather than one screen of it:
#
#   the explorer  - `surface`, `surfaceContainer`, `onSurfaceVariant` on the rows, `outlineVariant`
#                   on the dividers, and the breadcrumb
#   the document  - `outline` on the blockquote's rule, `outlineVariant` on the thematic break and
#                   the table, and `primary` on the active cell's collapser and editor border
#   the overflow  - `surfaceContainerHigh`, which nothing else on screen draws
#
# The fixture carries a blockquote, a rule and a table on purpose: `RichText.kt:82` is the app's
# only reader of `colorScheme.outline`, and P2u-1 is the step that moves it off `panel.border`
# (1.31:1) onto `checkbox.border` (3.76:1). A frame with no blockquote in it could not show that.
#
# Seeded by scripts/p2u-1-chrome-driver.sh, which sets the system night mode and runs this flow
# once per theme into its own directory; clearState would delete the fixture.
#
# Runs no cell, so it needs no Space runtime and either device will do - but the step's gate asks
# for both, so the driver is run once per device with its own evidence half.
- launchApp
# Home's list is populated by a disk scan, and a scroll started before it has rendered ends rather
# than retrying - so let the launch settle first.
- waitForAnimationToEnd:
    timeout: 5000

# --- the explorer -----------------------------------------------------------------------------
# The workspace is the launch screen since X2h. Three row kinds - a folder, a notebook and a file
# that is neither - because they are what the list chrome has to tell apart.
- assertVisible: "Files"
- assertVisible: "Workspace"
- assertVisible: "reports"
- assertVisible: "Chrome Check.ipynb"
- takeScreenshot: 01-the-explorer

- tapOn: "reports"
- assertVisible: "Nested.ipynb"
- assertVisible: "data.csv"
- takeScreenshot: 02-inside-a-folder

# `filebrowser:go-up`, which is the reference's Backspace binding and the way back to the root.
- back
- assertVisible: "Chrome Check.ipynb"

# --- the document -----------------------------------------------------------------------------
- tapOn: "Chrome Check.ipynb"
# A notebook opens with its first cell active (`selectedCellId = opened.first().id`), so the
# markdown cell's collapser is already drawn in `primary` here - and the rendered prose, the
# blockquote and the thematic break are all in this one frame.
- extendedWaitUntil:
    visible: "Chrome check"
    timeout: 30000
- takeScreenshot: 03-the-document-at-rest

# Into the code cell: its editor takes the `primary` border and the caret is drawn in `primary`.
#
# **Scrolled to rather than asserted on.** At 320dp the rendered markdown cell fills the fold and
# the code cell below it is off screen - a plain `assertVisible` passed on the tablet at 1280dp
# and failed on the emulator, which is the whole reason this flow runs on both.
- scrollUntilVisible:
    element:
      text: ".*def area.*"
    direction: DOWN
    timeout: 20000
- tapOn: ".*def area.*"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 04-the-active-cell

# --- a surface nothing else draws -------------------------------------------------------------
# Out of edit mode first, so the keyboard is not covering the menu that is about to open.
- back
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Notebook actions"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 05-a-menu-on-its-own-surface
