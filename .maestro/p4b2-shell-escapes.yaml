appId: com.jupydroid.app
---
# P4b-2: a cell's shell escapes reach the Space's busybox, on the device's own seccomp filter.
#
# All three cells died before this phase, and not visibly: Alpine's busybox calls setgid/setuid on
# every applet dispatch, both refused to app processes, so the shell was killed by SIGSYS before it
# printed anything (evidence/p4-terminal/busybox-under-app-seccomp.md).
#
# Every wait asserts a value that appears in **no cell's source**, which is what makes it honest:
# `FakeKernelGateway` echoes the source back, so an assertion the source could satisfy would pass
# on the emulator with no Space at all. Deliberately *not* scoped with `childOf: {text: "Cell
# output"}` - for the reason `p2j-2-export-formats` and `u4-execution-status` already record, this
# notebook puts three output containers on screen and Maestro resolves the scope against the first
# of them, so a later cell's output can never match. Measured here too: `captured True` was on
# screen and fully visible while the scoped wait reported it missing.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "Shell Escapes.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Shell Escapes.ipynb"
- assertVisible: "!head -2 dataset.csv"
- takeScreenshot: 01-before-running
# `head` is a busybox applet, not an ash builtin - the distinction P4b's own gate got wrong when
# `echo` passed with all 304 applets broken. `ada,1815` is a row of the seeded CSV and appears
# nowhere in the notebook, so only the applet's output can satisfy this.
- tapOn:
    text: "Run cell"
    index: 0
# Generous: the first run installs the Space if needed and starts jupyter_server.
- extendedWaitUntil:
    visible: ".*ada,1815.*"
    timeout: 120000
- takeScreenshot: 02-bang-head-read-the-csv
# The capture form, `names = !ls`, which takes a different route: Popen(shell=True,
# executable=$SHELL) in IPython/utils/_process_common.py:86-90. With SHELL unset it fell back to
# the absolute /bin/sh, which Android does not have, and the cell got an empty list back.
- tapOn:
    text: "Run cell"
    index: 1
- extendedWaitUntil:
    visible: ".*captured True.*"
    timeout: 60000
- takeScreenshot: 03-capture-escape-listed-the-workspace
# %pip: IPython/core/magics/packaging.py runs `sys.executable -m pip <line>` through shell.system,
# so it needs the shell too - which is why it is here rather than assumed to be shell-free.
- tapOn:
    text: "Run cell"
    index: 2
- extendedWaitUntil:
    visible: ".*pip 2.*"
    timeout: 90000
- takeScreenshot: 04-pip-magic-answered
