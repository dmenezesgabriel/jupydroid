appId: com.jupydroid.app
---
# P4i-3b's own gate: `attach()` cancels while backgrounded and a re-attach replays scrollback.
#
# Proving only that the *old* text is still on screen after the cycle would not test this sub-step
# at all - `TerminalEmulator`'s own grid lives in the ViewModel's memory regardless of whether
# `attach()`'s collection is running, so it would survive a background/foreground cycle even under
# the old code that never cancelled it. The real proof is that a *second, new* command, typed only
# after foregrounding, still gets an answer - which needs a live re-attach, not just old pixels.
#
# The markers are `tee`'d into the workspace and grepped by the driver rather than
# `extendedWaitUntil: visible:`'d: `architecture/cross-cutting.md` §8.6 forbids gating on this
# canvas's per-row `Text` column, which reports `text=""` to a11y on this device run-to-run. The
# scrollback half is the driver's `terminal_top_strip_differs` over screenshots 01 and 03 - replayed
# rows keep the same top strip, a blanked grid does not.
#
# TABLET ONLY (SM-X216B): a real shell, not `FakeTerminalGateway`'s echo.
- launchApp
- assertVisible: "Files"
- tapOn:
    id: "launcher-card-NEW_TERMINAL"
- extendedWaitUntil:
    visible: "Terminal"
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 15000
# Focus is taken, not waited for - `TerminalInputField` autofocuses on composition, but a first
# inputText's leading keystrokes can still race the IME's own connection setup on this device
# (measured: `ech` of `echo` eaten, `p4i-terminal-tablet.yaml`'s own comment). A tap on the field
# is a user's own focus move, and the one that settles the connection before typing starts.
- tapOn:
    id: "terminal-input"
- inputText: "echo before-background | tee p4i-bg-before.txt"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-before-background
- pressKey: Home
- takeScreenshot: 02-backgrounded
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
# The resume re-composes the field and re-runs its autofocus - the same race the tap above took.
- tapOn:
    id: "terminal-input"
- inputText: "echo after-foreground | tee p4i-bg-after.txt"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 03-foregrounded-live-and-scrollback-intact
