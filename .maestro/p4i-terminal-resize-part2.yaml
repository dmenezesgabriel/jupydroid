appId: com.jupydroid.app
---
# The driver rotated the device between the two parts - `p1g-part2-reopen-after-rotation.yaml`'s
# own reason for `launchApp: stopApp: false` rather than a bare continuation: a rotation relaunches
# `MainActivity`, and Maestro's own session needs to reattach to the recreated view tree.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "Open Base \\(base\\)"
    file: open-base-space.yaml
# vi reflowed to the portrait grid - the on-screen witness to the same resize the file oracle
# measures.
- takeScreenshot: 02-vi-after-rotation
# Back to a shell for the second size report: vi opens in normal mode and nothing was edited, so
# `:q` leaves it; `:q!` would only matter for a buffer this flow never dirties.
- inputText: ":q"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000
# fd `0`, not the default `1` - under the `tee` pipe stdout is the pipe and an ioctl on it raises
# `ENOTTY`; stdin stays the pty (see part 1's own comment).
- inputText: "python3 -c 'import os;print(*os.get_terminal_size(0))' | tee size-2.txt"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000
