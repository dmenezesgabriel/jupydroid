appId: com.jupydroid.app
---
# P4i sub-step 1's tablet half - a real shell, not the fake's echo. `architecture/cross-cutting.md`
# §8.6: an assertion must name something that cannot appear in the prompt or the pty's own echo of
# the command line, so this asks for arithmetic the shell has to compute and lists a file the driver
# seeded, rather than waiting for "ls" or "ok".
#
# The answers are `tee`'d into the workspace rather than `extendedWaitUntil: visible:`'d off the
# screen: `architecture/cross-cutting.md` §8.6 forbids gating on the per-row `Text` column, which
# reports `text=""` to a11y on this device run-to-run. The driver's `wait_for_workspace_text` greps
# those files - `42` is still something only a real shell computes, and `p4i-marker.txt` only a real
# `ls` against the real workspace lists - while `tee` keeps both answers on screen for the
# screenshot.
#
# Not `clearState: true`: the driver's own `reset_notebooks` + `seed_file` already put a clean
# workspace and the marker file in place, and `clearState` would wipe both **and** the already
# installed Space, forcing a full rootfs reinstall this flow does not need - `a2-empty-notebook`'s
# own precedent, a bare `launchApp` after the driver's cleanup.
- launchApp
- assertVisible: "Files"
- tapOn:
    id: "launcher-card-NEW_TERMINAL"
# Generous: this can still own installing the Space and starting jupyter_server on the very first
# run in a fresh environment, matching notebook-session-reattaches/p1d-part1-run-a-cell.
- extendedWaitUntil:
    visible: "Tab: Terminal .*"
    timeout: 120000
- takeScreenshot: 01-terminal-open

- waitForAnimationToEnd:
    timeout: 15000
# Focus is taken, not waited for: the field autofocuses on composition, but the first keystrokes
# can still race the IME's connection setup on this device - measured, `ech` of `echo` eaten
# (`evidence` history records the same race fixed by `waitForAnimationToEnd` elsewhere). A tap on
# the field is what a user does to give the terminal focus, and it settles the connection before
# any inputText runs.
- tapOn:
    id: "terminal-input"
- inputText: "echo $((6*7)) | tee p4i-answer.txt"
- pressKey: Enter
- inputText: "ls | tee p4i-listing.txt"
- pressKey: Enter
# The screenshots are evidence, not the gate - the driver greps the tee'd files. This wait just
# gives the shell a beat to answer so the frame shows it.
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 02-answered-and-listed
