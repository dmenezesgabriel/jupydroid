appId: com.jupydroid.app
---
# P4j-3a's phone-width half - this step's gate names both a tablet and a phone-width run
# (`architecture/cross-cutting.md` §8.6), `p4j-terminal-input.yaml`'s own precedent.
# FakeTerminalGateway (the emulator's fallback) echoes bytes back through the same VT100 parser real
# output would hit, but a control byte - Esc, Tab, Ctrl+letter - has no glyph of its own to draw, so
# unlike that flow's printable "ls" this one proves reach and layout at a narrow width rather than
# wire content: `TerminalExtraKeysRowTest` already proves the bytes themselves reach a recording
# fake, on this same emulator, which a screen a control byte cannot draw never could.
- launchApp
- runFlow: open-base-space.yaml
- assertVisible: "Files"
- tapOn: "New terminal"
- extendedWaitUntil:
    visible: "Tab: Terminal .*"
    timeout: 120000
- assertVisible: "Esc"
- assertVisible: "Ctrl"
- assertVisible: "Alt"
- takeScreenshot: 01-extra-keys-row-at-phone-width

- tapOn: "Ctrl"
- assertVisible: "Ctrl, active"
- takeScreenshot: 02-ctrl-latched
