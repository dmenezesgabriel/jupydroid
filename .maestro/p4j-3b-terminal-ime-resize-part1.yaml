appId: com.jupydroid.app
---
# P4j-3b's own gate: `set_size` actually resizes when the keyboard opens, not only on rotation
# (P4i-3a's own gate, `p4i-terminal-resize`). `vi`'s own full-screen redraw is the same oracle idea
# reused, but read differently: the driver's own `terminal_content_extent.py` measures the
# screenshot's own pixels rather than the accessibility tree - `grep -c 'text="~"'` over a
# `uiautomator dump` (P4i-3a's own oracle) proved unreliable on this device, independent of anything
# `TerminalCanvas` draws (`architecture/cross-cutting.md` §8.6). `stty size` is still rejected for
# the same reason.
#
# A fixed `waitForAnimationToEnd` before typing, not straight from "Terminal" being visible to
# `inputText` - `p4i-terminal-vi.yaml`'s own shape, which a real device run found is a race:
# "Terminal" names the *screen*, not the pty being attached and the input field ready to receive
# keystrokes, and a `vi` typed too early is silently lost, leaving an empty prompt
# (`architecture/cross-cutting.md` §8.6). Not `extendedWaitUntil visible: "jupydroid"` (the shell's
# own first prompt, `.../home/jupydroid $`) either - tried first and rejected: it timed out for 30s
# over a prompt a screenshot taken moments later shows plainly, the same accessibility-polling gap
# the fill-line oracle hit (`architecture/cross-cutting.md` §8.6), so a fixed wait is what is left.
#
# Read with the keyboard *open* first - autofocused on composition, no `hideKeyboard` first - a
# resize racing `vi`'s own startup redraw is a real, measured hazard
# (`architecture/cross-cutting.md` §8.6), so the keyboard is only ever dismissed once `vi` is
# already idle, in part2.
#
# TABLET ONLY (SM-X216B): a real shell, not `FakeTerminalGateway`'s echo.
# NOT A SUITE FLOW: it leaves a `vi` session running, which a flow run after it in the same sweep
# would inherit.
- launchApp
- runFlow: open-base-space.yaml
- assertVisible: "Files"
# The reach point, by width since P6d-6: the bottom bar's own item at one pane, the auto-filled
# launcher's Terminal card at two - several drivers below force portrait (`rotate_to 0`) for their
# pixel oracles, which is one-pane, so the card arm is not a formality. The `notVisible` half is
# checked first - after the bar's own tap the bar is gone, and a `when:` is evaluated where it
# sits (`p4i-terminal-screen.yaml`'s own ordering).
- runFlow:
    when:
      notVisible: "New terminal"
    commands:
      - tapOn:
          id: "launcher-card-NEW_TERMINAL"
- runFlow:
    when:
      visible: "New terminal"
    commands:
      - tapOn: "New terminal"
- extendedWaitUntil:
    visible: "Tab: Terminal .*"
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 5000
# Focus is taken, not waited for - `TerminalInputField` autofocuses on composition, but a first
# inputText's leading keystrokes can still race the IME's own connection setup on this device
# (measured: `ech` of `echo` eaten, `p4i-terminal-tablet.yaml`'s own comment). A tap on the field
# is a user's own focus move, and the one that settles the connection before typing starts.
- tapOn:
    id: "terminal-input"
- inputText: "vi"
- pressKey: Enter
# A generous, fixed settle for vi's own full-screen redraw - a real run found 5s could still be
# mid-launch (a cold rootfs/JIT after a device reboot), the "vi" typed and running but its own first
# frame not drawn yet, leaving an apparently-empty screenshot that `architecture/cross-cutting.md`
# §8.6 measured and explains.
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 01-vi-keyboard-open
