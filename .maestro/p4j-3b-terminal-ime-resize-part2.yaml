appId: com.jupydroid.app
---
# Reattaches to the still-running session part1 left - `p4i-terminal-resize-part2.yaml`'s own
# reason for `stopApp: false` applies here too, even though nothing here recreates the activity:
# a bare `launchApp` would still restart the app and kill the live `vi` session this driver needs
# to keep measuring.
#
# `hideKeyboard` only now, with `vi` already idle rather than mid-startup - part1's own reason.
- launchApp:
    stopApp: false
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-vi-keyboard-closed
