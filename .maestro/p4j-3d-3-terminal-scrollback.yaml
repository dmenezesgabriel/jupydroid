appId: com.jupydroid.app
---
# P4j-3d-3's own gate: scroll back into real output a real shell produced, and show it - not the
# live screen. Maestro's own `visible:`/`extendedWaitUntil` cannot reliably read this terminal's
# text (`architecture/cross-cutting.md` §8.6) - screenshots and the pixel-based
# `terminal_top_strip_differs` oracle (`terminal_content_extent.py`) are what actually prove it, the
# same screenshot-plus-python-oracle pattern P4j-3b/P4j-3c already established for this screen.
#
# TABLET ONLY (SM-X216B): a real shell, not `FakeTerminalGateway`'s echo.
# NOT A SUITE FLOW: the driver rotates the device, which every flow running after it would inherit.
- launchApp
- runFlow: open-base-space.yaml
- assertVisible: "Files"
# The reach point, by width since P6d-6: the bottom bar's own item at one pane, the auto-filled
# launcher's Terminal card at two - several drivers below force portrait (`rotate_to 0`) for their
# pixel oracles, which is one-pane, so the card arm is not a formality. The `notVisible` half is
# checked first - after the bar's own tap the bar is gone, and a `when:` is evaluated where it
# sits (`p4i-terminal-screen.yaml`'s own ordering).
- runFlow:
    when:
      notVisible: "New terminal"
    commands:
      - tapOn:
          id: "launcher-card-NEW_TERMINAL"
- runFlow:
    when:
      visible: "New terminal"
    commands:
      - tapOn: "New terminal"
- extendedWaitUntil:
    visible: "Tab: Terminal .*"
    timeout: 120000

- waitForAnimationToEnd:
    timeout: 15000
# Focus is taken, not waited for - `TerminalInputField` autofocuses on composition, but a first
# inputText's leading keystrokes can still race the IME's own connection setup on this device
# (measured: `ech` of `echo` eaten, `p4i-terminal-tablet.yaml`'s own comment). A tap on the field
# is a user's own focus move, and the one that settles the connection before typing starts.
- tapOn:
    id: "terminal-input"
- inputText: "seq 1 60"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-live-tail

# Several downward drags over the terminal content - one alone need not reach all the way back,
# and a drag past the oldest row is a no-op (`TerminalGrid.clampedTopRow`'s own clamp), not an
# error.
- repeat:
    times: 5
    commands:
      - swipe:
          start: 50%, 25%
          end: 50%, 85%
          duration: 400
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 02-scrolled-back

# Typing again snaps the view back to the live tail - `TerminalPaneViewModel.attach`'s own
# reset-on-output rule.
- inputText: "echo done"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 03-new-output-snaps-back-to-live
