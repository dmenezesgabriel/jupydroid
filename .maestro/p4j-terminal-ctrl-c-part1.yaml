appId: com.jupydroid.app
---
# P4j-2's own closing half of `docs/PLAN.md`'s P4j gate: "send Ctrl-C to a running one." A real
# shell (TABLET ONLY), not `FakeTerminalGateway`'s echo - Ctrl-C needs a real line discipline to
# answer to. `sleep 30`, not `yes`: `yes`'s own screen-filling output makes two screenshots of it
# indistinguishable whether or not it was actually interrupted - measured, not assumed, a first
# attempt against `yes` produced pixel-identical frames either way. `sleep` prints nothing on its
# own, so the only way `^C` or a fresh prompt can appear is a real interrupt byte reaching it -
# `docs/DECISIONS.md`'s own rule that an assertion must name something that cannot appear in the
# prompt or the command line's own echo.
#
# Not `clearState` - `p4i-terminal-tablet.yaml`'s own reason: wipes the already-installed Space.
- launchApp
- assertVisible: "Files"
- tapOn: "New terminal"
- extendedWaitUntil:
    visible: "Terminal"
    timeout: 120000

- inputText: "sleep 30"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-sleep-running
