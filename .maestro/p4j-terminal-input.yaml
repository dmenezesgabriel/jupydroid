appId: com.jupydroid.app
---
# P4j-1's own gate: input folded into the terminal canvas itself - no separate floating box below
# the output, the merged surface Termux's own `TerminalView` is. Runs on both the tablet and a
# phone-width emulator profile - `p4i-terminal-screen`'s own precedent: FakeTerminalGateway (the
# emulator's fallback) echoes what it is sent, which is enough to prove the merged surface; the
# tablet run is a real shell answering the same input. Not `clearState` on either device -
# `p4i-terminal-tablet.yaml`'s own reason: it would wipe the tablet's already installed Space,
# forcing a full rootfs reinstall this flow does not need.
- launchApp
- runFlow: open-base-space.yaml
- assertVisible: "Files"
- takeScreenshot: 01-the-workspace

# The reach point, by width since P6d-6: the bottom bar's own item at one pane, the auto-filled
# launcher's Terminal card at two. The card half is checked first - a `when:` is evaluated where it
# sits, and after the bar's own tap the bar itself is gone, so "not visible" would then describe the
# terminal screen too.
- runFlow:
    when:
      notVisible: "New terminal"
    commands:
      - tapOn:
          id: "launcher-card-NEW_TERMINAL"
- runFlow:
    when:
      visible: "New terminal"
    commands:
      - tapOn: "New terminal"
# Generous: on the tablet this can still own installing the Space and starting jupyter_server on
# the very first run - `p4i-terminal-tablet.yaml`'s own timeout.
- extendedWaitUntil:
    visible: "Tab: Terminal .*"
    timeout: 120000
- takeScreenshot: 02-the-terminal-screen

# `TerminalInputField`'s invisible decorator still owns real focus/IME - it just paints nothing,
# so what is on screen here is only `TerminalCanvas`: no separate input box beneath it, the way
# there was through P4i. It autofocuses on composition, but the tap below is still taken: a first
# inputText's leading keystrokes can race the IME's own connection setup on a real device
# (`p4i-terminal-tablet.yaml`'s measured finding), and a tap on the canvas - which *is* the field,
# this flow's whole point - is a user's own deterministic focus move.
- tapOn:
    id: "terminal-input"
- inputText: "ls"
- takeScreenshot: 03-typed-ls
