appId: com.jupydroid.app
---
# P5b: the build that now wires `StdioLanguageServer` into `AppContainer` still drives the
# Space's language tooling end-to-end in a real terminal.
#
# The port itself has no user-visible surface yet - P5c is what the completion popup plugs
# into - so the flow's honest claim is the one the wiring could have broken: `pylsp` still
# answers by name and over stdio on the build carrying the adapter. The port's own session,
# handshake to shutdown, is the driver's `am instrument` run of StdioLanguageServerDeviceTest,
# and the `lsp.start`/`lsp.stop` stages it leaves in logcat are the lifecycle evidence.
#
# **TABLET ONLY (SM-X216B):** the emulator ships no rootfs, so its terminal has no shell. The
# terminal draws to a `Canvas`, so nothing here is asserted by Maestro text - the flow redirects
# what pylsp printed to files and the driver reads them back (`architecture/cross-cutting.md` §8.6).
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "launcher-card-NEW_TERMINAL"
- extendedWaitUntil:
    visible: "Terminal"
    timeout: 300000
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 01-a-shell

# Same focus discipline as p5a-pylsp.yaml: `TerminalInputField` autofocuses, but a first
# inputText's leading keystrokes can still race the IME connection - the tap settles it, and
# the extendedWait first covers a first-launch rootfs extraction.
- extendedWaitUntil:
    visible:
      id: "terminal-input"
    timeout: 60000
- tapOn:
    id: "terminal-input"
- inputText: "pylsp --version > p5b-version.txt 2>&1"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 20000
- inputText: "echo rc=$? >> p5b-version.txt"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 02-pylsp-version

# The transport the adapter speaks, typed as one pipeline: a `Content-Length`-framed
# `initialize` gets a framed reply. `timeout` covers the pipe staying open after the answer.
- inputText: "printf 'Content-Length: 107\\r\\n\\r\\n%s' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"processId\":null,\"rootUri\":null,\"capabilities\":{}}}' | timeout 15 pylsp > p5b-init.out 2>&1"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 30000
- inputText: "echo rc=$? >> p5b-init.out"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 8000
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-initialize-answered
