appId: com.jupydroid.app
---
# P5e-7: "Rename symbol…" asks `textDocument/rename` at the caret's virtual position and lands
# jedi's whole-document answer on every cell the name touches - VS Code's `editor.action.rename`,
# which `bulkEditService.apply`s as one undoable unit.
#
# The shipped pylsp answers ONE whole-document TextEdit whose `newText` carries the new name
# at the `def` line and the call site both - so the proof is that *both* cells change in one
# step, and that one undo restores both. The raw cell in between proves the row never offers
# an ask the virtual document could not map back.
#
# TABLET ONLY (SM-X216B), the reason `p5e3-hover.yaml` states: the ask is session-gated and
# the emulator's `FakeKernelGateway` never opens a Space, so no `pylsp` runs there.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Rename Symbol.ipynb"
- extendedWaitUntil:
    visible: ".*lsp_warmup.*"
    timeout: 15000
- tapOn: "Run cell"
# `ran in` - the run's job is the open session the ask rows' availability is gated on.
- extendedWaitUntil:
    visible: ".*ran in.*"
    timeout: 180000
- takeScreenshot: 01-kernel-session-open

# The raw cell's menu first: the virtual document maps code cells only, so a non-code cell's
# rename row would promise an ask that could never land - the format row's own proof shape.
- tapOn:
    text: "Cell actions"
    below:
      text: ".*use site.*"
    above:
      text: ".*raw text.*"
- assertNotVisible: ".*Rename symbol.*"
- assertNotVisible: ".*Format cell.*"
- takeScreenshot: 02-raw-cell-has-no-rename-row
- back

# The call site, typed over the use cell's seed comment: `inputText` leaves the caret at the
# end of the name, which `identifierSpanAt` still resolves - the same word-end inclusion
# `p5e5-definition.yaml` relies on (`pressKey` has no arrow keys to land mid-word).
- tapOn: ".*use site.*"
- eraseText
- inputText: "total = compute_total"

# The use cell's own ⋮: every header carries "Cell actions" and `tapOn` takes the first match,
# so the button is pinned from both sides - below the def cell's `return` line and above this
# cell's own source (`p5e5-definition.yaml`'s pad-10 lesson).
- tapOn:
    text: "Cell actions"
    below:
      text: ".*return sum.*"
    above:
      text: ".*total = compute_total.*"
# `.*Rename symbol.*`, not "Cell menu Rename symbol": Maestro full-matches the regex and the
# row's accessibilityText carries the ellipsis - "Cell menu Format cell" worked in
# p5e6-format.yaml only because it *was* the whole string.
- tapOn: ".*Rename symbol.*"

# The dialog opens prefilled with `compute_total` - the identifier the frozen caret sat in -
# selected whole so typing replaces it. `eraseText` first keeps the flow honest either way.
- extendedWaitUntil:
    visible: "New name"
    timeout: 10000
- takeScreenshot: 03-rename-dialog-prefilled
# The tag, not a blind eraseText: it names the dialog's field, so the erase cannot land in
# the cell the dialog sits over.
- tapOn:
    id: "rename-symbol-field"
- eraseText
- inputText: "summed"
# `^Rename$` anchors the button: the dialog's own title is "Rename symbol", which a bare
# "Rename" regex would match first in tree order.
- tapOn: "^Rename$"

# jedi's answer is one whole-document edit: the `def` line and the call site move together,
# which is exactly what `bulkEditService.apply` promises - both assertions, not either.
- extendedWaitUntil:
    # matches-source: the renamed `def` line is the asked cell's own text, on screen.
    visible: ".*def summed.*"
    timeout: 60000
- hideKeyboard
# matches-source: the call site carries the new name too - the one edit reached every cell.
- assertVisible: ".*total = summed.*"
# matches-source: the old name's absence is the proof - a partial rename leaves it on screen.
- assertNotVisible: ".*compute_total.*"
- takeScreenshot: 04-renamed

# One undo takes the whole transaction back - `recording` made the rename one entry, the
# same shape `p5e6-format.yaml` proves for format.
- tapOn: "Undo cell operation"
- extendedWaitUntil:
    # matches-source: the cell's own restored source is what the wait observes.
    visible: ".*def compute_total.*"
    timeout: 15000
- assertVisible: ".*total = compute_total.*"
- takeScreenshot: 05-undone

# The surface's own miss: the caret ends `x = 42` on a literal, so `identifierSpanAt` finds
# no identifier - the reference's `resolveRenameLocation` null, which VS Code's notification
# words "No result.". A snackbar and no dialog, the ask never reaching the wire.
- tapOn: ".*nothing to rename.*"
- eraseText
- inputText: "x = 42"
- hideKeyboard
- tapOn:
    text: "Cell actions"
    below:
      text: ".*raw text.*"
    above:
      text: ".*x = 42.*"
- tapOn: ".*Rename symbol.*"
# A `Short` snackbar outlives a Maestro command by barely a second - the wait *is* the
# assertion (`p5e5-definition.yaml`'s own rule).
- extendedWaitUntil:
    visible: "No result."
    timeout: 30000
- takeScreenshot: 06-no-identifier-says-no-result
