appId: com.jupydroid.app
---
# P6a-15's own gate: the Open risks entry named since P6a-8 - "the debugger panel never
# reselects a frame" - closed against a real, two-frame call stack. `p6a-9-step.ipynb`'s own
# fixture never calls a function, so it can only ever produce a single-frame stack; this fixture
# (`p6a-15-nested-call.ipynb`) breaks on a line inside a real `helper` call so debugpy's own
# `stackTrace` answers two frames - the caller frame this feature exists to make reachable.
#
# WIDE WINDOW: the side panel this opens is only drawn where there is room for two panes, the
# same rule p6a-8-debugger-variables.yaml's own header states.
#
# TABLET ONLY (SM-X216B). On the x86_64 emulator MainActivity falls back to FakeKernelDebugger,
# which never genuinely pauses anything for a frame tap to reselect.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "Debugger Nested Call.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Debugger Nested Call.ipynb"
- assertVisible: "(?s).*def helper\\(x\\):.*"
# The breakpoint column P6a-12 gave its own strip, left of the line-2 gutter - the same point
# every other debugger flow taps for line 2, since the row's own height and the gutter's own
# left edge do not move with a cell's indentation.
- tapOn:
    point: "39%,30%"
- tapOn:
    text: "Run cell"
    index: 0
- extendedWaitUntil:
    visible: "\\[\\*\\]:"
    timeout: 120000
- extendedWaitUntil:
    visible: "Terminate"
    timeout: 120000
- tapOn: "Debugger"
# A fresh stop always resolves the top frame first (P6a-8a's own rule) - `helper`'s own line and
# its own `x`, debugpy's real reply for this fixture's real call.
- assertVisible: "helper — line 2"
- assertVisible: "<module> — line 5"
- assertVisible: "x: int = 41"
- takeScreenshot: 01-stopped-with-two-frames
# The tap this feature adds: the caller frame's own scopes/variables replace the callee's -
# `x: int = 41` is `helper`'s own local and must not survive a reselect onto `<module>`, which
# never bound it.
- tapOn: "<module> — line 5"
- assertNotVisible: "x: int = 41"
- takeScreenshot: 02-reselected-the-caller-frame
