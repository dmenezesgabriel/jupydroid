appId: com.jupydroid.app
---
# P6a-17's own gate: an ad hoc expression, typed while stopped, runs against the real kernel's own
# top frame and its real answer renders in the panel - not this app's own state echoing something
# already on screen, since `x * 2` is not a value any variable row already shows.
#
# Reuses p6a-9-step.ipynb (`x = 41`) rather than a new fixture: any already-verified debugger
# fixture with a visible local is enough to prove an expression reaches a real frame.
#
# TABLET ONLY (SM-X216B). On the x86_64 emulator MainActivity falls back to FakeKernelDebugger,
# which has no real interpreter behind it to evaluate anything against.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "Debugger Step.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Debugger Step.ipynb"
- assertVisible: "(?s).*y = x \\+ 1.*"
- tapOn:
    point: "39%,30%"
- tapOn:
    text: "Run cell"
    index: 0
- extendedWaitUntil:
    visible: "\\[\\*\\]:"
    timeout: 120000
- extendedWaitUntil:
    visible: "Terminate"
    timeout: 120000
- tapOn: "Debugger"
- assertVisible: "x: int = 41"
- tapOn: "Evaluate"
- inputText: "x * 2"
- pressKey: Enter
- assertVisible: "x * 2: int = 82"
- takeScreenshot: 01-evaluated-against-the-real-kernel
