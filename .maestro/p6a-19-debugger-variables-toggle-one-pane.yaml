appId: com.jupydroid.app
---
# P6a-19's own gate: the phone/one-pane fix for the bug P6a-18 asked about - a paused kernel's
# call stack and variables reached from DebuggerControlBar's own toggle rather than the "Notebook
# actions" overflow menu, and drawn as a non-modal sheet docked above the bar rather than a
# ModalBottomSheet blocking it.
#
# Same fixture and gutter tap point p6a-9's own flows already measured
# (.maestro/fixtures/p6a-9-step.ipynb, line 2 of `x = 41` / `y = x + 1` / `print(y)`), but at
# **one-pane width** (the tablet rotated to portrait - `evidence/p6a-18/portrait/` measured this
# as 800dp, below the 840dp two-pane threshold) rather than landscape.
#
# TABLET ONLY (SM-X216B) - a real breakpoint stop needs the real kernel debugger, which the
# x86_64 emulator's FakeKernelGateway fallback does not have.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "Debugger Step.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Debugger Step.ipynb"
- assertVisible: "(?s).*y = x \\+ 1.*"
- takeScreenshot: 01-before-running
# The gutter column at one-pane width - measured in evidence/p6a-18/portrait/, not landscape's own
# 39%,30%: with no list pane the editor spans the full width and the column sits far to the left.
- tapOn:
    point: "7%,19%"
- takeScreenshot: 02-breakpoint-armed-unverified
- tapOn:
    text: "Run cell"
    index: 0
- extendedWaitUntil:
    visible: "\\[\\*\\]:"
    timeout: 120000
- takeScreenshot: 03-running
