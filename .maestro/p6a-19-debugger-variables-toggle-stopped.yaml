appId: com.jupydroid.app
---
# P6a-19's own gate, part 2 (the row's own file name): once stopped, the control bar's own toggle
# opens the call stack and variables **without hiding the control bar it came from** - the non-modal
# sheet's whole point, proved by both being on screen in the same screenshot. Continues from
# p6a-19-debugger-variables-toggle-one-pane.yaml's own stop, at line 2 of the same fixture.
#
# TABLET ONLY (SM-X216B) - see p6a-19-debugger-variables-toggle-one-pane.yaml, which this continues.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "Open Base \\(base\\)"
    file: open-base-space.yaml
- assertVisible: "\\[\\*\\]:"
- assertVisible: "Continue"
- takeScreenshot: 04-stopped-control-bar-no-menu-entry-needed
# The old path is gone: the overflow menu offers no debugger row at one-pane width any more.
- tapOn: "Notebook actions"
- assertNotVisible: "Show call stack and variables"
- takeScreenshot: 05-menu-has-no-debugger-row
# Outside the dropdown's own bounds (it anchors top-right), which is what dismisses it.
- tapOn:
    point: "10%,50%"
# The control bar's own toggle - reachable without opening any menu at all.
- tapOn: "Show call stack and variables"
- assertVisible: "<module> — line 2"
- assertVisible: "x: int = 41"
# The point of a non-modal sheet: the control bar it is docked above is still on screen and
# still tappable, not hidden behind a scrim.
- assertVisible: "Continue"
- assertVisible: "Step over"
- takeScreenshot: 06-sheet-docked-above-control-bar-both-visible
# Reachable through the sheet too, not only the control bar's own row of icons.
- tapOn: "Step over"
- extendedWaitUntil:
    visible: "<module> — line 3"
    timeout: 20000
- assertVisible: "y: int = 42"
- takeScreenshot: 07-stepped-with-the-sheet-still-open
