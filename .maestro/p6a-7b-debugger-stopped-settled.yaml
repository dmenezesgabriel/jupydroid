appId: com.jupydroid.app
---
# The second half of P6a-7b's gate, run by scripts/p6a-7b-debugger-stop-driver.sh after a real
# `sleep` - not a Maestro wait. `waitForAnimationToEnd` was tried first and measured unreliable
# here: timed against this tablet's own continuously-spinning "running" indicator, a 1000ms and a
# 14000ms timeout differed by ~7.6s of wall clock rather than the ~13s a faithful wait would have
# cost, and two later runs at 20000ms and 60000ms both still caught the breakpoint dot grey and
# the line unhighlighted in the screenshot - the command was returning well before either
# timeout, not after it. A shell `sleep` has no such heuristic to fool.
#
# TABLET ONLY (SM-X216B) - see p6a-7b-debugger-stops-at-breakpoint.yaml, which this continues.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "Open Base \\(base\\)"
    file: open-base-space.yaml
- assertVisible: "\\[\\*\\]:"
- assertNotVisible: "42"
- takeScreenshot: 04-stopped-at-breakpoint
