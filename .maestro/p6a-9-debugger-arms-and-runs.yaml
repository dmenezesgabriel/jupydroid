appId: com.jupydroid.app
---
# P6a-9's own gate, part 1: arms a breakpoint on line 2 of a three-line cell and runs it - the
# same shape as p6a-7b-debugger-stops-at-breakpoint.yaml, on a fixture of its own
# (.maestro/fixtures/p6a-9-step.ipynb, `x = 41` / `y = x + 1` / `print(y)`) so stepping past the
# stop has a line 3 to land on and Continue has something (`y` = 42) to finish printing. Seeded by
# scripts/p6a-9-debugger-step-continue-driver.sh.
#
# TABLET ONLY (SM-X216B). On the x86_64 emulator MainActivity falls back to FakeKernelDebugger,
# whose attach/setBreakpoints/configurationDone are no-ops that arm nothing real.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "Debugger Step.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Debugger Step.ipynb"
# See p6a-7b-debugger-stops-at-breakpoint.yaml for why this is a regex rather than a plain
# substring - one semantics node holds the whole cell's text.
- assertVisible: "(?s).*y = x \\+ 1.*"
- takeScreenshot: 01-before-running
# Line 2's own row - the same tap point p6a-7b-debugger-stops-at-breakpoint.yaml measured, since a
# third line below it does not move where line 1/2 sit.
- tapOn:
    point: "39%,30%"
- takeScreenshot: 02-breakpoint-armed-unverified
- tapOn:
    text: "Run cell"
    index: 0
- extendedWaitUntil:
    visible: "\\[\\*\\]:"
    timeout: 120000
- takeScreenshot: 03-running
