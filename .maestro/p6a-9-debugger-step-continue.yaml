appId: com.jupydroid.app
---
# P6a-9's own gate, part 3 (the row's own file name): a real, paused kernel actually moves again -
# the reverse of p6a-7b-debugger-stops-at-breakpoint.yaml's own assertion ("nothing sends
# continue yet - that is P6a-9's own job"). Continues from p6a-9-debugger-stopped-settled.yaml,
# stopped at line 2 of the three-line fixture (`x = 41` / `y = x + 1` / `print(y)`).
#
# Text-based waits throughout (`extendedWaitUntil: visible:`) rather than a shell `sleep` between
# flows - unlike the breakpoint dot/line wash the two flows above settle for, every state this one
# waits on (a stack frame's name, a variable, an execution count) is a real semantics node Maestro
# can poll for directly, which is exactly the mechanism the cold-start wait below already trusts.
#
# TABLET ONLY (SM-X216B) - see p6a-9-debugger-arms-and-runs.yaml, which this continues.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "\\[\\*\\]:"
- takeScreenshot: 05-before-stepping
- tapOn: "Debugger"
- assertVisible: "<module> — line 2"
- assertVisible: "x: int = 41"
- takeScreenshot: 06-panel-before-stepping
- tapOn: "Step over"
# No cold start here - the session is already attached and running, so this is a short round
# trip rather than the 120s the first breakpoint hit budgets for.
- extendedWaitUntil:
    visible: "<module> — line 3"
    timeout: 20000
- assertVisible: "y: int = 42"
- takeScreenshot: 07-stepped-to-line-3
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "\\[1\\]:"
    timeout: 20000
# The panel reverts to "Not stopped" once `Continued` clears `debugStack` - which is what makes
# the real printed "42" unambiguous from the panel's own "y: int = 42" a moment before.
- assertNotVisible: "y: int = 42"
- assertVisible: "42"
- takeScreenshot: 08-continued-to-completion
