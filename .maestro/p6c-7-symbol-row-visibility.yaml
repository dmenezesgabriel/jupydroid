appId: com.jupydroid.app
---
# P6c-7: the Settings screen's "Symbol row" toggle actually stops the row rendering while a cell
# is being typed into, and the choice survives a relaunch - not only the unit/instrumented proof
# that the field persists and `editorBottomBar` answers NONE for it
# (`EditorSettingsRepositoryContract`, `SettingsScreenTest`, `EditorBottomBarTest`).
#
# Runs no cell, so any device will do - sharded across both anyway,
# `p6c-5-word-wrap.yaml`'s own precedent for a pure UI-rendering row. Entering edit mode is a
# single tap on the cell's own source, `u5d-symbol-row.yaml`'s own precedent.
#
# **Matched by `id: "symbol_row"`, not by "Tab"'s own text.** The row's first key is labelled
# "Tab", and on the physical tablet's real IME (Gboard) the *keyboard's own* Tab key carries the
# identical accessible text ("Tab", `resource-id: com.google.android.inputmethod.latin:id/key_
# pos_tab") - so `assertNotVisible: "Tab"` passed on the emulator and failed on the tablet the
# moment the keyboard was actually up, against the wrong element. `SYMBOL_ROW_TAG` is this row's
# own, unambiguous handle (`SymbolRow.kt`, `SymbolRowTest.theRowCarriesItsOwnTag`).
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Symbol Row Visibility.ipynb"
- extendedWaitUntil:
    visible: ".*x = 1.*"
    timeout: 15000
- tapOn: ".*x = 1.*"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "symbol_row"
- takeScreenshot: 01-symbol-row-shown-by-default

# One `back` exits edit mode (command mode), a second leaves the notebook for Files - the same
# two-step `p2f-4-insert-heading.yaml`'s own comment describes for the identical control.
- hideKeyboard
- back
- back
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Symbol row"
    timeout: 5000
- takeScreenshot: 02-settings-symbol-row-on

- tapOn: "Symbol row"
- takeScreenshot: 03-settings-symbol-row-off

- tapOn: "Back to files|Close"
- extendedWaitUntil:
    visible: "Symbol Row Visibility.ipynb"
    timeout: 5000
- tapOn: "Symbol Row Visibility.ipynb"
- extendedWaitUntil:
    visible: ".*x = 1.*"
    timeout: 15000
- tapOn: ".*x = 1.*"
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible:
    id: "symbol_row"
- takeScreenshot: 04-symbol-row-hidden

- hideKeyboard
- back
- back
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Symbol row"
    timeout: 5000
- tapOn: "Symbol row"
- takeScreenshot: 05-settings-symbol-row-back-on

- tapOn: "Back to files|Close"
- extendedWaitUntil:
    visible: "Symbol Row Visibility.ipynb"
    timeout: 5000
- tapOn: "Symbol Row Visibility.ipynb"
- extendedWaitUntil:
    visible: ".*x = 1.*"
    timeout: 15000
- tapOn: ".*x = 1.*"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "symbol_row"
- takeScreenshot: 06-symbol-row-shown-again

# The choice survives a relaunch - `EditorSettingsRepositoryContract`'s own
# `remembersSymbolRowShownTurnedOff`, now asked of the real app. Left off across the relaunch so
# the driver's own file-based check (`symbolRowShown":false`) has something unambiguous to read.
- hideKeyboard
- back
- back
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Symbol row"
    timeout: 5000
- tapOn: "Symbol row"
- stopApp
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Symbol row"
    timeout: 5000
- takeScreenshot: 07-settings-symbol-row-off-after-relaunch
