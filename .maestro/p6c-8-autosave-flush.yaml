appId: com.jupydroid.app
---
# P6c-8b, second half, as P6c-8c left it: `autosave: false` is still seeded, and the document's
# own dismiss now meets the `saveBeforeClose` ask rather than leaving directly. The only writer
# that can put `close_flushed` on disk is the dialog's Save - `saveNow`'s flush before the close -
# which is the same owed-write-on-close contract, now answered instead of silent. Type, dismiss,
# answer Save (the tab's `Close tab:` two-pane, "Back to files" one-pane), and the driver cats the file after.
#
# Self-contained on purpose: `maestro test`'s `launchApp` force-stops the process, so state never
# survives between flows - the gate half is its own flow (`p6c-8-autosave-gate.yaml`) and this one
# needs no state from it.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- assertVisible: "Files"
- tapOn: "autosave_gate.py"
- assertVisible: "Back to files|Close tab: autosave_gate.py"
- extendedWaitUntil:
    visible: ".*the file editor.*"
    timeout: 10000
- tapOn: ".*the file editor.*"
- tapOn:
    point: "95%,25%"
- pressKey: Enter
- inputText: "print("
- inputText: "'"
- inputText: "close_flushed"
- inputText: "'"
- inputText: ")"
- assertVisible: "(?s).*close_flushed.*"
- takeScreenshot: 03-typed-before-close
# The dismiss is the strip's own affordance - either arm (`MainAreaTabStrip`) - and a
# dirty document is asked first, so the owed write goes through the dialog's Save.
- tapOn: "Back to files|Close tab: autosave_gate.py"
- extendedWaitUntil:
    visible: "Save your work"
    timeout: 5000
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Files"
    timeout: 5000
- takeScreenshot: 04-closed-back-to-files
