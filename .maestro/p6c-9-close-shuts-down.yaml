appId: com.jupydroid.app
---
# P6c-9b, part 2 of 4: with `kernelShutdown` on, *leaving* the notebook ends its kernel - the
# ordinary dismiss, not the ⋮ menu's "Shut Down Kernel". `SessionContext.dispose()`'s own
# shutdownOnDispose branch (`packages/apputils/src/sessioncontext.tsx:690-698`), reachable by
# toggle instead of by menu.
#
# **`stopApp: false` is the test, not a detail** - `p1d-part2`'s own rule: a force-stop would
# take the kernel with it, and the driver's "the session is gone" check would pass without
# close() having done anything at all.
#
# TABLET ONLY: it runs a cell, and on the x86_64 emulator MainActivity falls back to
# FakeKernelGateway, which holds no session for /api/sessions to watch disappear.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Kernel Shutdown.ipynb"
- assertVisible: "Back to files|Close tab: Kernel Shutdown.ipynb"
- tapOn:
    text: "Run cell"
    index: 0
# Generous: the run starts the kernel, and a cold one on the tablet measured well past the
# default timeout - `notebook-session-reattaches`'s own allowance.
- extendedWaitUntil:
    visible: "42"
    timeout: 120000
- takeScreenshot: 03-carried-defined-on-a-live-kernel
# A clean close: the run's own autosave persist left nothing dirty, so no save-before-close
# dialog stands between the dismiss and the kernel ending (P6c-8c's gate asks only for dirty).
- tapOn: "Back to files|Close tab: Kernel Shutdown.ipynb"
- extendedWaitUntil:
    visible: "Kernel Shutdown.ipynb"
    timeout: 10000
- takeScreenshot: 04-closed-kernel-asked-to-end
