appId: com.jupydroid.app
---
# P6c-9b, part 3 of 4: the reopened notebook runs on a kernel that never saw `carried`.
#
# **`.*NameError.*` is the whole assertion**, `shutdown-kernel-fresh-kernel-forgot`'s own reasoning verbatim: three outcomes
# are distinguishable - 44 means the same kernel is still there (the close did nothing),
# NameError means a kernel that never saw the assignment (what a close-time shutdown leaves), and
# nothing means the notebook cannot run at all, which would be its own defect. And the regex form
# is measured: a traceback is one node, so the bare word can never match it.
#
# `stopApp: false`, `shutdown-kernel-shut-it-down`'s own rule. TABLET ONLY: see part 2.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "Open Base \\(base\\)"
    file: open-base-space.yaml
- tapOn: "Kernel Shutdown.ipynb"
- extendedWaitUntil:
    visible: "Run cell"
    timeout: 30000
- tapOn:
    text: "Run cell"
    index: 1
# Generous: this run boots a whole new kernel, part 2's having been ended by the close.
- extendedWaitUntil:
    visible: ".*NameError.*"
    timeout: 120000
- takeScreenshot: 05-a-fresh-kernel-never-saw-it
- tapOn: "Back to files|Close tab: Kernel Shutdown.ipynb"
- extendedWaitUntil:
    visible: "Kernel Shutdown.ipynb"
    timeout: 10000
