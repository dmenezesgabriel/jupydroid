appId: com.jupydroid.app
---
# P7a: the shell drawn as *parts*, a step apart, the way the reference draws them.
#
# **What this flow is for is a colour, and no assertion can read one** - so the deliverable is the
# frames, and `scripts/read_chrome_parts.py` is what turns them into something that can fail. The
# driver reads each frame's own vertical colour bands and compares them against the values
# `resolve_vscode_theme.py` resolves; this file's job is only to put the parts on screen.
#
# The defect it closes, measured off the frame P2u-1 shipped: at 1920x1200 along y=900, the
# activity rail (x 0-119) and the file explorer (x 122-699) were both `#121314` -
# `editor.background` - so three parts were one field with a 1px seam drawn across it
# (`evidence/p2u-1-chrome/after-tablet/dark/01-the-explorer.png`).
#
# Seeded by scripts/p7a-chrome-parts-driver.sh, which sets the system night mode and runs this
# flow once per theme into its own directory; clearState would delete the fixture.
#
# Runs no cell, so it needs no Space runtime - but the **rail only exists beside two panes**, so
# the tablet is the device that can show all three parts at once. The emulator's own run is the
# one-pane half: there the side panel is the window and the activity bar is under it.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000

# --- the file browser, which is `sideBar.background` ------------------------------------------
- assertVisible: "Files"
- assertVisible: "Workspace"
- assertVisible: "Chrome Check.ipynb"
- takeScreenshot: 01-the-file-browser

# --- a second side panel, so the claim is about the *part* and not about one screen -------------
# The search panel is a different composable with its own `Scaffold` and its own `TopAppBar`; if
# only the explorer had been given the colour, this frame is where that shows.
#
# **Before the document, not after, and a device run is why.** Where the shell draws one pane the
# document *is* the window - `NavDisplay` composes only the top entry and the activity bar is
# deliberately not drawn over a document (`docs/DECISIONS.md`, "The bar is drawn over the panel and
# never over a document") - so reaching Search from inside the notebook is not a thing that exists
# there. Ordered this way the same flow drives both layouts.
- tapOn: "Search"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-a-second-side-panel
- tapOn: "Files"
- waitForAnimationToEnd:
    timeout: 5000

# --- a document, which is `editor.background` --------------------------------------------------
# Beside two panes this is the frame that carries all three parts at once - rail, side panel and
# page - which is the whole claim of this step in one picture. At one pane it carries none of them,
# because the document is the window; the checker knows that and does not hold it to a shape.
- tapOn: "Chrome Check.ipynb"
- extendedWaitUntil:
    visible: "Chrome check"
    timeout: 30000
- takeScreenshot: 03-a-document-beside-the-panel
