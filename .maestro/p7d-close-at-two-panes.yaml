appId: com.jupydroid.app
---
# P7d, the half only two panes can show: beside a browser a document is **closed**, not backed out
# of.
#
# There is nothing to go back *to* here - the browser is already on screen - and what the arrow
# would do is empty the document area. Both references name that act: `application:close`, labelled
# *Close Tab* (`application-extension/src/index.tsx:309-310`), and a `Codicon.close` on the tab
# itself in VS Code. Material draws the same distinction for the navigation slot: an arrow
# navigates up, a cross dismisses.
#
# **All three surfaces**, because one `DocumentDismissAction` serves all three bars and a component
# wired to two of them would pass a flow that only opened one.
#
# WIDE WINDOW (>= 840dp). Runs no cell: the notebook is opened and read, never executed, so
# `FakeKernelGateway` is never asked anything.
- launchApp
- extendedWaitUntil:
    visible: "Files"
    timeout: 10000

# --- the notebook ---
- tapOn: "Root.ipynb"
- extendedWaitUntil:
    visible: ".*this one is at the root.*"
    timeout: 20000
- assertVisible: "Close"
- assertNotVisible: "Back to notebooks"
- takeScreenshot: 01-the-notebook-offers-close-not-back
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: ".*this one is at the root.*"
    timeout: 10000
# **The document area empties and the browser keeps its column** - which is what the frame showed
# and not what this flow first claimed. It is also the reference's own structure: VS Code leaves an
# empty editor group (its watermark lives there) and JupyterLab an empty dock area. What fills it is
# `docs/PLAN.md`'s P6d, the Launcher, and inventing a surface for it here would be inventing one the
# reference already names.
- assertVisible: "Root.ipynb"
- assertVisible: "file_editor.py"
- takeScreenshot: 02-the-document-area-is-empty-and-the-browser-keeps-its-column

# --- the plain file editor ---
- tapOn: "file_editor.py"
- extendedWaitUntil:
    visible: ".*the file editor.*"
    timeout: 20000
- assertVisible: "Close"
- assertNotVisible: "Back to files"
- takeScreenshot: 03-the-plain-editor-offers-close-not-back
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: ".*the file editor.*"
    timeout: 10000
- assertVisible: "file_editor.py"
- takeScreenshot: 04-the-file-closed-too

# --- the terminal ---
# A shell is not a file, but it occupies the same area, so what empties that area has one name.
- tapOn: "New terminal"
- extendedWaitUntil:
    visible: "Terminal"
    timeout: 120000
- assertVisible: "Close"
- takeScreenshot: 05-the-terminal-offers-close-too
- tapOn: "Close"
# **The bar going is the oracle, not the shell's title.** `notVisible: "Terminal"` alone gave way
# once on a run where the hierarchy held no such string at all - the document area was already
# empty and the wait was still deciding. What is unambiguous is that nothing occupies that area any
# more, and the only thing that draws a Close is a document.
- extendedWaitUntil:
    notVisible: "Close"
    timeout: 15000
- assertNotVisible: "Terminal"
- assertVisible: "Root.ipynb"
- takeScreenshot: 06-the-shell-closed-and-the-browser-remains
