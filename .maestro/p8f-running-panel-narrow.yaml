appId: com.jupydroid.app
---
# P8f, one pane: the same "Sessions and Tabs" panel where the window is the pane - reached from
# the bottom bar's second item (the rail's `running` item moved, `SidePanelBar`'s own job), its
# rows opening documents *over* it and the Workspace crumb - not Back, which closes - returning
# beneath them.
#
# The fixtures live in `reports/` for the same reason p8e's do: a root document has no crumbs.
#
# On the emulator the kernel is FakeKernelGateway, which echoes a run cell's own source back as
# its output - so the run's assertion is scoped under "Cell output" and waived accordingly; the
# panel's loop itself (run -> row -> shut down -> No Kernel) is still real, because the fake
# gateway and the fake session list share the app's one KernelSessionRegistry.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Files"

# ---- the bar's second item is the panel ----
- tapOn: "Sessions and Tabs"
- extendedWaitUntil:
    visible: "Kernel Sessions"
    timeout: 10000
- assertVisible: "Open Tabs"
- assertVisible: "Terminals"
- assertVisible: "Refresh list"
# No launcher fill at one pane (`launcherSeen` is seeded) - Open Tabs starts empty, so the whole
# panel's three sections are empty lists.
- takeScreenshot: 01-panel-sections-empty

# ---- a run notebook is a Kernel Sessions row ----
- tapOn: "Files"
- tapOn: "reports"
- tapOn: "p8f-kernel.ipynb"
- extendedWaitUntil:
    visible: "Tab: p8f-kernel.ipynb"
    timeout: 30000
- assertVisible: "No Kernel"
- tapOn: "Run cell"
# matches-source: the fake echoes the source - the row the run creates is the real claim here.
# The `[\s\S]*` tails are load-bearing: `text` is a whole-string regex, so a bare substring never
# matches (p8b's own measured lesson).
- extendedWaitUntil:
    visible:
      text: "[\\s\\S]*p8f_kernel_total_[\\s\\S]*"
      childOf:
        text: "Cell output"
    timeout: 30000
- assertVisible: "Kernel Python 3: Idle"
# The crumb returns to the bar *without* closing the tab - the strip's Up arrow would close it.
- tapOn: "Workspace"
- extendedWaitUntil:
    visible: "Sessions and Tabs"
    timeout: 10000
- tapOn: "Sessions and Tabs"
- extendedWaitUntil:
    visible: "Open kernel session: p8f-kernel.ipynb"
    timeout: 10000
- assertVisible: "Open tab: p8f-kernel.ipynb"
- takeScreenshot: 02-session-listed

# ---- the session row opens its document ----
- tapOn: "Open kernel session: p8f-kernel.ipynb"
- extendedWaitUntil:
    visible: ".*p8f_kernel_total_.*"
    timeout: 10000
- takeScreenshot: 03-session-row-opens

# ---- a second run, then the counted shut-down-all ----
- tapOn: "Workspace"
- tapOn: "Files"
- tapOn: "reports"
- tapOn: "p8f-second.ipynb"
- extendedWaitUntil:
    visible: "Tab: p8f-second.ipynb"
    timeout: 30000
- tapOn: "Run cell"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Workspace"
- tapOn: "Sessions and Tabs"
- extendedWaitUntil:
    visible: "Open kernel session: p8f-second.ipynb"
    timeout: 10000
- assertVisible: "Open kernel session: p8f-kernel.ipynb"
- takeScreenshot: 04-two-sessions-listed
- tapOn: "Shut Down All: Kernel Sessions"
- extendedWaitUntil:
    visible: "Are you sure you want to permanently shut down the 2 running kernel sessions?"
    timeout: 5000
- takeScreenshot: 05-shutdown-all-asks-with-count
- tapOn: "Confirm Shut Down All"
- extendedWaitUntil:
    notVisible: "Open kernel session: p8f-kernel.ipynb"
    timeout: 10000
- assertNotVisible: "Open kernel session: p8f-second.ipynb"

# ---- `ended` lands on the open document as No Kernel ----
- tapOn: "Open tab: p8f-kernel.ipynb"
- extendedWaitUntil:
    visible: "No Kernel"
    timeout: 10000
- takeScreenshot: 06-shutdown-all-lands-no-kernel

# ---- a terminal outlives its own tab ----
- tapOn: "Workspace"
# `terminal:create-new` is the bar's own action at one pane.
- tapOn: "New terminal"
- extendedWaitUntil:
    visible: "Tab: Terminal 1"
    timeout: 30000
# Up *closes* the tab - and closing the current tab reveals a sibling, so the notebook is what
# shows, with the shell still the server's. That is exactly why the reference has the row at all:
# the Terminals section still holds it (`terminal:open` reattaches).
- tapOn: "Back to files"
# The closed tab's sibling is what shows (the tab strip's own survivor rule) - either notebook
# carries the Workspace crumb the return needs.
- extendedWaitUntil:
    visible: "Workspace"
    timeout: 10000
- tapOn: "Workspace"
- tapOn: "Sessions and Tabs"
- extendedWaitUntil:
    visible: "Open terminal: terminals/1"
    timeout: 15000
- takeScreenshot: 07-terminal-outlives-its-tab
- tapOn: "Open terminal: terminals/1"
- extendedWaitUntil:
    visible: "Tab: Terminal 1"
    timeout: 10000
- takeScreenshot: 08-terminal-reattached
# And back again - sibling tab, then the crumb - to shut the shell itself down.
- tapOn: "Back to files"
- extendedWaitUntil:
    visible: "Workspace"
    timeout: 10000
- tapOn: "Workspace"
- tapOn: "Sessions and Tabs"
- tapOn: "Shut Down: terminals/1"
- extendedWaitUntil:
    notVisible: "Open terminal: terminals/1"
    timeout: 10000
- takeScreenshot: 09-terminal-shut-down

# ---- Close All asks, then closes each - dirty ones through the gate's queue ----
- tapOn: "Close All: Open Tabs"
- extendedWaitUntil:
    visible: "Are you sure you want to close all open tabs?"
    timeout: 5000
- takeScreenshot: 10-close-all-asks
- tapOn: "Confirm Close All"
# Both notebooks are dirty from their runs, so the close lands as one dialog per document in
# opening order - the reference's own one-ask-per-widget, serialised the way a phone has to.
- extendedWaitUntil:
    visible: "Save changes in \"p8f-kernel.ipynb\" before closing?"
    timeout: 5000
- takeScreenshot: 11-first-dirty-ask
- tapOn: "Discard"
- extendedWaitUntil:
    visible: "Save changes in \"p8f-second.ipynb\" before closing?"
    timeout: 5000
- takeScreenshot: 12-second-dirty-ask
- tapOn: "Discard"
- extendedWaitUntil:
    notVisible: "Open tab: p8f-kernel.ipynb"
    timeout: 10000
- assertNotVisible: "Open tab: p8f-second.ipynb"
- takeScreenshot: 13-all-closed
