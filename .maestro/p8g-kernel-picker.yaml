appId: com.jupydroid.app
---
# P8g: kernel choice - `selectKernel` end to end against real kernels.
#
# TABLET ONLY (SM-X216B). The whole claim is that a *different* kernel answers after the pick:
# `marker_echo` only exists because the p8g-echo kernelspec's `env` set it, and `shared_7` only
# exists because the session was re-bound to a kernel that already held the variable. The
# emulator's FakeKernelGateway echoes source and shares nothing - every one of those assertions
# would be a fiction there. The picker's own shape is `p8g-kernel-picker-emulator`'s, which runs
# no cell.
#
# The second kernelspec is planted by the provider's own first cell: `p8g-echo`, same interpreter
# and launcher as `python3` (sys.executable is the Space's musl interpreter), one `env` marker
# apart - a real `kernel.json` jupyter lists, not a fake in the app. It lands while the server is
# up, which is the point: `KernelSpecManager.find_kernel_specs` re-walks `kernel_dirs` on every
# `GET /api/kernelspecs`, so no restart is needed and the provider's kernel stays alive to attach
# to.
#
# Three proofs in one pass, in the reference's own terms:
#   * `{"id": <running>}`   - "Connect to Existing python Kernel" PATCHes the session onto the
#     provider's kernel, and `p8g_shared` is already there when it arrives.
#   * `{"name": "p8g-echo"}` - "Start python Kernel" swaps the interpreter, and `_updateSpec`
#     writes it to `metadata.kernelspec`.
#   * reopen                - the persisted name seeds the next kernel, which answers `echo`.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml

# ---- the provider's kernel comes up holding a variable ----
- scrollUntilVisible:
    element:
      text: "P8g Provider.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "P8g Provider.ipynb"
# The plant cell fills the first screen; the second cell's source is below the fold, so the
# "notebook opened" wait names this one's own text.
- extendedWaitUntil:
    visible: ".*jupyter_path.*"
    timeout: 30000
- tapOn: "Run all cells"
# `spec_planted` is the first output, which `childOf` can name; `provider_armed` is the second
# cell's, and `childOf` resolves to the *first* "Cell output" on screen - the limitation
# export-formats records - so it is asserted unscoped. It is computed text (`"provider_" +
# "armed"`), which is what makes an unscoped assert an honest one. The plant cell is tall enough
# that both outputs start below the fold, so the wait is a scroll, not an assert.
- scrollUntilVisible:
    element:
      text: "spec_planted"
      childOf: {text: "Cell output"}
    direction: DOWN
    timeout: 120000
- scrollUntilVisible:
    element:
      text: "provider_armed"
    direction: DOWN
    timeout: 120000
- takeScreenshot: 01-provider-kernel-armed
- back

# ---- the consumer starts on the kernel its metadata names ----
- scrollUntilVisible:
    element:
      text: "P8g Consumer.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "P8g Consumer.ipynb"
- extendedWaitUntil:
    # matches-source: waits for the cell's *source* to render - the "notebook opened" wait, not
    # an output. P8G_KERNEL is also a literal in the provider's plant-cell source.
    visible: ".*P8G_KERNEL.*"
    timeout: 30000
# Lazily connected, as always: nothing has asked for a kernel yet.
- assertVisible: "No Kernel"
- tapOn: "Run all cells"
- extendedWaitUntil:
    visible:
      text: "marker_python3"
      childOf: {text: "Cell output"}
    timeout: 120000
# `shared_unset` - the second cell's own output container, which `childOf` cannot name: Maestro
# resolves the scope against the *first* "Cell output" node, the same limitation
# export-formats records. The text is in no cell's source, which is what the gate checks.
- assertVisible: "shared_unset"
- takeScreenshot: 02-consumer-on-python3

# ---- the indicator's tap opens `selectKernel` ----
- tapOn: "Kernel Python 3: Idle"
- extendedWaitUntil:
    visible: "Select Kernel"
    timeout: 10000
- assertVisible: "Select kernel for: \"P8g Consumer.ipynb\""
- assertVisible: "Start python Kernel"
# Asserts the *picker row* the planted kernelspec produced - the same four words sit in the
# provider's plant-cell source, which the dialog covers anyway.
# matches-source: the dialog row, not a cell output.
- assertVisible: "P8g Echo Python"
- assertVisible: "Use No Kernel"
- assertVisible: "Start Kernel"
# The picker's LazyColumn is bounded inside the dialog's text slot, so the deep groups are
# not composed until the list scrolls to them. The swipe lands inside the dialog (screen
# centre x, a row's height of travel) and the a11y wait then finds the rows it reveals.
- swipe:
    start: 50%, 60%
    end: 50%, 50%
    duration: 300
- extendedWaitUntil:
    visible: "Connect to Existing python Kernel"
    timeout: 20000
# Maestro text selectors are full-string regex matches, so the running-kernel row's
# `(<id>)` suffix needs a trailing wildcard; `\\.` pins the literal dot.
- scrollUntilVisible:
    element:
      text: "P8g Provider\\.ipynb.*"
    direction: DOWN
    timeout: 20000
- takeScreenshot: 03-picker-groups

# ---- `{"id": ...}`: attach to the provider's running kernel ----
- tapOn: "P8g Provider\\.ipynb.*"
- tapOn: "^Select$"
- extendedWaitUntil:
    visible: "Kernel Python 3: Idle"
    timeout: 60000
- tapOn: "Run all cells"
- extendedWaitUntil:
    visible: "shared_7"
    timeout: 120000
- takeScreenshot: 04-attached-to-provider-kernel

# ---- `{"name": "p8g-echo"}`: swap the interpreter ----
- tapOn: "Kernel Python 3: Idle"
- extendedWaitUntil:
    visible: "Select Kernel"
    timeout: 10000
- tapOn: "P8g Echo Python"
- tapOn: "^Select$"
# `_isChangingKernel` reads 'starting' while the PATCH is out (`sessioncontext.tsx:623-625`).
- extendedWaitUntil:
    visible: "Kernel P8g Echo Python: Idle"
    timeout: 60000
- takeScreenshot: 05-bound-to-echo
- tapOn: "Run all cells"
- extendedWaitUntil:
    visible:
      text: "marker_echo"
      childOf: {text: "Cell output"}
    timeout: 120000
- assertVisible: "shared_unset"
- takeScreenshot: 06-echo-kernel-answers

# ---- reopen: the persisted kernelspec seeds the next kernel ----
- back
- scrollUntilVisible:
    element:
      text: "P8g Consumer.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "P8g Consumer.ipynb"
- extendedWaitUntil:
    # matches-source: same as above - the open wait reads the cell's source.
    visible: ".*P8G_KERNEL.*"
    timeout: 30000
- tapOn: "Run all cells"
- extendedWaitUntil:
    visible:
      text: "marker_echo"
      childOf: {text: "Cell output"}
    timeout: 120000
- assertVisible: "Kernel P8g Echo Python: Idle"
# A fresh kernel, not the provider's: the variable is gone again.
- assertVisible: "shared_unset"
- takeScreenshot: 07-reopened-honours-persisted-spec

# ---- `null`: "No Kernel" is the pick that ends the session ----
- tapOn: "Kernel P8g Echo Python: Idle"
- extendedWaitUntil:
    visible: "Select Kernel"
    timeout: 10000
# The row, not the button - bound, so the cancel button reads "Cancel" and this text is unique.
- tapOn: "^No Kernel$"
- tapOn: "^Select$"
- extendedWaitUntil:
    visible: "No Kernel"
    timeout: 20000
- takeScreenshot: 08-no-kernel-after-the-pick
