appId: com.jupydroid.app
---
# AUD-002's paste defect, end to end: the cell clipboard holds the cell's *JSON* - outputs and
# execution count included (`packages/notebook/src/actions.tsx:1451-1454`) - so a pasted copy
# shows the results the original was carrying. It used to come out blank: nothing wired the
# pasted cell into the maps beside `cells`, and the next save wrote it with none.
#
# No cell is run on purpose: the results are seeded into the fixture's file, so the paste - the
# thing being measured - is the only thing in the story. Seeded by
# scripts/paste-outputs-driver.sh.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
# Scrolled to rather than asserted on: Home is sorted by recency, so a seeded notebook sinks
# below the fold as soon as anything else is saved.
- scrollUntilVisible:
    element:
      text: "Paste Outputs.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Paste Outputs.ipynb"
# `[3]:` rather than the word "code": the bracket is the saved execution count, so seeing it is
# seeing the seeded result mounted.
- extendedWaitUntil:
    visible: "\\[3\\]:"
    timeout: 30000
- assertVisible:
    text: "saved result"
    childOf:
      text: "Cell output"
- takeScreenshot: 01-the-cell-and-its-saved-output
- tapOn:
    text: "Cell actions"
    index: 0
# The clipboard rows sit near the end of the sheet - the swipe that brings them up belongs to
# the shared sub-flow, which picks the point both surfaces answer.
- runFlow: scroll-the-cell-menu-to-its-end.yaml
- tapOn: "Cell menu Copy"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Cell actions"
    index: 0
- runFlow: scroll-the-cell-menu-to-its-end.yaml
- tapOn: "Cell menu Paste below"
- waitForAnimationToEnd:
    timeout: 5000
# Two cells now, the copy below the original: `index: 1` skips the original's pair, so the second
# bracket and the second output are the pasted one's - and on the broken build there is no second.
- assertVisible:
    text: "\\[3\\]:"
    index: 1
- assertVisible:
    text: "saved result"
    index: 1
- takeScreenshot: 02-the-pasted-copy-kept-the-output-and-count
