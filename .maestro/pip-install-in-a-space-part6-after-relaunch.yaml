appId: com.jupydroid.app
---
# The driver force-stopped the app. Relaunched into a fresh notebook in base, the cell installs
# nothing new - pip reports pandas already satisfied from the Space's `pkgs-gnu` user base - and
# imports all three packages the earlier parts installed, in a kernel started after the relaunch.
# That is the persistence claim: what `%pip` wrote is on the Space's disk, not in the process that
# wrote it.
#
# TABLET ONLY (SM-X216B): see `pip-install-in-a-space-body.yaml`.
- runFlow:
    file: pip-install-in-a-space-body.yaml
- inputText: "%pip install pandas"
- pressKey: Enter
- inputText: "import pandas, duckdb, sklearn"
- pressKey: Enter
- inputText: 'print("VERSIONS", pandas.__version__, duckdb.__version__, sklearn.__version__)'
- hideKeyboard
- tapOn:
    text: "Run cell"
    index: 0
# The wait is on the cell's own "ran in" mark, not on `VERSIONS`: the notebook screen composes
# only the output that fits its viewport, so a trailing stream can sit below the fold uncomposed
# (`docs/architecture/cross-cutting.md` §8.6). "ran in" sits in the cell's chrome, outside the
# output container, and no source line can satisfy it; the driver reads `VERSIONS` off the saved
# notebook, which keeps every stream.
- extendedWaitUntil:
    visible: ".*ran in [0-9].*"
    timeout: 300000
- takeScreenshot: 06-the-same-packages-after-a-relaunch
