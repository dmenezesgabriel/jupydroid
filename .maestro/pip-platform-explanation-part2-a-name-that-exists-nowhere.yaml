appId: com.jupydroid.app
---
# The control: `%pip install duckdbzz`, a name that exists nowhere, prints pip's two lines for
# duckdb's miss word for word (measured 2026-11-20). Nothing may be said about the platform, and
# only PyPI's own answer is what tells the two cases apart.
#
# This part only drives the cell and takes the frame; the silence is asserted by
# `pip-platform-explanation-part3-the-typo-stays-silent.yaml`, after the driver has slept - the note
# a confirmed miss earns arrives a moment *after* pip's text, so an assertion made here could pass
# before the thing it denies would have appeared.
#
# TABLET ONLY (SM-X216B): see `pip-platform-explanation-body.yaml`.
- runFlow:
    file: pip-platform-explanation-body.yaml
    env:
      PACKAGE: duckdbzz
- takeScreenshot: 02-typo-pip-returns
