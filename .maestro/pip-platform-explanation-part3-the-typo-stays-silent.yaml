appId: com.jupydroid.app
---
# Part 2's silence, asserted after a real sleep in the driver rather than a Maestro wait: the note a
# confirmed miss earns lands a moment after pip's text, so this must run once that moment is spent
# (`scripts/pip-platform-explanation-driver.sh`). `waitForAnimationToEnd` was measured unreliable
# for a delay on this tablet - see `debugger-stopped-at-breakpoint-settled.yaml`.
#
# **Unscoped on purpose.** `childOf` reaches the first "Cell output" node and never a later one
# (`docs/architecture/cross-cutting.md` §8.6), and the claim here is that the phrase is nowhere on
# screen. It cannot come from the source either: the cell reads `%pip install duckdbzz`.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible: ".*musllinux aarch64.*"
- takeScreenshot: 03-typo-stays-silent
