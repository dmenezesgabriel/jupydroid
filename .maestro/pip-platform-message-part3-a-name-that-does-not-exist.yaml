appId: com.jupydroid.app
---
# `%pip install duckdbzz`: a name that exists nowhere, which is the control. A message that reads the
# same as the two real packages' is what makes "pip found no distribution" unable to say whether the
# package exists and the platform is wrong, or the name is a typo - the fact the explanation has to
# be checked against PyPI rather than guessed from pip's text.
#
# TABLET ONLY (SM-X216B): on x86_64 the app falls back to `FakeKernelGateway`.
- runFlow:
    file: pip-platform-message-body.yaml
    env:
      PACKAGE: duckdbzz
- takeScreenshot: 01-unknown-name-pip-returns
