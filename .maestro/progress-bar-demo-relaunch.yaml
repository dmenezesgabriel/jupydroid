appId: com.jupydroid.app
---
# The driver force-stopped the app after part 1. Relaunched and reopened, the notebook still shows
# the one block the progress loop left, read back off the disk: no cell runs in this part. The
# driver reads the saved file after it.
#
# TABLET ONLY (SM-X216B): part 1 runs cells.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "Untitled.ipynb"
- extendedWaitUntil:
    visible:
      text: "100% done\na\nb"
      childOf: {text: "Cell output"}
    timeout: 30000
- takeScreenshot: 03-the-one-block-survives-a-relaunch
