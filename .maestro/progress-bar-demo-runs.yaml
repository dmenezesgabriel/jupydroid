appId: com.jupydroid.app
---
# The PRD's demo, typed into a new notebook rather than seeded: a `\r` progress loop and the prints
# after it land as one output reading `100% done`, `a`, `b`, in the notebook and then in the
# Console on the same kernel (StreamFold.kt). `100%` is in no source - the loop prints `{i*25}%` -
# and FakeKernelGateway would echo the whole source instead. Run by
# scripts/progress-bar-demo-driver.sh, which kills the app after this part.
#
# TABLET ONLY (SM-X216B): the flow runs cells.
#
# The source is typed a line at a time with Enter between, because `inputText` cannot type a
# newline. The line after `for ...:` gets an indent level from PythonTypingRules.continueIndent,
# and the line after the body keeps it, so `eraseText: 4` takes that level back off.
#
# Each assertion full-matches one output node, so it fails on any of: a frame per repaint, a `\r`
# drawn literally, or `a`/`b` in an output of their own.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "New"
- extendedWaitUntil:
    visible: "New notebook"
    timeout: 5000
- tapOn: "New notebook"
- extendedWaitUntil:
    visible: "Untitled.ipynb"
    timeout: 10000
- tapOn: "Untitled.ipynb"
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000

# The empty cell's field has no text to tap by, so it is tapped at a point inside it: SM-X216B's
# 1920x1200 puts the field at [805,319][1884,391] (`maestro hierarchy`).
- tapOn:
    point: "1300,354"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: progress-bar-demo-type-source.yaml
- hideKeyboard
- tapOn: "Run cell"
# Generous: the first run installs the Space's kernel and starts it.
- extendedWaitUntil:
    visible:
      text: "100% done\na\nb"
      childOf: {text: "Cell output"}
    timeout: 180000
- takeScreenshot: 01-the-notebook-draws-one-line-and-the-prints-join-it

# The Console, on the notebook's own kernel, with the same source typed the same way. The cell
# still has focus after Run, and a notebook in edit mode draws the symbol row along its bottom
# instead of the kernel bar (`editorBottomBar`). The keyboard is already down, so one `back` is
# edit mode's own exit to command mode, as in cell-mode.yaml.
- back
- tapOn: "Kernel actions"
- tapOn: "New Console for Notebook"
- extendedWaitUntil:
    visible:
      id: "console-input-field"
    timeout: 10000
- tapOn:
    id: "console-input-field"
- runFlow: progress-bar-demo-type-source.yaml
- tapOn: "Run"
- extendedWaitUntil:
    visible:
      text: "100% done\na\nb"
      childOf: {text: "Cell output"}
    timeout: 60000
# The Console's field keeps the keyboard up after Run, and it covers the entry's last line.
- hideKeyboard
- takeScreenshot: 02-the-console-draws-the-same-one-block
