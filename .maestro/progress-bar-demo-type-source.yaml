appId: com.jupydroid.app
---
# Types the demo source into whichever field has focus, a line at a time: `inputText` cannot
# type a newline, so Enter goes between the lines. The line after `for ...:` gets an indent level
# from PythonTypingRules.continueIndent and the line after the body keeps it, so `eraseText: 4`
# takes that level back off. Shared by the notebook and the Console halves of
# progress-bar-demo-runs.yaml.
- inputText: "import time"
- pressKey: Enter
- inputText: "for i in range(5):"
- pressKey: Enter
- inputText: "print(f\"\\r{i*25}%\", end=\"\", flush=True); time.sleep(0.3)"
- pressKey: Enter
- eraseText: 4
- inputText: "print(\" done\")"
- pressKey: Enter
- inputText: "print(\"a\"); print(\"b\")"
