appId: com.jupydroid.app
---
# The hand-made musl environment the panel part that follows registers: `python3 -m venv` with
# the Space's musl interpreter, then its own pip installing ipykernel - the route that predates
# `jupydroid-env`, kept working on purpose (a musl venv is deliberately not creatable from the
# app; the terminal's own venv + Register is its route).
#
# The status goes to a file in the workspace and the driver greps it: cross-cutting.md §8.6
# forbids gating a flow's pass on `visible:` reading the terminal canvas. `>>` and `$?` rather
# than `${…}`, which Maestro evaluates as JavaScript.
- launchApp
- extendedWaitUntil:
    visible: "Run Thesis \\(space-1\\)"
    timeout: 10000
- tapOn: "Run Thesis \\(space-1\\)"
# Stop, not an enabled Open: see `open-base-space.yaml` for why Open's own node cannot be read.
- extendedWaitUntil:
    visible: "Stop Thesis \\(space-1\\)"
    timeout: 120000
- tapOn: "Open Thesis \\(space-1\\)"
- extendedWaitUntil:
    visible: "New Launcher"
    timeout: 10000
- tapOn: "New Launcher"
- extendedWaitUntil:
    visible:
      id: "launcher-card-NEW_TERMINAL"
    timeout: 10000
- tapOn:
    id: "launcher-card-NEW_TERMINAL"
- extendedWaitUntil:
    visible: "Tab: Terminal .*"
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 15000
# A tap settles the IME's connection before typing - the first keystrokes can race it otherwise
# (terminal-tablet measured `ech` of `echo` eaten).
- tapOn:
    id: "terminal-input"
- inputText: "python3 -m venv ~/envs/hand >hand.txt 2>&1 && ~/envs/hand/bin/pip install ipykernel >>hand.txt 2>&1; echo hand-rc=$? >>hand.txt; tail -3 hand.txt"
- pressKey: Enter
- takeScreenshot: 01-hand-venv-typed
