appId: com.jupydroid.app
---
# Thesis is made from the home, as the other Space flows make it, so the driver can seed a notebook into
# its workspace before anything runs in it.
- launchApp
- extendedWaitUntil:
    visible: "Open Base \\(base\\)"
    timeout: 10000
- tapOn: "New Space"
- extendedWaitUntil:
    visible: "Create"
    timeout: 5000
- inputText: "Thesis"
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Run Thesis \\(space-1\\)"
    timeout: 60000
- takeScreenshot: 01-thesis-created
