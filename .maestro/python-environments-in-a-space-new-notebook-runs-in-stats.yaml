appId: com.jupydroid.app
---
# Thesis runs with `stats` as its default (parts 4-5). A notebook made from the explorer's New menu
# records that default and starts it: the bar names `Python (stats)`, and its one cell prints the
# kernel's `sys.prefix`, which is the venv only when the venv's own interpreter runs it -
# FakeKernelGateway would echo the source, which never holds the path. The driver reads the file's
# `metadata.kernelspec` after this part.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Run Thesis \\(space-1\\)"
    timeout: 30000
- tapOn: "Run Thesis \\(space-1\\)"
# Stop, not an enabled Open: see `open-base-space.yaml` for why Open's own node cannot be read.
- extendedWaitUntil:
    visible: "Stop Thesis \\(space-1\\)"
    timeout: 120000
- tapOn: "Open Thesis \\(space-1\\)"
- extendedWaitUntil:
    visible: "Files"
    timeout: 10000
- tapOn: "New"
- extendedWaitUntil:
    visible: "New notebook"
    timeout: 5000
- tapOn: "New notebook"
- extendedWaitUntil:
    visible: "Untitled.ipynb"
    timeout: 10000
- tapOn: "Untitled.ipynb"
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000
# Bracket-free source, so the editor's auto-closing cannot change what is typed.
- runFlow:
    file: focus-cell.yaml
    env:
      CELL_INDEX: 0
- inputText: "import sys; sys.prefix"
- hideKeyboard
- tapOn:
    text: "Run cell"
    index: 0
- extendedWaitUntil:
    visible:
      text: ".*/home/jupydroid/envs/stats.*"
      childOf: {text: "Cell output"}
    timeout: 120000
- assertVisible: "Python \\(stats\\)"
- takeScreenshot: 09-new-notebook-ran-in-stats
