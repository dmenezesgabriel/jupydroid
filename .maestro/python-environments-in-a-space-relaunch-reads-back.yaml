appId: com.jupydroid.app
---
# The driver killed the app after part 5. Relaunched, Thesis's Settings opens on `stats` still
# registered and `Python (stats)` the default: the dialog starts from the stored record, so the
# pick and the spec came back off Thesis's disk.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Run Thesis \\(space-1\\)"
    timeout: 30000
- tapOn: "Settings Thesis \\(space-1\\)"
- extendedWaitUntil:
    visible: "Idle shutdown \\(minutes\\)"
    timeout: 5000
# The section sits under the startup script, in the dialog's own scroll.
- scrollUntilVisible:
    element: "Registered as kernel stats"
    direction: DOWN
    timeout: 10000
- assertVisible: "envs/fast"
- takeScreenshot: 10-stats-registered-after-relaunch
- scrollUntilVisible:
    element: "Default kernel: Python \\(stats\\)"
    direction: DOWN
    timeout: 10000
- takeScreenshot: 11-stats-is-the-default-after-relaunch
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Idle shutdown \\(minutes\\)"
    timeout: 5000
