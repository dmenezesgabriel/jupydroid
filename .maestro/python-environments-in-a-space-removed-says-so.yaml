appId: com.jupydroid.app
---
# The driver killed the app after part 8, so Thesis is stopped with the spec removed. Settings no
# longer lists `envs/stats` at all, and the home row now gives the other reason: no kernel of the
# stored default's name is left.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Run Thesis \\(space-1\\)"
    timeout: 30000
- assertVisible: ".*Default kernel is python3, not stats: no kernel named stats is left in this Space.*"
- takeScreenshot: 14-home-says-no-kernel-is-left
- tapOn: "Settings Thesis \\(space-1\\)"
- extendedWaitUntil:
    visible: "Idle shutdown \\(minutes\\)"
    timeout: 5000
- scrollUntilVisible:
    element: "envs/bare"
    direction: DOWN
    timeout: 10000
- assertNotVisible: "envs/stats"
- assertNotVisible: "jupyter kernelspec remove stats"
- takeScreenshot: 15-envs-stats-no-longer-listed
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Idle shutdown \\(minutes\\)"
    timeout: 5000
