appId: com.jupydroid.app
---
# Back on the home, Thesis is stopped and its Settings opened: the section lists `envs/bare` with
# the command that adds ipykernel and `envs/stats` as having it, and not `thesis/.venv`, which is
# below the scan's roots. The driver compares the screen with `find` over the same workspace.
- launchApp:
    stopApp: false
- repeat:
    while:
      notVisible: "Open Thesis \\(space-1\\)"
    times: 4
    commands:
      - back
- extendedWaitUntil:
    visible: "Stop Thesis \\(space-1\\)"
    timeout: 10000
- tapOn: "Stop Thesis \\(space-1\\)"
- extendedWaitUntil:
    visible: "Run Thesis \\(space-1\\)"
    timeout: 60000
- takeScreenshot: 03-thesis-stopped
- tapOn: "Settings Thesis \\(space-1\\)"
- extendedWaitUntil:
    visible: "Idle shutdown \\(minutes\\)"
    timeout: 5000
# The section sits under the startup script, in the dialog's own scroll.
- scrollUntilVisible:
    element: "envs/stats"
    direction: DOWN
    timeout: 10000
- assertVisible: "envs/bare"
- assertVisible: "~/envs/bare/bin/pip install ipykernel"
- assertVisible: "ipykernel installed"
- assertNotVisible: "thesis/.venv"
- takeScreenshot: 04-settings-lists-the-environments
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Idle shutdown \\(minutes\\)"
    timeout: 5000
