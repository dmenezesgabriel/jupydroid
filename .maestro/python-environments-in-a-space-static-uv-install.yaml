appId: com.jupydroid.app
---
# PyPI's uv is a static binary, so no LD_PRELOAD reaches it - getaddrinfo_shim.c included - and its lookup
# is musl's own. tabulate is in neither env yet, so the install must reach the index.
# The frame first shows the previous command's tail, which the driver has already read off disk.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 07-uv-venv
- tapOn:
    id: "terminal-input"
- inputText: "clear; /pkgs/bin/uv pip install --python ~/envs/fast/bin/python tabulate >uv-static.txt 2>&1; echo install-rc=$? >>uv-static.txt; tail -3 uv-static.txt"
- pressKey: Enter
