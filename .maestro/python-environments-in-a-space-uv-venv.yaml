appId: com.jupydroid.app
---
# Alpine's uv makes a venv and installs ipykernel into it by the venv's interpreter. Named by path: PATH puts /pkgs/bin, where part 6's uv went, first.
# The frame first shows the previous command's tail, which the driver has already read off disk.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 06-uv-from-pip
- tapOn:
    id: "terminal-input"
- inputText: "clear; /usr/bin/uv venv ~/envs/fast >uv-venv.txt 2>&1; echo venv-rc=$? >>uv-venv.txt; /usr/bin/uv pip install --python ~/envs/fast/bin/python ipykernel >>uv-venv.txt 2>&1; echo install-rc=$? >>uv-venv.txt; tail -3 uv-venv.txt"
- pressKey: Enter
