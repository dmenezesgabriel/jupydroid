appId: com.jupydroid.app
---
# P2d-2: the two ranged runs, and the asymmetry between them.
#
# `notebook:run-all-above` slices `(0, activeCellIndex)` and `notebook:run-all-below` slices
# `(activeCellIndex)` (`packages/notebook/src/actions.tsx:1005-1090`) - one excludes the head and
# the other includes it. Nothing about the two names says so, and nothing but a run on a real
# kernel can show it, which is what this flow is for.
#
# Three cells, three products no source contains: 42, 121, 169.
#
#   1. **A notebook just opened has an active cell, and it is the first.** The overflow's
#      `Run All Above Selected Cell` is greyed before anything is touched - the reference's own
#      `activeCellIndex` clamp to 0 (`widget.ts:1965-1974`) plus its `isEnabled` at index 0
#      (`notebook-extension/src/index.ts:3082-3089`).
#   2. **Above excludes the head.** With cell 2 active, Run All Above leaves 42 and only 42.
#   3. **Below includes it.** The same head then produces 121 *and* 169.
#
# Seeded by scripts/ranged-runs-driver.sh; clearState would delete the fixture.
- launchApp
- runFlow: open-base-space.yaml
# Home's list is populated by a disk scan, and a scroll started before it has rendered ends
# rather than retrying - so let the launch settle first.
- waitForAnimationToEnd:
    timeout: 5000
# Scrolled to rather than asserted on: Home is sorted by recency, so a seeded notebook
# sinks below the fold as soon as anything else is saved.
- scrollUntilVisible:
    element:
      text: "Ranged Runs.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Ranged Runs.ipynb"
- extendedWaitUntil:
    visible: "print\\(6 \\* 7\\)"
    timeout: 30000
- assertVisible: "print\\(13 \\* 13\\)"
- takeScreenshot: 01-three-cells-nothing-run

# The head is cell 1 because the notebook was loaded, not because anything was tapped. So the
# range above it is empty and the row says so by being dead.
- tapOn: "Kernel actions"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Run All Above Selected Cell"
- assertVisible: "Run Selected Cell and All Below"
# **The greying is proved by behaviour, not by reading the row's state**, and that cost two runs to
# learn: Compose's merged semantics tree puts a DropdownMenuItem's disabled state onto its label,
# but Android's accessibility tree - the one Maestro reads - keeps it on a clickable node one level
# up that has no label. So `enabled: false` on the row matched an always-enabled TextView and could
# never fail. Tapping is the observable difference instead: a live row closes this menu (`onRun`
# does), a dead one leaves it open.
- tapOn: "Run All Above Selected Cell"
- assertVisible: "Run Selected Cell and All Below"
- takeScreenshot: 02-above-is-dead-on-the-first-cell
- back

# Move the head to cell 2 the way a user does - by tapping the cell. Focus is what selects a cell
# in this app (`EditorViewModel.cellFocusChanged`), so this also opens the keyboard and swaps the
# kernel bar for the symbol row; `hideKeyboard` is a system BACK on Android, which the IME takes,
# and the second one reaches the notebook's own BackHandler and drops the caret.
- tapOn: "print\\(11 \\* 11\\)"
- waitForAnimationToEnd:
    timeout: 5000
- hideKeyboard
- back
# The kernel bar is back, so the notebook is in command mode again - with cell 2 still the head.
- extendedWaitUntil:
    visible: "Kernel actions"
    timeout: 10000
- takeScreenshot: 03-head-on-the-second-cell

- tapOn: "Kernel actions"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Run All Above Selected Cell"
# Generous: the first run of the session installs the Space if needed and starts jupyter_server.
# 42 is the kernel's product of 6 and 7 - no echo of `print(6 * 7)` can produce it.
- extendedWaitUntil:
    visible: "42"
    timeout: 120000
# The head itself did not run, which is the whole point of *above*. Neither product appears in any
# cell's source, so these cannot be satisfied by a field.
- assertNotVisible: "121"
- assertNotVisible: "169"
- takeScreenshot: 04-above-ran-only-the-first-cell

- tapOn: "Kernel actions"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Run Selected Cell and All Below"
- extendedWaitUntil:
    visible: "169"
    timeout: 120000
# The head ran this time - that one cell is the difference between the two commands.
- assertVisible: "121"
- takeScreenshot: 05-below-ran-the-head-and-the-rest
