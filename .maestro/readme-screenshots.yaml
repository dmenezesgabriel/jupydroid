appId: com.jupydroid.app
---
# The frames the README's <picture> blocks and the site's index show: the shell with a notebook
# open and its cells run. The cells' results are kernel-built (`mean` and `std` are computed from
# a seeded generator, so neither number is in the source), which FakeKernelGateway - an echo of
# the source - could not produce.
# Seeded and cropped by scripts/site-screenshots-driver.sh alone, into
# docs-site/pages/images/<name>-<theme>.png pairs - the files both front doors embed; each crop
# removes the system bars off what is captured.
#
# TABLET ONLY (SM-X216B): the flow runs cells.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "Jupydroid tour.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Jupydroid tour.ipynb"
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000
- tapOn: "Run all cells"
# The scrolls below can only go down, so they must not start until the run's output exists: the
# pip cell's install can outlast a scroll to the bottom and park the view under the lines they
# look for. Busy-then-Idle is the whole run - Idle alone would pass on the gap before the first
# cell starts the kernel (kernel-indicator-states.yaml waits on the same pair).
- extendedWaitUntil:
    visible: "Kernel Python 3: Busy"
    timeout: 120000
- extendedWaitUntil:
    visible: "Kernel Python 3: Idle"
    timeout: 600000
# Generous: the tour's cells leave enough output above the stats line to push it below the
# fold - the wait is a scroll, not an assert (kernel-picker-tablet records the same shape).
- scrollUntilVisible:
    element:
      text: "mean -?0\\.\\d+, std [01]\\.\\d+"
    direction: DOWN
    timeout: 180000
- assertVisible: "mean -?0\\.\\d+, std [01]\\.\\d+"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-notebook-with-outputs
# The pandas table is the last cell's output, below the first frame's fold. `[4]:` is its prompt -
# the only text in the notebook that names this cell alone, since every value the table prints is
# also a literal in the cell's source above it.
- scrollUntilVisible:
    element:
      text: "\\[4\\]:"
    direction: DOWN
    timeout: 60000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-html-table-output
