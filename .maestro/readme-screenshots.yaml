appId: com.jupydroid.app
---
# The frames the README shows: the shell with a notebook open and its cells run. The cells' results
# are kernel-built (`mean` and `std` are computed from a seeded generator, so neither number is in the
# source), which FakeKernelGateway - an echo of the source - could not produce.
# Seeded by scripts/readme-screenshots-driver.sh for the README's frames and by
# scripts/site-screenshots-driver.sh for the site's light/dark pairs; each crops the system bars
# off what is captured.
#
# TABLET ONLY (SM-X216B): the flow runs cells.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "Jupydroid tour.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Jupydroid tour.ipynb"
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000
- tapOn: "Run all cells"
# Generous: the first run installs the Space and starts jupyter_server, and the tour's cells
# leave enough output above the stats line to push it below the fold - the wait is a scroll,
# not an assert (kernel-picker-tablet records the same shape).
- scrollUntilVisible:
    element:
      text: "mean -?0\\.\\d+, std [01]\\.\\d+"
    direction: DOWN
    timeout: 180000
- assertVisible: "mean -?0\\.\\d+, std [01]\\.\\d+"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-notebook-with-outputs
# The second code cell's `text/html` table is below the first frame's fold.
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-html-table-output
