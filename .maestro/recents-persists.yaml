appId: com.jupydroid.app
---
# A section's collapse outlives the process that set it - in both directions, from
# the shut state it arrives in (`ExplorerSettings.recentsCollapsed`'s default).
#
# The reference writes a view's `collapsed` straight through to storage on every change
# (`viewContainerModel.ts:456-461`) and reads it back into the view's state on the next launch
# (`:90-108`), so this is parity and not a convenience. Nothing on screen can tell a state that was
# stored from one that merely survived in memory, which is why this flow kills the app rather than
# navigating away and back.
#
# ONE PANE (<840dp). Runs no cell: the documents are plain files.
- launchApp
- runFlow: open-base-space.yaml
- extendedWaitUntil:
    visible: "Files"
    timeout: 10000
- tapOn: "file_editor.py"
- extendedWaitUntil:
    visible: ".*the file editor.*"
    timeout: 15000
- tapOn: "Back to files"
- tapOn: "reports"
- tapOn: "data.csv"
- extendedWaitUntil:
    visible: ".*region,amount.*"
    timeout: 15000
- tapOn: "Back to files"
- tapOn: "Workspace"
- extendedWaitUntil:
    visible: "Recent"
    timeout: 5000
# Nobody has touched the heading yet, so it is shut: the heading and nothing under it.
- assertNotVisible: "reports/data.csv"
- assertNotVisible: "Recent actions"
- takeScreenshot: 01-arrives-shut-on-a-fresh-install

- tapOn: "Recent"
- extendedWaitUntil:
    visible: "reports/data.csv"
    timeout: 5000
- takeScreenshot: 02-opened-before-the-app-is-killed

# The process goes. `clearState` is deliberately not used: it would delete the store this flow is
# about along with everything else, and prove nothing.
- stopApp
- launchApp:
    clearState: false
- runFlow: open-base-space.yaml
# Open is what was stored, and the default is shut - so a row here is the store, not the default.
- extendedWaitUntil:
    visible: "reports/data.csv"
    timeout: 15000
- takeScreenshot: 03-still-open-after-a-relaunch

# And the stored state is a setting, not a one-way door: shutting it again survives too.
- tapOn: "Recent"
- extendedWaitUntil:
    notVisible: "reports/data.csv"
    timeout: 5000
- stopApp
- launchApp:
    clearState: false
- runFlow: open-base-space.yaml
- extendedWaitUntil:
    visible: "Files"
    timeout: 15000
# The section is still there - the history outlived the process too - and shut.
- assertVisible: "Recent"
- assertNotVisible: "reports/data.csv"
- assertNotVisible: "Recent actions"
- takeScreenshot: 04-shut-again-and-still-shut-after-a-relaunch
