appId: com.jupydroid.app
---
# The same process, the same act in the file editor. `a.py` is created, opened and typed into,
# then renamed to `b.py` from the strip; a second `a.py` is created and opened beside it, and
# `b.py` keeps its typed line and its dot.
- launchApp:
    stopApp: false
- runFlow:
    file: recreated-path-demo-create-as.yaml
    env:
      NEW_ITEM: "New Python file"
      UNTITLED: "untitled.py"
      STEM: "a"
      NAME: "a.py"
- tapOn: "a.py"
- extendedWaitUntil:
    visible: "Tab: a.py"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
# An empty file has no text to tap by; the editor fills the right pane, so a point in its top
# quarter lands in the field.
- tapOn:
    point: "70%,25%"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "${MAESTRO_TYPED}"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Unsaved changes"
- takeScreenshot: 05-a-py-typed-into-owes-a-write
# A long press on a tab opens its menu (`MainAreaTab.kt`), and Rename… in it opens the dialog.
- longPressOn: "Tab: a.py"
- extendedWaitUntil:
    visible: "Rename…"
    timeout: 5000
- tapOn: "Rename…"
- extendedWaitUntil:
    visible: "Rename file"
    timeout: 5000
- inputText: "b"
- tapOn: "Rename"
- extendedWaitUntil:
    visible: "Tab: b.py"
    timeout: 10000
- assertNotVisible: "Tab: a.py"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 06-renamed-to-b-py-from-the-strip
- runFlow:
    file: recreated-path-demo-create-as.yaml
    env:
      NEW_ITEM: "New Python file"
      UNTITLED: "untitled.py"
      STEM: "a"
      NAME: "a.py"
- tapOn: "a.py"
- extendedWaitUntil:
    visible: "Tab: a.py"
    timeout: 10000
- assertVisible: "Tab: b.py"
- assertNotVisible: ".*${MAESTRO_TYPED}.*"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 07-the-new-a-py-opens-empty-beside-b-py
- tapOn: "Tab: b.py"
- extendedWaitUntil:
    visible: ".*${MAESTRO_TYPED}.*"
    timeout: 10000
- assertVisible: "Tab: a.py"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 08-b-py-keeps-its-typed-line-and-its-dot
