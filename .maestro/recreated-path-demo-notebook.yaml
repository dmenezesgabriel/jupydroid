appId: com.jupydroid.app
---
# Landscape, two panes, autosave off, on a fresh install. Driven by
# scripts/recreated-path-demo-driver.sh. `a.ipynb` is created, opened and typed into, so its
# tab owes a write, then renamed to `b.ipynb` from the strip. A second notebook is created as
# `a.ipynb` and opened: it gets a tab of its own beside `b.ipynb`, which keeps its typed cell and
# its dot. The driver reads the strip and the disk after this.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- runFlow:
    file: recreated-path-demo-create-as.yaml
    env:
      NEW_ITEM: "New notebook"
      UNTITLED: "Untitled.ipynb"
      STEM: "a"
      NAME: "a.ipynb"
- tapOn: "a.ipynb"
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000
# The empty cell's field has no text to tap by, so it is tapped at a point inside it: SM-X216B's
# 1920x1200 puts the field at [805,319][1884,391] (`maestro hierarchy`).
- tapOn:
    point: "1300,354"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "${MAESTRO_TYPED}"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Unsaved changes"
- takeScreenshot: 01-a-ipynb-typed-into-owes-a-write
- longPressOn: "Tab: a.ipynb"
- extendedWaitUntil:
    visible: "Rename file"
    timeout: 5000
- inputText: "b"
- tapOn: "Rename"
- extendedWaitUntil:
    visible: "Tab: b.ipynb"
    timeout: 10000
- assertNotVisible: "Tab: a.ipynb"
- assertVisible: "Unsaved changes"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-renamed-to-b-ipynb-from-the-strip
- runFlow:
    file: recreated-path-demo-create-as.yaml
    env:
      NEW_ITEM: "New notebook"
      UNTITLED: "Untitled.ipynb"
      STEM: "a"
      NAME: "a.ipynb"
- tapOn: "a.ipynb"
- extendedWaitUntil:
    visible: "Tab: a.ipynb"
    timeout: 10000
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000
- assertVisible: "Tab: b.ipynb"
- assertNotVisible: ".*${MAESTRO_TYPED}.*"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 03-the-new-a-ipynb-opens-empty-beside-b-ipynb
- tapOn: "Tab: b.ipynb"
- extendedWaitUntil:
    visible: ".*${MAESTRO_TYPED}.*"
    timeout: 10000
- assertVisible: "Unsaved changes"
- assertVisible: "Tab: a.ipynb"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 04-b-ipynb-keeps-its-typed-cell-and-its-dot
