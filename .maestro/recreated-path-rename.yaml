appId: com.jupydroid.app
---
# Landscape, two panes. Seeded by scripts/recreated-path-two-tabs-driver.sh. `second.py` is opened
# and renamed from its own tab's long press, so its tab keeps the key it opened under while the
# file moves. The driver then writes a new `second.py` and runs the reopen half.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "${MAESTRO_SECOND}"
- extendedWaitUntil:
    visible: "Tab: ${MAESTRO_SECOND}"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-second-open
- longPressOn: "Tab: ${MAESTRO_SECOND}"
- extendedWaitUntil:
    visible: "Rename file"
    timeout: 5000
- inputText: "${MAESTRO_RENAMED_STEM}"
- tapOn: "Rename"
- extendedWaitUntil:
    visible: "Tab: ${MAESTRO_RENAMED_STEM}.py"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-second-renamed-from-its-tab
