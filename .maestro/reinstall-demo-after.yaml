appId: com.jupydroid.app
---
# After `adb uninstall` (data gone) and `adb install`, which restored the backup before this first
# launch: base's documents are listed, the recents still hold the notebook, the theme is the one
# picked before, and the notebook's cell answers from base's kernel, so the rootfs was extracted
# again around the restored home. Then base's terminal installs opencode again - its binary is in the
# rootfs, which no backup carries - and asks its console for the signed-in account's orgs, which only
# the restored home can answer. The terminal canvas is not readable by an assertion
# (cross-cutting.md §8.6), so the seeded scripts write their answers, and nothing of the account, into
# the workspace for the driver.
#
# TABLET ONLY (SM-X216B): the cell runs in base's server, and only arm64 ships one.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 04-spaces-after
- runFlow: open-base-space.yaml
- extendedWaitUntil:
    visible: "survives.ipynb"
    timeout: 10000
- assertVisible: "notes.md"
- assertVisible: "talk.chat"
- assertVisible: "Recent"
- takeScreenshot: 05-documents-and-recent-after
- tapOn: "notes.md"
- extendedWaitUntil:
    visible: ".*Written before the uninstall\\..*"
    timeout: 10000
- takeScreenshot: 06-notes-after
- tapOn: "talk.chat"
- extendedWaitUntil:
    visible: ".*\"body\": \"Written before the uninstall\\.\".*"
    timeout: 10000
- takeScreenshot: 07-chat-after
- tapOn:
    text: "survives.ipynb"
    index: 0
- extendedWaitUntil:
    visible: "Run cell"
    timeout: 60000
- tapOn:
    text: "Run cell"
    index: 0
# A whole-text match: the fake gateway's echo would read `print('kept through an uninstall')`.
- extendedWaitUntil:
    visible:
      text: "kept through an uninstall"
      childOf: {text: "Cell output"}
    timeout: 120000
- takeScreenshot: 08-cell-answers
- tapOn: "New Launcher"
- extendedWaitUntil:
    visible:
      id: "launcher-card-NEW_TERMINAL"
    timeout: 10000
- tapOn:
    id: "launcher-card-NEW_TERMINAL"
- extendedWaitUntil:
    visible: "Tab: Terminal .*"
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    id: "terminal-input"
- inputText: "sh jd046-probe.sh; sh jd058-console-accounts.sh after-restore"
- pressKey: Enter
- hideKeyboard
- takeScreenshot: 09-sign-in-asked
