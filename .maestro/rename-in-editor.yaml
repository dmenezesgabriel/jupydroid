appId: com.jupydroid.app
---
# A notebook's title is editable from the notebook, not only from a long press in Recents.
#
# The title in the app bar is the target, which is where JupyterLab puts it - docmanager:rename
# hangs off "[data-type=\"document-title\"]" (docmanager-extension/schema/plugin.json:73-77) -
# and the pencil beside it is what says the title is a control rather than a label.
#
# Seeded by scripts/rename-in-editor-driver.sh, which also reads the file back off the device
# afterwards: the title lives in metadata.jupydroid.title, and the screen agreeing is only half
# the claim.
- launchApp
# Home's list comes from a disk scan, and a scroll started before it has rendered ends rather
# than retrying - so let the launch settle first.
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "Rename Me Here.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Rename Me Here.ipynb"
- assertVisible: "renamed_here = 1"
- takeScreenshot: 01-editor-before-rename
# The app bar title, which is the rename target - and on a wide window the *only* one of two.
# U7 puts the notebook list beside the editor, so the open notebook's name is on screen twice,
# once as a list row and once in the app bar. Plain `tapOn` took the row, which merely re-opened
# the notebook it was already showing, and the dialog never came.
#
# **`above` the back arrow, where this used to say `rightOf`.** P2q gave the title a row of its own
# over the action row, which is what JupyterLab's single-document mode does
# (`packages/application/src/shell.ts:690-705`), so the name is no longer beside the arrow at all.
# It is above it, and the list pane's rows are not: they start below the bar on every width.
- tapOn:
    text: "Rename Me Here.ipynb"
    above:
      text: "Back to files"
- assertVisible: "Rename notebook"
- takeScreenshot: 02-dialog-from-the-title
# No tap and no erase: the dialog opens focused with only the *stem* selected
# (`dialogs.ts:271-274` sets the value to the whole basename and the selection to
# `0..length - ext.length`), so typing replaces the stem and the suffix survives. Tapping into
# the field is what collapses that selection - with the tap in place, `eraseText` stopped at the
# unselected `.ipynb` and the rename landed as "Renamed From Editor.ipynbynb".
- inputText: "Renamed From Editor"
- tapOn: "Rename"
# The bar updates from the ViewModel's own state, without a reload.
- extendedWaitUntil:
    visible: "Renamed From Editor.ipynb"
    timeout: 10000
- assertNotVisible: "Rename Me Here.ipynb"
- takeScreenshot: 03-title-bar-updated
# No hideKeyboard here, and that is not an oversight. The dialog owns the keyboard and takes it
# with it when it closes, so hideKeyboard has none to hide - and on Android it is a system BACK,
# which popped the editor. The next `tapOn: "Back"` then matched the *system* navigation bar's
# back button, whose contentDescription is also "Back", and left the app for the launcher.
- tapOn: "Back to files"   # the TopAppBar arrow. Not "Back": the system nav bar has that too
                               # and a uiautomator dump carries both (evidence/u-flow-sweep/).
# The browser's crumb, which the editor has none of: assert it before looking for a row, so a flow
# still stuck in the editor fails here rather than against the title in the app bar. (This was
# Home's FAB until X2h; the browser has no FAB, and "Workspace" is the thing only it draws.)
- extendedWaitUntil:
    visible: "Workspace"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
# Renaming writes the file, and a write is what makes a notebook "updated" - so the row is now
# the most recent and sits at the top.
- scrollUntilVisible:
    element:
      text: "Renamed From Editor.ipynb"
    direction: DOWN
    timeout: 20000
- assertNotVisible: "Rename Me Here.ipynb"
- takeScreenshot: 04-recents-agrees
