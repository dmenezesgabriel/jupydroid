appId: com.jupydroid.app
---
# A tap on a `#heading` link in a rendered markdown cell scrolls to the heading's cell. The links
# sit a long cell below the code cell the notebook opens on, and `## Results` a long cell below them
# and inside `# Chapter`'s collapsed section, so the tap has to reveal it as well as scroll; `#results` finds it through the slug rule, and `#Conclusion` - no heading has
# that name - says so on a snackbar. Opened by output-caps-baseline-open.yaml; seeded by
# scripts/rendered-heading-link-driver.sh. Each link is a paragraph of its own, so its text node
# is the link.
#
# TABLET ONLY (SM-X216B): the flow that follows runs a cell.
- scrollUntilVisible:
    element:
      text: "words beside the links"
    direction: DOWN
    timeout: 20000
- assertVisible: "to the results"
- assertVisible: "words beside the links"
- assertNotVisible: "The results section."
- takeScreenshot: 01-heading-links
- tapOn: "to the results"
- extendedWaitUntil:
    visible: "The results section."
    timeout: 10000
- takeScreenshot: 02-results-revealed-and-reached
# Back to the links: the notebook is scrolled, not navigated, so there is no screen to go back from.
- scrollUntilVisible:
    element:
      text: "lowercase results"
    direction: UP
    timeout: 20000
- assertNotVisible: "The results section."
# The cell's own source, which a tap that opened the editor would show.
- assertNotVisible: ".*\\[to the results\\]\\(#Results\\).*"
- tapOn: "lowercase results"
- extendedWaitUntil:
    visible: "The results section."
    timeout: 10000
- takeScreenshot: 03-slug-reached
- scrollUntilVisible:
    element:
      text: "a missing heading"
    direction: UP
    timeout: 20000
- tapOn: "a missing heading"
- extendedWaitUntil:
    visible: "No heading #Conclusion"
    timeout: 10000
- takeScreenshot: 04-missing-heading-said
