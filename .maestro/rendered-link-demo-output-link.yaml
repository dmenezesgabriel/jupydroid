appId: com.jupydroid.app
---
# A code cell below the markdown displays a bare URL through IPython's Markdown and prints `6 * 7`;
# a tap on the URL in the output opens the browser, which the driver reads from the resumed
# activity. Run by scripts/rendered-link-demo-driver.sh after part 2.
#
# `42` is computed by the kernel; FakeKernelGateway would echo the source as one node, which the
# exact "see https://jupyter.org" never matches.
#
# TABLET ONLY (SM-X216B): the flow runs a cell.
- tapOn: "Cell actions"
- tapOn: "Cell menu Insert code below"
- runFlow:
    file: focus-cell.yaml
    env:
      CELL_INDEX: 0
- inputText: "from IPython.display import Markdown, display; display(Markdown(\"see https://jupyter.org\")); print(6*7)"
- hideKeyboard
- tapOn:
    text: "Run cell"
    index: 1
# Generous: the first run starts the kernel.
- extendedWaitUntil:
    visible:
      text: "42"
      childOf: {text: "Cell output"}
    timeout: 300000
- assertVisible:
    text: "see https://jupyter\\.org"
    childOf: {text: "Cell output"}
# The code cell still has focus after Run; `back` is edit mode's exit to command mode, where the
# kernel bar part 4 starts from is.
- back
- extendedWaitUntil:
    visible: "Kernel actions"
    timeout: 5000
- takeScreenshot: 01-the-output-link-and-the-print
# The paragraph is one text node and the URL its tail. Measured from 01's ink inside the node's
# bounds [720,955] on SM-X216B: the URL is 763-953, and 60% is 861, its middle.
- tapOn:
    text: "see https://jupyter\\.org"
    childOf: {text: "Cell output"}
    point: "60%,50%"
# No screenshot after the tap: what is on screen then is the browser.
- waitForAnimationToEnd:
    timeout: 5000
