appId: com.jupydroid.app
---
# Back from the browser, the markdown cell is still rendered: the link's tap did not open its editor.
# Then a `display(Markdown(...))` output's link is tapped, and the driver reads the resumed activity
# again. `42` is computed by the kernel from `6 * 7`; FakeKernelGateway would echo the source instead.
#
# TABLET ONLY (SM-X216B): the flow runs a cell.
#
# Not `stopApp`: the notebook the first part left open is the state under test.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
# Rendered, the cell shows the link's text; opened for editing it would show its source.
- assertVisible: "Jupyter"
- assertNotVisible: ".*\\]\\(https://jupyter.org\\).*"
- takeScreenshot: 01-cell-still-rendered
- tapOn: "Run all cells"
# Generous: the first run starts the kernel.
- extendedWaitUntil:
    visible:
      text: "42"
      childOf: {text: "Cell output"}
    timeout: 300000
- assertVisible:
    text: "IPython"
    childOf: {text: "Cell output"}
- takeScreenshot: 02-output-link
- tapOn:
    text: "IPython"
    childOf: {text: "Cell output"}
# No screenshot after the tap: what is on screen then is the browser, with the owner's tabs and
# account in it. The driver's record of the resumed activity is the evidence.
- waitForAnimationToEnd:
    timeout: 5000
