appId: com.jupydroid.app
---
# Brings the symbol row's `←`/`→` into view, so a flow can drive a caret with them.
#
# **Not a flow.** No driver runs this; it is called with `runFlow` by the flows that place a caret.
#
# The row scrolls, and at 320dp it shows `Tab : ( ) [ ]` and stops - the arrows are off the right
# edge, where `tapOn` cannot reach them. `scrollUntilVisible` does not help: it swipes at the
# centre of the *screen*, which is empty space below the cell, so the row never moves - measured,
# with the before and after captures identical.
#
# A swipe anchored on a key of the row does move it, but the anchor has to be a key near the
# **right** edge: a leftward drag started at the left edge has no room, which is why a swipe from
# `Tab` moved nothing at all, and why a `while` loop anchored on the one key that survives every
# scroll span 950 times without moving it a pixel.
#
# So: three guarded steps, each naming the key that is rightmost at that stage, each skipped once
# the arrows are in view. A swipe's distance is not reliable - two of them reached the arrows on
# one run and stopped a key short on the next - and the guards make that harmless.
#
# **The `notVisible` guard is not an optimisation.** Where the whole row already fits, swiping at
# all is actively harmful: the tablet's keyboard prints `=` and `]` as hints on its `r` and `y`
# keys, so an anchored swipe matched the **keyboard**, and a one-second drag across a keyboard is
# glide typing. It wrote " ya tea" into a cell and the split then cut where nothing on screen
# explained. Read out of the hierarchy dump rather than guessed: two nodes labelled `=`, one at
# y543 in the symbol row and one at y767 on the keyboard.
- runFlow:
    when:
      notVisible: "←"
      visible: "\\]"
    commands:
      - swipe:
          from:
            text: "\\]"
          direction: LEFT
          duration: 1000
- runFlow:
    when:
      notVisible: "←"
      visible: "\""
    commands:
      - swipe:
          from:
            text: "\""
          direction: LEFT
          duration: 1000
- runFlow:
    when:
      notVisible: "←"
      visible: "="
    commands:
      - swipe:
          from:
            text: "="
          direction: LEFT
          duration: 1000
- waitForAnimationToEnd:
    timeout: 3000
