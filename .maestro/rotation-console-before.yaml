appId: com.jupydroid.app
---
# Landscape, two panes. Run by scripts/rotation-console-driver.sh. A Console is opened from the
# Launcher's card and answers one entry, so what the turn has to keep is a live Console with a
# transcript, not only a tab.
#
# Every printed value is built by the kernel from an f-string, so no typed source holds it, and
# FakeKernelGateway would echo the source instead.
#
# TABLET ONLY (SM-X216B): the flow runs Console entries.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "Tab: Launcher"
- tapOn:
    id: "launcher-card-NEW_CONSOLE-python3"
- extendedWaitUntil:
    visible: "Tab: Console 1"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "console-input-field"
    timeout: 10000
- tapOn:
    id: "console-input-field"
- inputText: "print(f'before the turn {6*9}')"
- tapOn: "Run"
# The soft keyboard covers the transcript's newest entry, so it goes before the wait looks for it.
- hideKeyboard
# Generous: the first entry starts the Console's kernel.
- extendedWaitUntil:
    visible:
      text: "before the turn 54"
      childOf: {text: "Cell output"}
    timeout: 300000
- takeScreenshot: 01-a-console-answered-before-the-turn
