appId: com.jupydroid.app
---
# Landscape, two panes. Seeded by scripts/rotation-tab-strip-driver.sh. The strip is given the
# three things it holds beside the back stack: an opening order the stack does not share (`first.py`
# is tapped back on top, so the stack has it last and the strip first), a tab renamed from its own
# long press, and a terminal whose shell reported a title - left beneath the top, where its screen
# does not compose to report it again.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "${MAESTRO_FIRST}"
- extendedWaitUntil:
    visible: "Tab: ${MAESTRO_FIRST}"
    timeout: 10000
- tapOn: "${MAESTRO_SECOND}"
- extendedWaitUntil:
    visible: "Tab: ${MAESTRO_SECOND}"
    timeout: 10000
# Renamed while it is the top tab, as the PRD's demo renames: beneath a terminal the tab keeps the
# name it left even with no rotation at all, which is GAP-172 and not this flow's question.
- longPressOn: "Tab: ${MAESTRO_SECOND}"
- extendedWaitUntil:
    visible: "Rename file"
    timeout: 5000
- inputText: "${MAESTRO_RENAMED_STEM}"
- tapOn: "Rename"
- extendedWaitUntil:
    visible: "Tab: ${MAESTRO_RENAMED_STEM}.py"
    timeout: 10000

- tapOn: "Tab: Launcher"
- tapOn:
    id: "launcher-card-NEW_TERMINAL"
- extendedWaitUntil:
    visible: "Tab: Terminal .*"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 10000
# A tap on the field settles the IME's connection before typing - `space-python.yaml`.
- tapOn:
    id: "terminal-input"
# OSC 0, the title a shell reports - what `term.onTitleChange` hears.
- inputText: "printf '\\033]0;${MAESTRO_TITLE}\\007'"
- pressKey: Enter
- hideKeyboard
- extendedWaitUntil:
    visible: "Tab: ${MAESTRO_TITLE}"
    timeout: 10000

- tapOn: "Tab: ${MAESTRO_FIRST}"
- extendedWaitUntil:
    visible: "first = \"kept open\"\\s*"
    timeout: 10000
- takeScreenshot: 01-first-tapped-back-on-top-renamed-and-titled-beside-it
