appId: com.jupydroid.app
---
# A row's own menu renames and deletes. Home's rows carried the
# same two items and went with Home; the browser's row menu is what every entry has,
# and it is the reference's right-click context menu adapted to a finger.
- launchApp:
    clearState: true
- runFlow: open-base-space.yaml
- assertVisible: "Files"
- tapOn: "New"
- extendedWaitUntil:
    visible: "New notebook"
    timeout: 5000
- tapOn: "New notebook"
- assertVisible: "Untitled.ipynb"
- longPressOn: "Untitled.ipynb"
- assertVisible: "Rename"
- assertVisible: "Delete"
- takeScreenshot: 02-menu
- tapOn: "Rename"
- assertVisible: "Rename file"
# The dialog opens with the caret already in the field and the stem selected, so this state is
# worth a picture: it is the half of RenameNotebookDialog that no assertion here describes.
- takeScreenshot: 02b-rename-dialog
# Typing replaces the selected stem and leaves `.ipynb` alone, which is the whole point of
# opening with `setSelectionRange(0, value.length - ext.length)`: renaming a notebook should not
# require retyping - or remembering - its suffix.
- inputText: "Math notes"
- tapOn: "Rename"
- assertVisible: "Math notes.ipynb"
- takeScreenshot: 03-renamed
# Delete asks first - the same question the browser asks, because it is the same
# destructive act. Both references ask (`DirListing.delete`, Winlator's `ContentDialog.confirm`),
# and this row used to destroy a notebook on one tap with no way back.
- longPressOn: "Math notes.ipynb"
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Are you sure you want to permanently delete: Math notes.ipynb?"
    timeout: 5000
- takeScreenshot: 04-delete-asks-first
# Cancel keeps it, which is the half of a confirmation that is worth having.
- tapOn: "Cancel"
- assertVisible: "Math notes.ipynb"
- longPressOn: "Math notes.ipynb"
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Are you sure you want to permanently delete: Math notes.ipynb?"
    timeout: 5000
# The dialog's button, not its title: the reference titles the dialog with the action name, so
# both say "Delete", and index 1 is the one below the question.
- tapOn:
    text: "Delete"
    index: 1
# Gone from the listing, and nothing left behind it.
- assertNotVisible: "Math notes.ipynb"
- assertVisible: "Workspace"
- takeScreenshot: 05-deleted
