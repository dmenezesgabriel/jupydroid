appId: com.jupydroid.app
---
# A second surface beside the running notebook, twice: a file editor tab, then Settings. Both
# push a new entry on top of the stack rather than removing the notebook's, so its ViewModel was
# never cleared and the run was never detached - the covered-entry case the strip's model
# already guaranteed. Activating the notebook's tab must find the run exactly where it was.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "\\[\\*\\]:"
    timeout: 30000
- takeScreenshot: 01-before-the-other-tab
- tapOn: "file_editor.py"
- extendedWaitUntil:
    visible: "Tab: file_editor.py"
    timeout: 10000
- assertVisible: "Tab: Run Survives.ipynb"
- takeScreenshot: 02-file-editor-tab-open
- tapOn: "Tab: Run Survives.ipynb"
- extendedWaitUntil:
    visible: "\\[\\*\\]:"
    timeout: 30000
- extendedWaitUntil:
    visible: "Stop cell"
    timeout: 30000
- takeScreenshot: 03-back-on-the-notebook
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Close tab: Settings"
    timeout: 10000
- takeScreenshot: 04-settings-open
- tapOn: "Tab: Run Survives.ipynb"
- extendedWaitUntil:
    visible: "\\[\\*\\]:"
    timeout: 30000
- extendedWaitUntil:
    visible: "Stop cell"
    timeout: 30000
- assertVisible:
    text: "(?s).*tick [0-9]+.*"
    childOf:
      text: "Cell output"
- takeScreenshot: 05-back-from-settings-still-running
