appId: com.jupydroid.app
---
# Landscape, two panes, from a cold start. Seeded by scripts/save-on-demand-demo-driver.sh
# with autosave off. A file just opened owes nothing, so the strip's save icon is greyed; a typed
# line puts the dot on the tab and makes the icon live. The driver reads the disk after this - the
# file is still as seeded.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "${MAESTRO_FILE}"
- extendedWaitUntil:
    visible: "notes = \"seeded\"\\s*"
    timeout: 10000
- assertNotVisible: "Unsaved changes"
- assertVisible:
    text: "Save tab: ${MAESTRO_FILE}"
    enabled: false
- takeScreenshot: 00-opened-the-file-owes-nothing-and-the-save-icon-is-grey
- tapOn:
    point: "95%,25%"
- inputText: " # ${MAESTRO_TYPED}"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Unsaved changes"
- assertVisible:
    text: "Save tab: ${MAESTRO_FILE}"
    enabled: true
- takeScreenshot: 01-typed-the-tab-wears-its-dot-and-the-save-icon-is-live
