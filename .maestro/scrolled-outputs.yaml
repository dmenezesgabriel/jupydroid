appId: com.jupydroid.app
---
# A cell whose saved outputs are marked `scrolled` draws them bounded, whether or not this app can
# mark one itself. Seeded by scripts/scrolled-outputs-driver.sh;
# clearState would delete the fixtures.
#
# Two notebooks, same 40-line stream output - one carries `"scrolled": true` in the saved file,
# one does not. `metadata.scrolled` is written only when true and deleted when false
# (`packages/cells/src/widget.ts:1511-1526`); the fixtures are the two states a save can leave a
# cell in.
#
# **What is asserted is nested scroll, not a line count, and that is deliberate.** A bounded
# output's own `verticalScroll` consumes a drag before the notebook's list does - the same
# `overflow-y: auto` behaviour the reference's CSS gives a mouse wheel over the output area
# (`packages/cells/style/widget.css:72-76`) - so a swipe *inside* the output leaves the cell above
# it on screen. An unbounded output has no scroll region of its own, so the identical swipe moves
# the whole cell, source and all, off the top. Reachability of the next cell was tried first and
# rejected: nested scroll means a swipe that starts above a bounded box and drags through it
# scrolls the box's own content first and only then the list behind it, so the *total* distance to
# reach a cell below is close to the same either way - it is what stays on screen during the swipe
# that differs, not how far the swipe has to go.
#
# **Only the positive claim is asserted** - that the code stays visible in the bounded case. The
# mirror claim ("the code is gone" once unbounded) is not: a `LazyColumn` keeps a couple of items
# composed just past the viewport for smooth scrolling, and an item's semantics node can still
# report visible in that window once its pixels are off screen. Two screenshots carry that half
# instead.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "Bounded Output.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Bounded Output.ipynb"
- extendedWaitUntil:
    visible: "(?s).*line 1.*"
    timeout: 30000
- assertVisible: "(?s).*for i in range.*"
- takeScreenshot: 01-bounded-before-scrolling
# A short swipe with both ends inside the output area - well clear of the code cell above it and
# of the screen edges, so the gesture cannot be mistaken for anything else on screen.
- swipe:
    start: 50%, 70%
    end: 50%, 55%
    duration: 300
- waitForAnimationToEnd:
    timeout: 2000
# The code above stayed put: the swipe scrolled the *output's own* region, not the notebook list.
- assertVisible: "(?s).*for i in range.*"
- takeScreenshot: 02-bounded-swipe-scrolls-inside-the-output
- tapOn: "Back to files"
- scrollUntilVisible:
    element:
      text: "Unbounded Output.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Unbounded Output.ipynb"
- extendedWaitUntil:
    visible: "(?s).*line 1.*"
    timeout: 30000
- assertVisible: "(?s).*for i in range.*"
- takeScreenshot: 03-unbounded-before-scrolling
- swipe:
    start: 50%, 70%
    end: 50%, 55%
    duration: 300
- waitForAnimationToEnd:
    timeout: 2000
# No scroll region of its own, so the identical swipe moves the whole cell rather than scrolling
# inside it - the screenshot is the evidence: `line 1` has moved up with the code above it, where
# 02's showed the same lines with the code still anchored at the top.
- takeScreenshot: 04-unbounded-swipe-scrolls-the-whole-cell
