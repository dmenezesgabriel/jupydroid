appId: com.jupydroid.app
---
# P2x-3e: the two glob boxes behind the `…`, and the files each one takes out of the walk.
#
# `.query-details` under the query box (`searchView.ts:504-580`): a `.more` button at the row's
# right (`searchview.css:124-133`), and under it two labelled inputs that are `display: none` until
# it is tapped (`:135-146`). `QueryBuilder.commonQuery` folds both into every query the view builds
# (`queryBuilder.ts:140-160`), which is why the scope stands while the query changes under it.
#
# **Each box is proved by the file it removes**, three files seeded to make that visible:
#
#   * baseline    - `cat` is 6 hits across a nested `.py`, a root `.py` and a `.md`;
#   * include     - `*.py` drops the `.md`, and reaches *any depth*, so the nested file stays;
#   * exclude     - `reports` prunes the folder, and the `.md` comes back because the include is gone.
#
# The `…` names what a tap will do rather than carrying `aria-expanded`, which a browser has and
# Android's tree does not - so "Hide search details" being visible *is* the open state.
#
# **WIDE WINDOW**: the panel is drawn only where there is room for two panes. No cell is run, so
# this needs the width and not the arm64 kernel.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- assertVisible: "Workspace"
- tapOn:
    text: "^Search$"
# --- baseline: everything the workspace holds ---------------------------------------------------
- tapOn: "Search the workspace"
- inputText: "cat"
- extendedWaitUntil:
    visible: "6 results in 3 files"
    timeout: 15000
- hideKeyboard
- takeScreenshot: 01-the-whole-workspace-walked
# --- the boxes are behind the `…`, closed to start with -----------------------------------------
- assertNotVisible: "files to include"
- assertNotVisible: "files to exclude"
- tapOn: "Show search details"
# The details open **focused** - `toggleQueryDetails`' own `moveFocus` - so the IME comes up with
# them, and since P2x-5e put the replace chevron's row above these two boxes the exclude one no
# longer fits in what it leaves. This flow was the thing that said so, one phase late: its committed
# `02` frame already showed the exclude field half clipped, and 48dp finished the job. Putting the
# keyboard away first is what a reader does to read a panel, and it is what `03` and `04` below have
# always done before reading a count.
- hideKeyboard
- assertVisible: "files to include"
- assertVisible: "files to exclude"
- assertVisible: "Hide search details"
- takeScreenshot: 02-the-two-glob-boxes
# --- include: `*.py` drops the markdown, at any depth --------------------------------------------
# Tapped rather than typed into blind: the focus `moveFocus` gave the include box did not survive
# the keyboard being dismissed above.
- tapOn: "files to include"
- inputText: "*.py"
# **The keyboard goes away before the count is read.** With the two glob fields open the panel's
# fixed chrome is about 290dp, and an IME leaves less than that - measured on the tablet, with the
# tree composed, correct and zero pixels tall. The panel scrolls as one surface now
# (`SearchResults`' own doc carries the reading); putting the keyboard away is still what a reader
# does before browsing, exactly as `workspace-search-results` already does.
- hideKeyboard
- extendedWaitUntil:
    visible: "5 results in 2 files"
    timeout: 15000
- takeScreenshot: 03-an-include-drops-the-markdown
# --- exclude: `reports` prunes the folder, and the markdown returns -------------------------------
- tapOn: "files to include"
- eraseText
# Same 48dp as above: with the IME up the exclude box is off the bottom of a panel that is one
# scrolling surface, so it is put away before the box below is reached for.
- hideKeyboard
- tapOn: "files to exclude"
- inputText: "reports"
- hideKeyboard
- extendedWaitUntil:
    visible: "4 results in 2 files"
    timeout: 15000
# **Read with the two glob fields still open**, which is what the one-scrolling-surface change buys:
# before it, everything below the exclude box was composed and unreachable.
- assertVisible: "notes.py, 3 matches found"
- assertVisible: "readme.md, 1 match found"
- assertNotVisible: "reports/analysis.py, 2 matches found"
- takeScreenshot: 04-an-exclude-prunes-the-folder
