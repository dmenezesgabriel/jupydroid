appId: com.jupydroid.app
---
# Landscape, two panes, on a fresh install. Driven by
# scripts/session-follows-rename-demo-driver.sh. `a.ipynb` is created, runs `x = 41` and is
# renamed to `b.ipynb` from the strip. The Running panel's kernel row then reads `b.ipynb`, reveals
# the renamed tab, and a second cell holding only `x + 1` prints `42`.
#
# `42` is in neither source, and a kernel the rename had restarted would answer `NameError`: the
# session that followed the rename is the one that ran the first cell (`SessionHandler.patch`
# keeps the session's kernel, `jupyter_server/services/sessions/handlers.py` in the shipped rootfs).
#
# TABLET ONLY (SM-X216B): the flow runs cells.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- runFlow:
    file: recreated-path-demo-create-as.yaml
    env:
      NEW_ITEM: "New notebook"
      UNTITLED: "Untitled.ipynb"
      STEM: "a"
      NAME: "a.ipynb"
- tapOn: "a.ipynb"
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000
- runFlow:
    file: focus-cell.yaml
    env:
      CELL_INDEX: 0
- inputText: "x = 41"
- hideKeyboard
- tapOn: "Run cell"
# An assignment prints nothing, so the prompt's count is what says the kernel ran it. Generous: the
# first run on a fresh install installs the Space's kernel and starts it.
- extendedWaitUntil:
    visible: "\\[1\\]:"
    timeout: 180000
- takeScreenshot: 01-a-ipynb-ran-x-41

# ---- renamed from its tab: the row takes the new name ----
# A long press on a tab opens its menu (`MainAreaTab.kt`), and Rename… in it opens the dialog.
- longPressOn: "Tab: a.ipynb"
- extendedWaitUntil:
    visible: "Rename…"
    timeout: 5000
- tapOn: "Rename…"
- extendedWaitUntil:
    visible: "Rename file"
    timeout: 5000
- inputText: "b"
- tapOn: "Rename"
- extendedWaitUntil:
    visible: "Tab: b.ipynb"
    timeout: 10000
- assertNotVisible: "Tab: a.ipynb"
- takeScreenshot: 02-renamed-to-b-ipynb-from-the-strip
- tapOn: "Sessions and Tabs"
- extendedWaitUntil:
    visible: "Open kernel session: b.ipynb"
    timeout: 15000
- assertNotVisible: "Open kernel session: a.ipynb"
- takeScreenshot: 03-the-kernel-row-reads-b-ipynb

# ---- the row reveals the renamed tab, and no third one ----
- tapOn: "Open kernel session: b.ipynb"
- extendedWaitUntil:
    visible: "Tab: b.ipynb"
    timeout: 10000
- assertNotVisible: "Tab: a.ipynb"
- takeScreenshot: 04-the-row-reveals-the-b-ipynb-tab

# ---- the same kernel: a second cell holding only `x + 1` ----
- tapOn: "Cell actions"
- extendedWaitUntil:
    visible: "Insert code below"
    timeout: 5000
- tapOn: "Insert code below"
- waitForAnimationToEnd:
    timeout: 3000
# The new cell's field is empty too: beneath a one-line cell with no output it is at
# [805,488][1884,522] (`uiautomator dump`).
- tapOn:
    point: "1300,505"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "x + 1"
- hideKeyboard
- tapOn:
    text: "Run cell"
    index: 1
- extendedWaitUntil:
    visible:
      text: "42"
      childOf: {text: "Cell output"}
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 05-x-plus-1-prints-42-on-the-same-kernel
