appId: com.jupydroid.app
---
# Landscape, two panes. Seeded by scripts/session-follows-rename-running-row-driver.sh with
# `f/a.ipynb`, whose one cell counts its own runs in the kernel: `run_37`, then `run_74`. A second
# run printing `run_74` is the same kernel, so the rename did not cost the session.
#
# `_updatePath` sends `setPath` and `setName` (jupyterlab@7f0e6906
# `packages/docregistry/src/context.ts`): after the notebook is renamed from its tab, the kernel row
# names it as it is now, and after the folder above it is renamed, the row still opens the live
# tab rather than the path the folder left.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "f"
- tapOn: "a.ipynb"
- extendedWaitUntil:
    visible: "Tab: a.ipynb"
    timeout: 30000
- tapOn: "Run cell"
- extendedWaitUntil:
    visible:
      text: "run_37[\\s\\S]*"
      childOf:
        text: "Cell output"
    timeout: 120000
- takeScreenshot: 01-a-ran-once

# ---- renamed from its tab: the row takes the new name ----
- longPressOn: "Tab: a.ipynb"
- extendedWaitUntil:
    visible: "Rename file"
    timeout: 5000
- inputText: "b"
- tapOn: "Rename"
- extendedWaitUntil:
    visible: "Tab: b.ipynb"
    timeout: 10000
- tapOn: "Sessions and Tabs"
- extendedWaitUntil:
    visible: "Open kernel session: b.ipynb"
    timeout: 15000
- assertNotVisible: "Open kernel session: a.ipynb"
- takeScreenshot: 02-row-reads-the-new-name

# ---- the row reveals the renamed tab, on the same kernel ----
- tapOn: "Open kernel session: b.ipynb"
- extendedWaitUntil:
    visible: "Tab: b.ipynb"
    timeout: 10000
- assertNotVisible: "Tab: a.ipynb"
- tapOn: "Run cell"
- extendedWaitUntil:
    visible:
      text: "run_74[\\s\\S]*"
      childOf:
        text: "Cell output"
    timeout: 60000
- takeScreenshot: 03-same-kernel-after-the-rename

# ---- the folder above it renamed: the row still opens the live tab ----
# The Launcher goes on top first: the notebook draws "Workspace" and "f" crumbs of its own, and
# beneath another tab the browser's are the only ones on screen. It also means the row has to
# bring the notebook back, not find it already showing.
- tapOn: "Tab: Launcher"
- tapOn: "Files"
- tapOn: "Workspace"
# Recents is cleared for the reason explorer-rename-open-document.yaml gives: an opened folder is
# listed twice, and only the listing's row carries the menu.
- tapOn: "Recent actions"
- tapOn: "Clear Recent Documents"
- extendedWaitUntil:
    notVisible: "Recent"
    timeout: 5000
- longPressOn: "f"
- extendedWaitUntil:
    visible: "Rename"
    timeout: 5000
- tapOn: "Rename"
- extendedWaitUntil:
    visible: "Rename folder"
    timeout: 5000
- inputText: "g"
- tapOn: "Rename"
- extendedWaitUntil:
    visible: "g"
    timeout: 10000
- takeScreenshot: 04-folder-renamed
- tapOn: "Sessions and Tabs"
- extendedWaitUntil:
    visible: "Open kernel session: b.ipynb"
    timeout: 15000
- tapOn: "Open kernel session: b.ipynb"
# The live document still holds its second run; an editor opened on the path the folder left
# would hold nothing.
- extendedWaitUntil:
    visible:
      text: "run_74[\\s\\S]*"
      childOf:
        text: "Cell output"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 05-row-opens-the-live-tab-after-the-folder-rename
