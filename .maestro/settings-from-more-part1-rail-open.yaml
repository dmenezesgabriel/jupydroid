appId: com.jupydroid.app
---
# At one pane the bottom bar's fifth item is More, the Files bar has no gear, and More opens the
# modal rail with New terminal in it and Settings at its foot (ADR-0109, `MoreRail`). Ends with the
# rail open, so the driver can read where its rows sit; part 2 goes on from there.
# Nothing here runs a cell; the driver pins the tablet to portrait, which is one pane.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- assertVisible: "Workspace"
- assertVisible: "More"
- assertNotVisible: "Settings"
- assertNotVisible: "New terminal"
- takeScreenshot: 01-files-bar-has-more-and-no-gear
- tapOn: "More"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 5000
- assertVisible: "New terminal"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-the-more-rail-open
