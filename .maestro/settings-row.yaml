appId: com.jupydroid.app
---
# The Settings screen's "Shut down kernel on close" row is real and writes
# `kernelShutdown` on - `tracker.json`'s own setting (title "Shut down kernel", description
# "...when closing a notebook", schema/tracker.json:741-746), one label here because this
# screen's rows carry no description line.
#
# Bare `launchApp`: this flow starts the process the three that follow it (`close-shuts-down`,
# `reopen-forgot`, `setting-off-reattaches`) pin, `shutdown-kernel-shut-it-down`'s own shape.
# TABLET ONLY - the row itself needs no kernel, but the gate it feeds does, and there is no point
# in a two-device sweep of one flow's head.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- runFlow: open-settings.yaml
- scrollUntilVisible:
    element:
      text: "Shut down kernel on close"
    direction: DOWN
    timeout: 10000
- takeScreenshot: 01-shutdown-row-off
- tapOn: "Shut down kernel on close"
- takeScreenshot: 02-shutdown-row-on
- tapOn: "Back to files|Close tab: Settings"
- extendedWaitUntil:
    visible: "Kernel Shutdown.ipynb"
    timeout: 10000
