appId: com.jupydroid.app
---
# The app-wide Settings screen is reachable from its gear - the foot of the modal rail behind
# the bottom bar's More at one pane, the activity rail's foot beside two (ADR-0109) - and Back
# returns to it. Nothing below runs a cell, so the emulator - and its FakeKernelGateway - is enough;
# this flow is sharded across both devices.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- assertVisible: "Files"
- assertVisible: "Workspace"
- takeScreenshot: 01-files-with-the-settings-icon

- runFlow: open-settings.yaml
# `MainAreaTabStrip`'s own rule, measured rather than assumed on both shards: its "Back to files"
# arrow below two panes, the tab's `Close tab: Settings` beside one - `console-shares-kernel.yaml`'s
# own precedent for why this is not a single fixed string, since the tablet's current rotation draws
# the Files list beside Settings and closing is the strip's alone there.
- extendedWaitUntil:
    visible: "Back to files|Close tab: Settings"
    timeout: 5000
- assertVisible: "Settings"
- takeScreenshot: 02-settings-screen-open

# The gear returns exactly where it opened from - this flow's own gate, and `NotebookBackStack.kt`'s
# `openSettings` doc comment: it stacks on top rather than replacing, so Back has somewhere to
# return to even with no document open.
- tapOn: "Back to files|Close tab: Settings"
- extendedWaitUntil:
    visible: "Workspace"
    timeout: 5000
- assertVisible: "Files"
- takeScreenshot: 03-back-to-files
