appId: com.jupydroid.app
---
# The driver opens the same file again, the same way, while the first copy is open. Its name is taken, so
# the second copy opens under the next free one and the first is left as the run saved it - which
# the driver reads off the workspace. Run by scripts/shared-notebook-driver.sh.
#
# TABLET ONLY (SM-X216B): the notebook before it ran a cell.
- extendedWaitUntil:
    visible: "Shared analysis1\\.ipynb"
    timeout: 30000
- extendedWaitUntil:
    visible: "A shared analysis"
    timeout: 30000
- takeScreenshot: 01-second-copy
