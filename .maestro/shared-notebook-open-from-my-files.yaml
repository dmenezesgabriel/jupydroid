appId: com.sec.android.app.myfiles
---
# Opens `Shared analysis.ipynb` the way a person does: from Samsung's My Files, the tablet's own
# file manager, through Android's "Open with" chooser. So the VIEW intent, its `content://` URI and
# its read grant are the ones My Files makes, not ones a driver wrote. The flows that follow check
# what opened. Run by scripts/shared-notebook-driver.sh --from-my-files.
#
# The file is reached through Search, not by browsing Downloads: the folder's listing is the
# device owner's own files, and the chooser is drawn over whatever list is behind it. Search for
# the fixture's name lists the fixture alone, so the chooser frame shows nothing else.
#
# "Just once", never "Always": Always makes Jupydroid the default for this type, and the next
# open would then skip the chooser this flow waits for.
#
# Every tap names its id as well as its text, because the same names are on screen elsewhere.
# Jupydroid's own rail has a Search, and on the second open it is still drawn when the tap is
# aimed: the tap lands on My Files' rail and opens Downloads instead. The tablet's taskbar has a
# Jupydroid icon, and a tap there launches the app from the launcher, leaving the chooser alive
# in its own task - to come back in front of My Files at the next open.
#
# TABLET ONLY (SM-X216B): My Files is Samsung's, and the flows after this one run a cell.
- launchApp
- tapOn:
    id: "com.sec.android.app.myfiles:id/menu_search"
- inputText: "Shared analysis"
- tapOn:
    text: "Shared analysis\\.ipynb"
    id: "com.sec.android.app.myfiles:id/main_text"
- extendedWaitUntil:
    visible: "Open with"
    timeout: 10000
- takeScreenshot: 00-open-with-from-my-files
- tapOn:
    text: "Jupydroid"
    id: "android:id/text1"
- tapOn: "Just once"
