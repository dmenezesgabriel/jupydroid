appId: com.jupydroid.app
---
# The single gate for "tap Run on a code cell and the kernel answers". `step4b-run-cell` used to sit
# beside it and is now deleted: its cell was `answer = 42`, an assignment that produces no output at
# all, and it waited on the bare `Cell output` container - which FakeKernelGateway's echo always
# satisfied and a real kernel never did. This asserts computed values instead, which no echo can
# fabricate.
- launchApp
- runFlow: open-base-space.yaml
# Home's list is populated by a disk scan, and a scroll started before it has rendered ends
# rather than retrying - so let the launch settle first.
- waitForAnimationToEnd:
    timeout: 5000
# Scrolled to rather than asserted on: Home is sorted by recency, so a seeded notebook
# sinks below the fold as soon as anything else is saved.
- scrollUntilVisible:
    element:
      text: "Real Kernel.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Real Kernel.ipynb"
- assertVisible: "print(6 * 7)"
- takeScreenshot: 01-before-running
- tapOn:
    text: "Run cell"
    index: 0
# Generous: the first run installs the Space if needed and starts jupyter_server.
# 42 is the kernel's answer, not ours - the fake could not have produced it.
- extendedWaitUntil:
    visible: "42"
    timeout: 120000
# The kernel runs at --log-level=DEBUG and logs `*** MESSAGE TYPE:<type>***` for every shell
# message it dispatches (ipykernel/kernelbase.py:455). That has to land in the server's log file
# and nowhere else: ipykernel forwards a kernel's stderr to iopub, which renders as cell output,
# so a logger left bound to it would print the app's own diagnostics into the user's notebook.
# What keeps it out is ipykernel re-pointing such a handler at the raw file descriptor
# (kernelapp.py:546-554) - upstream behaviour, so this asserts it rather than assuming it.
- assertNotVisible: ".*MESSAGE TYPE.*"
- takeScreenshot: 02-real-kernel-printed-42
# numpy, in the app process, through the whole chain. index 1 is the second cell's Run
# button - index 0 would re-run the first, which is what it did on the first attempt.
- tapOn:
    text: "Run cell"
    index: 1
- extendedWaitUntil:
    visible: ".*10.000000000000002.*"
    timeout: 60000
- takeScreenshot: 03-real-kernel-numpy
