appId: com.jupydroid.app
---
- launchApp:
    clearState: true
- assertVisible: "No recent notebooks yet"
- tapOn: "\\+"
- tapOn: "New notebook"
- assertVisible: "Untitled"
- longPressOn: "Untitled"
- assertVisible: "Rename"
- assertVisible: "Delete"
- takeScreenshot: 02-menu
- tapOn: "Rename"
- assertVisible: "Rename notebook"
# The dialog opens with the caret already in the field and the stem selected, so this state is
# worth a picture: it is the half of RenameNotebookDialog that no assertion here describes.
- takeScreenshot: 02b-rename-dialog
- tapOn:
    id: "rename-field"
- eraseText
- inputText: "Math notes"
- tapOn: "Rename"
- assertVisible: "Math notes"
- takeScreenshot: 03-renamed
- longPressOn: "Math notes"
- tapOn: "Delete"
- assertVisible: "No recent notebooks yet"
- takeScreenshot: 04-deleted
