appId: com.jupydroid.app
---
- launchApp:
    clearState: true
- assertVisible: "No recent notebooks yet"
- tapOn: "\\+"
- tapOn: "New notebook"
- assertVisible: "Untitled.ipynb"
- stopApp
- launchApp:
    clearState: false
- assertVisible: "Untitled.ipynb"
- takeScreenshot: 01-persisted-after-restart
