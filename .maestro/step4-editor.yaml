appId: com.jupydroid.app
---
# Seeded by scripts/step4-editor-driver.sh; clearState would delete the fixture.
- launchApp
# Home's list is populated by a disk scan, and a scroll started before it has rendered ends
# rather than retrying - so let the launch settle first.
- waitForAnimationToEnd:
    timeout: 5000
# Scrolled to rather than asserted on: Home is sorted by `updatedAt` descending and the fixture
# is seeded at 2026-08-04, so it sinks below the fold as the device accumulates notebooks. This
# flow was missed by the sweep in e962d7d that gave every other seeded flow the same two steps.
- scrollUntilVisible:
    element:
      text: "Two Cells.ipynb"
    direction: DOWN
    timeout: 20000
- takeScreenshot: 01-home-with-seeded-notebook
- tapOn: "Two Cells.ipynb"
# `[ ]:` rather than the word "code": U4 replaced a code cell's kind label with Jupyter's own
# bracket, where `[ ]:` is "never run" and the trailing colon is the reference's
# (`packages/cells/src/inputarea.ts:283-290`).
#
# **And the markdown cell below it carries no prompt at all**, which is the reference's own
# arrangement rather than an omission: `_setPrompt` has a single caller, `CodeCell._updatePrompt`
# (`packages/cells/src/widget.ts:1693-1700`). Asserted `below` the code cell's source so it is
# that cell being spoken about and not the document as a whole - the code cell above keeps its own.
- assertVisible: "\\[ \\]:"
- assertVisible: "answer = 42"
- assertNotVisible:
    text: "\\[ \\]:"
    below:
      text: "answer = 42"
- assertVisible: "Markdown cell here"
- takeScreenshot: 02-editor-cells
- tapOn: "Back to files"   # the TopAppBar arrow. Not "Back": the system nav bar has that too
                               # and a uiautomator dump carries both (evidence/u-flow-sweep/).
# Home comes back scrolled to the top, so the row needs finding again for the same reason.
- scrollUntilVisible:
    element:
      text: "Two Cells.ipynb"
    direction: DOWN
    timeout: 20000
- takeScreenshot: 03-back-to-home
