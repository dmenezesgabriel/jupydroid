appId: com.jupydroid.app
---
# Seeded by scripts/step4b-run-all-driver.sh; clearState would delete the fixture.
- launchApp
- runFlow: open-base-space.yaml
# Home's list is populated by a disk scan, and a scroll started before it has rendered ends
# rather than retrying - so let the launch settle first.
- waitForAnimationToEnd:
    timeout: 5000
# Scrolled to rather than asserted on: Home is sorted by recency, so a seeded notebook
# sinks below the fold as soon as anything else is saved.
- scrollUntilVisible:
    element:
      text: "Run All.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Run All.ipynb"
- assertVisible: ".*'fi' \\+ 'rst'.*"
- takeScreenshot: 01-before-run-all
- tapOn: "Run all cells"
# The cells print `'fi' + 'rst'` and `'sec' + 'ond'`, so the words only ever exist in the
# *output*. They used to be printed as literals, which meant these waits were satisfied by the
# cells' own source - on screen the whole time - and this flow never checked Run All's results.
#
# Scoping with `childOf: Cell output` would be the other way, and is what step7-html-output
# does. It is no good here: two code cells are on screen, so there are two `Cell output` nodes
# and Maestro resolves the scope against the first of them.
- extendedWaitUntil:
    visible: "first"
    timeout: 120000
# Scrolled to, not just waited on: the third cell's output starts below the fold.
- scrollUntilVisible:
    element:
      text: "second"
    direction: DOWN
    timeout: 60000
- takeScreenshot: 02-run-all-ran-both-code-cells
# The fourth cell sleeps for two minutes, so Run All is still going: Stop is the only way
# out, and it must end the run rather than leave a spinner.
- assertVisible: "Stop cell"
- takeScreenshot: 03-still-running-with-stop
- tapOn: "Stop cell"
- extendedWaitUntil:
    visible: ".*KeyboardInterrupt.*"
    timeout: 60000
- takeScreenshot: 04-stopped-with-keyboardinterrupt
