appId: com.jupydroid.app
---
# Seeded by scripts/step4b-run-cell-driver.sh; clearState would delete the fixture.
- launchApp
# assertVisible waits; tapOn alone can race a cold start still reading the notebook list.
- assertVisible: "Two Cells"
- tapOn: "Two Cells"
- assertVisible: "answer = 42"
- takeScreenshot: 01-cell-before-running
# Compose contentDescription surfaces as accessibility text, which Maestro matches by
# text rather than by id.
- tapOn: "Run cell"
- extendedWaitUntil:
    visible: "Cell output"
    timeout: 20000
- takeScreenshot: 02-cell-output
