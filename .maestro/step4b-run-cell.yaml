appId: com.jupydroid.app
---
# Seeded by scripts/step4b-run-cell-driver.sh; clearState would delete the fixture.
- launchApp
# Home's list is populated by a disk scan, and a scroll started before it has rendered ends
# rather than retrying - so let the launch settle first.
- waitForAnimationToEnd:
    timeout: 5000
# assertVisible waits; tapOn alone can race a cold start still reading the notebook list.
# Scrolled to rather than asserted on: Home is sorted by recency, so a seeded notebook
# sinks below the fold as soon as anything else is saved.
- scrollUntilVisible:
    element:
      text: "Two Cells"
    direction: DOWN
    timeout: 20000
- tapOn: "Two Cells"
- assertVisible: "answer = 42"
- takeScreenshot: 01-cell-before-running
# Compose contentDescription surfaces as accessibility text, which Maestro matches by
# text rather than by id.
- tapOn: "Run cell"
- extendedWaitUntil:
    visible: "Cell output"
    timeout: 20000
- takeScreenshot: 02-cell-output
