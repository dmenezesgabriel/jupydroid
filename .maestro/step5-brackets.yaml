appId: com.jupydroid.app
---
# Seeded by scripts/step5-brackets-driver.sh; clearState would delete the fixture.
#
# The match is a colour, so the screenshots are the evidence. They are taken in an order that
# rules out the two ways this could be faked: 01 is the same text with nothing lit, and 03 is a
# different pair lit after the cursor moved, so the highlight is neither always-on nor baked in
# when the cell loaded.
- launchApp
- runFlow: open-base-space.yaml
# Home's list is populated by a disk scan, and a scroll started before it has rendered ends
# rather than retrying - so let the launch settle first.
- waitForAnimationToEnd:
    timeout: 5000
# Scrolled to rather than asserted on: Home is sorted by recency, so a seeded notebook
# sinks below the fold as soon as anything else is saved.
- scrollUntilVisible:
    element:
      text: "Bracket Match.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Bracket Match.ipynb"
- extendedWaitUntil:
    visible: "total = sum\\(\\[1, 2, 3\\]\\)"
    timeout: 30000
# Nothing focused yet: the cursor sits at the end of the text but must not light anything up.
- takeScreenshot: 01-unfocused-nothing-lit
# Tapping the node puts the caret past the end of this one short line only while the field is
# wider than the text - which is why this flow needs a >= 600dp window and its driver says so. At
# 320dp the centre lands inside `sum([1, 2, 3])`, the `[` goes in front of the `1`, and
# `opensAPair` correctly declines to wedge a partner into existing text. Recorded for months as an
# "emulator IME artefact": it is neither the emulator nor the IME, and not an app defect at all -
# the app did the right thing with the caret it was given. Maestro has no End key, this version
# has no `relativePoint`, and neither scrolling nor swiping reaches the symbol row's arrow at that
# width, so the caret cannot be placed from a flow.
- tapOn: "total = sum\\(\\[1, 2, 3\\]\\)"
- takeScreenshot: 02-outer-pair-lit
# A new pair, opened by typing one character (5.3 closes it), and the cursor moves inside it.
- inputText: "["
- assertVisible: "total = sum\\(\\[1, 2, 3\\]\\)\\[\\]"
- takeScreenshot: 03-match-follows-the-cursor
