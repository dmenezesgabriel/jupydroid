appId: com.jupydroid.app
---
# Seeded by scripts/step5-height-driver.sh; clearState would delete the fixture.
- launchApp
- runFlow: open-base-space.yaml
# Home's list is populated by a disk scan, and a scroll started before it has rendered ends
# rather than retrying - so let the launch settle first.
- waitForAnimationToEnd:
    timeout: 5000
# Scrolled to rather than asserted on: Home is sorted by recency, so a seeded notebook
# sinks below the fold as soon as anything else is saved.
- scrollUntilVisible:
    element:
      text: "Tall Cell.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Tall Cell.ipynb"
# The last line of a 16-line cell is only reachable if the cell grew to fit it. With a fixed
# height it would be hidden behind the page's own scroller.
- extendedWaitUntil:
    visible: "short = 1"
    timeout: 30000
- takeScreenshot: 01-short-cell-is-short
- extendedWaitUntil:
    visible: ".*last_line.*"
    timeout: 30000
- takeScreenshot: 02-tall-cell-grew-to-fit
