appId: com.jupydroid.app
---
# Seeded by scripts/step5-theme-driver.sh; clearState would delete the fixture.
# Mod-Enter is not driven here: Maestro has no modifier chord, so the driver script sends it
# with `adb shell input keycombination` once this flow has focused the cell.
- launchApp
# Home's list is populated by a disk scan, and a scroll started before it has rendered ends
# rather than retrying - so let the launch settle first.
- waitForAnimationToEnd:
    timeout: 5000
# Scrolled to rather than asserted on: Home is sorted by recency, so a seeded notebook
# sinks below the fold as soon as anything else is saved.
- scrollUntilVisible:
    element:
      text: "Themed Cell.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Themed Cell.ipynb"
- extendedWaitUntil:
    visible: ".*def greet.*"
    timeout: 30000
# Colour is judged from the screenshot by a human; what is asserted is that the tokens
# rendered at all and the page took its styling from Compose.
- takeScreenshot: 01-themed-tokens
- tapOn: '.*print\(greet.*'
