appId: com.jupydroid.app
---
# Seeded by scripts/step7-outputs-driver.sh; clearState would delete the fixture.
- launchApp
# Home's list is populated by a disk scan, and a scroll started before it has rendered ends
# rather than retrying - so let the launch settle first.
- waitForAnimationToEnd:
    timeout: 5000
# Scrolled to rather than asserted on: Home is sorted by recency, so a seeded notebook
# sinks below the fold as soon as anything else is saved.
- scrollUntilVisible:
    element:
      text: "Real Kernel"
    direction: DOWN
    timeout: 20000
- tapOn: "Real Kernel"
- tapOn:
    text: "Run cell"
    index: 0
- extendedWaitUntil:
    visible: "42"
    timeout: 120000
- takeScreenshot: 01-output-produced
# The whole point: kill the app, come back, and the result is still there without re-running.
- stopApp
- launchApp
# The relaunch needs the same settle and scroll as the first launch, and used to have neither -
# so it failed here with the row present all along (evidence/relaunch-settles/). Saving does not
# move a notebook up Recents: `saveNotebook` writes what it is given and only `createNotebook`
# stamps `updatedAt`, so running a cell leaves this fixture at its seeded 2026-08-04 timestamp,
# well below the fold on a device with notebooks newer than that.
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "Real Kernel"
    direction: DOWN
    timeout: 20000
- tapOn: "Real Kernel"
- extendedWaitUntil:
    visible: "42"
    timeout: 20000
- assertVisible: "[1]"
- takeScreenshot: 02-output-survived-restart
