appId: com.jupydroid.app
---
# Seeded by scripts/step7-outputs-driver.sh; clearState would delete the fixture.
- launchApp
- runFlow: open-base-space.yaml
# Home's list is populated by a disk scan, and a scroll started before it has rendered ends
# rather than retrying - so let the launch settle first.
- waitForAnimationToEnd:
    timeout: 5000
# Scrolled to rather than asserted on: Home is sorted by recency, so a seeded notebook
# sinks below the fold as soon as anything else is saved.
- scrollUntilVisible:
    element:
      text: "Real Kernel.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Real Kernel.ipynb"
- tapOn:
    text: "Run cell"
    index: 0
- extendedWaitUntil:
    visible: "42"
    timeout: 120000
- takeScreenshot: 01-output-produced
# The whole point: kill the app, come back, and the result is still there without re-running.
- stopApp
- launchApp
- runFlow: open-base-space.yaml
# The relaunch needs the same settle and scroll as the first launch, and used to have neither -
# so it failed here with the row present all along (evidence/relaunch-settles/). Running a cell
# does now move the notebook up Recents, since `updatedAt` is the file's mtime (audit A6), but
# the scroll stays: it costs nothing when the row is already in view, and where the row sits is
# not something this flow should have to know.
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "Real Kernel.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Real Kernel.ipynb"
- extendedWaitUntil:
    visible: "42"
    timeout: 20000
# **Escaped, and that is a fix rather than a rename.** Maestro matches a node's whole text as a
# regex, so the unescaped `[1]` was a character class matching a node reading exactly `1` - a line
# number in the gutter, not the prompt. It has been asserting the wrong node since it was written.
- assertVisible: "\\[1\\]:"
- takeScreenshot: 02-output-survived-restart
