appId: com.jupydroid.app
---
# U5d: the characters a touch keyboard hides, one tap above it.
#
# Runs no cell, so any device will do. What it drives is the sequence a Python line actually
# needs and a soft keyboard makes expensive: `(`, `)`, `:` - each two taps away behind a symbols
# page, and each auto-closing exactly as it would from the keyboard.
#
# The saved file is the assertion. What is on screen is a text field, and a field shows whatever
# it was given; only the .ipynb shows the characters reached the notebook.
#
# Seeded by scripts/symbol-row-driver.sh; clearState would delete the fixture.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "Symbol Row.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Symbol Row.ipynb"
- extendedWaitUntil:
    visible: ".*def area.*"
    timeout: 30000
- takeScreenshot: 01-command-mode-kernel-bar
# Putting the caret in the cell swaps the kernel bar for the symbol row.
- tapOn: ".*def area.*"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Tab"
# And the kernel bar is gone: one bar at a time, chosen by the mode.
- assertNotVisible: "Restart kernel"
- takeScreenshot: 02-edit-mode-symbol-row
# `(` auto-closes to `()` and leaves the caret between them, so `)` types over the partner
# rather than doubling it - the same rules the keyboard gets, applied by hand because a
# programmatic edit does not run the field's InputTransformation.
- tapOn: "\\("
- tapOn: "\\)"
- tapOn: ":"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 03-typed-from-the-row
