appId: com.jupydroid.app
---
# Landscape, two panes, on a fresh install. Seeded by scripts/tab-close-siblings-demo-driver.sh
# with autosave off and `a.py`, `b.py`, `c.ipynb`, so an edit to b.py stays unsaved until something
# writes it. a.py, a terminal, b.py (edited) and c.ipynb open in that order; the terminal comes
# from the rail's New Launcher, because a document already fills the main area.
#
# "Close Tabs to Right" and "Close All Other Tabs" on a tab's long-press menu -
# `application:close-right-tabs` and `application:close-other-tabs`, bound to every main-area tab
# (jupyterlab@7f0e690 `packages/application-extension/schema/commands.json` `context`). The
# terminal's Close Tabs to Right closes c.ipynb while dirty b.py asks and Cancel keeps it; a.py's
# Close All Other Tabs asks again, and Discard leaves a.py alone. After a kill, b.py opens with its
# seed and without the discarded line; the driver reads the same from the disk.
#
# Whether a menu row is greyed is not readable by Maestro (a Material item reports enabled either
# way): the lone tab's greyed rows are the screenshot's and TabCloseSiblingsTest's to see.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml

# ---- a.py, a terminal, b.py with an unsaved edit, c.ipynb, in that order ----
- tapOn: "a.py"
- extendedWaitUntil:
    visible: "Tab: a.py"
    timeout: 10000
- tapOn: "New Launcher"
- extendedWaitUntil:
    visible:
      id: "launcher-card-NEW_TERMINAL"
    timeout: 10000
- tapOn:
    id: "launcher-card-NEW_TERMINAL"
- extendedWaitUntil:
    visible: "Tab: Terminal 1"
    timeout: 30000
- hideKeyboard
- tapOn: "b.py"
- extendedWaitUntil:
    visible: "other = \"other_seeded\"\\s*"
    timeout: 10000
- tapOn:
    point: "95%,25%"
- inputText: " # typed"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    text: "Save tab: b.py"
    enabled: true
- tapOn: "c.ipynb"
- extendedWaitUntil:
    visible: "Tab: c.ipynb"
    timeout: 30000
- takeScreenshot: 01-four-tabs-open

# ---- the terminal's menu holds the two close rows and no document row ----
- longPressOn: "Tab: Terminal 1"
- extendedWaitUntil:
    visible: "Close Tabs to Right"
    timeout: 5000
- assertVisible: "Close All Other Tabs"
- assertNotVisible: "Rename…"
- takeScreenshot: 02-the-terminal-tab-menu

# ---- to the right: dirty b.py asks, Cancel keeps it, c.ipynb closes ----
- tapOn: "Close Tabs to Right"
- extendedWaitUntil:
    visible: "Save your work"
    timeout: 5000
- takeScreenshot: 03-dirty-b-py-asks
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Tab: c.ipynb"
    timeout: 5000
- assertVisible: "Tab: a.py"
- assertVisible: "Tab: Terminal 1"
- assertVisible: "Tab: b.py"
- takeScreenshot: 04-cancel-kept-b-py-and-c-ipynb-closed

# ---- a document's menu: the close rows first, its own rows beneath ----
- longPressOn: "Tab: a.py"
- extendedWaitUntil:
    visible: "Close All Other Tabs"
    timeout: 5000
- assertVisible: "Close Tabs to Right"
- assertVisible: "Rename…"
- assertVisible: "Save As…"
- assertVisible: "Revert to Checkpoint…"
- assertVisible: "Duplicate"
- assertVisible: "Delete…"
- takeScreenshot: 05-a-document-tab-menu

# ---- all others: b.py asks again, Discard leaves a.py alone ----
- tapOn: "Close All Other Tabs"
- extendedWaitUntil:
    visible: "Save your work"
    timeout: 5000
- tapOn: "Discard"
- extendedWaitUntil:
    notVisible: "Tab: b.py"
    timeout: 5000
- assertNotVisible: "Tab: Terminal 1"
- assertVisible: "Tab: a.py"
- takeScreenshot: 06-discard-left-a-py-alone

# ---- a lone tab: both rows greyed ----
- longPressOn: "Tab: a.py"
- extendedWaitUntil:
    visible: "Close All Other Tabs"
    timeout: 5000
- takeScreenshot: 07-a-lone-tab-greys-both-rows
- pressKey: back

# ---- after a kill, b.py opens with its last save ----
# launchApp stops the process, and the open tabs live in the process's AppContainer (ADR-0092), so
# what b.py opens with is read from the disk.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "b.py"
- extendedWaitUntil:
    visible: "other = \"other_seeded\"\\s*"
    timeout: 10000
- assertNotVisible: ".*# typed.*"
- takeScreenshot: 08-after-a-kill-b-py-holds-its-save
