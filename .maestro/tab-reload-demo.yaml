appId: com.jupydroid.app
---
# Landscape, two panes, on a fresh install. Driven by scripts/tab-reload-demo-driver.sh,
# which seeds nothing but autosave off: with it on, the 500 ms debounce writes a typed edit before
# the reload icon can be tapped, and a dirty document is the case the question exists for.
#
# `docmanager:reload` re-reads an open document from its file, and asks first when the document has
# unsaved work (jupyterlab@7f0e690 `packages/docmanager-extension/src/index.tsx`). `a.ipynb` and
# `b.ipynb` are made from the explorer's New menu; `notes.txt` by the Space's shell, since the menu
# makes no text file. A cell in `a.ipynb` rewrites `notes.txt`, then `b.ipynb`, and each open tab
# shows what it opened until its reload icon is tapped.
#
# TABLET ONLY (SM-X216B): the cells and the shell need a real Space.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- runFlow:
    file: recreated-path-demo-create-as.yaml
    env:
      NEW_ITEM: "New notebook"
      UNTITLED: "Untitled.ipynb"
      STEM: "a"
      NAME: "a.ipynb"

# ---- notes.txt holding `before`, written by the shell ----
- tapOn: "New Launcher"
- extendedWaitUntil:
    visible:
      id: "launcher-card-NEW_TERMINAL"
    timeout: 10000
- tapOn:
    id: "launcher-card-NEW_TERMINAL"
- extendedWaitUntil:
    visible: "Tab: Terminal .*"
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    id: "terminal-input"
- inputText: "printf before > notes.txt"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      notVisible: "New"
    commands:
      - tapOn: "Files"
# The explorer re-lists on a 10 s poll (`EXPLORER_REFRESH_INTERVAL`); the shell's file is not one it
# was told about.
- extendedWaitUntil:
    visible: "notes.txt"
    timeout: 30000
- tapOn: "notes.txt"
- extendedWaitUntil:
    visible: "before\\s*"
    timeout: 10000
- tapOn: "a.ipynb"
- extendedWaitUntil:
    visible: "\\[ \\]:"
    timeout: 30000
- takeScreenshot: 01-notes-txt-reads-before-and-a-is-open

# ---- a cell rewrites notes.txt; its tab is stale until the tap ----
- runFlow: focus-first-cell.yaml
- inputText: "open('notes.txt', 'w').write('after')"
- hideKeyboard
- tapOn: "Run cell"
# `write` returns the count it wrote, which the source does not hold. Generous: the first run on a
# fresh install starts the Space's kernel.
- extendedWaitUntil:
    visible:
      text: "5"
      childOf: {text: "Cell output"}
    timeout: 180000
# Out of edit mode: a cell left in it brings the keyboard back when a dialog closes.
- back
- takeScreenshot: 02-a-cell-rewrote-notes-txt
- tapOn: "Tab: notes.txt"
- extendedWaitUntil:
    visible: "before\\s*"
    timeout: 10000
- takeScreenshot: 03-notes-txt-still-reads-before
- tapOn: "Reload tab: notes.txt"
# matches-source: a whole-text match on the file editor's field, and a.ipynb is not composed while
# notes.txt is the top tab - the cell's source line holds far more than `after`
- extendedWaitUntil:
    visible: "after\\s*"
    timeout: 10000
- assertNotVisible: "Reload File from Disk"
- assertVisible:
    text: "Save tab: notes.txt"
    enabled: false
- takeScreenshot: 04-reloaded-notes-txt-reads-after-with-no-dot

# ---- dirty: asked first; Cancel keeps the edit, Reload drops it ----
- tapOn:
    point: "95%,25%"
- inputText: " typed_here"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    text: "Save tab: notes.txt"
    enabled: true
- tapOn: "Reload tab: notes.txt"
- extendedWaitUntil:
    visible: "Reload File from Disk"
    timeout: 5000
- assertVisible: "Are you sure you want to reload the File from the disk?"
- takeScreenshot: 05-unsaved-work-is-asked-about
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Reload File from Disk"
    timeout: 5000
- assertVisible: ".*typed_here.*"
- assertVisible:
    text: "Save tab: notes.txt"
    enabled: true
- takeScreenshot: 06-cancel-keeps-the-edit-and-its-dot
- tapOn: "Reload tab: notes.txt"
- extendedWaitUntil:
    visible: "Reload File from Disk"
    timeout: 5000
- tapOn: "Reload"
# matches-source: the same whole-text match on the file editor's field as above
- extendedWaitUntil:
    visible: "after\\s*"
    timeout: 10000
- assertNotVisible: ".*typed_here.*"
- assertVisible:
    text: "Save tab: notes.txt"
    enabled: false
- takeScreenshot: 07-reload-drops-the-edit-for-after

# ---- a notebook: b.ipynb rewritten with one new cell ----
- runFlow:
    file: recreated-path-demo-create-as.yaml
    env:
      NEW_ITEM: "New notebook"
      UNTITLED: "Untitled.ipynb"
      STEM: "b"
      NAME: "b.ipynb"
- tapOn: "b.ipynb"
- extendedWaitUntil:
    visible: "Tab: b.ipynb"
    timeout: 30000
- tapOn: "Tab: a.ipynb"
- extendedWaitUntil:
    visible: "Cell actions"
    timeout: 10000
- tapOn: "Cell actions"
- extendedWaitUntil:
    visible: "Insert code below"
    timeout: 5000
- tapOn: "Insert code below"
- waitForAnimationToEnd:
    timeout: 3000
# Beneath a one-line cell whose output is one line, the new field is at [805,525][1884,597]
# (`uiautomator dump`).
- tapOn:
    point: "1300,561"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "import json; nb = json.load(open('b.ipynb')); nb['cells'].append(dict(id='added', cell_type='code', metadata={}, outputs=[], execution_count=None, source='reloaded_' + str(6 * 7))); json.dump(nb, open('b.ipynb', 'w')); print('wrote_' + str(6 * 7))"
- hideKeyboard
- tapOn:
    text: "Run cell"
    index: 1
# `childOf` resolves its parent to one element, the first: without the index it is the first cell's
# output, `5`, and `wrote_42` beneath the second is never looked at.
- extendedWaitUntil:
    visible:
      text: "wrote_42[\\s\\S]*"
      childOf: {text: "Cell output", index: 1}
    timeout: 60000
- back
- takeScreenshot: 08-a-cell-rewrote-b-ipynb
- tapOn: "Tab: b.ipynb"
- extendedWaitUntil:
    visible: "Reload tab: b.ipynb"
    timeout: 10000
- assertNotVisible: "reloaded_42"
- takeScreenshot: 09-b-ipynb-still-shows-what-it-opened
- tapOn: "Reload tab: b.ipynb"
- extendedWaitUntil:
    visible: "reloaded_42"
    timeout: 10000
- assertVisible:
    text: "Save tab: b.ipynb"
    enabled: false
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 10-reloaded-b-ipynb-shows-the-new-cell
