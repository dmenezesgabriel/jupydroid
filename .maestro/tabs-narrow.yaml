appId: com.jupydroid.app
---
# P8e, one pane: the tab strip over the one pane the detail gets below two panes. Three documents
# open -> three tabs; tapping a tab reveals that document with its own state; a tab's close
# leaves the rest; a dirty tab's close raises the reference's Save/Discard/Cancel gate
# (`docmanager/dialogs.ts`), and Cancel really does leave the tab standing.
#
# The fixtures live in `reports/` on purpose: a root document has no crumbs, and at one pane the
# bar's "Back to ..." *pops* the document - so the way back to the browser that keeps the tab
# open is the crumb, `shell.cd` style (`filebrowser/src/crumbs.ts:415`, goToFolder promotes the
# Explorer entry rather than popping the document's).
#
# `autosaveEnabled: false` is seeded by the driver the way the autosave flows seed it: with the
# debounce live the document is clean 500 ms after the last keystroke and the marker a race.
#
# Runs no cell, so the emulator is evidence.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- assertVisible: "Files"
# ---- three documents -> three tabs ----
- tapOn: "reports"
- tapOn: "tabs-first.ipynb"
- extendedWaitUntil:
    visible: "Tab: tabs-first.ipynb"
    timeout: 30000
- takeScreenshot: 01-one-document-one-tab
# Back to the browser *without* closing: the Workspace crumb navigates the list pane up over the
# open document - the one-pane form of a second tab.
- tapOn: "Workspace"
- extendedWaitUntil:
    visible: "Files"
    timeout: 10000
- tapOn: "reports"
- tapOn: "tabs-second.ipynb"
- extendedWaitUntil:
    visible: "Tab: tabs-second.ipynb"
    timeout: 30000
- assertVisible: "Tab: tabs-first.ipynb"
- tapOn: "Workspace"
- extendedWaitUntil:
    visible: "Files"
    timeout: 10000
- tapOn: "reports"
- tapOn: "tabs-notes.txt"
- extendedWaitUntil:
    visible: "Tab: tabs-notes.txt"
    timeout: 30000
- assertVisible: "Tab: tabs-first.ipynb"
- assertVisible: "Tab: tabs-second.ipynb"
- takeScreenshot: 02-three-documents-three-tabs
# ---- a tab tap reveals its document ----
- tapOn: "Tab: tabs-first.ipynb"
- extendedWaitUntil:
    # The first notebook's own cell source - a generic "editor is visible" would pass on the
    # document that was already on top.
    visible: ".*p8e_marker_first.*"
    timeout: 10000
- takeScreenshot: 03-tab-tap-reveals
# ---- closing one tab leaves the rest ----
- tapOn: "Close tab: tabs-second.ipynb"
- extendedWaitUntil:
    notVisible: "Tab: tabs-second.ipynb"
    timeout: 10000
- assertVisible: "Tab: tabs-first.ipynb"
- assertVisible: "Tab: tabs-notes.txt"
- takeScreenshot: 04-close-leaves-the-rest
# ---- a dirty tab closes through Save/Discard/Cancel ----
- tapOn: "Tab: tabs-notes.txt"
- extendedWaitUntil:
    visible: ".*the file editor.*"
    timeout: 10000
- tapOn: ".*the file editor.*"
- tapOn:
    point: "95%,25%"
- pressKey: Enter
- inputText: "p8e_dirty_probe"
- assertVisible: "(?s).*p8e_dirty_probe.*"
- extendedWaitUntil:
    visible: "Unsaved changes"
    timeout: 10000
- takeScreenshot: 05-dirty-tab-dot
- tapOn: "Close tab: tabs-notes.txt"
- extendedWaitUntil:
    visible: "Save your work"
    timeout: 5000
- takeScreenshot: 06-dirty-close-gate
# Cancel first: the reference's middle button, and the half of the gate a Discard-only flow
# would leave unproven.
- tapOn: "Cancel"
- extendedWaitUntil:
    visible: "Tab: tabs-notes.txt"
    timeout: 5000
- assertVisible: "Unsaved changes"
- tapOn: "Close tab: tabs-notes.txt"
- extendedWaitUntil:
    visible: "Save your work"
    timeout: 5000
- tapOn: "Discard"
- extendedWaitUntil:
    notVisible: "Tab: tabs-notes.txt"
    timeout: 10000
- assertVisible: "Tab: tabs-first.ipynb"
- takeScreenshot: 07-discard-closes-first-stays
# ---- rename is the tab's own act (`docmanager:rename` on the title node) ----
# A long press is a touch screen's right-click, and the tab node is what the reference binds the
# command to - the dialog is the shared RenameFileDialog, the move is `context.rename`'s.
- longPressOn: "Tab: tabs-first.ipynb"
- extendedWaitUntil:
    visible: "Rename file"
    timeout: 5000
- takeScreenshot: 08-tab-long-press-opens-rename
# Stem selected on open (`titleStemEnd`), so typing replaces it and `.ipynb` survives - no tap
# into the field, which would collapse the selection (`explorer-rename.yaml`'s own lesson).
- inputText: "p8e-renamed"
- tapOn: "Rename"
- extendedWaitUntil:
    visible: "Tab: p8e-renamed.ipynb"
    timeout: 10000
# The tab kept its place and its document: the same cell source is still on screen, which holds
# only if the entry and its ViewModel were never replaced (`Context._updatePath`, not a reopen).
- assertVisible: ".*p8e_marker_first.*"
- takeScreenshot: 09-renamed-in-place
