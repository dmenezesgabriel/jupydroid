appId: com.jupydroid.app
---
# P4k part 1: open a terminal, write a marker to disk, then background the app with nothing else
# running.
#
# The marker goes to a file rather than only to the screen: `architecture/cross-cutting.md` §8.6
# forbids gating a Maestro flow's pass/fail on `visible:`/`extendedWaitUntil` reading this
# terminal's own per-row text - accessibility polling of it proved unreliable independent of
# anything `TerminalCanvas` actually draws (reproduced against an untouched build too). The driver
# reads the file straight off the device's disk afterwards instead - the same move
# `app-death-backstop-driver.sh` already makes for a notebook's answer.
#
# A screenshot here is for the driver's own pixel-extent comparison against part 2's resume
# (`terminal_content_extent.py`'s established pattern, `terminal-ime-resize-driver.sh`),
# reused rather than re-derived - the proof that backgrounding did not shrink what was on screen.
#
# TABLET ONLY (SM-X216B): a real shell, and a real `jupyter_server` process for the driver's own
# `ps` check to find.
# NOT A SUITE FLOW: the driver's own sleep past the grace is the gate; running this alone proves
# nothing without `scripts/idle-stopper-terminal-driver.sh` around it.
- launchApp
- runFlow: open-base-space.yaml
- assertVisible: "Files"
- runFlow: open-new-terminal.yaml
- extendedWaitUntil:
    visible: "Tab: Terminal .*"
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 5000
# Focus is taken, not waited for - `TerminalInputField` autofocuses on composition, but a first
# inputText's leading keystrokes can still race the IME's own connection setup on this device
# (measured: `ech` of `echo` eaten, `terminal-tablet.yaml`'s own comment). A tap on the field
# is a user's own focus move, and the one that settles the connection before typing starts.
- tapOn:
    id: "terminal-input"
- inputText: "echo p4k-before-idle > p4k-marker-before.txt"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-terminal-open-before-idle
- pressKey: Home
- takeScreenshot: 02-backgrounded-idle
