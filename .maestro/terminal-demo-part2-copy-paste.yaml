appId: com.jupydroid.app
---
# Copy ends the selection, and the ⋮ menu's Paste types the copied word after `echo `, which the
# shell then answers. Run by scripts/terminal-demo-driver.sh after part 1. The floating toolbar's
# own Paste is `terminal-paste.yaml`'s.
#
# **What this flow cannot assert, and what does.** The line Paste typed and the shell's answer are
# drawn, so 03 and 04 are their evidence; `TerminalSelectionTest` is the instrumented proof that
# Paste reaches the shell.
- tapOn:
    text: "Copy"
    id: "android:id/floating_toolbar_menu_item_text"
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible:
    text: "Copy"
    id: "android:id/floating_toolbar_menu_item_text"
- takeScreenshot: 02-copy-ended-the-selection
- inputText: "echo "
- tapOn: "Terminal actions"
- tapOn: "Paste"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-paste-typed-the-copied-word-after-echo
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-the-shell-answered-the-pasted-line
