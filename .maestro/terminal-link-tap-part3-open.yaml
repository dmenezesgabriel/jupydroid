appId: com.jupydroid.app
---
# The same tap, then Open. No screenshot after it: what is on screen then is the browser, which the
# driver reads as the resumed activity. Run by scripts/terminal-link-tap-driver.sh after part 2.
- tapOn:
    id: "terminal-input"
- assertVisible: "Open Link\\?"
- tapOn: "Open"
- waitForAnimationToEnd:
    timeout: 5000
