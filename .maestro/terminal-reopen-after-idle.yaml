appId: com.jupydroid.app
---
# Part 2 of the idle-stopper pair, begun by `terminal-background-idle`: resume after the driver's own wait past the grace, with the terminal open the whole
# time.
#
# Screenshot immediately on resume, before typing anything new - the driver compares this
# capture's own `terminal_content_extent.py` reading against part 1's pre-background capture, the
# same `[ "$AFTER" -ge "$BEFORE" ]` idiom `terminal-ime-resize-driver.sh` already uses, to
# prove the `read_buffer` replay did not shrink what was on screen.
#
# Then a second marker, to a second file, read off disk for the reason part 1's header gives: a
# live shell answering is what a *new* command proves, which stale pixels alone cannot.
#
# `stopApp: false`, as every other resume-after-background flow in this tree does.
# TABLET ONLY: this depends on a real shell surviving to answer at all.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "Open Base \\(base\\)"
    file: open-base-space.yaml
- takeScreenshot: 03-resumed-before-typing
- inputText: "echo after-idle > idle-marker-after.txt"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 04-new-command-answered
