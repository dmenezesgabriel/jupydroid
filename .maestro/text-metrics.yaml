appId: com.jupydroid.app
---
# P2l-1: the vertical metrics of `bodyLarge`, on every surface that draws it.
#
# Seeded by scripts/text-metrics-driver.sh; clearState would delete the fixture.
#
# **This flow cannot see the defect and is not asked to.** What it does is put every surface
# `bodyLarge` reaches into two frames, so the before/after pair can be compared - the explorer's
# file rows and its recents (`ExplorerScreen.kt:401`, `RecentsSection.kt:125`), the code cell's
# source, which inherits the role through `LocalTextStyle` because `MaterialTheme` provides
# `typography.bodyLarge` as the ambient style (`MaterialTheme.kt:107`), and the symbol row's keys
# (`SymbolRow.kt:102`). The assertions only guarantee the frame is the one meant to be compared.
#
# The code cell is ten short lines on purpose: a per-line metric difference is a rounding error
# once and a measurable block height ten times over.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "Text Metrics.ipynb"
    direction: DOWN
    timeout: 20000
# The browser's own rows, before anything is opened: file names are `bodyLarge`.
- takeScreenshot: 01-file-rows
- tapOn: "Text Metrics.ipynb"
- extendedWaitUntil:
    visible: ".*line_10.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
# Ten lines of source in one frame, which is where a per-line metric shows as a block height.
- takeScreenshot: 02-code-source
# Into the cell, which raises the symbol row - the third surface drawing the role.
- tapOn: ".*line_01.*"
- extendedWaitUntil:
    visible: "Tab"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 03-symbol-row
