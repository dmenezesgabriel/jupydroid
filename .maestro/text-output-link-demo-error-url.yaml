appId: com.jupydroid.app
---
# A second code cell raises a ValueError whose message is a URL; IPython's traceback draws it on its
# last line, and a tap there opens the browser, which the driver reads from the resumed activity.
# Run by scripts/text-output-link-demo-driver.sh after part 2.
#
# The exact traceback is the kernel's; FakeKernelGateway would echo the source, which has no
# "ValueError: https" in it.
#
# TABLET ONLY (SM-X216B): the flow runs a cell.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Cell actions"
- tapOn: "Cell menu Insert code below"
- runFlow:
    file: focus-cell.yaml
    env:
      CELL_INDEX: 1
- inputText: "raise ValueError(\"https://jupyter.org\")"
- hideKeyboard
- tapOn:
    text: "Run cell"
    index: 1
- extendedWaitUntil:
    visible: "-{20,}.*ValueError: https://jupyter\\.org"
    timeout: 60000
# `back` is edit mode's exit to command mode.
- back
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-the-error-url
# The traceback is one text node of six 31 px lines, [732,594][1844,780] on SM-X216B from
# `uiautomator dump`: `ValueError: https://jupyter.org` is line 6, at 92% of its height, and the
# URL's ink 910-1190, so 29% across is its middle.
- tapOn:
    text: "-{20,}.*ValueError: https://jupyter\\.org"
    point: "29%,92%"
# No screenshot after the tap: what is on screen then is the browser.
- waitForAnimationToEnd:
    timeout: 5000
