appId: com.jupydroid.app
---
# With `mod.py` deleted by the driver, a tap on the Console's `~/mod.py:1` opens nothing and says
# so on the Console's snackbar. After part 5, run by scripts/text-output-path-driver.sh;
# the point is part 5's, measured there.
#
# TABLET ONLY (SM-X216B): part 1 runs a cell.
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "-{20,}.*"
    point: "13%,61%"
- extendedWaitUntil:
    visible: "No file at mod.py"
    timeout: 10000
- assertNotVisible: "Tab: mod.py"
- takeScreenshot: 01-missing-file-said
