appId: com.jupydroid.app
---
# Run by scripts/theme-six-combinations-driver.sh once per app theme, with MAESTRO_THEME naming the
# Settings row's choice (System, Light or Dark). Picks it, then shows each open surface in turn.
# It asserts only that each surface is on screen: what colour each one takes is the driver's
# reading of the screenshots' pixels, the same before a repair and after it.
#
# TABLET ONLY (SM-X216B): the terminal is the Space's real shell.
- launchApp:
    stopApp: false
- tapOn: "Tab: Settings"
- extendedWaitUntil:
    visible: "Theme"
    timeout: 5000
- tapOn: "${MAESTRO_THEME}"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-settings
- tapOn: "Tab: ${MAESTRO_FILE}"
- extendedWaitUntil:
    visible: "notes = \"seeded\"\\s*"
    timeout: 10000
- takeScreenshot: 02-file
- tapOn: "Tab: ${MAESTRO_NOTEBOOK}"
- extendedWaitUntil:
    visible: "p8e_marker_first = 1"
    timeout: 10000
- takeScreenshot: 03-notebook
- tapOn: "Tab: Terminal .*"
- extendedWaitUntil:
    visible:
      id: "terminal-input"
    timeout: 10000
# Showing the tab focuses the shell's input and raises the soft keyboard over the terminal it is
# meant to show.
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-terminal
