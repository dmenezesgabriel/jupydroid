appId: com.jupydroid.app
---
# P7a-1b: a search toggle's *on* wash, which is `inputOption.activeBackground` and nothing else.
#
# **What this flow is for is a colour, and no assertion can read one** - the lesson P7a-1's own
# driver records, and the reason that step's defect survived P2u-1 with every flow green. So the
# deliverable is the frame plus the hierarchy the driver dumps after it, and
# `scripts/check_node_fill.py` is what turns the pair into something that can fail.
#
# The claim: `SearchOptionToggles` cites `inputOption.activeBackground` - `#D6D6D6` light,
# `#313233` dark, **opaque** in both - and until P7a-1b it borrowed `secondaryContainer`, which was
# `list.inactiveSelectionBackground` and belongs to the explorer's row instead. Two ids, one role;
# this frame is where the toggle's own half is read.
#
# **A toggle says which way it is set by flipping its own name**, not by a mark (every toggle in
# this app since the export picker). So the node the driver measures is described *"Ignore case"* -
# which is what a tap *would* do, and therefore means case matching is currently **on**. Addressing
# "Match case" would measure the toggle in its off state, which draws no wash at all and would make
# the gate vacuous.
#
# The flow ends on that frame on purpose: maestro leaves the app where the last step put it, and
# the driver's `uiautomator dump` is taken there (`scripts/cell-header-prompts-driver.sh`'s own pattern).
#
# Runs no cell, so it needs no Space runtime, and the search panel is reachable at both widths -
# `toggle-wash-driver.sh` runs it on the tablet and on the emulator for that reason.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- assertVisible: "Workspace"

# --- the search panel, where the three toggles live --------------------------------------------
- tapOn:
    text: "^Search$"
- waitForAnimationToEnd:
    timeout: 5000
# Off, and named for what a tap will do - which is the state readout this app uses.
- assertVisible: "Match case"
- takeScreenshot: 01-the-toggles-off

# --- one toggle on, which is the only state that draws a wash ----------------------------------
- tapOn: "Match case"
- waitForAnimationToEnd:
    timeout: 5000
# The name has flipped, so case matching is on and the wash is drawn.
- assertVisible: "Ignore case"
- takeScreenshot: 02-the-toggle-on
