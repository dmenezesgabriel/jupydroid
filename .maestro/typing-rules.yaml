appId: com.jupydroid.app
---
# Seeded by scripts/typing-rules-driver.sh; clearState would delete the fixture.
#
# The flow types strictly fewer characters than the cell ends up holding: no indent is ever
# typed, and `)` `'` only ever arrive on top of a partner that is already there. So the final
# assertion can only pass if the rules ran.
- launchApp
- runFlow: open-base-space.yaml
# Home's list is populated by a disk scan, and a scroll started before it has rendered ends
# rather than retrying - so let the launch settle first.
- waitForAnimationToEnd:
    timeout: 5000
# Scrolled to rather than asserted on: Home is sorted by recency, so a seeded notebook
# sinks below the fold as soon as anything else is saved.
- scrollUntilVisible:
    element:
      text: "Typing Rules.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Typing Rules.ipynb"
- extendedWaitUntil:
    visible: "x = 1"
    timeout: 30000
- takeScreenshot: 01-cell-loaded
# The field fills the width, so tapping the node puts the cursor past the end of the one line.
- tapOn: "x = 1"
- pressKey: Enter
- inputText: "if x:"
- takeScreenshot: 02-block-opener-typed
# Auto-indent after `:` - four spaces nobody typed.
- pressKey: Enter
- inputText: "print"
- inputText: "("
- inputText: "'"
- inputText: "hi"
- takeScreenshot: 03-pairs-closed
# Both closers are already there, so typing them must step over rather than double them.
- inputText: "'"
- inputText: ")"
# Indent kept on a line that opens nothing: four more spaces, still untyped.
- pressKey: Enter
- inputText: "pass"
- assertVisible: '(?s).*if x:\n    print\(.hi.\)\n    pass.*'
- takeScreenshot: 04-indent-and-pairs
