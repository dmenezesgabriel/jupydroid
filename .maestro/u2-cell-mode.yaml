appId: com.jupydroid.app
---
# U2: back in edit mode returns to command mode instead of leaving the notebook.
#
# The assertion that matters is the *negative* one - after back, the notebook is still open.
# Before this step there was no BackHandler at all, so back popped straight to Recents and a
# tap-then-back lost the screen.
#
# Seeded by scripts/u2-cell-mode-driver.sh; clearState would delete the fixture.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "Cell Mode.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Cell Mode.ipynb"
- extendedWaitUntil:
    visible: "answer = 42"
    timeout: 30000
- takeScreenshot: 01-command-mode
# Tapping the cell's source puts the caret in it: edit mode, keyboard up.
- tapOn: "answer = 42"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-edit-mode-keyboard-up
# The keyboard is a window of its own and eats the first back, so this run of them is what a
# person actually presses. Each is followed by a screenshot: which one leaves edit mode and
# which one leaves the notebook is the thing being measured, not assumed.
- back
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 03-after-first-back
- assertVisible: "Cell Mode.ipynb"
- back
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 04-after-second-back
# Still the notebook: one of those two backs left edit mode, and neither left the screen.
- assertVisible: "Cell Mode.ipynb"
- assertVisible: "answer = 42"
# And back still *works*. A BackHandler that stayed enabled would swallow every press and trap
# the user in the notebook, which is the way this feature fails if the mode never returns to
# COMMAND - so the third press is the important one, not an afterthought.
- back
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 05-back-still-leaves
# The browser: its crumb is there and the cell's source is not. (Home's FAB marked this until
# X2h; the browser has no FAB, and "Workspace" is the thing only it draws.)
- assertVisible: "Workspace"
- assertNotVisible: "answer = 42"
