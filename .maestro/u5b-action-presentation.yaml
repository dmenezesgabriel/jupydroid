appId: com.jupydroid.app
---
# U5b: the same cell actions, on the surface the window has room for.
#
# Runs no cell, so any device will do. The driver runs this flow twice - once at the device's own
# width and once with `wm size` forced to a phone width - and the screenshots are what show which
# surface appeared. The labels are identical on both, which is the point: one flow addresses a
# dropdown and a bottom sheet without knowing which it got.
#
# Seeded by scripts/u5b-action-presentation-driver.sh; clearState would delete the fixture.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "Cell Actions"
    direction: DOWN
    timeout: 20000
- tapOn: "Cell Actions"
- extendedWaitUntil:
    visible: "alpha = 1"
    timeout: 30000
- tapOn:
    text: "Cell actions"
    below:
      text: "alpha = 1"
- waitForAnimationToEnd:
    timeout: 5000
# The first item, which is at the top of both surfaces. Asserting a middle one instead would be
# asserting how many rows happen to fit, which is a property of the device rather than of this.
- assertVisible: "Cell menu Insert code above"
- takeScreenshot: 01-actions-offered
# Choosing an action, so the flow proves the surface *works* rather than only that it appeared.
#
# Reachability of the items below the fold is deliberately **not** driven here: a
# `scrollUntilVisible` swipe on a bottom sheet is a dismiss gesture, and the first attempt closed
# the sheet and then failed looking for a row on the notebook behind it. Scrolling inside either
# surface is asserted by `CellActionsTest`, which can walk the semantics tree without gestures.
- tapOn: "Cell menu Insert code below"
- waitForAnimationToEnd:
    timeout: 5000
# The notebook is still there and the surface has closed. That a *third cell* was inserted is
# proved by the saved file the driver prints, not asserted here: how many cells fit on screen is
# a property of the window this flow deliberately varies, and the compact run has room for one.
- assertVisible: "alpha = 1"
- takeScreenshot: 02-action-taken
