appId: com.jupydroid.app
---
# U5c: the kernel bar, and that Restart really replaces the interpreter.
#
# TABLET ONLY - this runs cells. On the x86_64 emulator MainActivity falls back to
# FakeKernelGateway, which echoes the source back as stdout: `kept` would never exist, `dir()`
# would never be evaluated, and the one assertion that proves a restart happened could not fail.
#
# The proof is a *variable*, not a screenshot. Run All defines `kept` and the second cell reports
# whether it is still in scope; restart the kernel, run **that cell alone**, and it must now say
# False. Nothing else on screen changes when a kernel restarts, which is exactly why a restart
# that silently did nothing would be invisible.
#
# Seeded by scripts/u5c-notebook-bar-driver.sh; clearState would delete the fixture.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "Notebook Bar.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Notebook Bar.ipynb"
- extendedWaitUntil:
    visible: ".*after restart.*"
    timeout: 30000
- takeScreenshot: 01-bar-at-rest
# Run All from the bar, where it now lives instead of the top corner.
- tapOn: "Run all cells"
- extendedWaitUntil:
    visible: ".*after restart: True.*"
    timeout: 120000
- takeScreenshot: 02-variable-defined
# Restart asks first, and the dialog says what will be lost.
- tapOn: "Restart kernel"
- assertVisible: "All variables will be lost."
- takeScreenshot: 03-restart-asks-first
- tapOn: "Restart"
- waitForAnimationToEnd:
    timeout: 10000
# Only the *second* cell, and that is the whole trick. Run All would re-run the first cell
# first, redefining `kept` before the second ever looked - so the check could never fail, and the
# first version of this flow proved nothing while appearing to. Running the second cell alone
# against a fresh interpreter is what shows the variable is gone.
- tapOn:
    text: "Run cell"
    below:
      text: "survives a run"
- extendedWaitUntil:
    visible: ".*after restart: False.*"
    timeout: 120000
- takeScreenshot: 04-variable-gone-after-restart
