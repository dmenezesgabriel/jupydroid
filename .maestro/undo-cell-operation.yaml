appId: com.jupydroid.app
---
# P2a: `notebook:undo-cell-action` and `notebook:redo-cell-action` - taking a cell operation back.
#
# Runs no cell, so the emulator is enough and this is evidence on both devices.
#
# **Two things are being proved, and the second is the one that is easy to get quietly wrong.**
#
#   1. A deleted cell comes back *whole* - its source, its saved output and its `[7]`. Restoring
#      the cells and losing the results would look right in a screenshot cropped to the source.
#   2. **Typing done after the operation survives the undo.** JupyterLab has two undo commands
#      because text and structure are two histories (`notebook:undo` reaches `cell.editor?.undo()`
#      and never the document's stack), and a whole-document snapshot cannot tell a cell it is
#      *restoring* from one it would be *reverting*. So this types into the cell that was NOT
#      deleted, between the delete and the undo, and asserts the typing is still there afterwards.
#
# Cells are addressed by their own text, never by `index:` - every cell header carries the same
# "Cell actions" description, and U5a's first attempt at `index: 1` tapped the first cell twice.
#
# Seeded by scripts/undo-cell-operation-driver.sh; clearState would delete the fixture.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "Take It Back.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Take It Back.ipynb"
- extendedWaitUntil:
    visible: "undone = 2"
    timeout: 30000
# Both controls are on the bar before anything has happened, and both are dead. Disabled rather
# than absent is the reference's own shape (`isEnabled` on both commands) and it is what makes
# them discoverable - a control that appears only once it would work is one nobody finds.
- assertVisible:
    text: "Undo cell operation"
    enabled: false
- assertVisible:
    text: "Redo cell operation"
    enabled: false
- takeScreenshot: 01-nothing-to-take-back
# The second cell's menu: the only "Cell actions" below the first cell's source.
- tapOn:
    text: "Cell actions"
    below:
      text: "kept = 1"
# Scrolled to rather than tapped straight away: Delete is the last row and it is below the fold on
# both surfaces since P2b made the list fourteen long. Why that needs a subflow is written there.
- runFlow: scroll-the-cell-menu-to-its-end.yaml
- assertVisible: "Cell menu Delete"
- tapOn: "Cell menu Delete"
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible: "undone = 2"
- assertNotVisible: "undone output"
- takeScreenshot: 02-deleted
# Now type into the cell that was *not* deleted. The caret lands wherever the tap did, so the
# assertion is a substring rather than the whole line - what matters is that the characters exist,
# not where in the line they went.
- tapOn: "kept = 1"
- inputText: "TYPED"
- waitForAnimationToEnd:
    timeout: 5000
# Back to get the keyboard out of the way of the screenshot. It does **not** reach the app: with
# the soft keyboard up the system consumes the first BACK to dismiss it, so `EditorScreen`'s
# BackHandler never runs, the caret stays and the notebook is still in edit mode - which is what
# 03 and 04 show, symbol row and all. Left as it is rather than pressed twice: undo is tapped from
# edit mode here, and that it works there is worth capturing, since on a phone the sequence that
# needs it most is "delete a cell, carry on typing, change your mind".
- back
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: ".*TYPED.*"
- takeScreenshot: 03-typed-after-the-delete
# Undo is still about the delete: typing records nothing, because text has its own history.
- tapOn: "Undo cell operation"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "undone = 2"
# The whole cell came back, not just its source: the saved output and the count it ran under.
- assertVisible: "undone output"
- assertVisible: "\\[7\\]:"
# And the typing done after the delete is still there. This is the assertion the design exists for.
- assertVisible: ".*TYPED.*"
- takeScreenshot: 04-undone-with-its-output-and-the-typing-kept
- tapOn: "Redo cell operation"
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible: "undone = 2"
- assertVisible: ".*TYPED.*"
- takeScreenshot: 05-redone
# The point of taking it through a kill: an undo is an edit to the document and goes to disk on
# the same debounce every other edit uses. stopApp is a real kill, so anything held only in the
# ViewModel is gone by the relaunch - and the driver prints the saved file afterwards, which is
# where the cell count and the typed characters are checked rather than merely looked at.
- stopApp
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- scrollUntilVisible:
    element:
      text: "Take It Back.ipynb"
    direction: DOWN
    timeout: 20000
- tapOn: "Take It Back.ipynb"
- extendedWaitUntil:
    visible: ".*TYPED.*"
    timeout: 30000
- assertNotVisible: "undone = 2"
- takeScreenshot: 06-saved-as-the-redo-left-it
