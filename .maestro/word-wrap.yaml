appId: com.jupydroid.app
---
# P6c-5: the Settings screen's "Wrap code lines" toggle actually changes whether a code cell's
# source wraps or scrolls horizontally, and the choice survives a relaunch - not only the unit/
# instrumented proof that the field persists and the mechanism lays out correctly
# (`EditorSettingsRepositoryContract`, `SettingsScreenTest`, `CodeCellFieldWrapTest`).
#
# **What this flow does NOT assert, and why.** `CodeCellField` is one semantics node carrying the
# whole cell's source regardless of scroll position (`architecture/cross-cutting.md` §8.6: "the
# editor is one node carrying the whole file") - so `assertVisible` on the fixture's own END_MARKER
# text would pass whether or not the line actually wrapped, exactly the "goes green against the
# wrong thing" shape P2x-3f itself found. What proves the wrap state here is the screenshot, looked
# at - the same substitution P2x-3f and the terminal's own P4j-3b/P4j-3d-3 already made for the
# identical reason.
#
# Nothing here runs a cell, so the emulator - and its FakeKernelGateway - is enough; sharded
# across both devices anyway, `editor-code-font-size.yaml`'s own precedent for a pure
# UI-rendering row.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- tapOn: "Word Wrap.ipynb"
- extendedWaitUntil:
    visible: ".*x = 1.*"
    timeout: 15000
- takeScreenshot: 01-cell-wraps-by-default

- back
- runFlow: open-settings.yaml
- extendedWaitUntil:
    visible: "Wrap code lines"
    timeout: 5000
- takeScreenshot: 02-settings-wrap-on

- tapOn: "Wrap code lines"
- takeScreenshot: 03-settings-wrap-off

- tapOn: "Back to files|Close tab: Settings"
- extendedWaitUntil:
    visible: "Word Wrap.ipynb"
    timeout: 5000
- tapOn: "Word Wrap.ipynb"
- extendedWaitUntil:
    visible: ".*x = 1.*"
    timeout: 15000
- takeScreenshot: 04-cell-unwrapped

# Several rightward drags over the cell - one alone need not reach the marker, and a drag past
# the line's own end is a no-op (`ScrollState`'s own clamp), not an error.
- repeat:
    times: 5
    commands:
      - swipe:
          start: 90%, 30%
          end: 10%, 30%
          duration: 400
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 05-scrolled-toward-the-marker

- back
- runFlow: open-settings.yaml
- extendedWaitUntil:
    visible: "Wrap code lines"
    timeout: 5000
- tapOn: "Wrap code lines"
- takeScreenshot: 06-settings-wrap-back-on

- tapOn: "Back to files|Close tab: Settings"
- extendedWaitUntil:
    visible: "Word Wrap.ipynb"
    timeout: 5000
- tapOn: "Word Wrap.ipynb"
- extendedWaitUntil:
    visible: ".*x = 1.*"
    timeout: 15000
- takeScreenshot: 07-cell-wraps-again

# The choice survives a relaunch - `EditorSettingsRepositoryContract`'s own
# `remembersCodeWrapEnabledTurnedOff`, now asked of the real app. Left off across the relaunch so
# the driver's own file-based check (`codeWrapEnabled":false`) has something unambiguous to read.
- back
- runFlow: open-settings.yaml
- extendedWaitUntil:
    visible: "Wrap code lines"
    timeout: 5000
- tapOn: "Wrap code lines"
- stopApp
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: open-base-space.yaml
- runFlow: open-settings.yaml
- extendedWaitUntil:
    visible: "Wrap code lines"
    timeout: 5000
- takeScreenshot: 08-settings-wrap-off-after-relaunch
