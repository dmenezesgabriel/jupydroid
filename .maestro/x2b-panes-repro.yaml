appId: com.jupydroid.app
---
# X2b: the defect, captured where it shows - the tablet's wide window. On the pre-fix build
# "Browse files" opened the browser beside Recents. The driver asserts that WHICH pane is drawn
# from the app's own accessibility tree after this flow settles, because maestro's "Recents"
# matcher also sees a system "Recents" somewhere on this device.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-recents-before-browsing
- tapOn: "Browse files"
- extendedWaitUntil:
    visible: "Files"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-after-browse-files-settled