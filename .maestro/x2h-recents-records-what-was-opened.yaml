appId: com.jupydroid.app
---
# X2h-1: opening a document is what puts it in Recents.
#
# The defect this closes is X2b's: Recents was a scan of the workspace *root*
# (`DiskNotebookRepository.scanSummaries`, `rootDir.listFiles()`), so a notebook inside a folder was
# reachable through the explorer and absent from the list the app opens on. The list is now a record
# of what was opened - JupyterLab's `RecentsManager` - so where a document lives has stopped
# deciding whether it can be found again.
#
# **This flow drives the app; its driver reads the store.** A list that looked right on screen and
# was never persisted would pass a screen-only assertion, which is the trap `new-python-file`
# avoids by asserting its file is not nbformat.
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Files"
# Nothing has been opened yet, so there is no section at all - a heading over an empty list is
# noise, and its absence here is what makes its arrival below mean something.
- assertNotVisible: "Recent"
- takeScreenshot: 01-no-recents-before-anything-was-opened

- assertVisible: "reports"
- takeScreenshot: 02-the-folder-the-old-recents-could-not-see

- tapOn: "reports"
- assertVisible: "Nested.ipynb"
- takeScreenshot: 03-inside-the-folder

# The notebook in the folder, asserted by its cell: a title alone would be matched by the row that
# was tapped, and it is the *path* the editor has to resolve - `reports/Nested.ipynb`.
- tapOn: "Nested.ipynb"
- extendedWaitUntil:
    visible: "print('this notebook lives in a folder')"
    timeout: 10000
- takeScreenshot: 04-opened-from-inside-the-folder

# A plain file counts as a document too - X2c gave `.py` an editor, and the reference records
# whatever the document manager opened, not whatever was a notebook.
- tapOn: "Back to files"
- assertVisible: "data.csv"
- tapOn: "data.csv"
- assertVisible: ".*region,amount.*"
- takeScreenshot: 05-a-plain-file-is-a-document-too

# Left through the app rather than killed, so the writes are the ones an ordinary session makes.
- tapOn: "Back to files"
- assertVisible: "Nested.ipynb"
- takeScreenshot: 06-back-in-the-folder

# The section is not shown inside a folder - a recents list is not a property of the directory you
# are standing in, and the reference's own surfaces are global rather than per-directory.
- assertNotVisible: "Recent"
# At the root it is, and it carries the whole path: two `summary.ipynb` in different folders would
# otherwise be one row repeated, which is why the reference labels its recents by path too.
- tapOn: "Workspace"
- extendedWaitUntil:
    visible: "Recent"
    timeout: 5000
- assertVisible: "reports/Nested.ipynb"
- assertVisible: "reports/data.csv"
- takeScreenshot: 07-recents-at-the-root
