# Pre-commit hooks: Working Agreement (AGENTS.md, rule 7).
# Install with:  pip install pre-commit && pre-commit install
# Hooks are pure checkers (non-mutating). Format with: ./gradlew ktlintFormat
# Gradle hooks run through scripts/gradlew-jbr (resolves JAVA_HOME from the
# Android Studio JBR) so they work without JAVA_HOME exported.
# `pre-commit install` installs both types: without the second, the commit-msg hook below is
# configured and never runs. `default_stages` keeps every other hook at pre-commit: a hook with no
# `stages` runs at every installed stage, so the whole gate (Gradle included) ran a second time
# at commit-msg until this line.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  # ShellCheck's own hook (koalaman/shellcheck README): the pinned upstream image, run offline
  # by pre-commit over every file it identifies as shell, by extension or shebang. .shellcheckrc
  # makes it follow sourced files. gradlew is Gradle's generated wrapper; .maestro/fixtures/ is
  # test data the flows assert byte for byte (configure-a-space-setup.sh is a user's startup script).
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        exclude: ^(gradlew|\.maestro/fixtures/)
  # actionlint's own hook, same shape as ShellCheck's above: the upstream image, its tag fixed by
  # this rev, so no Go toolchain or community repackaging joins the lock (ADR-0130). It lints what
  # zizmor does not - expressions, contexts and the shell in a `run:` step - and finds ShellCheck on
  # the image's own PATH.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker
  - repo: local
    hooks:
      - id: file-line-length
        name: kotlin files <= 500 lines
        entry: scripts/check-file-line-length.sh
        language: system
        files: '\.kt$'
      - id: maestro-output-assertions
        name: maestro flows observe what the kernel produced
        entry: uv run --locked python scripts/check_maestro_output_assertions.py
        language: system
        files: '^\.maestro/.*\.(yaml|ipynb)$'
        pass_filenames: false
      - id: ui-dimensions
        name: a gap has a name, and the name is in one place
        entry: uv run --locked python scripts/check_ui_dimensions.py
        language: system
        files: '^app/src/main/java/com/jupydroid/app/ui/.*\.kt$'
        pass_filenames: false
      - id: busybox-seccomp
        name: busybox asks Android for nothing it refuses apps
        entry: uv run --locked python scripts/check_busybox_seccomp.py
        language: system
        files: '^(tools/rootfs/busybox\.config|tools/rootfs/Dockerfile|tools/rootfs/stage-app-artifacts\.sh)$'
        pass_filenames: false
      - id: driver-isolation
        name: every flow starts from the Home list it seeded
        entry: uv run --locked python scripts/check_driver_isolation.py
        language: system
        files: '^scripts/.*-driver\.sh$'
        pass_filenames: false
      # Always run: the gates above are only worth having while they still catch things,
      # and their tests are milliseconds.
      - id: maestro-gate-tests
        name: the maestro gates' own tests
        # `env -u`: `git commit -a` exports GIT_INDEX_FILE as the outer repository's index to every hook,
        # and the tests that build a repository in a temp dir would then write into it.
        entry: env -u GIT_INDEX_FILE uv run --locked python -m unittest discover -s scripts -p '*_test.py'
        language: system
        pass_filenames: false
        always_run: true
      # A pure checker (no --fix, AGENTS.md rule 7), from the uv.lock environment so the hook, the
      # local gate and CI run one ruff. Rules and per-file exceptions live in pyproject.toml.
      - id: ruff-check
        name: python lint (ruff)
        entry: uv run --locked ruff check --force-exclude
        language: system
        types: [python]
      # Also a pure checker: `ruff format --check` fails, a person runs `ruff format` (rule 7).
      - id: ruff-format
        name: python format (ruff)
        entry: uv run --locked ruff format --check --force-exclude
        language: system
        types: [python]
      # Whole program, not the staged files: a changed signature breaks its callers in files the
      # commit does not touch. Config (strict, tests excluded and why) lives in pyproject.toml.
      - id: mypy
        name: python types (mypy)
        entry: uv run --locked mypy
        language: system
        types: [python]
        pass_filenames: false
      # The image's modules, checked as Python 3.12 from their own config (tools/rootfs/mypy.ini).
      - id: mypy-rootfs
        name: python types, rootfs (mypy)
        entry: uv run --locked mypy --config-file tools/rootfs/mypy.ini
        language: system
        types: [python]
        pass_filenames: false
      # **The source sets are named, and that is the repair rather than a detail.** `ktlintCheck`
      # is an aggregate over whatever tasks the plugin happened to register, so when it registered
      # none for Kotlin it resolved to the `.kts` build scripts and reported "Passed" for months
      # (ADR-0016). Named explicitly, a plugin that stops seeing a source set fails with
      # "Task not found" instead of passing quietly. `ktlintCheck` stays first so the scripts are
      # still covered. The extension modules (ADR-0104) are named by path for the same reason: an
      # unqualified task runs wherever it exists, and passes for a module where it does not.
      - id: monospace-home
        name: what code looks like has one home
        entry: uv run --locked python scripts/check_monospace_home.py
        language: system
        pass_filenames: false
        always_run: true
      - id: device-secrets
        name: evidence proves the app, not the house it ran in
        entry: uv run --locked python scripts/check_device_secrets.py
        language: system
      - id: palette-consumers
        name: a palette states colours something draws
        entry: uv run --locked python scripts/check_palette_consumers.py
        language: system
        pass_filenames: false
        always_run: true
      # A comment cites something that still resolves in a fresh clone (ADR-0001). A shrinking
      # allowlist is what let this land green on a tree where 507 files carried a retired
      # citation; the sweep reached zero, so there is no allowlist any more. Every file under
      # app/src/, tools/ and each extension module's src/ is read, each language by its own
      # scanner, and a type with no scanner fails the run by name - a four-extension glob is what left Dockerfile, the ANTLR grammars
      # and AndroidManifest.xml unread while the gate reported them clean.
      - id: doc-citations
        name: a comment cites what still resolves
        entry: uv run --locked python scripts/check_doc_citations.py
        language: system
        pass_filenames: false
        always_run: true
      - id: retired-doc-citations
        name: no file names a document ADR-0001 deleted
        entry: uv run --locked python scripts/check_retired_doc_citations.py
        language: system
        types: [text]
      # Device captures stay on the disk that ran them (ADR-0132), so a document naming one of
      # their directories points at nothing in a fresh clone.
      - id: evidence-citations
        name: no document names an evidence directory
        entry: uv run --locked python scripts/check_evidence_citations.py
        language: system
        types: [markdown]
      # The whole tree on every commit, not the staged files: renaming a target breaks the links
      # to it in Markdown the commit never touched. The read is milliseconds.
      - id: markdown-links
        name: a Markdown link points at a tracked file
        entry: uv run --locked python scripts/check_markdown_links.py
        language: system
        pass_filenames: false
        always_run: true
      # Security audit of the workflows (unpinned actions, token scopes, template injection) and of
      # dependabot.yml (a missing cooldown), from the uv.lock environment. Offline: an online audit
      # needs a token, which is not handed to CI.
      - id: zizmor
        name: workflows and dependabot.yml pass the zizmor security audit
        entry: uv run --locked zizmor --offline
        language: system
        files: '^\.github/(workflows/|dependabot\.yml$)'
      # Conventional commits (commitlint.config.mjs). `language: system` over the committed
      # package-lock.json, run after `npm ci`: `language: node` with `additional_dependencies` pins
      # only the two named packages and leaves the transitive tree unlocked (ADR-0123), while `npm ci`
      # fails on a sha512 mismatch. `--no` makes a clone that skipped `npm ci` fail instead of
      # downloading an unlocked copy. pre-commit appends the message file path to the entry.
      - id: commitlint
        name: commit message is a conventional commit
        entry: npm exec --no -- commitlint --edit
        language: system
        stages: [commit-msg]
      # Only when the rules, the npm settings or the lockfile change (any root-level .mjs is a config or
      # its test), or the autopilot loop or the recorded sessions its tests read (ADR-0147); the
      # hook above is what runs on every commit.
      - id: commitlint-config-tests
        name: the commit tooling's and the autopilot loop's own tests
        entry: npm test
        language: system
        files: '^(package(-lock)?\.json|\.npmrc|[^/]+\.mjs|scripts/autopilot/.*|scripts/testdata/autopilot-frames/.*)$'
        pass_filenames: false
      # `tsc --noEmit` over the loop and its tests: Node strips the types without checking them.
      - id: autopilot-typecheck
        name: the autopilot loop typechecks
        entry: npm run typecheck
        language: system
        files: '^(package(-lock)?\.json|scripts/autopilot/.*)$'
        pass_filenames: false
      # The vendored agent-harness skills are the pinned ones, byte for byte (ADR-0149).
      - id: agent-harness-skills
        name: the vendored agent-harness skills equal the pin
        entry: uv run --locked python scripts/check_agent_harness_skills.py
        language: system
        files: '^(\.claude/(skills/|agent-harness-skills\.sha256)|scripts/check_agent_harness_skills\.py)'
        pass_filenames: false
      # The five Gradle hooks run when a commit touches something Gradle reads, not on every commit: 214
      # of the last 300 touched nothing it reads, and each run is about 2 minutes, 3.5 CPU-minutes and 1 GB
      # (ADR-0151). One pattern, defined once on ktlint-check and shared through its anchor, and
      # scripts/check_gradle_hook_scope.py fails the commit if the five stop sharing it, if a tracked file is
      # neither matched nor named as not an input, or if a build script reads a path the pattern misses. CI
      # runs each hook with --all-files, so it still checks everything. This config is in the pattern, so a
      # change to a hook runs them all.
      - id: gradle-hook-scope
        name: the Gradle hooks' file scope is complete
        entry: uv run --locked python scripts/check_gradle_hook_scope.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ktlint-check
        name: ktlint format check
        entry: >-
          scripts/gradlew-jbr ktlintCheck ktlintMainSourceSetCheck ktlintTestSourceSetCheck ktlintAndroidTestSourceSetCheck
          :extension-api:ktlintMainSourceSetCheck :extension-api:ktlintTestSourceSetCheck
          :extensions:git:ktlintMainSourceSetCheck :extensions:git:ktlintTestSourceSetCheck
          :extensions:ai:ktlintMainSourceSetCheck :extensions:ai:ktlintTestSourceSetCheck
        language: system
        pass_filenames: false
        files: &gradle_inputs '^(app/|extension-api/|extensions/|gradle/|config/|tools/grammars/|(build|settings)\.gradle\.kts$|gradle\.properties$|(settings|buildscript)-gradle\.lockfile$|\.editorconfig$|gradlew(\.bat)?$|(LICENSE|NOTICE|THIRD_PARTY\.md|SOURCE_OFFER\.md)$|scripts/(gradlew-jbr|java-home\.sh)$|\.pre-commit-config\.yaml$)'
      - id: detekt
        name: detekt static analysis
        entry: scripts/gradlew-jbr detekt :extension-api:detekt :extensions:git:detekt :extensions:ai:detekt
        language: system
        pass_filenames: false
        files: *gradle_inputs
      - id: cpd
        name: no Kotlin block copied past 150 tokens
        entry: scripts/gradlew-jbr :app:cpd
        language: system
        pass_filenames: false
        files: *gradle_inputs
      - id: android-lint
        name: android lint
        entry: scripts/gradlew-jbr :app:lintDebug :extension-api:lintDebug :extensions:git:lintDebug :extensions:ai:lintDebug
        language: system
        pass_filenames: false
        files: *gradle_inputs
      # `compileDebugAndroidTestKotlin` rides the same call because nothing else reaches the
      # source set: `assembleDebug` compiles `main`, `testDebugUnitTest` compiles `test`, and
      # `ktlintAndroidTestSourceSetCheck` is a formatter, which parses without resolving - so a
      # test file that cannot compile still passed the gate until it was named (ADR-0016).
      - id: unit-tests
        name: unit tests, and androidTest compiles
        entry: scripts/gradlew-jbr :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :extension-api:testDebugUnitTest :extensions:git:testDebugUnitTest :extensions:ai:testDebugUnitTest
        language: system
        pass_filenames: false
        files: *gradle_inputs
