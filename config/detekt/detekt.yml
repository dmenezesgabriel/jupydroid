# detekt configuration (v2). Overrides on top of the default config
# (buildUponDefaultConfig = true in app/build.gradle.kts).
# Enforces the Working Agreement (CLAUDE.md, rule 6): classes <= 500 lines,
# functions 4-20 lines, complexity cap. Naming rules and MaxLineLength (120)
# come from the defaults.
complexity:
  CyclomaticComplexMethod:
    allowedComplexity: 15
    # A function whose whole body is one `when` over a sealed type is a dispatch table, not a
    # branchy function: the compiler proves it exhaustive, every arm is one call, and its number
    # grows with the vocabulary rather than with the logic. `CellEdits.transformed` is the case -
    # fifteen cell actions, each mapped to one transform, and splitting it would cost the guarantee
    # the file exists for ("the one place a CellAction becomes a transform"). This is detekt's own
    # option for the shape, chosen over `ignoreSimpleWhenEntries` because it is the narrower of the
    # two: a function with anything else in it is still counted in full.
    ignoreSingleWhenExpression: true
  LargeClass:
    allowedLines: 500
  LongMethod:
    allowedLines: 20
    # Compose composables wire state + child composables (menus/dialogs) and
    # routinely exceed 20 lines; keep the cap for plain functions.
    ignoreAnnotated:
      - 'Composable'

# Compose composables are conventionally PascalCase (e.g. MainScreen);
# keep enforcing camelCase/PascalCase but reject snake_case etc.
naming:
  FunctionNaming:
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
