[versions]
# 9.1.1 rather than 9.0.1 because `adaptive-*:1.3.0` requires "Android Gradle plugin 9.1.0 or
# higher" and says so in its AAR metadata; 9.1.1 is the first patch of the minimum it asks for.
androidGradlePlugin = "9.1.1"
androidxCore = "1.18.0"
androidxLifecycle = "2.10.0"
androidxActivity = "1.13.0"
androidxComposeBom = "2026.03.01"
adaptiveNavigation3 = "1.3.0"
androidxTest = "1.7.0"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestEspresso = "3.7.0"
commonmark = "0.30.0"
commonsCompress = "1.27.1"
zstdJni = "1.5.7-9"
jsoup = "1.23.1"
coroutines = "1.10.2"
detekt = "2.0.0-alpha.5"
junit = "4.13.2"
kotlin = "2.3.20"
kotlinxSerialization = "1.11.0"
antlr = "4.13.2"
okhttp = "5.4.0"
ktlint = "14.2.0"
nav3Core = "1.0.1"
lifecycleViewmodelNav3 = "2.10.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3"}
# Version-less on purpose: the Compose BOM already manages the material3.adaptive family, so
# pinning one here would be a second number to keep in step with it.
androidx-compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive"}
# The one member of that family that carries a version, and it was adopted knowingly: the
# Compose BOM 2026.03.01 pins `adaptive` at **1.2.0**, and this artifact's POM requires
# `adaptive-navigation` **strictly `[1.3.0]`** - so adopting it moves the whole adaptive family,
# `currentWindowAdaptiveInfo()` included, to 1.3.0 and off the BOM. It also asks for
# `navigation3-ui:1.0.0`, which `nav3Core` already exceeds. What it buys is the deletion of
# `TwoPaneSceneStrategy`/`TwoPaneScene`, and an `extraPane` the table of contents then measured and
# declined (ADR-0037).
androidx-compose-material3-adaptive-navigation3 = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation3", version.ref = "adaptiveNavigation3"}
# material3 no longer pulls the icons in transitively; -core is the small set (not -extended).
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core"}
# Version-less like the rest of the Compose family: the BOM manages it. Added for the explorer's
# file-type icons.
#
# **It is big**: the debug APK went from 116 MB to 142 MB, and Android's own guidance says so -
# "material-icons-extended is a large library and can affect your APK size, so you should consider
# using R8/Proguard in production builds to remove the resources that aren't used". Release builds
# do not shrink it today, because `isMinifyEnabled` is false; that is a release-packaging question
# alongside the rootfs, and it is written down here rather than assumed away.
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended"}
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui"}
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview"}
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4"}
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling"}
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest"}
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
# Process-wide ON_STOP/ON_START, which the runtime-ktx artifacts do not provide: the backstop that
# stops a server when the app goes away observes the whole process, not an activity. Used by
# `JupydroidApplication` and `di/AppContainer`, the two places that outlive a screen.
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidxLifecycle" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
# tar reader for the rootfs archive: a docker export carries GNU long names, PAX
# headers, symlinks and hardlinks, so hand-rolling USTAR parsing is not worth it.
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }
# zstd for the rootfs archive. `GZIPInputStream` decompression of the arm64 tarball was measured at
# ~8.9 s on the tablet, a floor under a 12.0 s serial extract (ADR-0012), and parallel file writes
# cannot go under that floor - the codec has to change. Winlator's rootfs installer made
# the same call: `.tzst` via this artifact plus commons-compress's Zstd* streams. The AAR
# form (@aar in the app deps) carries the arm64-v8a native lib into the APK.
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstdJni" }
# WebSocket client for the kernel channel. Android ships no WebSocket API and no
# java.net.http (verified against android.jar for API 36), so a library is required.
antlr-tool = { module = "org.antlr:antlr4", version.ref = "antlr" }
antlr-runtime = { module = "org.antlr:antlr4-runtime", version.ref = "antlr" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# Markdown for the cells' prose. BSD-2-Clause, pure Java, and its AST is walked directly -
# org.commonmark.renderer is a separate package we never touch, so no HTML and no WebView.
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
# GitHub-flavoured pipe tables, which JupyterLab parses (marked's `gfm: true`). Released with the
# core and versioned with it, so it shares the core's ref.
commonmark-ext-gfm-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
# HTML for `text/html` outputs. MIT, pure Java, no runtime dependencies - and its lenient
# tree builder is the point: a kernel's HTML is whatever a library chose to emit.
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3-junit4", version.ref = "okhttp" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Core" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }