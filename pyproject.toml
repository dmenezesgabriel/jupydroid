# The host's tooling, not a package: the gates, measures and their tests under scripts/ run from
# the environment `uv.lock` resolves, so a hook, the local gate and CI all see one set of versions
# (ADR-0123 is the same rule for Gradle). Nothing here is published.
[project]
name = "jupydroid-host-tooling"
version = "0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false
default-groups = ["host", "dev"]

[dependency-groups]
# Imported by scripts/: Pillow by the read_* image measures, PyYAML by check_maestro_output_assertions.
host = [
    "Pillow>=12.1,<13",
    "PyYAML>=6.0,<7",
]

# Run by the commit gate, never imported: ruff lints scripts/ and tools/rootfs/, its S rules carrying bandit's checks,
# and mypy type-checks scripts/ (ADR-0131). types-PyYAML because PyYAML ships no inline types; Pillow does.
dev = [
    "mypy>=2.0,<3",
    "ruff>=0.15,<0.16",
    "types-PyYAML>=6.0,<7",
]

# scripts/ runs on the host's interpreter; tools/rootfs/ overrides the target in its own ruff.toml,
# because the image runs Python 3.12 (tools/rootfs/Dockerfile) and a 3.14-only syntax must not land there.
[tool.ruff]
line-length = 120
target-version = "py314"
# evidence/ holds local captured runs, not source (ADR-0132): a harness copy there is a record, so it is neither linted
# nor reformatted. The hooks pass --force-exclude because pre-commit hands ruff the staged filenames, and
# a named file ignores an exclude without it.
extend-exclude = ["evidence"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

# Fixtures a test asserts byte for byte: wrapping them would change what the test feeds the parser.
[tool.ruff.lint.per-file-ignores]
"scripts/cold_path_report_test.py" = ["E501"]  # captured logcat lines
"scripts/read_apk_native_libs_test.py" = ["E501"]  # captured readelf section lists
"scripts/read_ledger_verdicts_test.py" = ["E501"]  # ledger table rows

# F401: workspace-search-results.yaml asserts that a result row shows this fixture's `import os` line.
".maestro/fixtures/search.py" = ["F401"]

# B018: `mod.py` is one line on purpose. The text-output flows tap `~/mod.py:1` in IPython's traceback and
# read that row's height, so a formatter that moved the failing `1 / 0` to line 2 would break them.
".maestro/fixtures/mod.py" = ["B018"]

# S603/S607: argv is a list (never a shell) of PATH-resolved SDK tools (adb, git, readelf) built from our own
# arguments, so there is no string from outside to inject.
"scripts/clear_system_anr.py" = ["S603"]
"scripts/read_apk_native_libs.py" = ["S603", "S607"]
"scripts/read_reference_commands.py" = ["S603", "S607"]
"scripts/read_personal_data.py" = ["S603", "S607"]
"scripts/read_history_markers.py" = ["S603", "S607"]
# The tests run `git ls-files` and the fixture with this interpreter, from literal argv.
"scripts/check_device_secrets_test.py" = ["S607"]
"scripts/read_history_markers_test.py" = ["S603", "S607"]
"scripts/rewrite_history.py" = ["S603", "S607"]
"scripts/rewrite_history_test.py" = ["S603", "S607"]
"scripts/rename_tracked_files.py" = ["S603", "S607"]
"scripts/rename_tracked_files_test.py" = ["S603", "S607"]
# The test sources java-home.sh with `sh` and a fixture HOME; the argv is literal.
"scripts/java_home_test.py" = ["S603", "S607"]
"scripts/check_retired_doc_citations_test.py" = ["S607"]
"scripts/check_evidence_citations_test.py" = ["S607"]
"scripts/quince_mcp_fixture_test.py" = ["S603"]
# S314: these parse `adb uiautomator dump` of our own app on our own device, not untrusted XML.
"scripts/read_gutter_x.py" = ["S314"]
"scripts/read_node_fill.py" = ["S314"]
"scripts/read_pane_widths.py" = ["S314"]
"scripts/read_search_box_width.py" = ["S314"]
"scripts/read_touch_target_bounds.py" = ["S314"]
# S310: PROOT_URL is a literal https URL, and the download is refused unless it matches PROOT_SHA256.
"scripts/stage_proot.py" = ["S310"]

# Same reason as the B018 entry above: the formatter would move `1 / 0` off line 1.
[tool.ruff.format]
exclude = [".maestro/fixtures/mod.py"]

# scripts/ is strict: its sources already annotate every function, so strict only adds the findings fixed
# when this gate landed. The _test.py files are left out: the same run measured them at 74 findings beyond
# unannotated test methods (Optional narrowing on re.match/Pillow results, unittest fakes), which is
# noise a test's own assertion already covers, and mypy's module globs cannot select "*_test" alone.
[tool.mypy]
files = ["scripts"]
exclude = '_test\.py$'
python_version = "3.14"
strict = true
