# The host's tooling, not a package: the gates, measures and their tests under scripts/ run from
# the environment `uv.lock` resolves, so a hook, the local gate and CI all see one set of versions
# (ADR-0123 is the same rule for Gradle). Nothing here is published.
[project]
name = "jupydroid-host-tooling"
version = "0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false
default-groups = ["host", "dev"]

[dependency-groups]
# Imported by scripts/: Pillow by the read_* image measures, PyYAML by check_maestro_output_assertions.
host = [
    "Pillow>=13,<14",
    "PyYAML>=6.0,<7",
]

# Run by the commit gate, never imported: ruff lints scripts/ and tools/rootfs/, its S rules carrying bandit's checks,
# and mypy type-checks scripts/ (ADR-0131). types-PyYAML because PyYAML ships no inline types; Pillow does.
# pre-commit is the gate's runner and zizmor audits .github/workflows/: locked here so CI runs the versions a commit does.
# python-semantic-release computes the next version from the commit subjects in release-cut.yml (no wheel is built).
dev = [
    "mypy>=2.0,<3",
    "pre-commit>=4.6,<5",
    "python-semantic-release>=10.7,<11",
    "ruff>=0.17.3,<0.18",
    "types-PyYAML>=6.0,<7",
    "zizmor>=1.32,<2",
]

# The release cut. The git tag is the only record of a version: no file holds one, so nothing is edited by regex
# and the release commit carries only CHANGELOG.md. 0.x because the app has no stable contract yet, and a breaking
# change stays 0.x until `major_on_zero` is turned on. The default parser bumps on feat (minor) and fix/perf (patch)
# and releases nothing for docs, build, ci, chore, refactor, test and style, which is the right line for a bundled
# rootfs too: a rootfs feat/fix/perf changes the APK, a rootfs build does not.
# `scripts/release_cut_config_test.py` asserts each of these.
[tool.semantic_release]
tag_format = "v{version}"
commit_message = "chore(release): v{version}"
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.changelog]
mode = "update"
default_templates = { changelog_file = "CHANGELOG.md" }

# The release commit rides a normal pull request from release/next, so the cut runs on it as it does on main.
[tool.semantic_release.branches.main]
match = "(main|release/.*)"
prerelease = false

# scripts/ runs on the host's interpreter; tools/rootfs/ overrides the target in its own ruff.toml,
# because the image runs Python 3.12 (tools/rootfs/Dockerfile) and a 3.14-only syntax must not land there.
[tool.ruff]
line-length = 120
target-version = "py314"
# evidence/ holds local captured runs, not source (ADR-0132): a harness copy there is a record, so it is neither linted
# nor reformatted. The hooks pass --force-exclude because pre-commit hands ruff the staged filenames, and
# a named file ignores an exclude without it.
# window-key-row.py is `def area` with no body, on purpose: its flow types the rest into the editor, so it is not
# valid Python and ruff cannot lint it. CI hands the hooks every file (`--all-files`), where a commit hands only the
# staged ones, which is how neither fixture was ever read by ruff before.
# .claude/skills/ is vendored from agent-harness at a pin and never edited (ADR-0149): its Python is that
# project's own scripts and tests, written to its style, and a reformat would change bytes the manifest checks.
extend-exclude = ["evidence", ".maestro/fixtures/window-key-row.py", ".claude/skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

# Fixtures a test asserts byte for byte: wrapping them would change what the test feeds the parser.
[tool.ruff.lint.per-file-ignores]
"scripts/cold_path_report_test.py" = ["E501"]  # captured logcat lines
"scripts/read_apk_native_libs_test.py" = ["E501"]  # captured readelf section lists
"scripts/read_ledger_verdicts_test.py" = ["E501"]  # ledger table rows

# F401: workspace-search-results.yaml asserts that a result row shows this fixture's `import os` line.
".maestro/fixtures/search.py" = ["F401"]

# B018: `mod.py` is one line on purpose. The text-output flows tap `~/mod.py:1` in IPython's traceback and
# read that row's height, so a formatter that moved the failing `1 / 0` to line 2 would break them.
".maestro/fixtures/mod.py" = ["B018"]

# S603/S607: argv is a list (never a shell) of PATH-resolved SDK tools (adb, git, readelf) built from our own
# arguments, so there is no string from outside to inject.
# S310: the URL is the driver's own --base-url (a loopback MobSF container), never a string from outside.
"scripts/mobsf_scan.py" = ["S310"]
"scripts/clear_system_anr.py" = ["S603"]
"scripts/focus_samples.py" = ["S603"]
"scripts/count_anr_per_boot.py" = ["S603"]
"scripts/read_apk_native_libs.py" = ["S603", "S607"]
"scripts/read_reference_commands.py" = ["S603", "S607"]
"scripts/read_personal_data.py" = ["S603", "S607"]
"scripts/read_history_markers.py" = ["S603", "S607"]
# The tests run `git ls-files` and the fixture with this interpreter, from literal argv.
"scripts/check_device_secrets_test.py" = ["S607"]
"scripts/read_history_markers_test.py" = ["S603", "S607"]
"scripts/rewrite_history.py" = ["S603", "S607"]
"scripts/rewrite_history_test.py" = ["S603", "S607"]
"scripts/rename_tracked_files.py" = ["S603", "S607"]
"scripts/rename_tracked_files_test.py" = ["S603", "S607"]
"scripts/release_commit_tag.py" = ["S603", "S607"]
"scripts/release_commit_tag_test.py" = ["S603", "S607"]
"scripts/remap_cited_shas.py" = ["S603", "S607"]
"scripts/remap_cited_shas_test.py" = ["S603", "S607"]
# The test runs this repository's own script with this interpreter, as the demo driver does; the argv is literal.
"scripts/installed_release_check_test.py" = ["S603"]
# The test sources java-home.sh with `sh` and a fixture HOME; the argv is literal.
"scripts/java_home_test.py" = ["S603", "S607"]
# The test sources font-scale.sh with `bash` beside a fake `adb`; the argv is literal.
"scripts/font_scale_script_test.py" = ["S603", "S607"]
# The test runs pull-app-logs.sh with `bash` beside a fake `adb`; the argv is literal.
"scripts/pull_app_logs_script_test.py" = ["S603", "S607"]
# The test sources maestro-run.sh with `bash` beside a fake `adb`; the argv is literal.
"scripts/reset_notebooks_script_test.py" = ["S603", "S607"]
# The test builds a scratch git repository and runs the locked semantic-release in it; both argvs are literal.
"scripts/release_cut_config_test.py" = ["S603", "S607"]
"scripts/check_retired_doc_citations_test.py" = ["S607"]
"scripts/check_evidence_citations_test.py" = ["S607"]
"scripts/check_markdown_links.py" = ["S607"]
"scripts/check_markdown_links_test.py" = ["S607"]
"scripts/quince_mcp_fixture_test.py" = ["S603"]
# S314: these parse `adb uiautomator dump` of our own app on our own device, not untrusted XML.
"scripts/read_gutter_x.py" = ["S314"]
"scripts/read_layout_spacing.py" = ["S314"]
"scripts/read_font_scale_fit.py" = ["S314"]
"scripts/read_node_fill.py" = ["S314"]
"scripts/read_pane_widths.py" = ["S314"]
"scripts/read_tab_close_reach.py" = ["S314"]
"scripts/read_search_box_width.py" = ["S314"]
"scripts/read_terminal_margin.py" = ["S314"]
"scripts/read_touch_targets.py" = ["S314"]
"scripts/read_text_contrast.py" = ["S314"]
"scripts/read_touch_target_bounds.py" = ["S314"]
# S310: PROOT_URL is a literal https URL, and the download is refused unless it matches PROOT_SHA256.
"scripts/stage_proot.py" = ["S310"]
# S310: PYPI_URL is a literal https URL; only the package name, taken from the command line, is substituted.
"scripts/read_wheel_platforms.py" = ["S310"]

# Same reason as the B018 entry above: the formatter would move `1 / 0` off line 1. file-editor.py ends without a
# newline on purpose: the drivers seed it byte for byte and the flows assert the file as written.
[tool.ruff.format]
exclude = [".maestro/fixtures/mod.py", ".maestro/fixtures/file-editor.py"]

# scripts/ is strict: its sources already annotate every function, so strict only adds the findings fixed
# when this gate landed. The _test.py files are left out: the same run measured them at 74 findings beyond
# unannotated test methods (Optional narrowing on re.match/Pillow results, unittest fakes), which is
# noise a test's own assertion already covers, and mypy's module globs cannot select "*_test" alone.
[tool.mypy]
files = ["scripts"]
exclude = '_test\.py$'
python_version = "3.14"
strict = true
