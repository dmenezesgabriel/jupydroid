# The image runs Python 3.12 (tools/rootfs/Dockerfile), the host 3.14, and mypy takes one python_version per
# run, so these modules have a config of their own beside the host's [tool.mypy] in pyproject.toml.
# Run from the repository root: paths below are relative to it.
# The cache sits apart from the host's: two Python versions in one cache invalidate each other on every run.
[mypy]
files = tools/rootfs
python_version = 3.12
strict = True
cache_dir = .mypy_cache_rootfs

# These packages are installed in the image (tools/rootfs/requirements.lock) and not on the host, whose
# environment is uv.lock. Named one by one so a typo in any other import still fails.
[mypy-fastmcp.*,starlette.*,jupyter_server.*,jupyter_server_mcp.*,jupyter_ai_acp_client.*,ipykernel.*,zmq,acp.*]
ignore_missing_imports = True

# What those packages export is Any here, so a class that extends one extends Any.
[mypy-jupydroid_kernel,jupydroid_mcp_bearer]
disallow_subclassing_any = False
